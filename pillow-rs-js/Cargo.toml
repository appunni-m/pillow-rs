[package]
name = "pillow-rs-js"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wasm-bindgen bindings for pillow-rs — Pillow in the browser"

[lib]
crate-type = ["cdylib"]

[dependencies]
pillow-rs = { path = "../pillow-rs", default-features = false, features = ["image-png"] }
log = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = { version = "0.1", optional = true }
console_log = { version = "1.0", optional = true }

[features]
default = []
debug-hooks = ["console_error_panic_hook", "console_log"]

[lints]
workspace = true
