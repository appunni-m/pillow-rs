[package]
name = "pillow-rs-js"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wasm-bindgen bindings for pillow-rs — Pillow in the browser"

[lib]
crate-type = ["cdylib"]

[dependencies]
pillow-rs = { path = "../pillow-rs", default-features = false }
log = { version = "0.4", optional = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = { version = "0.1", optional = true }
console_log = { version = "1.0", optional = true }

[features]
default = ["wasm-core"]
# The JS package always ships the complete Rust codec surface. Keep the
# feature name for package consumers, while delegating the codec set to the
# core crate's single all-codecs feature.
wasm-core = ["pillow-rs/image-codecs-all", "pillow-rs/wasm-wide-font-internals"]
# Backwards-compatible name for consumers that selected the former extra
# bundle. It intentionally resolves to the same complete codec surface.
wasm-extra = ["wasm-core"]
wasm-all = ["wasm-core"]
debug-hooks = ["dep:log", "console_error_panic_hook", "console_log"]

[lints]
workspace = true
