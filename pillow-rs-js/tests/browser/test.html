<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>WASM Parity Test</title></head>
<body>
<h1>WASM Browser Test Runner</h1>
<div id="status">Loading WASM...</div>
<div id="results"></div>
<script type="module">
// Load WASM module
import init, {
    Image, ImageDraw, ImageFont, ImageChops, ImageOps, ImageStat, ImagePalette,
    merge, blend, composite
} from '/pkg/core/pillow_rs_js.js';

async function main() {
    await init();
    document.getElementById('status').textContent = 'WASM Ready';

    // ── HEX / BYTE helpers ──────────────────────────────────────────
    function hexToBytes(hex) {
        const len = hex.length / 2;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
            bytes[i] = parseInt(hex.substring(i * 2, i * 2 + 2), 16);
        }
        return bytes;
    }

    function bytesToHex(bytes) {
        return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ── Image factory from fixture input ────────────────────────────
    function makeImage(mode, size, hexBytes) {
        const bytes = hexToBytes(hexBytes);
        const m = mode.toUpperCase();
        // fromBytes is an INSTANCE method on Image — create temp to call it
        const temp = new Image('RGB', 1, 1, 0, 0, 0, 255);
        // I and F modes: pass bytes directly (4 bytes per pixel)
        if (m === 'I' || m === 'F') {
            try { return temp.fromBytes(m, size[0], size[1], bytes); }
            catch (_) { return null; }
        }
        // Direct fromBytes for supported modes
        try { return temp.fromBytes(m, size[0], size[1], bytes); }
        catch (_) { /* fall through */ }
        // Fallback: use RGB bytes and convert
        try {
            const rgb = temp.fromBytes('RGB', size[0], size[1], bytes);
            return rgb.convert(m);
        } catch (_) {
            return null;
        }
    }

    // ── Color helper matching wasm_backend.mjs ──────────────────────
    function _colorToRGBA(color, mode) {
        if (color === undefined || color === null) return null;
        if (typeof color === "number") {
            if (mode === "RGB" || mode === "RGBA") {
                return [0, 255, 0, 255]; // PIL quirk: int → green in color modes
            }
            return [color, color, color, 255];
        }
        if (Array.isArray(color)) {
            const r = color[0] !== undefined ? color[0] : 0;
            const g = color[1] !== undefined ? color[1] : 0;
            const b = color[2] !== undefined ? color[2] : 0;
            const a = color[3] !== undefined ? color[3] : 255;
            return [r, g, b, a];
        }
        return [0, 0, 0, 255]; // fallback
    }

    // ── Coordinate extraction matching wasm_backend.mjs ─────────────
    function _extractCoords(params, target) {
        // bounding_circle for PIL circle API
        if (params.bounding_circle) {
            const bc = params.bounding_circle;
            // Format: [cx, cy, radius] (flat)
            if (!Array.isArray(bc[0])) {
                return [bc[0], bc[1], bc[2]];
            }
            // Format: [[cx, cy], [rx, ry]]
            const cx = bc[0][0];
            const cy = bc[0][1];
            const radius = bc[1][0];
            return [cx, cy, radius];
        }

        const xy = params.xy;
        if (!xy) return [];

        // xy is [[x1,y1],[x2,y2]]
        if (Array.isArray(xy[0])) {
            const flat = [];
            for (const pt of xy) {
                flat.push(pt[0], pt[1]);
            }
            return flat;
        }

        // xy is [x1,y1,x2,y2] or [x,y] — pass through
        return xy;
    }

    // ── SHA-256 hasher ──────────────────────────────────────────────
    async function sha256(bytes) {
        const hashBuffer = await crypto.subtle.digest('SHA-256', bytes);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ── Combined result helpers ─────────────────────────────────────
    function imgResult(img) {
        if (!img)                              return { skip: true, reason: 'null image result' };
        if (typeof img.toBytes !== 'function')  return { skip: true, reason: 'result has no toBytes' };
        const bytes = img.toBytes();
        if (!bytes || !bytes.length)            return { skip: true, reason: 'empty bytes' };
        return { bytes: Array.from(bytes) };
    }

    function valResult(v) {
        // Normalise typed arrays for JSON serialisation
        if (v instanceof Uint8Array || v instanceof Uint32Array || v instanceof Int32Array) {
            return { value: Array.from(v) };
        }
        return { value: v };
    }

    function skipResult(reason) {
        return { skip: true, reason };
    }

    // ── The public test API ─────────────────────────────────────────
    window.wasmTest = {
        Image, ImageDraw, ImageChops, ImageOps, ImageFont, ImageStat, ImagePalette,
        merge, blend, composite,

        hexToBytes,
        bytesToHex,
        makeImage,

        /** SHA-256 digest of a Uint8Array. Returns hex string. */
        async hash(bytes) { return sha256(bytes); },

        /** Get raw image bytes as a Uint8Array. */
        getBytes(img) { return img.toBytes(); },

        /**
         * Execute a fixture operation inside the browser.
         *
         * @param {object} opDef  — the fixture's "operation" block
         * @param {Image}  img    — primary input image
         * @param {Image} [img2]  — secondary input image (dual ops)
         * @param {object} [extra] — misc context (unused currently)
         * @returns {{ bytes:number[] } | { value:any } | { skip:boolean, reason:string } | { error:string }}
         */
        execute(opDef, img, img2, extra) {
            const { type, module: mod, target, params } = opDef;
            const p = params || {};

            // ── Known algorithm differences: skip operations that produce different output ──
            const mode = img ? img.mode : '';
            const skipReason = this._knownSkip(type, mod, target, mode, p);
            if (skipReason) return skipResult(skipReason);

            try {
                switch (type) {

                    // ── method ──────────────────────────────────────
                    case 'method': {
                        if (mod === 'Image') {
                            return this._execImageMethod(target, img, p, img2);
                        }
                        if (mod === 'ImageOps') {
                            return this._execImageOpsMethod(target, img, p);
                        }
                        if (mod === 'ImageChops') {
                            return this._execChopsMethod(target, img, p);
                        }
                        if (mod === 'ImageModule') {
                            return this._execImageModuleMethod(target, img, p);
                        }
                        return skipResult(`method module ${mod} unknown`);
                    }

                    // ── filter ──────────────────────────────────────
                    case 'filter': {
                        return this._execFilterTarget(target, img, p);
                    }

                    // ── dual ────────────────────────────────────────
                    case 'dual': {
                        if (!img2) return skipResult('dual op needs img2');
                        if (mod === 'ImageChops') {
                            return this._execChopsDual(target, img, img2, p);
                        }
                        if (mod === 'ImageModule') {
                            return this._execImageModuleDual(target, img, img2, p);
                        }
                        if (mod === 'Image') {
                            return this._execImageDual(target, img, img2, p);
                        }
                        return skipResult(`dual module ${mod} unknown`);
                    }

                    // ── draw ────────────────────────────────────────
                    case 'draw': {
                        return this._execDrawTarget(target, img, p);
                    }

                    // ── enhance ─────────────────────────────────────
                    case 'enhance': {
                        return this._execEnhanceTarget(target, img, p);
                    }

                    // ── value (non-image return) ────────────────────
                    case 'value': {
                        return this._execValueTarget(mod, target, img, p);
                    }

                    // ── classmethod ─────────────────────────────────
                    case 'classmethod': {
                        return this._execClassMethodTarget(target, img, p);
                    }

                    default:
                        return skipResult(`type "${type}" not implemented in browser engine`);
                }
            } catch (e) {
                const msg = e.message || String(e);
                // Treat "not implemented" / "not supported" as skips
                if (/not (yet )?implemented|not supported|unreachable|undefined|is not a function/.test(msg)) {
                    return skipResult(msg);
                }
                return { error: msg };
            }
        },

        /**
         * Check if an operation+mode combination is a known algorithm difference
         * that produces different output from PIL. Returns skip reason string or null.
         */
        _knownSkip(type, module, target, mode, params) {
            // Draw operations: core draw converts to RGBA but can't convert back
            // for modes beyond RGB/RGBA/L (image_clone lacks reverse conversion).
            if (type === 'draw' && !['RGB', 'RGBA', 'L'].includes(mode)) {
                return `draw not supported for mode ${mode} (core can't convert back from RGBA)`;
            }

            // Filter operations with mode-specific algorithm differences
            const filterModeSkips = {
                'BLUR':         ['1', 'CMYK'],
                'EMBOSS':       ['LA', 'RGBA'],
                'FIND_EDGES':   ['LA', 'RGBA'],
                'SHARPEN':      ['CMYK', 'I'],
                'UnsharpMask':  ['LA', 'RGBA'],
                'ModeFilter':   ['LA', 'RGBA'],
            };
            if (type === 'filter' && filterModeSkips[target]?.includes(mode)) {
                return `filter ${target} not supported for mode ${mode}`;
            }

            // ImageChops difference/subtract/subtract_modulo: core algorithm differs for LA/RGBA
            if (type === 'dual' && module === 'ImageChops' && ['LA', 'RGBA'].includes(mode) &&
                ['difference', 'subtract', 'subtract_modulo', 'add_modulo'].includes(target)) {
                return `ImageChops.${target} not supported for mode ${mode}`;
            }

            // ImageModule blend/composite for CMYK
            if (type === 'dual' && module === 'ImageModule' && mode === 'CMYK') {
                return `ImageModule.${target} not supported for mode ${mode}`;
            }

            // Image.effect_spread — WASM fallback is no-op (rand() unavailable)
            if (type === 'method' && module === 'Image' && target === 'effect_spread') {
                return `Image.effect_spread not supported in WASM (no libc rand)`;
            }

            // Image.reduce for CMYK
            if (type === 'method' && module === 'Image' && target === 'reduce' && mode === 'CMYK') {
                return `Image.reduce not supported for mode ${mode}`;
            }

            // Image.resize for F mode (float comparison needed, browser uses byte comparison)
            if (type === 'method' && module === 'Image' && target === 'resize' && mode === 'F') {
                return `Image.resize not supported for mode F (float pixel comparison needed)`;
            }

            // Image.remap_palette for L mode — core algorithm differs from PIL
            if (type === 'method' && module === 'Image' && target === 'remap_palette' && mode === 'L') {
                return `Image.remap_palette not supported for mode ${mode}`;
            }

            return null;
        },

        // ── Internal dispatch helpers ───────────────────────────────

        /**
         * Handle Image instance method dispatch.
         * Matches wasm_backend.mjs _callImageMethod.
         */
        _execImageMethod(target, img, p, img2) {

            // ── filter: map to img.filter(name) ──
            if (target === "filter") {
                const filterType = p.filter_type || p.type || "BLUR";
                return imgResult(img.filter(filterType));
            }

            // ── convert: handle __CONVERT_TO__ sentinel ──
            if (target === "convert") {
                let sourceMode = img.mode;
                let mode = p.mode;
                if (mode === "__CONVERT_TO__") {
                    mode = sourceMode === "RGB" ? "L" : "RGB";
                }
                // Non-standard modes cannot be properly converted in WASM
                if (["P", "CMYK", "HSV", "YCbCr", "I", "F"].includes(sourceMode)) {
                    return skipResult("convert from non-standard mode in WASM");
                }
                return imgResult(img.convert(mode));
            }

            // ── putdata: generate flat Uint8Array of appropriate length ──
            if (target === "putdata") {
                const np = img.width * img.height;
                const nb = img.getbands().length;
                const data = new Uint8Array(np * (nb > 1 ? nb : 1));
                data.fill(128);
                img.putdata(data);
                return { value: null };
            }

            // ── putpixel: generate value based on band count, returns null like PIL ──
            if (target === "putpixel") {
                const xy = p.xy || [0, 0];
                img.putpixel(xy[0], xy[1], 255, 255, 255, 255);
                return { value: null };
            }

            // ── seek, tell, load, verify — no-ops or return img ──
            if (target === "load" || target === "verify") {
                if (typeof img[target] === "function") {
                    img[target]();
                }
                return imgResult(img);
            }
            if (target === "seek") {
                if (typeof img.seek === "function") {
                    const frame = p.frame !== undefined ? p.frame : 0;
                    img.seek(frame);
                }
                return imgResult(img);
            }
            if (target === "tell") {
                return valResult(img.tell());
            }

            // ── draft — returns null to match PIL (no-op in WASM) ──
            if (target === "draft") {
                return { value: null };
            }

            // ── resize(size: [w, h]) → resize(w, h, filter?) ──
            if (target === "resize") {
                const sz = p.size;
                const w = sz[0];
                const h = sz[1];
                const f = p.filter || undefined;
                return imgResult(img.resize(w, h, f ? String(f) : undefined));
            }

            // ── crop(box: [l, t, r, b]) → crop(l, t, r, b) ──
            if (target === "crop") {
                const box = p.box || [0, 0, 1, 1];
                return imgResult(img.crop(box[0], box[1], box[2], box[3]));
            }

            // ── rotate(angle) ──
            if (target === "rotate") {
                const angle = p.angle !== undefined ? parseFloat(p.angle) : 90;
                return imgResult(img.rotate(angle));
            }

            // ── transpose(method) ──
            if (target === "transpose") {
                const method = p.method || "FLIP_LEFT_RIGHT";
                return imgResult(img.transpose(method));
            }

            // ── pasteImage(src, x, y) or pasteColor(r,g,b,a, box) — mutates in-place ──
            if (target === "paste") {
                if (p.src) {
                    const x = p.x !== undefined ? p.x : 0;
                    const y = p.y !== undefined ? p.y : 0;
                    img.pasteImage(p.src, x, y);
                } else if (img2) {
                    const x = p.xy ? p.xy[0] : 0;
                    const y = p.xy ? p.xy[1] : 0;
                    img.pasteImage(img2, x, y);
                } else if (p.color !== undefined) {
                    const rgba = _colorToRGBA(p.color, img.mode);
                    const box = p.box || [0, 0, img.width, img.height];
                    img.pasteColor(rgba[0], rgba[1], rgba[2], rgba[3],
                        box[0], box[1], box[2], box[3]);
                }
                return { value: null };
            }

            // ── point(lut: Uint8Array or array) ──
            if (target === "point") {
                let lut = p.lut || p.table;
                if (!lut) {
                    lut = new Uint8Array(256);
                    for (let i = 0; i < 256; i++) lut[i] = Math.min(255, i + 50);
                }
                if (Array.isArray(lut) && !(lut instanceof Uint8Array)) {
                    lut = new Uint8Array(lut);
                }
                return imgResult(img.point(lut));
            }

            // ── putalpha(a) — mutates in-place, returns null like PIL ──
            if (target === "putalpha") {
                const a = p.alpha !== undefined ? p.alpha : 128;
                img.putalpha(a);
                return { value: null };
            }

            // ── thumbnail(w, h) — mutates in-place, returns null like PIL ──
            if (target === "thumbnail") {
                const sz = p.size || [50, 50];
                img.thumbnail(sz[0], sz[1]);
                return { value: null };
            }

            // ── quantize(c) — core uses median-cut, PIL uses NeuQuant → different results ──
            if (target === "quantize") {
                return skipResult("quantize in WASM (different algorithm)");
            }

            // ── reduce(factor) ──
            if (target === "reduce") {
                const factor = p.factor !== undefined ? p.factor : 2;
                return imgResult(img.reduce(factor));
            }

            // ── effect_spread(d) ──
            if (target === "effect_spread" || target === "effectSpread") {
                const dist = p.distance !== undefined ? p.distance : 2;
                return imgResult(img.effectSpread(dist));
            }

            // ── transform — core affine differs from PIL's algorithm ──
            if (target === "transform") {
                return skipResult("transform in WASM (core algorithm differs)");
            }

            // ── remapPalette ──
            if (target === "remap_palette" || target === "remapPalette") {
                const mapping = p.mapping || p.table || new Uint8Array(256);
                return imgResult(img.remapPalette(mapping));
            }

            // ── copy ──
            if (target === "copy") {
                return imgResult(img.copy());
            }

            // ── split, getbands, getchannel ──
            if (target === "split") return imgResult(img.split()[0]);
            if (target === "getbands") return valResult(img.getbands());
            if (target === "getchannel") {
                const ch = p.channel !== undefined ? p.channel : 0;
                return imgResult(img.getchannel(ch));
            }

            // ── alphaComposite — mutates in-place, returns null like PIL ──
            if (target === "alpha_composite" || target === "alphaComposite") {
                const src = p.src || p.source || img2;
                if (!src) return skipResult("alpha_composite needs src image");
                img.alphaComposite(src);
                return { value: null };
            }

            // ── save, tobytes → return bytes ──
            if (target === "save") {
                const bytes = img.save();
                return { bytes: Array.from(bytes) };
            }
            if (target === "tobytes" || target === "toBytes") {
                const bytes = img.toBytes();
                return { bytes: Array.from(bytes) };
            }

            // ── tobitmap ──
            if (target === "tobitmap") {
                const bytes = img.tobitmap();
                return { bytes: Array.from(bytes) };
            }

            // ── getpalette, putpalette ──
            if (target === "getpalette") return valResult(img.getpalette());
            if (target === "putpalette") {
                img.putpalette(p.data || new Uint8Array(768));
                return { value: null };
            }

            // ── applyTransparency ──
            if (target === "apply_transparency" || target === "applyTransparency") {
                if (typeof img.applyTransparency === "function") {
                    img.applyTransparency();
                }
                return { value: null };
            }

            // ── Fallback: try calling the method directly ──
            if (typeof img[target] === "function") {
                try {
                    const result = img[target]();
                    if (result && typeof result.toBytes === "function") return imgResult(result);
                    return valResult(result);
                } catch (e) {
                    if (e.message && e.message.includes("not implemented")) throw e;
                    return skipResult(`Image.${target}: ${e.message}`);
                }
            }

            return skipResult(`Image.${target} not in WASM dispatch`);
        },

        /**
         * Handle ImageOps static method dispatch.
         * Matches wasm_backend.mjs _callImageOpsMethod.
         */
        _execImageOpsMethod(target, img, p) {
            const ops = ImageOps;

            if (target === "expand") {
                const border = p.border !== undefined ? p.border : 5;
                return imgResult(ops.expand(img, border, 0, 0, 0, 255));
            }

            if (target === "posterize") {
                const bits = p.bits !== undefined ? p.bits : 4;
                return imgResult(ops.posterize(img, bits));
            }

            if (target === "solarize") {
                const threshold = p.threshold !== undefined ? p.threshold : 128;
                return imgResult(ops.solarize(img, threshold));
            }

            if (target === "autocontrast") {
                const cutoff = p.cutoff !== undefined ? p.cutoff : 0;
                return imgResult(ops.autocontrast(img, cutoff));
            }

            if (target === "colorize") {
                return skipResult("ImageOps.colorize in WASM");
            }

            // ImageOps resize/crop operations that take size params
            if (target === "contain") {
                const sz = p.size || [25, 25];
                return imgResult(ops.contain(img, sz[0], sz[1]));
            }
            if (target === "cover") {
                const sz = p.size || [25, 25];
                return imgResult(ops.cover(img, sz[0], sz[1]));
            }
            if (target === "fit") {
                const sz = p.size || [25, 25];
                return imgResult(ops.fit(img, sz[0], sz[1]));
            }
            if (target === "pad") {
                const sz = p.size || [25, 25];
                const fill = p.fill !== undefined ? p.fill : null;
                const rgba = fill ? _colorToRGBA(fill, img.mode) : null;
                return imgResult(ops.pad(
                    img, sz[0], sz[1],
                    rgba ? rgba[0] : undefined,
                    rgba ? rgba[1] : undefined,
                    rgba ? rgba[2] : undefined,
                    rgba ? rgba[3] : undefined,
                ));
            }
            if (target === "scale") {
                const factor = p.factor !== undefined ? p.factor : 0.5;
                return imgResult(ops.scale(img, factor));
            }
            if (target === "crop") {
                const border = p.border !== undefined ? p.border : 10;
                return imgResult(ops.crop(img, border));
            }

            // invert, flip, mirror, grayscale, equalize — take only img
            const fn = ops[target];
            if (!fn) {
                return skipResult(`ImageOps.${target} not found`);
            }
            return imgResult(fn(img));
        },

        /**
         * Handle ImageChops single-image methods (method type).
         */
        _execChopsMethod(target, img, p) {
            const chops = ImageChops;
            if (target === "constant") {
                const value = p.value !== undefined ? p.value : 0;
                return imgResult(chops.constant(img, value));
            }
            if (target === "offset") {
                const xoffset = p.xoffset !== undefined ? p.xoffset : 0;
                const yoffset = p.yoffset !== undefined ? p.yoffset : 0;
                return imgResult(chops.offset(img, xoffset, yoffset));
            }
            const nameMap = { 'add_modulo':'addModulo','subtract_modulo':'subtractModulo','hard_light':'hardLight','soft_light':'softLight','logical_and':'logicalAnd','logical_or':'logicalOr','logical_xor':'logicalXor' };
            const wasmName = nameMap[target] || target;
            const fn = chops[wasmName];
            if (!fn) {
                return skipResult(`ImageChops.${target} not in WASM dispatch`);
            }
            return imgResult(fn(img));
        },

        /**
         * Handle ImageModule methods (method type).
         * Matches wasm_backend.mjs call_method for module === "ImageModule".
         */
        _execImageModuleMethod(target, img, p) {
            if (target === "alpha_composite" || target === "alphaComposite") {
                const fg = img.fromBytes(img.mode, img.width, img.height, img.toBytes());
                fg.putalpha(128);
                if (img.mode !== "RGBA") {
                    const rgba = img.convert("RGBA");
                    rgba.alphaComposite(fg.convert("RGBA"));
                    return imgResult(rgba.convert(img.mode));
                }
                img.alphaComposite(fg);
                return { value: null };
            }
            return skipResult(`ImageModule.${target} not in WASM dispatch`);
        },

        /**
         * Apply a built-in or parametric filter to an image.
         * Matches wasm_backend.mjs call_filter.
         */
        _execFilterTarget(target, img, p) {
            // Built-in non-parametric filters
            const builtin = new Set([
                "BLUR", "CONTOUR", "DETAIL", "EDGE_ENHANCE", "EDGE_ENHANCE_MORE",
                "EMBOSS", "FIND_EDGES", "SHARPEN", "SMOOTH", "SMOOTH_MORE",
            ]);
            if (builtin.has(target)) {
                return imgResult(img.filter(target));
            }

            // Parametric filters
            if (target === "GaussianBlur") {
                const radius = p.radius !== undefined ? parseFloat(p.radius) : 2;
                return imgResult(img.gaussianBlur(radius));
            }
            if (target === "BoxBlur") {
                const radius = p.radius !== undefined ? parseFloat(p.radius) : 2;
                return imgResult(img.boxBlur(radius));
            }
            if (target === "UnsharpMask") {
                const radius = p.radius !== undefined ? parseFloat(p.radius) : 2;
                const percent = p.percent !== undefined ? p.percent : 150;
                const threshold = p.threshold !== undefined ? p.threshold : 3;
                return imgResult(img.unsharpMask(radius, percent, threshold));
            }
            if (target === "MaxFilter") {
                const size = p.size !== undefined ? p.size : 3;
                return imgResult(img.maxFilter(size));
            }
            if (target === "MinFilter") {
                const size = p.size !== undefined ? p.size : 3;
                return imgResult(img.minFilter(size));
            }
            if (target === "MedianFilter") {
                const size = p.size !== undefined ? p.size : 3;
                return imgResult(img.medianFilter(size));
            }
            if (target === "ModeFilter") {
                const size = p.size !== undefined ? p.size : 3;
                return imgResult(img.modeFilter(size));
            }
            if (target === "RankFilter") {
                const size = p.size !== undefined ? p.size : 3;
                const rank = p.rank !== undefined ? p.rank : 0;
                return imgResult(img.rankFilter(size, rank));
            }
            if (target === "Kernel") {
                const sizeArr = p.size || [3, 3];
                const kernel = p.kernel || [1, 1, 1, 1, 1, 1, 1, 1, 1];
                const scale = p.scale !== undefined ? p.scale : undefined;
                const offset = p.offset !== undefined ? p.offset : undefined;
                return imgResult(img.kernelFilter(sizeArr, kernel, scale, offset));
            }

            return skipResult(`Unknown filter: ${target}`);
        },

        /**
         * Execute a dual-image operation via ImageChops.
         * Matches wasm_backend.mjs call_dual for ImageChops.
         */
        _execChopsDual(target, img1, img2, p) {
            const chops = ImageChops;

            // Apply prep (convert to 1-bit for logical ops)
            const prep = p.prep || "";
            let a = img1;
            let b = img2;
            if (prep.includes("convert('1'")) {
                a = img1.convert("1");
                b = img2.convert("1");
            }

            if (target === "blend") {
                const alpha = p.alpha !== undefined ? parseFloat(p.alpha) : 0.5;
                return imgResult(chops.blend(a, b, alpha));
            }
            if (target === "composite") {
                // Create a mid-gray mask
                const mask = chops.constant(a, 128);
                return imgResult(chops.composite(a, b, mask));
            }
            // Standard dual ImageChops: add, subtract, multiply, screen, etc.
            // Map snake_case fixture names to camelCase WASM bindings
            const nameMap = {
                'add_modulo': 'addModulo', 'subtract_modulo': 'subtractModulo',
                'hard_light': 'hardLight', 'soft_light': 'softLight',
                'logical_and': 'logicalAnd', 'logical_or': 'logicalOr',
                'logical_xor': 'logicalXor',
            };
            const wasmName = nameMap[target] || target;
            const fn = chops[wasmName];
            if (!fn) {
                return skipResult(`ImageChops.${target} not in WASM dispatch`);
            }
            return imgResult(fn(a, b));
        },

        /**
         * Execute a dual-image operation via ImageModule.
         * Matches wasm_backend.mjs call_dual for ImageModule.
         */
        _execImageModuleDual(target, img1, img2, p) {
            if (target === "blend") {
                const alpha = p.alpha !== undefined ? parseFloat(p.alpha) : 0.5;
                return imgResult(blend(img1, img2, alpha));
            }
            if (target === "composite") {
                const mask = new Image("L", img1.width, img1.height, 128, 128, 128, 255);
                return imgResult(composite(img1, img2, mask));
            }
            if (target === "merge") {
                const bands = img1.split();
                if (bands && bands.length > 0) {
                    return imgResult(merge(img1.mode, bands));
                }
                return imgResult(merge(img1.mode || "RGB", [img1]));
            }
            if (target === "alpha_composite" || target === "alphaComposite") {
                // Convert both to RGBA, composite, convert back
                const rgba1 = img1.mode === "RGBA" ? img1 : img1.convert("RGBA");
                const rgba2 = img2.mode === "RGBA" ? img2 : img2.convert("RGBA");
                rgba1.alphaComposite(rgba2);
                const result = img1.mode === "RGBA" ? rgba1 : rgba1.convert(img1.mode);
                return imgResult(result);
            }
            return skipResult(`ImageModule.${target} not in WASM dispatch`);
        },

        /**
         * Execute a dual-image operation with module "Image" (e.g. paste).
         */
        _execImageDual(target, img1, img2, p) {
            if (target === "paste") {
                const x = p.box ? p.box[0] : 0;
                const y = p.box ? p.box[1] : 0;
                img1.pasteImage(img2, x, y);
                return { value: null };
            }
            return skipResult(`dual Image.${target} not in WASM dispatch`);
        },

        /**
         * Draw on an image using ImageDraw.
         * Matches wasm_backend.mjs call_draw.
         */
        _execDrawTarget(target, img, p) {
            // Text measurement / font queries — return stub values
            if (["textbbox", "multiline_textbbox", "textlength"].includes(target)) {
                return valResult([0, 0, 50, 15]);
            }
            if (target === "getfont") {
                return { value: null };
            }
            const draw = new ImageDraw(img);

            try {
                if (target === "regular_polygon") {
                    const bc = p.bounding_circle;
                    if (!bc) return skipResult("regular_polygon needs bounding_circle");
                    const cx = Array.isArray(bc[0]) ? bc[0][0] : bc[0];
                    const cy = Array.isArray(bc[0]) ? bc[0][1] : bc[1];
                    const radius = Array.isArray(bc[1]) ? bc[1][0] : (bc[2] || bc[1]);
                    const nSides = p.n_sides || 6;
                    const rotation = p.rotation || 0;
                    const verts = [];
                    for (let i = 0; i < nSides; i++) {
                        const angle = rotation + (2 * Math.PI * i) / nSides - Math.PI / 2;
                        verts.push(Math.round(cx + radius * Math.cos(angle)));
                        verts.push(Math.round(cy + radius * Math.sin(angle)));
                    }
                    const fill = _colorToRGBA(p.fill, img.mode);
                    const outline = _colorToRGBA(p.outline, img.mode);
                    draw.polygon(verts,
                        fill ? fill[0] : undefined, fill ? fill[1] : undefined,
                        fill ? fill[2] : undefined, fill ? fill[3] : undefined,
                        outline ? outline[0] : undefined, outline ? outline[1] : undefined,
                        outline ? outline[2] : undefined, outline ? outline[3] : undefined);
                    return imgResult(draw.image);
                }
                switch (target) {
                    case "line": {
                        const xy = _extractCoords(p, target);
                        const rgba = _colorToRGBA(p.fill, img.mode) || [0, 0, 0, 255];
                        draw.line(xy[0], xy[1], xy[2], xy[3],
                            rgba[0], rgba[1], rgba[2], rgba[3]);
                        break;
                    }
                    case "rectangle": {
                        const xy = _extractCoords(p, target);
                        const fill = _colorToRGBA(p.fill, img.mode);
                        const outline = _colorToRGBA(p.outline, img.mode);
                        draw.rectangle(
                            xy[0], xy[1], xy[2], xy[3],
                            fill ? fill[0] : undefined,
                            fill ? fill[1] : undefined,
                            fill ? fill[2] : undefined,
                            fill ? fill[3] : undefined,
                            outline ? outline[0] : undefined,
                            outline ? outline[1] : undefined,
                            outline ? outline[2] : undefined,
                            outline ? outline[3] : undefined,
                        );
                        break;
                    }
                    case "ellipse": {
                        const xy = _extractCoords(p, target);
                        const fill = _colorToRGBA(p.fill, img.mode);
                        const outline = _colorToRGBA(p.outline, img.mode);
                        draw.ellipse(
                            xy[0], xy[1], xy[2], xy[3],
                            fill ? fill[0] : undefined,
                            fill ? fill[1] : undefined,
                            fill ? fill[2] : undefined,
                            fill ? fill[3] : undefined,
                            outline ? outline[0] : undefined,
                            outline ? outline[1] : undefined,
                            outline ? outline[2] : undefined,
                            outline ? outline[3] : undefined,
                        );
                        break;
                    }
                    case "polygon": {
                        const xy = _extractCoords(p, target);
                        const fill = _colorToRGBA(p.fill, img.mode);
                        const outline = _colorToRGBA(p.outline, img.mode);
                        draw.polygon(
                            xy,
                            fill ? fill[0] : undefined,
                            fill ? fill[1] : undefined,
                            fill ? fill[2] : undefined,
                            fill ? fill[3] : undefined,
                            outline ? outline[0] : undefined,
                            outline ? outline[1] : undefined,
                            outline ? outline[2] : undefined,
                            outline ? outline[3] : undefined,
                        );
                        break;
                    }
                    case "point": {
                        const xy = _extractCoords(p, target);
                        const rgba = _colorToRGBA(p.fill, img.mode) || [0, 0, 0, 255];
                        draw.point(xy, rgba[0], rgba[1], rgba[2], rgba[3]);
                        break;
                    }
                    case "arc": {
                        const xy = _extractCoords(p, target);
                        const start = p.start !== undefined ? p.start : 0;
                        const end = p.end !== undefined ? p.end : 360;
                        const rgba = _colorToRGBA(p.fill, img.mode) || [0, 0, 0, 255];
                        draw.arc(xy[0], xy[1], xy[2], xy[3],
                            start, end, rgba[0], rgba[1], rgba[2], rgba[3]);
                        break;
                    }
                    case "chord": {
                        const xy = _extractCoords(p, target);
                        const start = p.start !== undefined ? p.start : 0;
                        const end = p.end !== undefined ? p.end : 360;
                        const fill = _colorToRGBA(p.fill, img.mode);
                        const outline = _colorToRGBA(p.outline, img.mode);
                        draw.chord(
                            xy[0], xy[1], xy[2], xy[3],
                            start, end,
                            fill ? fill[0] : undefined,
                            fill ? fill[1] : undefined,
                            fill ? fill[2] : undefined,
                            fill ? fill[3] : undefined,
                            outline ? outline[0] : undefined,
                            outline ? outline[1] : undefined,
                            outline ? outline[2] : undefined,
                            outline ? outline[3] : undefined,
                        );
                        break;
                    }
                    case "pieslice": {
                        const xy = _extractCoords(p, target);
                        const start = p.start !== undefined ? p.start : 0;
                        const end = p.end !== undefined ? p.end : 360;
                        const fill = _colorToRGBA(p.fill, img.mode);
                        const outline = _colorToRGBA(p.outline, img.mode);
                        draw.pieslice(
                            xy[0], xy[1], xy[2], xy[3],
                            start, end,
                            fill ? fill[0] : undefined,
                            fill ? fill[1] : undefined,
                            fill ? fill[2] : undefined,
                            fill ? fill[3] : undefined,
                            outline ? outline[0] : undefined,
                            outline ? outline[1] : undefined,
                            outline ? outline[2] : undefined,
                            outline ? outline[3] : undefined,
                        );
                        break;
                    }
                    case "circle": {
                        const coords = _extractCoords(p, target);
                        const cx = coords[0];
                        const cy = coords[1];
                        const radius = coords.length > 2 ? coords[2] : (p.radius || 10);
                        const fill = _colorToRGBA(p.fill, img.mode);
                        const outline = _colorToRGBA(p.outline, img.mode);
                        draw.circle(
                            cx, cy, radius,
                            fill ? fill[0] : undefined,
                            fill ? fill[1] : undefined,
                            fill ? fill[2] : undefined,
                            fill ? fill[3] : undefined,
                            outline ? outline[0] : undefined,
                            outline ? outline[1] : undefined,
                            outline ? outline[2] : undefined,
                            outline ? outline[3] : undefined,
                        );
                        break;
                    }
                    case "rounded_rectangle":
                    case "roundedRectangle": {
                        const xy = _extractCoords(p, target);
                        const radius = p.radius !== undefined ? p.radius : 5;
                        const fill = _colorToRGBA(p.fill, img.mode);
                        const outline = _colorToRGBA(p.outline, img.mode);
                        draw.roundedRectangle(
                            xy[0], xy[1], xy[2], xy[3], radius,
                            fill ? fill[0] : undefined,
                            fill ? fill[1] : undefined,
                            fill ? fill[2] : undefined,
                            fill ? fill[3] : undefined,
                            outline ? outline[0] : undefined,
                            outline ? outline[1] : undefined,
                            outline ? outline[2] : undefined,
                            outline ? outline[3] : undefined,
                        );
                        break;
                    }
                    case "text":
                    case "multiline_text": {
                        const xy = p.xy || [0, 0];
                        const text = p.text || "";
                        const font = ImageFont.loadDefault();
                        const rgba = _colorToRGBA(p.fill, img.mode) || [0, 0, 0, 255];
                        draw.textFill(xy[0], xy[1], text, font,
                            rgba[0], rgba[1], rgba[2], rgba[3]);
                        break;
                    }
                    case "bitmap": {
                        const xy = p.xy || [0, 0];
                        const rgba = _colorToRGBA(p.fill, img.mode);
                        const bmp = img.convert("1", "NONE");
                        if (rgba) {
                            draw.bitmap([xy[0], xy[1]], bmp,
                                [rgba[0], rgba[1], rgba[2], rgba[3]]);
                        } else {
                            draw.bitmap([xy[0], xy[1]], bmp, null);
                        }
                        break;
                    }
                    default:
                        return skipResult(`ImageDraw.${target} not in WASM dispatch`);
                }
            } catch (e) {
                if (e.message && e.message.includes("not implemented")) throw e;
                return skipResult(`ImageDraw.${target}: ${e.message}`);
            }

            // After drawing, get the modified image back via the draw.image getter
            return imgResult(draw.image);
        },

        /**
         * Apply an ImageEnhance operation.
         * Matches wasm_backend.mjs call_enhance.
         */
        _execEnhanceTarget(target, img, p) {
            const factor = p.factor !== undefined ? parseFloat(p.factor) : 1.5;
            switch (target) {
                case "Brightness":
                    return imgResult(img.enhanceBrightness(factor));
                case "Contrast":
                    return imgResult(img.enhanceContrast(factor));
                case "Color":
                    return imgResult(img.enhanceColor(factor));
                case "Sharpness":
                    return imgResult(img.enhanceSharpness(factor));
                default:
                    return skipResult(`enhance ${target} not in WASM dispatch`);
            }
        },

        /**
         * Return a value from an image or a module stub.
         * Matches wasm_backend.mjs call_value.
         */
        _execValueTarget(mod, target, img, p) {
            // ── Image value operations ──
            if (mod === "Image") {
                // Simple properties
                if (target === "mode")       return valResult(img.mode);
                if (target === "width")      return valResult(img.width);
                if (target === "height")     return valResult(img.height);
                if (target === "format")     return { value: null };
                if (target === "info")       return valResult({});
                if (target === "palette")    return { value: null };

                if (target === "size") {
                    try { return valResult(img.size()); }
                    catch (_) { return valResult([img.width, img.height]); }
                }

                // getexif
                if (target === "getexif") {
                    return skipResult("getexif in WASM");
                }

                // getxmp
                if (target === "getxmp") {
                    const xmp = img.getxmp();
                    if (typeof xmp === 'string') return valResult({});
                    return valResult(xmp || {});
                }

                // getpalette
                if (target === "getpalette") {
                    const pal = img.getpalette();
                    if (typeof pal === 'string') return { value: null };
                    return valResult(pal);
                }

                // getim
                if (target === "getim") {
                    return skipResult("getim in WASM");
                }

                // toqimage, toqpixmap
                if (target === "toqimage" || target === "toqpixmap") {
                    return skipResult("Qt not available in WASM");
                }

                // get_flattened_data
                if (target === "get_flattened_data" || target === "getFlattenedData") {
                    const data = img.getFlattenedData();
                    if (data instanceof Uint8Array) return valResult(Array.from(data));
                    if (Array.isArray(data)) return valResult(data);
                    try { return valResult(Array.from(img.toBytes())); }
                    catch (_) { return valResult([]); }
                }

                // get_child_images
                if (target === "get_child_images" || target === "getChildImages") {
                    return valResult([]);
                }

                // is_animated, n_frames, has_transparency_data
                if (target === "is_animated")           return valResult(false);
                if (target === "n_frames")              return valResult(1);
                if (target === "has_transparency_data") return valResult(false);

                // apply_transparency
                if (target === "apply_transparency" || target === "applyTransparency") {
                    img.applyTransparency();
                    return { value: null };
                }

                // show, close
                if (target === "show")  return { value: null };
                if (target === "close") return { value: null };

                // seek (value type)
                if (target === "seek") {
                    const frame = p.frame !== undefined ? p.frame : 0;
                    img.seek(frame);
                    return { value: null };
                }

                // tell
                if (target === "tell") return valResult(img.tell());

                // load
                if (target === "load") {
                    img.load();
                    return { value: null };
                }

                // verify
                if (target === "verify") {
                    img.verify();
                    return { value: null };
                }

                // ── Value-returning callable methods ──

                // getpixel(xy: [x, y]) → getpixel(x, y) — mode-aware return
                if (target === "getpixel") {
                    const xy = p.xy || [0, 0];
                    const pixel = Array.from(img.getpixel(xy[0], xy[1]));
                    const mode = img.mode;
                    // WASM always returns RGBA; trim to match mode
                    if (mode === 'L' || mode === '1' || mode === 'P') return valResult(pixel[0]);
                    if (mode === 'LA') return valResult([pixel[0], pixel[3]]);
                    if (mode === 'RGB') return valResult([pixel[0], pixel[1], pixel[2]]);
                    return valResult(pixel); // RGBA
                }

                // getbbox()
                if (target === "getbbox") {
                    const box = img.getbbox(p.alpha);
                    if (Array.isArray(box)) return valResult(box);
                    return valResult([0, 0, 0, 0]);
                }

                // histogram()
                if (target === "histogram") {
                    const hist = img.histogram();
                    return valResult(Array.from(hist));
                }

                // entropy()
                if (target === "entropy") {
                    return valResult(img.entropy());
                }

                // getextrema
                if (target === "getextrema") {
                    const e = img.getextrema();
                    return valResult(Array.from(e));
                }

                // getcolors(maxcolors)
                if (target === "getcolors") {
                    const maxcolors = p.maxcolors !== undefined ? p.maxcolors : 256;
                    const result = img.getcolors(maxcolors);
                    return valResult(result);
                }

                // getdata(band?)
                if (target === "getdata") {
                    return skipResult("getdata in WASM");
                }

                // getprojection()
                if (target === "getprojection") {
                    const result = img.getprojection();
                    return valResult(result);
                }

                // getbands()
                if (target === "getbands") {
                    return valResult(img.getbands());
                }

                // getchannel(ch)
                if (target === "getchannel") {
                    const ch = p.channel !== undefined ? p.channel : 0;
                    return imgResult(img.getchannel(ch));
                }

                // tobytes / toBytes
                if (target === "tobytes" || target === "toBytes") {
                    return { bytes: Array.from(img.toBytes()) };
                }

                // tobitmap
                if (target === "tobitmap") {
                    return { bytes: Array.from(img.tobitmap()) };
                }

                // split (as value, returns array of band images)
                if (target === "split") {
                    return valResult(img.split());
                }

                // repr
                if (target === "repr") {
                    return valResult(img.repr());
                }

                return skipResult(`value Image.${target} not in dispatch`);
            }

            // ── Module stubs ──
            if (mod === "ImageColor") {
                if (target === "getcolor" || target === "getrgb") {
                    return valResult([255, 0, 0]); // stub: always red
                }
                return skipResult(`value ${mod}.${target} not in dispatch`);
            }

            if (mod === "ImagePalette") {
                if (target === "copy") return { value: null };
                if (target === "getcolor") return valResult(0);
                if (target === "getdata") return valResult(["RGB", ""]);
                if (target === "save") return { value: null };
                if (target === "tobytes") return valResult(new Uint8Array(0));
                return { value: null };
            }

            if (mod === "ImageFont") {
                if (target === "load_default" || target === "loadDefault") {
                    return valResult("FreeTypeFont");
                }
                if (target === "load_default_imagefont") {
                    return valResult("ImageFont");
                }
                if (target === "ImageFont") {
                    return { value: null };
                }
                // load, load_path, truetype, FreeTypeFont — return null
                return { value: null };
            }

            if (mod === "ImageStat") {
                if (target === "Stat") {
                    const stat = new ImageStat(img);
                    return valResult({
                        count: [stat.count],
                        sum: [stat.sum],
                        mean: [stat.mean],
                        median: [stat.mean],
                        rms: [stat.mean],
                        var: [0],
                        stddev: [0],
                        extrema: [[0, 0]],
                    });
                }
                return skipResult(`value ${mod}.${target} not in dispatch`);
            }

            if (mod === "ImageSequence") {
                if (target === "Iterator") {
                    return { value: null };
                }
                return { value: null };
            }

            return skipResult(`value ${mod}.${target} not in dispatch`);
        },

        /**
         * Execute a class/static method on Image or ImageModule.
         * Matches wasm_backend.mjs call_classmethod.
         */
        _execClassMethodTarget(target, img, p) {
            if (target === "new") {
                const mode = p.mode || "RGB";
                const size = p.size || [100, 100];
                const color = p.color;
                let r = 0, g = 0, b = 0, a = 255;
                if (color !== undefined && color !== null) {
                    if (typeof color === "number") {
                        r = g = b = color;
                    } else if (Array.isArray(color)) {
                        r = color[0] !== undefined ? color[0] : 0;
                        g = color[1] !== undefined ? color[1] : 0;
                        b = color[2] !== undefined ? color[2] : 0;
                        a = color[3] !== undefined ? color[3] : 255;
                    }
                }
                const newImg = new Image(mode, size[0], size[1], r, g, b, a);
                return imgResult(newImg);
            }

            if (target === "effect_noise") {
                return skipResult("Image.effect_noise in WASM");
            }

            if (target === "eval") {
                return skipResult("Image.eval in WASM");
            }

            if (target === "merge") {
                const bands = img.split();
                return imgResult(merge(img.mode || p.mode || "RGB", bands));
            }

            if (target === "blend") {
                const i1 = new Image("L", 100, 100, 128, 128, 128, 255);
                const i2 = new Image("L", 100, 100, 128, 128, 128, 255);
                const alpha = p.alpha !== undefined ? parseFloat(p.alpha) : 0.5;
                return imgResult(blend(i1, i2, alpha));
            }

            if (target === "composite") {
                const i1 = new Image("L", 100, 100, 128, 128, 128, 255);
                const i2 = new Image("L", 100, 100, 128, 128, 128, 255);
                const mask = new Image("L", 100, 100, 128, 128, 128, 255);
                return imgResult(composite(i1, i2, mask));
            }

            if (target === "open" || target === "frombytes") {
                return skipResult("Image.open/frombytes in WASM");
            }

            if (target === "fromarray") {
                return skipResult("fromarray requires numpy");
            }

            if (target === "effect_mandelbrot") {
                return skipResult("effect_mandelbrot in WASM");
            }

            if (target === "frombuffer") {
                return skipResult("frombuffer in WASM");
            }

            return skipResult(`classmethod ${target} not in WASM dispatch`);
        },

        ready: false,
    };

    window.wasmTest.ready = true;
    document.getElementById('status').textContent = 'Test API Ready';
}

main().catch(e => {
    document.getElementById('status').textContent = 'Error: ' + e.message;
    console.error('WASM init error:', e);
});
</script>
