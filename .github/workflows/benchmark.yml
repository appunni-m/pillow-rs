name: Benchmark

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark cohort to run
        required: true
        default: quick
        type: choice
        options: [quick, standard]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: 1.96.1
  MIGRATION_BENCHMARK_PROFILE: ${{ inputs.profile || 'quick' }}

jobs:
  benchmark:
    name: ${{ inputs.profile || 'quick' }} benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: install the locked Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: install locked benchmark tools
        run: python -m pip install --requirement requirements-ci.txt
      - name: run correctness-gated benchmark
        run: make migration-parity-benchmark
      - name: generate benchmark evidence
        run: |
          make migration-parity-pipeline-report
          make migration-parity-pipeline-roadmap-status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-${{ github.run_id }}
          path: |
            build/migration-parity/benchmark-result.json
            build/migration-parity/benchmark-parity-result.json
            build/migration-parity/pipeline-performance-report.json
            build/migration-parity/pipeline-roadmap-status.json
          if-no-files-found: error
