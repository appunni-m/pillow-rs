name: Benchmark

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/benchmark.yml'
      - 'scripts/run_migration_benchmark.py'
      - 'scripts/build_migration_parity_inputs.py'
      - 'scripts/report_pipeline_*.py'
      - 'pillow-rs/src/**'
      - 'pillow-rs-py/src/**'
      - 'pillow-rs/tests/fixtures/manifest.yaml'
      - 'pillow-rs/tests/fixtures/inputs/benchmark/**'
      - 'docs/PIPELINE_ROADMAP.md'
      - 'scripts/docs_evidence.py'
      - 'scripts/docs_benchmark_view.py'
      - 'scripts/test_docs_benchmark_selection.py'
      - 'scripts/test_docs_benchmark_view.py'
      - 'docs.mk'
      - 'docs/BENCHMARKING.md'
      - 'site-assets/evidence.js'
      - 'site-assets/docs.css'
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: Optional prior successful full operation run ID for budget comparison
        required: false
        type: string
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: 1.96.1
  RUSTC_WRAPPER: ""
  # The public benchmark snapshot must contain both the individual-operation
  # and composed-pipeline cohorts. Quick runs remain available through Make.
  MIGRATION_BENCHMARK_PROFILE: pipeline

jobs:
  benchmark:
    name: full operation and pipeline benchmark (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-15-arm64
            runner: macos-15
            architecture: arm64
            label: macOS 15 · arm64
            backends: cpu,simd,gpu
          - id: ubuntu-24.04-x86_64
            runner: ubuntu-24.04
            architecture: x86_64
            label: Ubuntu 24.04 · x86_64
            backends: cpu,simd
          - id: ubuntu-24.04-arm64
            runner: ubuntu-24.04-arm
            architecture: aarch64
            label: Ubuntu 24.04 · arm64
            backends: cpu,simd
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install the locked Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: install locked benchmark tools
        run: make setup-venv PYTHON=python
      - name: verify runner architecture and record hardware identity
        id: runner
        shell: bash
        run: |
          actual_arch="$(uname -m)"
          test "$actual_arch" = "${{ matrix.architecture }}"
          if test "$(uname -s)" = Darwin; then
            cpu_model="$(sysctl -n machdep.cpu.brand_string 2>/dev/null || sysctl -n hw.model)"
          else
            cpu_model="$(awk -F: 'tolower($1) ~ /model name/ {sub(/^ /, "", $2); print $2; exit}' /proc/cpuinfo)"
            if test -z "$cpu_model"; then
              cpu_model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)"
            fi
            if test -z "$cpu_model"; then
              cpu_model="$(awk -F: '/^Hardware/ {sub(/^ /, "", $2); print $2; exit}' /proc/cpuinfo)"
            fi
          fi
          printf 'cpu_model=%s\n' "${cpu_model:-not-recorded}" >> "$GITHUB_OUTPUT"
          printf 'image_version=%s-%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: verify runtime x86 FMA matches portable fused arithmetic
        if: matrix.architecture == 'x86_64'
        run: |
          cargo test --locked -p pillow-rs --lib runtime_x86_fma_matches_portable_fused_operation
          cargo test --locked -p pillow-rs --lib runtime_x86_fma_boxed_resize_matches_portable_fused_operations
          cargo test --locked -p pillow-rs --lib runtime_x86_f32_fma_matches_portable_fused_operation
      - name: run full correctness-gated CPU, SIMD, and GPU benchmark
        env:
          MIGRATION_BENCHMARK_BACKENDS: ${{ matrix.backends }}
        run: make migration-parity-benchmark
      - name: run separately gated Parallel CPU benchmark
        run: make migration-parity-benchmark-parallel-cpu
      - name: generate benchmark evidence
        run: |
          make migration-parity-pipeline-report
          make migration-parity-pipeline-roadmap-status
      - name: download explicit compatible baseline
        if: ${{ inputs.baseline_run_id != '' }}
        id: download_baseline
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.baseline_run_id }}
          name: benchmark-${{ inputs.baseline_run_id }}-${{ matrix.id }}
          path: baseline-artifact
      - name: compare compatible baseline budget
        if: ${{ inputs.baseline_run_id != '' && steps.download_baseline.outcome == 'success' }}
        id: budget
        shell: bash
        run: |
          baseline="$(find baseline-artifact -type f -name benchmark-result.json -print -quit)"
          test -n "$baseline"
          set +e
          MIGRATION_BENCHMARK_OUTPUT=build/migration-parity/benchmark-result.json \
          MIGRATION_BENCHMARK_BUDGET_BASELINE="$baseline" \
          MIGRATION_BENCHMARK_BUDGET_OUTPUT=build/migration-parity/pipeline-budget-check.json \
          make migration-parity-pipeline-budget-check
          status=$?
          if test -f build/migration-parity/pipeline-budget-check.json; then
            if test "$status" -ne 0; then
              python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("build/migration-parity/pipeline-budget-check.json").read_text())
          if report.get("schema") != "pillow-rs/pipeline-performance-budget@1":
              raise SystemExit("budget report schema is invalid")
          violation_count = report.get("violation_count")
          if not isinstance(violation_count, int) or violation_count <= 0:
              raise SystemExit("budget comparison failed without a timing violation")
          summary = (
              f"### Benchmark budget comparison\n"
              f"Comparable rows: {report.get('comparable_count', 0)}; "
              f"not comparable: {report.get('not_comparable_count', 0)}; "
              f"violations: {violation_count} (review-needed).\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          PY
              exit 0
            fi
          elif test "$status" -ne 0; then
            exit "$status"
          fi
          exit "$status"
      - name: report unavailable same-runner baseline
        if: ${{ inputs.baseline_run_id != '' && steps.download_baseline.outcome != 'success' }}
        run: echo "No artifact was available for this runner in the selected baseline run; its timing budget was not compared."
      - name: Export both benchmark cohorts for the public view
        env:
          DOCS_BENCHMARK_RUNNER_ID: ${{ matrix.id }}
          DOCS_BENCHMARK_RUNNER_LABEL: ${{ matrix.label }}
          DOCS_BENCHMARK_CPU_MODEL: ${{ steps.runner.outputs.cpu_model }}
          DOCS_BENCHMARK_IMAGE_VERSION: ${{ steps.runner.outputs.image_version }}
          DOCS_BENCHMARK_RUST_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: >-
          make docs-benchmark
          DOCS_BENCHMARK_SOURCE=build/migration-parity/benchmark-result.json
          DOCS_BENCHMARK_PARALLEL_SOURCE=build/migration-parity/benchmark-result-parallel-cpu.json
          DOCS_BENCHMARK_OUTPUT=target/public-benchmark/snapshot.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-benchmark-${{ matrix.id }}
          path: target/public-benchmark/snapshot.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-${{ github.run_id }}-${{ matrix.id }}
          path: |
            build/migration-parity/benchmark-result.json
            build/migration-parity/benchmark-parity-result.json
            build/migration-parity/benchmark-result-parallel-cpu.json
            build/migration-parity/benchmark-parity-result-parallel-cpu.json
            build/migration-parity/pipeline-performance-report.json
            build/migration-parity/pipeline-roadmap-status.json
            build/migration-parity/pipeline-budget-check.json
          if-no-files-found: error

  aggregate:
    name: assemble runner-specific benchmark snapshots
    needs: [benchmark]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: public-benchmark-*
          path: target/benchmark-cohorts
          merge-multiple: false
      - name: validate and combine runner cohorts
        run: >-
          python3 scripts/docs_evidence.py merge
          target/benchmark-cohorts
          target/public-benchmark/snapshot.json
          --repository appunni-m/pillow-rs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-benchmark
          path: target/public-benchmark/snapshot.json
          if-no-files-found: error
