# ============================================================================
# AS PER DESIGN — DO NOT REMOVE CHECKS.
#   Rust:     rustfmt → clippy (workspace lints) → tests → cargo-deny → cargo-audit
#   Python:   AST binding check → parity tests → coverage report
#   WASM:     build sanity
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Rust: format + clippy + tests + supply chain ──
  rust:
    name: Rust (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        task: [fmt-clippy, test, supply-chain]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: rustfmt + clippy
        if: matrix.task == 'fmt-clippy'
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -A deprecated

      - name: tests
        if: matrix.task == 'test'
        run: cargo test -p pillow-rs

      - name: supply chain audit
        if: matrix.task == 'supply-chain'
        run: |
          cargo install cargo-deny cargo-audit --locked
          cargo deny check advisories
          cargo deny check bans
          cargo deny check licenses
          cargo deny check sources
          cargo audit

  # ── Python: binding audit + parity tests ──
  python:
    name: Python ${{ matrix.python-version }}
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install deps
        run: pip install maturin pillow pyyaml pytest pytest-timeout pytest-json-report pytest-benchmark numpy

      - name: check Python binding rules
        run: python scripts/check_bindings.py

      - name: build + test
        run: |
          maturin develop --manifest-path pillow-rs-py/Cargo.toml --release
          python -m pytest tests/ -q --tb=short --timeout=300 --json-report --json-report-file=/tmp/report.json

      - name: coverage
        run: python scripts/coverage/compute_coverage.py manifest.yaml /tmp/report.json

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: /tmp/report.json

  # ── WASM: build sanity ──
  wasm:
    name: WASM build
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - working-directory: pillow-rs-js
        run: wasm-pack build --target web --dev
