name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -A deprecated
      - run: cargo test -p pillow-rs

  python-tests:
    needs: core-tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install maturin pillow pyyaml pytest pytest-timeout pytest-json-report pytest-benchmark numpy
      - run: maturin develop --manifest-path pillow-rs-py/Cargo.toml --release
      - run: python -m pytest tests/ -q --tb=short --timeout=300 --json-report --json-report-file=/tmp/report.json
      - run: python scripts/coverage/compute_coverage.py manifest.yaml /tmp/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: /tmp/report.json

  wasm-build:
    needs: core-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - working-directory: pillow-rs-js
        run: wasm-pack build --target web --dev

  benchmark:
    needs: python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin pillow pyyaml
      - run: maturin develop --manifest-path pillow-rs-py/Cargo.toml --release
      - run: bash scripts/bench/bench_all.sh full
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: BENCHMARKS.md
