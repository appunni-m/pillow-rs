# The CI lanes use the same locked toolchain as local Make targets.
# Action references are full commit SHAs; update the trailing version comment
# together with the SHA when a reviewed dependency update is made.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: 1.96.1
  CARGO_DENY_VERSION: 0.20.2
  CARGO_AUDIT_VERSION: 0.22.2
  WASM_PACK_VERSION: 0.15.0

jobs:
  # ── Rust: format + clippy + parity build + supply chain ──
  rust:
    name: Rust (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        task: [fmt-clippy, parity-build, supply-chain]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: install the locked Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - name: rustfmt + clippy
        if: matrix.task == 'fmt-clippy'
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -A deprecated

      - name: parity build
        if: matrix.task == 'parity-build'
        run: make pillow-rs-build

      - name: supply chain audit
        if: matrix.task == 'supply-chain'
        run: |
          cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
          cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
          cargo deny check advisories
          cargo deny check bans
          cargo deny check licenses
          cargo deny check sources
          cargo audit

  # ── Python: binding audit + parity tests ──
  python:
    name: Python ${{ matrix.python-version }}
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        # Pillow 12.2.0 is the versioned oracle and requires Python >=3.10.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: install the locked Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: install locked Python tools
        run: python -m pip install --requirement requirements-ci.txt

      - name: check Python binding rules
        run: python scripts/check_bindings.py

      - name: build + Python parity
        run: |
          make build
          make migration-parity-inputs-check
          make migration-parity-inventory-check
          make migration-parity-test

      - name: coverage
        run: make migration-parity-coverage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-py${{ matrix.python-version }}
          path: target/coverage/migration-parity-python.json
          if-no-files-found: error

  # ── Documentation and manifest contract ──
  docs:
    name: Documentation and inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: install the documented input checker
        run: python -m pip install "pyyaml==6.0.3"
      - run: make docs-check

  # ── WASM: build sanity ──
  wasm:
    name: WASM build
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: install the locked Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - name: install wasm-pack ${{ env.WASM_PACK_VERSION }}
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.0"
      - working-directory: pillow-rs-js
        run: npm ci
      - name: build and JS/WASM parity
        run: make test-wasm
