# ============================================================================
# AS PER DESIGN — DO NOT REMOVE CHECKS.
#   Rust:     rustfmt → clippy (workspace lints) → parity build → cargo-deny → cargo-audit
#   Python:   AST binding check → parity tests → coverage report
#   WASM:     build sanity
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: 1.96.1

jobs:
  # ── Rust: format + clippy + parity build + supply chain ──
  rust:
    name: Rust (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        task: [fmt-clippy, parity-build, supply-chain]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: rustfmt + clippy
        if: matrix.task == 'fmt-clippy'
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -A deprecated

      - name: parity build
        if: matrix.task == 'parity-build'
        run: make pillow-rs-build

      - name: supply chain audit
        if: matrix.task == 'supply-chain'
        run: |
          cargo install cargo-deny cargo-audit --locked
          cargo deny check advisories
          cargo deny check bans
          cargo deny check licenses
          cargo deny check sources
          cargo audit

  # ── Python: binding audit + parity tests ──
  python:
    name: Python ${{ matrix.python-version }}
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install deps
        run: pip install maturin coverage pillow==12.2.0 pyyaml numpy

      - name: check Python binding rules
        run: python scripts/check_bindings.py

      - name: build + Python parity
        run: |
          make build
          make migration-parity-inputs-check
          make migration-parity-inventory-check
          make migration-parity-test

      - name: coverage
        run: make migration-parity-coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: target/coverage/migration-parity-python.json

  # ── WASM: build sanity ──
  wasm:
    name: WASM build
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: pillow-rs-js
        run: npm ci
      - name: build and JS/WASM parity
        run: make test-wasm
