# The CI lanes use the same locked toolchain as local Make targets.
# Action references are full commit SHAs; update the trailing version comment
# together with the SHA when a reviewed dependency update is made.

name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep hosted jobs self-contained; the local Cargo config may enable
  # sccache, but CI does not install that optional wrapper.
  RUSTC_WRAPPER: ""
  RUST_TOOLCHAIN: 1.96.1
  # A fresh hosted runner may need to retry a registry or git-dependency
  # request.  Retries do not change the final build result or hide failures.
  CARGO_NET_RETRY: "3"
  CARGO_DENY_VERSION: 0.20.2
  CARGO_AUDIT_VERSION: 0.22.2
  WASM_PACK_VERSION: 0.15.0
  NODE_VERSION: 22.14.0
  NPM_VERSION: 11.5.1

jobs:
  # ── Rust: format + clippy + parity build + supply chain ──
  rust:
    name: Rust (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        task: [fmt-clippy, parity-build, supply-chain]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: install the locked Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - name: rustfmt + clippy
        if: matrix.task == 'fmt-clippy'
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -A deprecated

      - name: parity build
        if: matrix.task == 'parity-build'
        run: make pillow-rs-build

      - name: supply chain audit
        if: matrix.task == 'supply-chain'
        run: |
          cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
          cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
          cargo deny check advisories
          cargo deny check bans
          cargo deny check licenses
          cargo deny check sources
          cargo audit

  # ── Python: binding audit + parity tests ──
  python:
    name: Python ${{ matrix.python-version }}
    needs: rust
    # The committed Pillow corpus and its native codec/oracle measurements are
    # generated on Apple ARM64.  Keep both parity adapters on the same
    # architecture so platform-specific C/Pillow arithmetic is not reported as
    # a migration mismatch; Linux remains covered by the Rust and WASM jobs.
    runs-on: macos-14
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Pillow 12.2.0 is the versioned oracle and requires Python >=3.10.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: install the locked Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: create the project virtualenv
        run: |
          python -m venv .venv
          # Maturin uses VIRTUAL_ENV to select the interpreter for `develop`.
          # Export the freshly created environment instead of relying on its
          # project-directory fallback, which differs across Python versions.
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: install locked Python tools
        run: .venv/bin/python -m pip install --requirement requirements-ci.txt

      - name: check Python binding rules
        run: .venv/bin/python scripts/check_bindings.py

      - name: build Python package
        env:
          PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          mkdir -p target/ci-diagnostics
          set -o pipefail
          make PYTHON=.venv/bin/python build 2>&1 | tee target/ci-diagnostics/python-build.log

      - name: upload Python build diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: python-build-${{ matrix.python-version }}
          path: target/ci-diagnostics/python-build.log
          if-no-files-found: warn

      - name: summarize Python build failure
        if: failure()
        run: |
          if [ -s target/ci-diagnostics/python-build.log ]; then
            {
              echo "### Python build log (last 80 lines)"
              echo
              echo '```text'
              tail -n 80 target/ci-diagnostics/python-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Python build failed before producing target/ci-diagnostics/python-build.log" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: verify parity inputs
        run: make PYTHON=.venv/bin/python migration-parity-inputs-check

      - name: verify parity inventory
        run: make PYTHON=.venv/bin/python migration-parity-inventory-check

      - name: run Python parity
        id: python-parity
        continue-on-error: true
        env:
          # Keep the large source/target result envelopes bounded on hosted
          # runners while preserving the exact public parity corpus.
          MIGRATION_PARITY_BATCH_SIZE: "256"
          MIGRATION_PARITY_SERIAL: "1"
          # The full result is highly repetitive and can exceed the hosted
          # runner's free-disk budget when retained as plain JSON.  Compression
          # changes storage only; the validator still checks the same schema.
          MIGRATION_PARITY_OUTPUT: build/migration-parity/parity-result.json.gz
        run: make PYTHON=.venv/bin/python migration-parity-test

      - name: report Python parity result
        if: always()
        run: |
          result="build/migration-parity/parity-result.json.gz"
          summary_result="build/migration-parity/parity-result.summary.json"
          level=notice
          if [ "${{ steps.python-parity.outcome }}" != "success" ]; then level=error; fi
          if [ -f "$summary_result" ]; then
            summary="$(tr '\n' ' ' < "$summary_result" | cut -c1-1800)"
            echo "::$level title=Python parity summary::$summary"
          elif [ -f "$result" ]; then
            echo "::$level title=Python parity summary::compressed result was written without its summary sidecar"
          else
            echo "::warning title=Python parity summary::No parity result was written"
          fi
          if [ -f "$result" ]; then
            .venv/bin/python - "$result" <<'PY'
          import gzip
          import json
          import sys

          path = sys.argv[1]
          with gzip.open(path, "rt", encoding="utf-8") as handle:
              result = json.load(handle)
          comparisons = result.get("comparisons", [])
          failed = [item for item in comparisons if item.get("outcome") == "fail"]
          failed_ids = [item.get("case_id", "?") for item in failed[:40]]
          if failed_ids:
              print(
                  "::error title=Python parity failed case IDs::"
                  f"count={len(failed)} first="
                  + ",".join(failed_ids)
              )
          errors = result.get("infrastructure_errors", [])
          for error in errors[:5]:
              message = str(error.get("message", "")).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Python parity infrastructure error::{message[:1800]}")
          PY
          fi

      - name: upload Python parity evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: parity-py${{ matrix.python-version }}
          path: |
            build/migration-parity/parity-result.json.gz
            build/migration-parity/parity-result.summary.json
          if-no-files-found: warn

      - name: stop after Python parity failure
        if: steps.python-parity.outcome != 'success'
        run: exit 1

      - name: coverage
        if: steps.python-parity.outcome == 'success'
        run: make PYTHON=.venv/bin/python migration-parity-coverage

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-py${{ matrix.python-version }}
          path: target/coverage/migration-parity-python.json
          if-no-files-found: error

  # ── Documentation and manifest contract ──
  docs:
    name: Documentation and inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
      - name: install the documented input checker
        run: python -m pip install "pyyaml==6.0.3"
      - run: make docs-check

  # ── WASM: build sanity and host parity ──
  wasm:
    name: WASM (${{ matrix.host }})
    needs: rust
    # The live Pillow oracle and committed native parity corpus are measured
    # on Apple ARM64. Keep the JS/WASM source/target comparison on that same
    # architecture; the Rust matrix above continues to cover Linux builds.
    runs-on: macos-14
    # The browser adapter intentionally isolates process-global RNG cases and
    # runs the complete public corpus.  Hosted macOS runners can need more
    # than an hour even though the local ARM64 replay is exact; keep the full
    # corpus and give the lane a bounded two-hour window.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        host: [node, browser]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: install the locked Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
      - name: create the project virtualenv
        run: python -m venv .venv
      - name: install locked Python tools
        run: .venv/bin/python -m pip install --requirement requirements-ci.txt
      - name: install wasm-pack ${{ env.WASM_PACK_VERSION }}
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: install the pinned npm version
        run: npm install --global "npm@$NPM_VERSION"
      - working-directory: pillow-rs-js
        run: npm ci
      - name: install the pinned Chromium headless shell
        if: matrix.host == 'browser'
        working-directory: pillow-rs-js
        run: npx --no-install puppeteer browsers install chrome-headless-shell
      - name: build and JS/WASM parity
        id: wasm-parity
        continue-on-error: true
        env:
          # wasm-opt is an optional packaging optimization.  wasm-pack 0.15.0
          # cannot provision Binaryen on every hosted runner, while the
          # parity lane only needs the generated wasm and its JS boundary.
          MIGRATION_WASM_NO_OPT: "1"
          # Stream one bounded source/target chunk at a time and retain the
          # unchanged result schema in a compact gzip envelope.
          MIGRATION_JS_STREAM_OUTPUT: "1"
          MIGRATION_JS_PARITY_OUTPUT: build/migration-parity/js-wasm-parity-result.json.gz
          MIGRATION_BROWSER_PARITY_OUTPUT: build/migration-parity/browser-wasm-parity-result.json.gz
          # A streamed chunk starts one source and one host process.  The
          # default local chunks (128/512) make the hosted lanes exceed their
          # timeout; 2,048-case chunks keep the same corpus and comparison
          # policy while reducing process-launch overhead.  Node and browser
          # run on separate matrix runners so either host gets a full budget.
          MIGRATION_JS_PARITY_CHUNK_SIZE: "2048"
          MIGRATION_BROWSER_PARITY_CHUNK_SIZE: "2048"
        run: make PYTHON=.venv/bin/python test-wasm-${{ matrix.host }}

      - name: report WASM parity result
        if: always()
        run: |
          level=notice
          if [ "${{ steps.wasm-parity.outcome }}" != "success" ]; then level=error; fi
          if [ "${{ matrix.host }}" = "node" ]; then
            result=build/migration-parity/js-wasm-parity-result.json.gz
          else
            result=build/migration-parity/browser-wasm-parity-result.json.gz
          fi
          if [ -f "$result" ]; then
            summary_result="${result%.json.gz}.summary.json"
            if [ -f "$summary_result" ]; then
              summary="$(tr '\n' ' ' < "$summary_result" | cut -c1-1800)"
            else
              summary="compressed result was written without its summary sidecar"
            fi
            echo "::$level title=${{ matrix.host }} WASM parity summary::$summary"
          else
            echo "::warning title=WASM parity summary::No WASM parity result was written"
          fi
          if [ -f "$result" ]; then
            .venv/bin/python - "$result" <<'PY'
          import gzip
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          opener = gzip.open if path.name.endswith(".gz") else open
          with opener(path, "rt", encoding="utf-8") as handle:
              result = json.load(handle)
          comparisons = result.get("comparisons", [])
          failed = [item for item in comparisons if item.get("outcome") == "fail"]
          failed_ids = [item.get("case_id", "?") for item in failed[:40]]
          if failed_ids:
              print(
                  "::error title=${{ matrix.host }} WASM parity failed case IDs::"
                  f"count={len(failed)} first="
                  + ",".join(failed_ids)
              )
          for error in result.get("infrastructure_errors", [])[:5]:
              message = str(error.get("message", ""))
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(
                  "::error title=${{ matrix.host }} WASM parity infrastructure error::"
                  + message[:1800]
              )
          PY
          fi

      - name: upload WASM parity evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: parity-wasm-${{ matrix.host }}
          path: |
            build/migration-parity/${{ matrix.host == 'node' && 'js-wasm-parity-result.json.gz' || 'browser-wasm-parity-result.json.gz' }}
            build/migration-parity/${{ matrix.host == 'node' && 'js-wasm-parity-result.summary.json' || 'browser-wasm-parity-result.summary.json' }}
          if-no-files-found: warn

      - name: stop after WASM parity failure
        if: steps.wasm-parity.outcome != 'success'
        run: exit 1
