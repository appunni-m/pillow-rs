name: Pillow-SIMD Benchmark

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pillow-simd-benchmark.yml'
      - '.github/workflows/docs.yml'
      - 'scripts/run_migration_benchmark.py'
      - 'scripts/run_migration_parity.py'
      - 'scripts/run_pillow_simd_benchmark.py'
      - 'scripts/docs_evidence.py'
      - 'scripts/docs_benchmark_view.py'
      - 'scripts/docs_site.py'
      - 'pillow-rs/**'
      - 'pillow-rs-py/**'
      - 'pillow-rs/tests/fixtures/inputs/benchmark/**'
      - 'pillow-rs/tests/fixtures/inputs/parity/**'
      - 'pillow-rs/tests/fixtures/manifest.yaml'
  workflow_dispatch:
  schedule:
    - cron: '47 4 * * 1'

permissions:
  contents: read

concurrency:
  group: pillow-simd-benchmark-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: 1.96.1
  RUSTC_WRAPPER: ''

jobs:
  benchmark:
    name: version-matched Pillow-SIMD x86 benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install the locked Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: install Pillow-SIMD native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libtiff5-dev libjpeg8-dev libopenjp2-7-dev zlib1g-dev \
            libfreetype6-dev liblcms2-dev libwebp-dev tcl8.6-dev tk8.6-dev \
            python3-tk libharfbuzz-dev libfribidi-dev libxcb1-dev
      - name: install project benchmark tools
        run: make setup-venv PYTHON=python
      - name: verify runner architecture and record hardware identity
        id: runner
        shell: bash
        run: |
          test "$(uname -m)" = x86_64
          cpu_model="$(awk -F: '/model name/ {sub(/^ /, "", $2); print $2; exit}' /proc/cpuinfo)"
          printf 'cpu_model=%s\n' "${cpu_model:-not-recorded}" >> "$GITHUB_OUTPUT"
          printf 'image_version=%s-%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: install version-matched isolated image oracles
        run: |
          python -m venv .venv-oracle-pillow
          .venv-oracle-pillow/bin/python -m pip install 'Pillow==12.1.1' PyYAML
          python -m venv .venv-oracle-pillow-simd
          .venv-oracle-pillow-simd/bin/python -m pip install PyYAML
          .venv-oracle-pillow-simd/bin/python -m pip install 'Pillow-SIMD==12.1.1.post0'
      - name: run parity-gated Pillow-SIMD and pillow-rs CPU/SIMD workloads
        env:
          PILLOW_ORACLE_PYTHON: .venv-oracle-pillow/bin/python
          PILLOW_SIMD_PYTHON: .venv-oracle-pillow-simd/bin/python
          DOCS_BENCHMARK_RUNNER_ID: ubuntu-24.04-x86_64
          DOCS_BENCHMARK_RUNNER_LABEL: Ubuntu 24.04 · x86_64
          DOCS_BENCHMARK_CPU_MODEL: ${{ steps.runner.outputs.cpu_model }}
          DOCS_BENCHMARK_IMAGE_VERSION: ${{ steps.runner.outputs.image_version }}
          DOCS_BENCHMARK_RUST_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: make migration-parity-benchmark-pillow-simd PYTHON=.venv/bin/python
      - name: stage the validated public comparison data
        run: |
          mkdir -p target/public-pillow-simd-benchmark
          cp build/migration-parity/pillow-simd-public-snapshot.json target/public-pillow-simd-benchmark/snapshot.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-pillow-simd-benchmark
          path: target/public-pillow-simd-benchmark/snapshot.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pillow-simd-benchmark-${{ github.run_id }}
          path: |
            build/migration-parity/benchmark-result-pillow.json
            build/migration-parity/benchmark-result-pillow-simd.json
            build/migration-parity/pillow-simd-public-snapshot.json
          if-no-files-found: ignore
          retention-days: 3
