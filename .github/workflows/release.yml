# Immutable tag releases use only GitHub OIDC after successful exact main CI.

name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep hosted release jobs self-contained; local sccache is optional.
  RUSTC_WRAPPER: ""
  RUST_TOOLCHAIN: 1.96.1
  WASM_PACK_VERSION: 0.15.0
  NODE_VERSION: 22.14.0
  NPM_VERSION: 11.5.1
  RELEASE_VERSION: ${{ github.ref_name }}
  # Published WASM must be optimized. The parity runner owns its separate opt-out.
  MIGRATION_WASM_NO_OPT: "0"
  MIGRATION_RUST_COVERAGE_TOOLCHAIN: nightly-2026-07-16

jobs:
  verify:
    name: Release preflight
    # The canonical parity and source-bound coverage lanes use the Apple
    # ARM64 native Pillow contract recorded by the committed corpus.
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: require a clean checkout
        run: |
          test -z "$(git status --porcelain)"
      - name: require the immutable release tag
        if: ${{ github.event_name == 'push' }}
        run: |
          # actions/checkout resolves an event tag to its commit SHA in the
          # local refs/tags namespace. Fetch the original tag object into a
          # scratch namespace before checking that the pushed ref is annotated.
          release_ref="refs/release-check/tags/${GITHUB_REF_NAME}"
          git fetch --no-tags origin \
            "refs/tags/${GITHUB_REF_NAME}:${release_ref}"
          test "$(git cat-file -t "$release_ref")" = tag
          release_commit="$(git rev-parse "${release_ref}^{commit}")"
          test "$release_commit" = "$(git rev-parse HEAD)"
      - name: require tag and Cargo version equality
        if: ${{ github.event_name == 'push' }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "pillow-rs") | .version')"
          test -n "$cargo_version"
          test "$cargo_version" = "$version"
      - name: require successful CI for this commit
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=100")"
          run_id="$(PAYLOAD="${payload}" python3 - <<'PY'
          import json
          import os

          runs = json.loads(os.environ["PAYLOAD"]).get("workflow_runs", [])
          candidates = [
              run
              for run in runs
              if run.get("name") == "CI"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
              and (
                  run.get("event") == "workflow_dispatch"
                  or (run.get("event") == "push" and run.get("head_branch") == "main")
              )
          ]
          candidates.sort(key=lambda run: run.get("updated_at", ""), reverse=True)
          print(candidates[0].get("id", "") if candidates else "")
          PY
          )"
          test -n "$run_id"
          echo "using successful CI run ${run_id} for ${GITHUB_SHA}"
      - name: install the locked Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: pillow-rs-js/package-lock.json
      - name: install fixed package tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --requirement requirements-ci.txt
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked
          npm install --global "npm@$NPM_VERSION"
          node --version
          npm --version
      - name: install locked JavaScript dependencies
        working-directory: pillow-rs-js
        run: npm ci
      - name: verify synchronized package metadata
        run: make release-version-check RELEASE_VERSION="$RELEASE_VERSION"
      - name: verify dependency registry visibility
        run: |
          for package in image-slash-star fontdone; do
            version="$(DEP_NAME="$package" python -c 'import os,tomllib; d=tomllib.load(open("pillow-rs/Cargo.toml", "rb")); print(d["dependencies"][os.environ["DEP_NAME"]]["version"].lstrip("="))')"
            cargo info --registry crates-io "$package@$version" >/dev/null
          done
          fontdone_version="$(DEP_NAME=fontdone python -c 'import os,tomllib; d=tomllib.load(open("pillow-rs/Cargo.toml", "rb")); print(d["dependencies"][os.environ["DEP_NAME"]]["version"].lstrip("="))')"
          npm view "fontdone@$fontdone_version" version --registry=https://registry.npmjs.org >/dev/null
      - name: validate repository contracts
        run: |
          make docs-check
          make migration-parity-evidence-check
          make fmt
          make clippy
          make migration-parity-coverage-receipt-test
          make release-tools-test
      - name: Install pinned Rust coverage tools
        run: |
          rustup toolchain install "$MIGRATION_RUST_COVERAGE_TOOLCHAIN" --profile minimal --component llvm-tools-preview
          cargo +"$MIGRATION_RUST_COVERAGE_TOOLCHAIN" install cargo-llvm-cov --version 0.8.7 --locked
      - name: collect source-bound Rust coverage
        run: make migration-parity-coverage-rust
      - name: validate generated release evidence
        run: make migration-parity-evidence-check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-preflight-${{ github.run_id }}
          path: |
            target/coverage/
            build/migration-parity/
          if-no-files-found: warn

  python-wheels:
    name: Python wheel (${{ matrix.runner }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Build manylinux wheel with fixed tools and container
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: ${{ matrix.target }}
          manylinux: '2_28'
          container: quay.io/pypa/manylinux_2_28_x86_64@sha256:531d7aa844bbb0c131d4ab011d3db741c4abc8d498cd5ccc86121046f62303b4
          working-directory: pillow-rs-py
          command: build
          args: --release --locked --out ../dist/python-wheel --interpreter python3.12
      - name: Build native wheel with fixed tools
        if: runner.os != 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: ${{ matrix.target }}
          working-directory: pillow-rs-py
          command: build
          args: --release --locked --out ../dist/python-wheel --interpreter python
      - name: Install and exercise the exact wheel outside the checkout
        shell: bash
        run: make release-wheel-test PYTHON=python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheel-${{ matrix.runner }}
          path: dist/python-wheel/*.whl
          if-no-files-found: error

  package:
    name: Package release artifacts
    needs: [verify, python-wheels]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: require a clean checkout
        run: |
          test -z "$(git status --porcelain)"
      - name: require the immutable release tag
        if: ${{ github.event_name == 'push' }}
        run: |
          # actions/checkout resolves an event tag to its commit SHA in the
          # local refs/tags namespace. Fetch the original tag object into a
          # scratch namespace before checking that the pushed ref is annotated.
          release_ref="refs/release-check/tags/${GITHUB_REF_NAME}"
          git fetch --no-tags origin \
            "refs/tags/${GITHUB_REF_NAME}:${release_ref}"
          test "$(git cat-file -t "$release_ref")" = tag
          release_commit="$(git rev-parse "${release_ref}^{commit}")"
          test "$release_commit" = "$(git rev-parse HEAD)"
      - name: install the locked Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: pillow-rs-js/package-lock.json
      - name: install fixed package tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --requirement requirements-ci.txt
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked
          npm install --global "npm@$NPM_VERSION"
      - name: create release directories
        run: mkdir -p dist/release/crate dist/release/python dist/release/npm
      - name: package the root crate after dependency publication
        run: |
          version="${RELEASE_VERSION#v}"
          make release-crate-package
          cp "target/package/pillow-rs-$version.crate" dist/release/crate/
      - name: Download verified platform wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-wheel-*
          merge-multiple: true
          path: dist/release/python
      - name: Build the Python source distribution
        run: make release-python-sdist RELEASE_WHEEL_DIR=dist/release/python
      - name: Build, install, and exercise the source distribution in isolation
        run: make release-sdist-test RELEASE_WHEEL_DIR=dist/release/python
      - name: Build and inspect the single Node/browser npm package
        run: make release-npm-pack
      - name: write release checksums
        working-directory: dist/release
        run: |
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-${{ github.run_id }}
          path: dist/release
          if-no-files-found: error

  publish-crates:
    name: Publish pillow-rs to crates.io
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install the locked Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts-${{ github.run_id }}
          path: dist/release
      - name: verify the package before authentication
        run: |
          (cd dist/release && sha256sum --check SHA256SUMS)
          make release-crate-package
          cmp "target/package/pillow-rs-${RELEASE_VERSION#v}.crate" "dist/release/crate/pillow-rs-${RELEASE_VERSION#v}.crate"
      - name: check immutable crates.io artifact
        id: cargo-check
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          archive="target/package/pillow-rs-${version}.crate"
          response="$(curl --silent --show-error --location \
            --user-agent 'pillow-rs-release-verifier/1 (+https://github.com/appunni-m/pillow-rs)' \
            --header 'Accept: application/json' \
            --write-out '\n__STATUS__%{http_code}' \
            "https://crates.io/api/v1/crates/pillow-rs/${version}")"
          http_status="${response##*__STATUS__}"
          metadata="${response%__STATUS__*}"
          metadata="${metadata%$'\n'}"
          if [ "$http_status" = "404" ]; then
            echo "pillow-rs@${version} is not visible"
            echo "missing=true" >> "$GITHUB_OUTPUT"
          elif [ "$http_status" != "200" ]; then
            echo "crates.io lookup returned HTTP ${http_status}" >&2
            exit 1
          else
            registry_checksum="$(printf '%s' "$metadata" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"].get("checksum", ""))')"
            test -n "$registry_checksum"
            local_checksum="$(sha256sum "$archive" | cut -d' ' -f1)"
            if [ "$local_checksum" != "$registry_checksum" ]; then
              echo "crates.io artifact mismatch for pillow-rs@${version}" >&2
              echo "local=${local_checksum} registry=${registry_checksum}" >&2
              exit 1
            fi
            echo "pillow-rs@${version} is visible and matches the immutable archive"
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi
      - name: obtain a short-lived crates.io token
        if: steps.cargo-check.outputs.missing == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: publish the root crate
        if: steps.cargo-check.outputs.missing == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish --locked --no-verify -p pillow-rs

  publish-pypi:
    name: Publish pillow-rs to PyPI
    needs: [package, publish-crates]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts-${{ github.run_id }}
          path: dist/release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source
      - name: Verify complete release bundle
        run: (cd dist/release && sha256sum --check SHA256SUMS)
      - name: Stage only absent immutable PyPI artifacts
        id: pypi-check
        run: >-
          python3 source/scripts/prepare_pypi_release.py
          --version "${RELEASE_VERSION#v}" --archive-dir dist/release/python
          --output-dir dist/pypi-publish
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: steps.pypi-check.outputs.missing == 'true'
        with:
          packages-dir: dist/pypi-publish/

  publish-npm:
    name: Publish pillow-rs to npm
    needs: [package, publish-crates]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts-${{ github.run_id }}
          path: dist/release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify complete release bundle
        run: (cd dist/release && sha256sum --check SHA256SUMS)
      - name: check immutable npm artifact
        id: npm-check
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          archive="dist/release/npm/pillow-rs-${version}.tgz"
          test -f "$archive"
          response="$(curl --silent --show-error --location \
            --header 'Accept: application/json' \
            --write-out '\n__STATUS__%{http_code}' \
            "https://registry.npmjs.org/pillow-rs/${version}")"
          http_status="${response##*__STATUS__}"
          metadata="${response%__STATUS__*}"
          metadata="${metadata%$'\n'}"
          if [ "$http_status" = "404" ]; then
            echo "pillow-rs@${version} is not visible"
            echo "missing=true" >> "$GITHUB_OUTPUT"
          elif [ "$http_status" != "200" ]; then
            echo "npm registry lookup returned HTTP ${http_status}" >&2
            exit 1
          else
            registry_integrity="$(printf '%s' "$metadata" | node --input-type=module -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).dist?.integrity ?? ""))')"
            test -n "$registry_integrity"
            local_integrity="sha512-$(sha512sum "$archive" | cut -d' ' -f1 | xxd -r -p | base64 -w0)"
            if [ "$local_integrity" != "$registry_integrity" ]; then
              echo "npm registry artifact mismatch for pillow-rs@${version}" >&2
              echo "local=${local_integrity} registry=${registry_integrity}" >&2
              exit 1
            fi
            echo "pillow-rs@${version} is visible and matches the immutable archive"
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi
      - name: install the npm CLI required by trusted publishing
        run: npm install --global "npm@$NPM_VERSION"
      - name: publish the npm tarball with provenance
        if: steps.npm-check.outputs.missing == 'true'
        shell: bash
        run: |
          set -o pipefail
          version="${RELEASE_VERSION#v}"
          dist_tag=latest
          if [[ "$version" == *-* ]]; then
            dist_tag=next
          fi
          log_file="${RUNNER_TEMP}/pillow-rs-npm-publish.log"
          set +e
          npm publish "./dist/release/npm/pillow-rs-$version.tgz" \
            --access public --tag "$dist_tag" --provenance 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            summary="$(tail -n 35 "$log_file" | tr '\n' ' ')"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            echo "::error title=npm publish failure::$summary"
            exit "$status"
          fi

  tag-and-release:
    name: Create the GitHub release for the pushed tag
    if: ${{ github.event_name == 'push' }}
    needs: [publish-crates, publish-pypi, publish-npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts-${{ github.run_id }}
          path: dist/release
      - name: Verify complete release bundle
        run: (cd dist/release && sha256sum --check SHA256SUMS)
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/release/crate/*.crate
            dist/release/python/*.whl
            dist/release/python/*.tar.gz
            dist/release/npm/*.tgz
            dist/release/SHA256SUMS
      - name: create the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_flags=()
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then release_flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${release_flags[@]}" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/release/SHA256SUMS dist/release/crate/*.crate dist/release/python/*.whl dist/release/python/*.tar.gz dist/release/npm/*.tgz
