# The first release is bootstrapped by a guarded manual dispatch. Later
# releases are driven by a pushed version tag and never move an existing tag.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Exact synchronized package version (for example 0.1.0)
        required: true
        default: 0.1.0
        type: string
      dependencies_published:
        description: image-slash-star and the single public fontdone crate, plus the fontdone npm package, are registry-visible
        required: true
        default: false
        type: boolean
      publish:
        description: Publish artifacts after the preflight succeeds; push a tag separately to create the release
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep hosted release jobs self-contained; local sccache is optional.
  RUSTC_WRAPPER: ""
  RUST_TOOLCHAIN: 1.96.1
  WASM_PACK_VERSION: 0.15.0
  NODE_VERSION: 22.14.0
  NPM_VERSION: 11.5.1
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
  MIGRATION_WASM_NO_OPT: "1"

jobs:
  verify:
    name: Release preflight
    # The canonical parity and source-bound coverage lanes use the Apple
    # ARM64 native Pillow contract recorded by the committed corpus.
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: require a clean checkout
        run: |
          test -z "$(git status --porcelain)"
      - name: require the bootstrap branch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: test "$GITHUB_REF_NAME" = main
      - name: require the immutable release tag
        if: ${{ github.event_name == 'push' }}
        run: |
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
          release_commit="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          test "$release_commit" = "$(git rev-parse HEAD)"
      - name: require tag and Cargo version equality
        if: ${{ github.event_name == 'push' }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "pillow-rs") | .version')"
          test -n "$cargo_version"
          test "$cargo_version" = "$version"
      - name: require successful CI for this commit
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success" \
            --jq '.workflow_runs[0].id // empty')"
          test -n "$run_id"
      - name: install the locked Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: pillow-rs-js/package-lock.json
      - name: install fixed package tools
        run: |
          python -m pip install --requirement requirements-ci.txt
          cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked
          npm install --global "npm@$NPM_VERSION"
          node --version
          npm --version
      - name: install locked JavaScript dependencies
        working-directory: pillow-rs-js
        run: npm ci
      - name: verify synchronized package metadata
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import tomllib

          expected = os.environ["RELEASE_VERSION"].removeprefix("v")
          if not expected or any(char not in "0123456789.-" for char in expected):
              raise SystemExit(f"invalid release version: {expected!r}")
          metadata = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--locked", "--no-deps", "--format-version", "1"],
                  text=True,
              )
          )
          cargo_version = next(
              package["version"]
              for package in metadata["packages"]
              if package["name"] == "pillow-rs"
          )
          with open("pillow-rs-py/pyproject.toml", "rb") as handle:
              python_version = tomllib.load(handle)["project"]["version"]
          with open("pillow-rs-js/package.json", encoding="utf-8") as handle:
              npm_version = json.load(handle)["version"]
          actual = {"cargo": cargo_version, "pypi": python_version, "npm": npm_version}
          if actual != {key: expected for key in actual}:
              raise SystemExit(f"package versions differ: expected {expected}, got {actual}")
          print(f"all package versions: {expected}")
          PY
      - name: verify dependency registry visibility
        if: ${{ inputs.dependencies_published || github.event_name == 'push' }}
        run: |
          for package in image-slash-star fontdone; do
            version="$(DEP_NAME="$package" python -c 'import os,tomllib; d=tomllib.load(open("pillow-rs/Cargo.toml", "rb")); print(d["dependencies"][os.environ["DEP_NAME"]]["version"].lstrip("="))')"
            cargo info --registry crates-io "$package@$version" >/dev/null
          done
          fontdone_version="$(DEP_NAME=fontdone python -c 'import os,tomllib; d=tomllib.load(open("pillow-rs/Cargo.toml", "rb")); print(d["dependencies"][os.environ["DEP_NAME"]]["version"].lstrip("="))')"
          npm view "fontdone@$fontdone_version" version --registry=https://registry.npmjs.org >/dev/null
      - name: validate repository contracts
        run: |
          make docs-check
          make migration-parity-evidence-check
          make fmt
          make clippy
          make migration-parity-coverage-receipt-test
      - name: run the canonical parity campaign
        run: |
          make build
          make migration-parity-test
      - name: collect source-bound Rust coverage
        run: make migration-parity-coverage-rust
      - name: validate generated release evidence
        run: make migration-parity-evidence-check
      - name: run the release package preflight
        env:
          RELEASE_CRATES_READY: ${{ (inputs.dependencies_published || github.event_name == 'push') && '1' || '0' }}
        run: make release-check
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: release-preflight-${{ github.run_id }}
          path: |
            target/coverage/
            build/migration-parity/
          if-no-files-found: warn

  package:
    name: Package release artifacts
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: require a clean checkout
        run: |
          test -z "$(git status --porcelain)"
      - name: require the bootstrap branch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: test "$GITHUB_REF_NAME" = main
      - name: require the immutable release tag
        if: ${{ github.event_name == 'push' }}
        run: |
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
          release_commit="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          test "$release_commit" = "$(git rev-parse HEAD)"
      - name: install the locked Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: pillow-rs-js/package-lock.json
      - name: install fixed package tools
        run: |
          python -m pip install --requirement requirements-ci.txt
          cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked
          npm install --global "npm@$NPM_VERSION"
      - name: create release directories
        run: mkdir -p dist/release/crate dist/release/python dist/release/npm
      - name: package the root crate after dependency publication
        if: ${{ inputs.dependencies_published || github.event_name == 'push' }}
        run: |
          version="${RELEASE_VERSION#v}"
          cargo package --locked -p pillow-rs
          cp "target/package/pillow-rs-$version.crate" dist/release/crate/
      - name: build the Python wheel
        run: python -m maturin build --manifest-path pillow-rs-py/Cargo.toml --release --locked --out dist/release/python
      - name: build and pack the npm package
        working-directory: pillow-rs-js
        run: |
          npm ci
          npm run build:release
          npm pack --ignore-scripts --pack-destination ../dist/release/npm
      - name: write release checksums
        working-directory: dist/release
        run: find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-artifacts-${{ github.run_id }}
          path: dist/release
          if-no-files-found: error

  publish-crates:
    name: Publish pillow-rs to crates.io
    if: ${{ (inputs.publish && inputs.dependencies_published) || github.event_name == 'push' }}
    needs: package
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - name: install the locked Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: verify the package before authentication
        run: cargo package --locked -p pillow-rs
      - name: check immutable crates.io artifact
        id: cargo-check
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          archive="target/package/pillow-rs-${version}.crate"
          response="$(curl --silent --show-error --location \
            --header 'Accept: application/json' \
            --write-out '\n__STATUS__%{http_code}' \
            "https://crates.io/api/v1/crates/pillow-rs/${version}")"
          http_status="${response##*__STATUS__}"
          metadata="${response%__STATUS__*}"
          metadata="${metadata%$'\n'}"
          if [ "$http_status" = "404" ]; then
            echo "pillow-rs@${version} is not visible"
            echo "missing=true" >> "$GITHUB_OUTPUT"
          elif [ "$http_status" != "200" ]; then
            echo "crates.io lookup returned HTTP ${http_status}" >&2
            exit 1
          else
            registry_checksum="$(printf '%s' "$metadata" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"].get("checksum", ""))')"
            test -n "$registry_checksum"
            local_checksum="$(sha256sum "$archive" | cut -d' ' -f1)"
            if [ "$local_checksum" != "$registry_checksum" ]; then
              echo "crates.io artifact mismatch for pillow-rs@${version}" >&2
              echo "local=${local_checksum} registry=${registry_checksum}" >&2
              exit 1
            fi
            echo "pillow-rs@${version} is visible and matches the immutable archive"
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi
      - name: obtain a short-lived crates.io token
        if: steps.cargo-check.outputs.missing == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: publish the root crate
        if: steps.cargo-check.outputs.missing == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish --locked -p pillow-rs

  publish-pypi:
    name: Publish pillow-rs to PyPI
    if: ${{ (inputs.publish && inputs.dependencies_published) || github.event_name == 'push' }}
    needs: [package, publish-crates]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-artifacts-${{ github.run_id }}
          path: dist/release
      - name: check immutable PyPI artifact
        id: pypi-check
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          archive="$(find dist/release/python -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$archive"
          python3 - "$archive" "$version" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          import urllib.error
          import urllib.request

          archive = Path(sys.argv[1])
          version = sys.argv[2]
          url = f"https://pypi.org/pypi/pillow-rs/{version}/json"
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write("missing=true\n")
                  print(f"pillow-rs=={version} is not visible")
                  raise SystemExit(0)
              raise

          filename = archive.name
          matches = [item for item in payload.get("urls", []) if item.get("filename") == filename]
          if len(matches) != 1:
              raise SystemExit(f"PyPI does not expose exactly one {filename} for pillow-rs=={version}")
          registry_checksum = matches[0].get("digests", {}).get("sha256")
          local_checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
          if not registry_checksum or local_checksum != registry_checksum:
              raise SystemExit(
                  f"PyPI artifact mismatch for pillow-rs=={version}: "
                  f"local={local_checksum} registry={registry_checksum}"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("missing=false\n")
          print(f"pillow-rs=={version} is visible and matches the immutable wheel")
          PY
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        if: steps.pypi-check.outputs.missing == 'true'
        with:
          packages-dir: dist/release/python/

  publish-npm:
    name: Publish pillow-rs to npm
    if: ${{ (inputs.publish && inputs.dependencies_published) || github.event_name == 'push' }}
    needs: [package, publish-crates]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-artifacts-${{ github.run_id }}
          path: dist/release
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: false
      - name: check immutable npm artifact
        id: npm-check
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          archive="dist/release/npm/pillow-rs-${version}.tgz"
          test -f "$archive"
          response="$(curl --silent --show-error --location \
            --header 'Accept: application/json' \
            --write-out '\n__STATUS__%{http_code}' \
            "https://registry.npmjs.org/pillow-rs/${version}")"
          http_status="${response##*__STATUS__}"
          metadata="${response%__STATUS__*}"
          metadata="${metadata%$'\n'}"
          if [ "$http_status" = "404" ]; then
            echo "pillow-rs@${version} is not visible"
            echo "missing=true" >> "$GITHUB_OUTPUT"
          elif [ "$http_status" != "200" ]; then
            echo "npm registry lookup returned HTTP ${http_status}" >&2
            exit 1
          else
            registry_integrity="$(printf '%s' "$metadata" | node --input-type=module -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).dist?.integrity ?? ""))')"
            test -n "$registry_integrity"
            local_integrity="sha512-$(sha512sum "$archive" | cut -d' ' -f1 | xxd -r -p | base64 -w0)"
            if [ "$local_integrity" != "$registry_integrity" ]; then
              echo "npm registry artifact mismatch for pillow-rs@${version}" >&2
              echo "local=${local_integrity} registry=${registry_integrity}" >&2
              exit 1
            fi
            echo "pillow-rs@${version} is visible and matches the immutable archive"
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi
      - name: install the npm CLI required by trusted publishing
        run: npm install --global "npm@$NPM_VERSION"
      - name: publish the npm tarball with provenance
        if: steps.npm-check.outputs.missing == 'true'
        run: |
          version="${RELEASE_VERSION#v}"
          npm publish "dist/release/npm/pillow-rs-$version.tgz" --access public --provenance

  tag-and-release:
    name: Create the GitHub release for the pushed tag
    if: ${{ github.event_name == 'push' }}
    needs: [publish-crates, publish-pypi, publish-npm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-artifacts-${{ github.run_id }}
          path: dist/release
      - name: create the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/release/SHA256SUMS dist/release/crate/*.crate dist/release/python/*.whl dist/release/npm/*.tgz
