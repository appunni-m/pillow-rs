name: Performance evidence database

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - ".github/workflows/perfdb.yml"
      - "tools/perfdb/**"
      - "docs/evidence/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/perfdb.yml"
      - "tools/perfdb/**"
      - "docs/evidence/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perfdb-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "3"
  RUST_TOOLCHAIN: 1.96.1

jobs:
  import-and-query:
    name: Import evidence and check comparisons
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install the locked Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
      - name: check the standalone CLI
        run: |
          cargo fmt --manifest-path tools/perfdb/Cargo.toml -- --check
          cargo clippy --locked --manifest-path tools/perfdb/Cargo.toml --all-targets -- -D warnings
      - name: seed the tracked evidence and verify rank query
        run: |
          cargo run --release --locked --manifest-path tools/perfdb/Cargo.toml -- \
            --db "$RUNNER_TEMP/performance-results.duckdb" \
            seed --evidence-dir docs/evidence
          cargo run --release --locked --manifest-path tools/perfdb/Cargo.toml -- \
            --db "$RUNNER_TEMP/performance-results.duckdb" \
            rank --profile python-cpu --baseline Pillow --below 1.0
