name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [Benchmark]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Install the hash-locked documentation tools
        run: make docs-setup PYTHON=python
      - name: Select the latest successful main benchmark
        id: benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: make docs-benchmark-select PYTHON=.venv-docs/bin/python
      - name: Download data from the successful main benchmark
        if: steps.benchmark.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-benchmark
          path: target/public-benchmark
          github-token: ${{ github.token }}
          run-id: ${{ steps.benchmark.outputs.run_id }}
      - name: Check sources and build the public site
        env:
          DOCS_BENCHMARK_SNAPSHOT: ${{ steps.benchmark.outputs.run_id != '' && 'target/public-benchmark/snapshot.json' || '' }}
          DOCS_BENCHMARK_REVISION: ${{ steps.benchmark.outputs.head_sha }}
        run: make docs-test docs-lint docs-build PYTHON=.venv-docs/bin/python
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/site

  deploy:
    needs: [build, examples]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publish the validated artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal && rustup default 1.96.1
      - name: Execute the documented Rust quickstart
        env:
          RUSTC_WRAPPER: ''
        run: make docs-examples
