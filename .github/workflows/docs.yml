name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [Benchmark]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.12.10'
      - name: Install the hash-locked documentation tools
        run: make docs-setup PYTHON=python
      - name: Select the latest successful main benchmark
        id: benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: make docs-benchmark-select PYTHON=.venv-docs/bin/python
      - name: Download data from the successful main benchmark
        if: steps.benchmark.outputs.run_id != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: public-benchmark
          path: target/public-benchmark
          github-token: ${{ github.token }}
          run-id: ${{ steps.benchmark.outputs.run_id }}
      - name: Check sources and build the public site
        env:
          DOCS_BENCHMARK_SNAPSHOT: ${{ steps.benchmark.outputs.run_id != '' && 'target/public-benchmark/snapshot.json' || '' }}
          DOCS_BENCHMARK_REVISION: ${{ steps.benchmark.outputs.head_sha }}
        run: make docs-test docs-lint docs-build PYTHON=.venv-docs/bin/python
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: target/site

  deploy:
    needs: [build, examples]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Publish the validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal && rustup default 1.96.1
      - name: Execute the documented Rust quickstart
        env:
          RUSTC_WRAPPER: ''
        run: make docs-examples
