    source:
      oracle_id: pillow
      path: PIL.Image.alpha_composite
      signature: 'alpha_composite(im1: ''Image'', im2: ''Image'') -> ''Image'''
      parameters:
      - id: im1
        style: positional_or_keyword
        value_types:
        - image
        omission:
          kind: required
      - id: im2
