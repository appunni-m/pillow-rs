version: 1
suite: font.public-api
input_dir: inputs/public-api
oracle:
  expected_runtime: python_pillow_font
  expected_path: PIL.ImageFont.FreeTypeFont
  native_core: PIL._imagingft
  rust_runtime: pillow_rs::font::Font
  rust_contract: Result-style status payload
  comparison: exact payload match after runtime oracle generation
required_operations:
  - load_default
  - truetype
  - font_size
  - text_bbox
  - getname
  - getmetrics
  - getlength
  - has_variations
  - get_variation_axes
  - get_variation_names
  - set_variation_by_axes
  - set_variation_by_name
  - font_variant
  - getbbox
  - getbbox_binary
  - getmask
  - getmask2
  - getmask2_with_start
  - get_transposed_mask
  - transposed_bbox
  - validate_transposed_length
  - draw_text
  - render_text_binary
negative_operations:
