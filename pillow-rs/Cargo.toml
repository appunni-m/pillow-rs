[package]
name = "pillow-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Pure Rust image processing — Pillow reimplementation"
readme = "../README.md"
keywords = ["image", "pillow", "graphics", "gpu"]
categories = ["multimedia::images"]
# The repository parity corpus is test evidence, not part of the published crate.
exclude = ["tests/fixtures/**"]

[lib]
name = "pillow_rs"

[features]
default = ["gpu", "image-codecs-all"]
gpu = ["wgpu", "pollster"]
parallel = ["rayon"]
image-codecs-all = [
    "image-slash-star/jpeg",
    "image-slash-star/png",
    "image-slash-star/gif",
    "image-slash-star/bmp",
    "image-slash-star/tiff",
    "image-slash-star/webp",
    "image-slash-star/ico",
]
image-jpeg = ["image-slash-star/jpeg"]
image-gif = ["image-slash-star/gif"]
image-png = ["image-slash-star/png"]
image-bmp = ["image-slash-star/bmp"]
image-tiff = ["image-slash-star/tiff"]
image-webp = ["image-slash-star/webp"]
image-ico = ["image-slash-star/ico"]
image-avif = ["image-slash-star/avif"]
wasm-wide-font-internals = ["fontdone/wasm-wide-internals"]
fontdone-subpixel-rendering = ["fontdone/subpixel-rendering"]
test-api = []

[[example]]
name = "backend_support_matrix"
required-features = ["test-api"]

[[example]]
name = "font_native_coverage"
required-features = ["test-api"]

[dependencies]
bytes = "1.10"
image-slash-star = { version = "=0.1.2", git = "https://github.com/appunni-m/image-slash-star.git", rev = "70190214a0711223302c76ab58e76c097288d80b", default-features = false }
fontdone = { version = "=2.14.3", git = "https://github.com/appunni-m/fontdone.git", rev = "7c48b706482b8800e97b35cccc18671893c34e9f" }
log = "0.4"
thiserror = "2"
csscolorparser = "0.8"
wgpu = { version = "24", optional = true }
pollster = { version = "0.3", optional = true }
bytemuck = { version = "1", features = ["derive"] }
fearless_simd = "1.2.0"
wide = "1.6.1"

# Rayon is opt-in through the default-off `parallel` feature. Use it only for
# explicitly reported Parallel CPU execution; do not count Rayon scheduling as
# SIMD work or involve Rayon in SIMD adapters or GPU dispatch.
rayon = { version = "1", optional = true }

[dev-dependencies]
# Keep the Rust-to-Rust comparison codec-independent. The image-rs subject is
# serial because its default Rayon and format features are deliberately excluded;
# pillow-rs CPU and SIMD are measured as separate subjects.
image = { version = "=0.25.10", default-features = false }

[[bench]]
name = "image_rs_comparison"
harness = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[lints]
workspace = true
