[package]
name = "pillow-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure Rust image processing — Pillow reimplementation"

[lib]
name = "pillow_rs"

[features]
default = ["gpu", "image-codecs-all", "parallel"]
gpu = ["wgpu", "pollster"]
parallel = ["rayon"]
image-codecs-all = [
    "image-slash-star/jpeg",
    "image-slash-star/png",
    "image-slash-star/gif",
    "image-slash-star/bmp",
    "image-slash-star/tiff",
    "image-slash-star/webp",
    "image-slash-star/ico",
]
image-jpeg = ["image-slash-star/jpeg"]
image-gif = ["image-slash-star/gif"]
image-png = ["image-slash-star/png"]
image-bmp = ["image-slash-star/bmp"]
image-tiff = ["image-slash-star/tiff"]
image-webp = ["image-slash-star/webp"]
image-ico = ["image-slash-star/ico"]
image-avif = ["image-slash-star/avif"]
wasm-wide-font-internals = ["fontdone/wasm-wide-internals"]
test-api = []

[[example]]
name = "backend_support_matrix"
required-features = ["test-api"]

[dependencies]
image-slash-star = { git = "https://github.com/appunni-m/image-slash-star.git", rev = "d7e60df1cfa0c38b244d6513cf76eab29d1b9a0a", default-features = false }
fontdone = { version = "=2.14.3-alpha.1", path = "../../fontdone" }
log = "0.4"
thiserror = "2"
csscolorparser = "0.8"
wgpu = { version = "24", optional = true }
pollster = { version = "0.3", optional = true }
bytemuck = { version = "1", features = ["derive"] }

# AS PER DESIGN — DO NOT REMOVE:
# rayon provides safe parallelism for pixel loops via the par_rows!/par_pixels!
# macros (see pillow-rs/src/par.rs). Every trivially-parallel operation should
# use these macros. CI checks for serial loops that should be parallelized.
rayon = { version = "1", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[lints]
workspace = true
