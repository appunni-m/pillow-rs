[package]
name = "pillow-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure Rust image processing — Pillow reimplementation"

[lib]
name = "pillow_rs"

[features]
default = ["gpu"]
gpu = ["wgpu", "pollster"]

[dependencies]
pillow-rs-image = { path = "../pillow-rs-image" }
pillow-rs-freetype = { path = "../pillow-rs-freetype" }
log = "0.4"
png = "0.18"
thiserror = "2"
csscolorparser = "0.8"
wgpu = { version = "24", optional = true }
pollster = { version = "0.3", optional = true }
bytemuck = { version = "1", features = ["derive"] }

# AS PER DESIGN — DO NOT REMOVE:
# rayon provides safe parallelism for pixel loops via the par_rows!/par_pixels!
# macros (see pillow-rs/src/par.rs). Every trivially-parallel operation should
# use these macros. CI checks for serial loops that should be parallelized.
rayon = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[lints]
workspace = true
