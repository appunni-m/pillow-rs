- id: fterrdef.FT_Err_Missing_Bbx_Field
  kind: error
  symbol: FT_Err_Missing_Bbx_Field
  header: freetype/fterrdef.h
  description: BDF parser error code for a glyph bitmap block that appears before the required BBX field.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 183, matching FT_ERRORDEF_(Missing_Bbx_Field, 0xB7) in the pinned header.
    - id: bdf_bitmap_before_bbx
      description: Loading a BDF glyph with STARTCHAR and ENCODING followed by BITMAP before BBX returns FT_Err_Missing_Bbx_Field from bdflib.c.
  # needs-input: operation=FT_New_Memory_Face; fixture_asset=fixtures/assets/bdf/missing_bbx_field.bdf with STARTFONT/FONT/SIZE/FONTBOUNDINGBOX/CHARS/STARTCHAR/ENCODING then BITMAP and ENDCHAR; params face_index=0; output shape=FT_Error from face load plus zero/non-created face handle state; comparison=exact C/Rust/C-FFI/Wasm FT_Error 0xB7 and no non-empty face output.

- id: fterrdef.FT_Err_Missing_Bitmap
  kind: error
  symbol: FT_Err_Missing_Bitmap
  header: freetype/fterrdef.h
  description: SFNT bitmap-strike error code for a requested glyph whose embedded bitmap image is absent.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 157, matching FT_ERRORDEF_(Missing_Bitmap, 0x9D) in the pinned header.
    - id: sbit_glyph_without_image
      description: Loading an embedded bitmap strike glyph with an empty EBDT/sbix image range returns FT_Err_Missing_Bitmap from ttsbit.c.
    - id: composite_sbit_missing_subglyph
      description: A recursive embedded bitmap composite with a missing subglyph reports Invalid_Composite instead of Missing_Bitmap, preserving the C branch split.
  # needs-input: operation=FT_Load_Glyph or FT_Load_Char with FT_LOAD_COLOR/FT_LOAD_SBITS_ONLY against a synthetic SFNT bitmap strike; fixture_asset=fixtures/assets/fonts/sbit_missing_bitmap.ttf plus optional composite variant; params glyph with glyph_start==glyph_end, valid strike size selected by FT_Select_Size, and recursive composite missing subglyph; output shape=FT_Error, slot format/bitmap fields when any, and face/slot preservation; comparison=exact C oracle error 0x9D for direct missing image and exact non-0x9D branch for recursive composite.

- id: fterrdef.FT_Err_Missing_Chars_Field
  kind: error
  symbol: FT_Err_Missing_Chars_Field
  header: freetype/fterrdef.h
  description: Public BDF error code reserved for a missing CHARS field.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 180, matching FT_ERRORDEF_(Missing_Chars_Field, 0xB4) in the pinned header.
    - id: source_emitter_audit
      description: Pinned source scan found no direct FT_THROW(Missing_Chars_Field) emitter; fixture generation must prove a reachable path before claiming runtime coverage.
  # needs-input: operation=source-emitter audit plus FT_New_Memory_Face if reachable; fixture_asset=fixtures/assets/bdf/missing_chars_field.bdf candidate ending after STARTFONT/FONT/SIZE/FONTBOUNDINGBOX and properties without CHARS; params face_index=0; output shape=FT_Error and parser terminal state; comparison=exact C oracle classification, recording whether current FreeType returns Missing_Chars_Field, Invalid_File_Format, or another public error.

- id: fterrdef.FT_Err_Missing_Encoding_Field
  kind: error
  symbol: FT_Err_Missing_Encoding_Field
  header: freetype/fterrdef.h
  description: BDF parser error code for a glyph body that reaches metric or bitmap fields before ENCODING.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 182, matching FT_ERRORDEF_(Missing_Encoding_Field, 0xB6) in the pinned header.
    - id: bdf_glyph_without_encoding
      description: Loading a BDF glyph with STARTCHAR followed by SWIDTH, DWIDTH, BBX, or BITMAP before ENCODING returns FT_Err_Missing_Encoding_Field from bdflib.c.
  # needs-input: operation=FT_New_Memory_Face; fixture_asset=fixtures/assets/bdf/missing_encoding_field.bdf; params valid BDF header, CHARS 1, STARTCHAR name, next line BBX or BITMAP without ENCODING; output shape=FT_Error and no completed glyph; comparison=exact C/Rust/C-FFI/Wasm FT_Error 0xB6 and no fabricated glyph metrics.

- id: fterrdef.FT_Err_Missing_Font_Field
  kind: error
  symbol: FT_Err_Missing_Font_Field
  header: freetype/fterrdef.h
  description: BDF parser error code for a CHARS section reached before the required FONT field.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 177, matching FT_ERRORDEF_(Missing_Font_Field, 0xB1) in the pinned header.
    - id: bdf_chars_before_font
      description: Loading a BDF file with STARTFONT, SIZE, FONTBOUNDINGBOX, then CHARS but no FONT returns FT_Err_Missing_Font_Field from bdflib.c.
  # needs-input: operation=FT_New_Memory_Face; fixture_asset=fixtures/assets/bdf/missing_font_field.bdf; params face_index=0 and minimal valid neighboring fields except FONT; output shape=FT_Error and face handle nullness; comparison=exact C oracle error 0xB1 across all interfaces.

- id: fterrdef.FT_Err_Missing_Fontboundingbox_Field
  kind: error
  symbol: FT_Err_Missing_Fontboundingbox_Field
  header: freetype/fterrdef.h
  description: BDF parser error code for a CHARS section reached before the required FONTBOUNDINGBOX field.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 179, matching FT_ERRORDEF_(Missing_Fontboundingbox_Field, 0xB3) in the pinned header.
    - id: bdf_chars_before_fontboundingbox
      description: Loading a BDF file with STARTFONT, FONT, SIZE, then CHARS but no FONTBOUNDINGBOX returns FT_Err_Missing_Fontboundingbox_Field from bdflib.c.
  # needs-input: operation=FT_New_Memory_Face; fixture_asset=fixtures/assets/bdf/missing_fontboundingbox_field.bdf; params face_index=0 and otherwise valid BDF header; output shape=FT_Error and parser cleanup state; comparison=exact C oracle error 0xB3 and absence of partial face output.

- id: fterrdef.FT_Err_Missing_Module
  kind: error
  symbol: FT_Err_Missing_Module
  header: freetype/fterrdef.h
  description: Public error code for a required FreeType module or renderer that is unavailable.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 11, matching FT_ERRORDEF_(Missing_Module, 0x0B) in the pinned header.
    - id: module_lookup_failure
      description: Module-dependent paths such as SFNT/CFF/PostScript support return FT_Err_Missing_Module when the requested service cannot be found.
    - id: no_driver_matches_face
      description: Opening data with no available driver reports the C module-missing classification instead of a generic invalid-font error where FreeType does so.
  # needs-input: operation=FT_New_Memory_Face plus module/service lookup APIs exposed by the unified runner; fixture_asset=valid fonts requiring SFNT, CFF, or Type1 services and a harness build/config with selected module unavailable if supported; params enabled/disabled module matrix and invalid unknown face bytes; output shape=FT_Error, module name if observable, and face handle state; comparison=exact C oracle error 0x0B for reachable missing-module paths, otherwise header-value-only coverage remains explicit.

- id: fterrdef.FT_Err_Missing_Property
  kind: error
  symbol: FT_Err_Missing_Property
  header: freetype/fterrdef.h
  description: Public error code for driver or renderer property names that are not recognized.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 12, matching FT_ERRORDEF_(Missing_Property, 0x0C) in the pinned header.
    - id: driver_property_unknown_name
      description: FT_Property_Get or FT_Property_Set on autofitter, TrueType, PCF, or SDF modules with an unknown property name returns FT_Err_Missing_Property.
    - id: known_property_success
      description: Known property names remain successful or value-validated so the missing-property fixture proves name dispatch, not module absence.
  # needs-input: operation=FT_Property_Get and FT_Property_Set; fixture_asset=no font required for module properties, plus optional loaded font for driver context; params module names autofitter/truetype/pcf/sdf, property name "__fontdone_missing_property__", known control property names, valid and null value pointers; output shape=FT_Error and returned property bytes for success cases; comparison=exact C oracle error 0x0C for unknown names and exact success/value behavior for known names.

- id: fterrdef.FT_Err_Missing_SVG_Hooks
  kind: error
  symbol: FT_Err_Missing_SVG_Hooks
  header: freetype/fterrdef.h
  description: OT-SVG renderer error code when SVG hooks were not installed before presetting or rendering an SVG glyph.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 158, matching FT_ERRORDEF_(Missing_SVG_Hooks, 0x9E) in the pinned header.
    - id: svg_render_without_hooks
      description: Rendering or presetting an OT-SVG glyph without SVG renderer hooks returns FT_Err_Missing_SVG_Hooks from ftsvg.c.
    - id: svg_hooks_installed_success
      description: Installing hooks changes the result away from Missing_SVG_Hooks and validates that the failing case is hook state, not font loading.
  # needs-input: operation=FT_Load_Glyph plus FT_Render_Glyph or SVG preset path; fixture_asset=fixtures/assets/fonts/otsvg_minimal.ttf with one SVG glyph and a runner-provided SVG hook table for the success control; params hooks unset vs set, render mode NORMAL and non-NORMAL; output shape=FT_Error, slot format, SVG document availability, hook call counters if supported; comparison=exact C oracle error 0x9E for unset hooks and exact branch behavior after hooks are installed.

- id: fterrdef.FT_Err_Missing_Size_Field
  kind: error
  symbol: FT_Err_Missing_Size_Field
  header: freetype/fterrdef.h
  description: BDF parser error code for a CHARS section reached before the required SIZE field.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 178, matching FT_ERRORDEF_(Missing_Size_Field, 0xB2) in the pinned header.
    - id: bdf_chars_before_size
      description: Loading a BDF file with STARTFONT, FONT, FONTBOUNDINGBOX, then CHARS but no SIZE returns FT_Err_Missing_Size_Field from bdflib.c.
  # needs-input: operation=FT_New_Memory_Face; fixture_asset=fixtures/assets/bdf/missing_size_field.bdf; params face_index=0 and valid neighboring BDF fields except SIZE; output shape=FT_Error and no created face; comparison=exact C oracle error 0xB2 across C, Rust FFI, C FFI, and Wasm.

- id: fterrdef.FT_Err_Missing_Startchar_Field
  kind: error
  symbol: FT_Err_Missing_Startchar_Field
  header: freetype/fterrdef.h
  description: BDF parser error code for glyph data that appears before STARTCHAR or for a nested STARTCHAR before ENDCHAR.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 181, matching FT_ERRORDEF_(Missing_Startchar_Field, 0xB5) in the pinned header.
    - id: bdf_encoding_before_startchar
      description: A BDF CHARS section whose first glyph line is ENCODING returns FT_Err_Missing_Startchar_Field from bdflib.c.
    - id: bdf_nested_startchar_before_endchar
      description: A second STARTCHAR while glyph bitmap bits are still open returns FT_Err_Missing_Startchar_Field, matching the missing-ENDCHAR branch.
  # needs-input: operation=FT_New_Memory_Face; fixture_asset=fixtures/assets/bdf/missing_startchar_field.bdf and fixtures/assets/bdf/nested_startchar_before_endchar.bdf; params valid BDF header with CHARS 1 or 2 and malformed glyph sequence variants; output shape=FT_Error and glyph allocation cleanup state; comparison=exact C oracle error 0xB5 and no leaked/visible partial glyph.

- id: fterrdef.FT_Err_Missing_Startfont_Field
  kind: error
  symbol: FT_Err_Missing_Startfont_Field
  header: freetype/fterrdef.h
  description: BDF parser error code for data whose first nonblank logical line is not STARTFONT.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 176, matching FT_ERRORDEF_(Missing_Startfont_Field, 0xB0) in the pinned header.
    - id: bdf_first_line_not_startfont
      description: Loading a BDF-like file that starts with FONT or SIZE instead of STARTFONT returns FT_Err_Missing_Startfont_Field from bdflib.c.
  # needs-input: operation=FT_New_Memory_Face; fixture_asset=fixtures/assets/bdf/missing_startfont_field.bdf; params first line FONT name, optional leading whitespace/comment variants as C parser accepts/rejects; output shape=FT_Error and face handle state; comparison=exact C oracle error 0xB0 and identical treatment of leading control bytes.

- id: fterrdef.FT_Err_Name_Table_Missing
  kind: error
  symbol: FT_Err_Name_Table_Missing
  header: freetype/fterrdef.h
  description: SFNT name-table error code for an invalid or structurally missing name table.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 145, matching FT_ERRORDEF_(Name_Table_Missing, 0x91) in the pinned header.
    - id: sfnt_name_storage_out_of_bounds
      description: Loading an SFNT name table where 6 + 12*numNameRecords exceeds the table length returns FT_Err_Name_Table_Missing from ttload.c.
    - id: sfnt_without_name_table
      description: A face with the name table removed or inaccessible must match C's chosen public error exactly, including whether it is Table_Missing or Name_Table_Missing.
  # needs-input: operation=FT_New_Memory_Face; fixture_asset=fixtures/assets/fonts/name_table_missing.ttf and fixtures/assets/fonts/name_table_bad_storage.ttf derived from a tiny TrueType font; params face_index=0; output shape=FT_Error, face family/style strings when creation succeeds, and table directory classification; comparison=exact C oracle error 0x91 for bad storage and exact C classification for absent table.

- id: fterrdef.FT_Err_Nested_DEFS
  kind: error
  symbol: FT_Err_Nested_DEFS
  header: freetype/fterrdef.h
  description: TrueType bytecode interpreter error for FDEF or IDEF nested inside an active function or instruction definition.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 137, matching FT_ERRORDEF_(Nested_DEFS, 0x89) in the pinned header.
    - id: truetype_nested_fdef
      description: Executing prep or glyph bytecode with FDEF containing another FDEF returns FT_Err_Nested_DEFS from ttinterp.c.
    - id: truetype_nested_idef
      description: Executing bytecode with IDEF containing FDEF or IDEF returns the same Nested_DEFS error while preserving interpreter state cleanup.
  # needs-input: operation=FT_Load_Glyph with bytecode interpreter enabled; fixture_asset=fixtures/assets/fonts/tt_nested_defs.ttf with controlled prep/fpgm/glyf programs; params load flags default vs NO_HINTING, interpreter versions if configurable, glyph index executing nested FDEF and IDEF variants; output shape=FT_Error, slot metrics preservation, and optional trace stage; comparison=exact C oracle error 0x89 only when bytecode executes and exact success/no-error under NO_HINTING if C skips execution.

- id: fterrdef.FT_Err_Nested_Frame_Access
  kind: error
  symbol: FT_Err_Nested_Frame_Access
  header: freetype/fterrdef.h
  description: Stream error code for entering a FreeType stream frame while another frame is still active.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 87, matching FT_ERRORDEF_(Nested_Frame_Access, 0x57) in the pinned header.
    - id: stream_nested_frame_guard
      description: Direct stream-frame access through the C ABI returns FT_Err_Nested_Frame_Access when FT_FRAME_ENTER is called while cursor/limit already describe an active frame.
  # needs-input: operation=public or harness-only stream wrapper that exercises FT_Stream_EnterFrame twice without FT_FRAME_EXIT; fixture_asset=synthetic byte stream buffer of at least 8 bytes; params first frame size 4, second nested frame size 1, then cleanup exit; output shape=FT_Error and stream cursor/limit/base fields; comparison=exact C oracle error 0x57 and identical stream state after cleanup. If no public stream-frame entry is exposed, keep this as value-only plus internal harness audit.

- id: fterrdef.FT_Err_No_Unicode_Glyph_Name
  kind: error
  symbol: FT_Err_No_Unicode_Glyph_Name
  header: freetype/fterrdef.h
  description: PostScript names service error when no glyph names can be mapped to Unicode.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 163, matching FT_ERRORDEF_(No_Unicode_Glyph_Name, 0xA3) in the pinned header.
    - id: postscript_names_without_unicode_mapping
      description: Building a Unicode cmap from glyph names with no recognized Unicode names returns FT_Err_No_Unicode_Glyph_Name from psmodule.c.
    - id: caller_ignores_nonfatal_mapping_failure
      description: SFNT/CFF/Type1 face loading paths that explicitly ignore No_Unicode_Glyph_Name must preserve C's final success or alternate error behavior.
  # needs-input: operation=FT_New_Memory_Face plus charmap enumeration or PS names service path; fixture_asset=fixtures/assets/fonts/postscript_names_no_unicode.pfa or CFF/Type1 font with only unmapped glyph names; params face_index=0 and charmap selection attempts; output shape=FT_Error, num_charmaps, charmap encodings, glyph-name query results; comparison=exact C oracle 0xA3 where service is directly exposed and exact ignored/nonfatal face-load result where C suppresses it.

- id: fterrdef.FT_Err_Ok
  kind: error
  symbol: FT_Err_Ok
  header: freetype/fterrdef.h
  description: Public no-error code returned by successful FreeType operations.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 0, matching FT_NOERRORDEF_(Ok, 0x00) in the pinned header.
    - id: successful_face_lifecycle
      description: A minimal successful FT_Init_FreeType, FT_New_Memory_Face, FT_Set_Char_Size or FT_Set_Pixel_Sizes, FT_Load_Glyph, and FT_Done_* sequence returns FT_Err_Ok at each successful step.
    - id: successful_constant_status_does_not_mask_output
      description: Success fixtures must also compare actual outputs such as face fields, size metrics, glyph metrics, bitmap bytes, or constant values rather than status alone.
  # needs-input: operation=representative success path across library, face, size, glyph load, render, and constant probes; fixture_asset=fixtures/assets/fonts/DejaVuSans.ttf plus small synthetic BDF and SFNT assets; params glyph ids/chars, sizes, load flags, render modes; output shape=FT_Error plus full endpoint-specific outputs; comparison=exact C/Rust/C-FFI/Wasm status 0 and exact output fields/bytes for every success case.

- id: fterrdef.FT_Err_Out_Of_Memory
  kind: error
  symbol: FT_Err_Out_Of_Memory
  header: freetype/fterrdef.h
  description: Public memory allocation failure error code returned by FreeType allocator-backed operations.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 64, matching FT_ERRORDEF_(Out_Of_Memory, 0x40) in the pinned header.
    - id: allocator_failure_injection
      description: Operations that allocate through FT_Memory return FT_Err_Out_Of_Memory at the same failing allocation point when the C oracle allocator is configured to fail.
    - id: cache_flush_then_oom
      description: Cache lookup OOM behavior flushes caches before returning Out_Of_Memory, matching ftcache.h documented behavior where that path is exposed.
  # needs-input: operation=FT_New_Memory_Face, FT_Load_Glyph, FT_Bitmap_Copy/Convert, and FTC cache lookups with fail-after-N allocator harness; fixture_asset=small TrueType/BDF fonts and synthetic bitmaps; params fail allocation index sweep, repeated run for deterministic first failing allocation, cache populated vs empty; output shape=FT_Error, allocation/free log, partial output object state, and cache state; comparison=exact C oracle error 0x40, same allocation index classification where portable, and no null/empty successful output.

- id: fterrdef.FT_Err_Post_Table_Missing
  kind: error
  symbol: FT_Err_Post_Table_Missing
  header: freetype/fterrdef.h
  description: SFNT error code for a missing required PostScript post table.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 148, matching FT_ERRORDEF_(Post_Table_Missing, 0x94) in the pinned header.
    - id: sfnt_without_post_table
      description: Loading or querying a TrueType face whose post table is absent must match C's exact public error classification when that table is required.
    - id: post_table_optional_control
      description: A valid font with a present post table succeeds for glyph-name or post-table-dependent queries, proving the missing-table case is not generic font corruption.
  # needs-input: operation=FT_New_Memory_Face plus glyph-name/post-table query endpoints such as FT_Get_Glyph_Name where exposed; fixture_asset=fixtures/assets/fonts/post_table_missing.ttf and a matching valid source font; params face_index=0, glyph name queries for valid glyph ids and out-of-range controls; output shape=FT_Error, returned glyph-name bytes, face flags, and table presence classification; comparison=exact C oracle error 0x94 where reachable and exact output bytes for present-table success.

- id: fterrdef.FT_Err_Raster_Corrupted
  kind: error
  symbol: FT_Err_Raster_Corrupted
  header: freetype/fterrdef.h
  description: Rasterizer error code for corrupted raster state or invalid SDF raster parameters.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 97, matching FT_ERRORDEF_(Raster_Corrupted, 0x61) in the pinned header.
    - id: sdf_raster_missing_flag
      description: Calling the SDF raster path without FT_RASTER_FLAG_SDF returns FT_Err_Raster_Corrupted from ftsdf.c.
    - id: bsdf_empty_contours_corrupted
      description: BSDF cleanup with temporary bitmaps and zero contours reports Raster_Corrupted, matching ftbsdf.c.
    - id: normal_raster_success_control
      description: A valid outline render succeeds and returns bitmap bytes so Raster_Corrupted is reserved for the corrupted-state cases.
  # needs-input: operation=FT_Outline_Render or raster API path with SDF/BSDF flags plus normal render control; fixture_asset=synthetic FT_Outline records and DejaVuSans.ttf glyph outline; params missing FT_RASTER_FLAG_SDF, empty-contour BSDF case if public runner can reach it, valid outline with NORMAL render mode; output shape=FT_Error, target FT_Bitmap fields/bytes, raster params preservation; comparison=exact C oracle error 0x61 for corrupted raster cases and exact bitmap output for success control.
