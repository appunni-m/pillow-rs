- id: freetype.FT_SizeRec
  kind: record
  symbol: FT_SizeRec
  header: freetype/freetype.h
  description: FreeType public size object record from freetype/freetype.h.
  cases:
    - id: layout_matches_c
      description: Size, alignment, and field offsets for face, generic, metrics, and internal match the pinned C header.
    - id: active_size_record_runtime
      description: A live face exposes an active size record whose face pointer, client generic field, and metrics field follow C FreeType lifetime and mutation behavior after size changes.
  # needs-input: operation=FT_Set_Char_Size and FT_Set_Pixel_Sizes followed by FT_SizeRec inspection; fixture_asset=input/fonts/DejaVuSans.ttf; params face_index=0 with multiple point and pixel sizes; expected output shape=FT_SizeRec layout metadata plus face pointer identity, generic pointer preservation, metrics fields, and internal pointer/null policy; comparison=exact C oracle field equality where public and exact pointer-null/identity classification where opaque.

- id: freetype.FT_Size_Metrics
  kind: record
  symbol: FT_Size_Metrics
  header: freetype/freetype.h
  description: FreeType public size metrics record from freetype/freetype.h.
  cases:
    - id: layout_matches_c
      description: Size, alignment, and field offsets for x_ppem, y_ppem, x_scale, y_scale, ascender, descender, height, and max_advance match the pinned C header.
    - id: returns_active_size_metrics
      description: Accessor returns active face size metrics with C FreeType rounding and 16.16/26.6 units.
      coverage:
        font_variability:
          folder: input/fonts
          sizes: [20]
    - id: matrix_active_size_metrics
      description: Accessor returns active face size metrics for matrix fixture fonts and sizes.

- id: freetype.FT_Size_RequestRec
  kind: record
  symbol: FT_Size_RequestRec
  header: freetype/freetype.h
  description: FreeType public size request record from freetype/freetype.h.
  cases:
    - id: layout_matches_c
      description: Size, alignment, and field offsets for type, width, height, horiResolution, and vertResolution match the pinned C header.
    - id: request_size_input_semantics
      description: FT_Request_Size interprets the record fields like C FreeType, including zero width/height mirroring, resolution fields, and direct 16.16 scale values for FT_SIZE_REQUEST_TYPE_SCALES.
  # needs-input: operation=FT_Request_Size; fixture_asset=input/fonts/DejaVuSans.ttf; params FT_Size_RequestRec values covering NOMINAL, REAL_DIM, BBOX, CELL, SCALES, zero width, zero height, and varied resolutions; expected output shape=FT_Error plus active FT_Size_Metrics; comparison=exact C oracle error and metrics equality.

- id: freetype.FT_ENC_TAG
  kind: tag
  symbol: FT_ENC_TAG
  header: freetype/freetype.h
  description: FreeType public encoding tag macro from freetype/freetype.h.
  cases:
    - id: value_matches_header
      description: Four input bytes are cast to FT_UInt32 and packed as a big-endian 32-bit tag matching the pinned C public header.
    - id: encoding_enum_tag_values
      description: FT_Encoding enum values built with FT_ENC_TAG match the pinned C constants, including space and digit bytes.

- id: freetype.FT_CharMap
  kind: type
  symbol: FT_CharMap
  header: freetype/freetype.h
  description: FreeType public opaque charmap handle typedef from freetype/freetype.h.
  cases:
    - id: alias_defined
      description: Pointer alias to FT_CharMapRec is present in the pinned C public interface.
    - id: owned_by_face_runtime
      description: Handles from face->charmaps and face->charmap remain face-owned and select character mapping behavior like the C oracle.
  # needs-input: operation=FT_New_Memory_Face, FT_Set_Charmap, FT_Get_Char_Index; fixture_asset=font with at least two charmaps plus input/fonts/DejaVuSans.ttf control; params iterate face->charmaps and select each valid charmap; expected output shape=FT_CharMapRec public fields, active charmap pointer identity, and glyph index results; comparison=exact C oracle field and glyph-index equality.

- id: freetype.FT_Driver
  kind: type
  symbol: FT_Driver
  header: freetype/freetype.h
  description: FreeType public opaque font driver handle typedef from freetype/freetype.h.
  cases:
    - id: alias_defined
      description: Pointer alias to FT_DriverRec is present in the pinned C public interface.
    - id: opaque_handle_policy
      description: Public ABI preserves driver handles as opaque module-owned pointers without exposing private record layout.

- id: freetype.FT_Face
  kind: type
  symbol: FT_Face
  header: freetype/freetype.h
  description: FreeType public face handle typedef from freetype/freetype.h.
  cases:
    - id: valid_font_bytes
      description: Face handle can be created from tracked font bytes.
    - id: owns_slot_size_and_charmaps
      description: A live face owns its glyph slot, active size object, and charmap array with pointer identity and lifetime matching C FreeType.
    - id: null_and_done_handle_errors
      description: APIs that accept FT_Face classify null and destroyed handles according to the pinned C error behavior or the project ABI safety policy.

- id: freetype.FT_Face_Internal
  kind: type
  symbol: FT_Face_Internal
  header: freetype/freetype.h
  description: FreeType public opaque private face-data handle typedef from freetype/freetype.h.
  cases:
    - id: alias_defined
      description: Pointer alias to FT_Face_InternalRec is present in the pinned C public interface.
    - id: opaque_private_layout
      description: ABI exposes only pointer/null behavior and never depends on private FT_Face_InternalRec layout.

- id: freetype.FT_GlyphSlot
  kind: type
  symbol: FT_GlyphSlot
  header: freetype/freetype.h
  description: FreeType public glyph slot handle typedef from freetype/freetype.h.
  cases:
    - id: populated_from_load
      description: Loaded glyph slot fields match C FreeType for migrated load cases.
    - id: overwritten_by_subsequent_load
      description: Reusing the same face overwrites the face-owned slot contents on each FT_Load_Glyph or FT_Load_Char call like C FreeType.
    - id: render_mutates_slot
      description: FT_Render_Glyph mutates the same slot's format, bitmap, placement, and advance-visible fields like the C oracle.

