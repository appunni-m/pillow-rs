- id: freetype.FT_SubGlyph
  kind: type
  symbol: FT_SubGlyph
  header: freetype/freetype.h
  description: FreeType public opaque subglyph handle typedef from freetype/freetype.h.
  cases:
    - id: alias_defined
      description: Pointer alias to FT_SubGlyphRec is present in the pinned C public interface.
    - id: composite_subglyph_query_runtime
      description: FT_Get_SubGlyph_Info observes composite subglyph data through this opaque handle path without exposing private layout.
  # needs-input: operation=FT_Load_Glyph and FT_Get_SubGlyph_Info; fixture_asset=composite glyph font such as input/fonts/DejaVuSans.ttf; params composite glyph index loaded with FT_LOAD_NO_RECURSE; expected output shape=subglyph count plus each subglyph index, flags, arguments, and transform; comparison=exact C oracle numeric equality.

- id: ftadvanc.FT_ADVANCE_FLAG_FAST_ONLY
  kind: flag
  symbol: FT_ADVANCE_FLAG_FAST_ONLY
  header: freetype/ftadvanc.h
  description: FreeType public quick-advance flag constant from freetype/ftadvanc.h.
  cases:
    - id: value_matches_header
      description: Numeric value 0x20000000 matches the pinned C public header.
    - id: fast_only_error_behavior
      description: FT_Get_Advance and FT_Get_Advances fail instead of falling back to slow glyph loading when C FreeType lacks a quick advance path for the requested face and load flags.
  # needs-input: operation=FT_Get_Advance and FT_Get_Advances; fixture_asset=input/fonts/DejaVuSans.ttf plus bitmap or driver-specific control if needed; params load_flags including FT_LOAD_DEFAULT|FT_ADVANCE_FLAG_FAST_ONLY, FT_LOAD_NO_HINTING|FT_ADVANCE_FLAG_FAST_ONLY, FT_LOAD_NO_SCALE|FT_ADVANCE_FLAG_FAST_ONLY, and FT_LOAD_VERTICAL_LAYOUT|FT_ADVANCE_FLAG_FAST_ONLY; expected output shape=FT_Error plus written FT_Fixed value or output preservation on error; comparison=exact C oracle error and write behavior.

- id: ftadvanc.FT_Get_Advance
  kind: function
  symbol: FT_Get_Advance
  header: freetype/ftadvanc.h
  description: FreeType C API function that retrieves one glyph advance in scaled 16.16 pixels or unscaled font units.
  coverage:
    font_variability: required
  cases:
    - id: success_horizontal_scaled_advance
      description: Valid face and glyph index return the same horizontal scaled 16.16 advance as C for default, no-hinting, and hinted load flags.
    - id: success_unscaled_font_units
      description: FT_LOAD_NO_SCALE returns the same font-unit advance as C without accidental 26.6 conversion.
    - id: success_vertical_advance
      description: FT_LOAD_VERTICAL_LAYOUT returns C-compatible vertical advances for fonts with real vertical metrics and for fonts where C synthesizes vertical metrics.
    - id: fast_only_success_or_error
      description: FT_ADVANCE_FLAG_FAST_ONLY returns exactly C's fast-path success or failure and associated output write behavior.
    - id: error_null_face_or_output
      description: Null face and null padvance pointers return the pinned C error classification and match C output preservation behavior.
    - id: error_invalid_glyph_or_flags
      description: Out-of-range glyph indexes and unsupported flag combinations return the same C error code and write behavior.
  # needs-input: operation=FT_Get_Advance; fixture_asset=input/fonts/DejaVuSans.ttf plus a fixture with real vertical metrics; params glyph indexes for .notdef, A, V, out-of-range, sizes 9/20/72px or pt, load_flags FT_LOAD_DEFAULT, FT_LOAD_NO_HINTING, FT_LOAD_NO_SCALE, FT_LOAD_VERTICAL_LAYOUT, and FAST_ONLY combinations; expected output shape=FT_Error and FT_Fixed advance; comparison=exact C oracle error, scalar value, and output write/preservation behavior.

- id: ftadvanc.FT_Get_Advances
  kind: function
  symbol: FT_Get_Advances
  header: freetype/ftadvanc.h
  description: FreeType C API function that retrieves a contiguous range of glyph advances in scaled 16.16 pixels or unscaled font units.
  coverage:
    font_variability: required
  cases:
    - id: success_horizontal_scaled_range
      description: Valid glyph ranges return ordered horizontal scaled 16.16 advances matching repeated FT_Get_Advance calls and the C oracle.
    - id: success_unscaled_range
      description: FT_LOAD_NO_SCALE returns ordered font-unit advances for the range without accidental 26.6 conversion.
    - id: success_vertical_range
      description: FT_LOAD_VERTICAL_LAYOUT returns ordered C-compatible vertical advances for real and synthesized vertical metrics.
    - id: fast_only_range_success_or_error
      description: FT_ADVANCE_FLAG_FAST_ONLY returns exactly C's fast-path success or failure for the full range and matches partial-write behavior.
    - id: zero_count_behavior
      description: A zero count returns the same C error/success classification and output write behavior.
    - id: error_null_face_or_output
      description: Null face and null padvances pointers return the pinned C error classification and match C output preservation behavior.
    - id: error_invalid_range_or_flags
      description: Out-of-range start/count combinations and unsupported flag combinations return the same C error code and write behavior.
  # needs-input: operation=FT_Get_Advances; fixture_asset=input/fonts/DejaVuSans.ttf plus a fixture with real vertical metrics; params ranges including start=0/count=3, A..V-containing range, count=0, out-of-range start/count, load_flags FT_LOAD_DEFAULT, FT_LOAD_NO_HINTING, FT_LOAD_NO_SCALE, FT_LOAD_VERTICAL_LAYOUT, and FAST_ONLY combinations; expected output shape=FT_Error and caller-owned FT_Fixed array with before/after sentinels; comparison=exact C oracle error, ordered values, untouched sentinel boundaries, and partial-write/preservation behavior.

- id: ftbbox.FT_Outline_Get_BBox
  kind: function
  symbol: FT_Outline_Get_BBox
  header: freetype/ftbbox.h
  description: FreeType C API function that computes the exact outline bounding box including Bezier extrema.
  coverage:
    font_variability: required
  cases:
    - id: success_simple_outline_bbox
      description: Loaded glyph outlines whose cbox and bbox coincide return the exact same FT_BBox 26.6 coordinates as C.
    - id: success_curve_extrema_bbox
      description: Outlines with conic or cubic extrema between endpoints return exact C bbox values rather than only point control-box values.
    - id: success_empty_outline_bbox
      description: Empty outlines return the same success/error classification and zero or preserved bbox behavior as C.
    - id: no_scale_tricky_font_behavior
      description: Tricky fonts loaded with FT_LOAD_NO_SCALE preserve C FreeType's documented meaningless-but-observable bbox behavior.
    - id: error_null_outline_or_output
      description: Null outline and null abbox pointers return the pinned C error classification and match C output preservation behavior.
    - id: error_malformed_outline
      description: Invalid point, tag, contour, or count combinations return the same C error classification.
  # needs-input: operation=FT_Outline_Get_BBox; fixture_asset=input/fonts/DejaVuSans.ttf plus fonts/glyphs with off-curve extrema and an optional tricky TrueType control; params outlines loaded at multiple sizes and load flags including FT_LOAD_NO_SCALE, plus synthetic malformed FT_Outline records; expected output shape=FT_Error and FT_BBox xMin/yMin/xMax/yMax in 26.6 or font units according to C; comparison=exact C oracle error, bbox fields, and output write/preservation behavior.

- id: ftbdf.FT_Get_BDF_Charset_ID
  kind: function
  symbol: FT_Get_BDF_Charset_ID
  header: freetype/ftbdf.h
  description: FreeType C API function that retrieves face-owned BDF charset encoding and registry strings.
  cases:
    - id: success_bdf_face_charset
      description: A BDF face returns C-compatible face-owned charset encoding and registry string pointers and contents.
    - id: success_sfnt_bdf_table_selected_strike
      description: An SFNT face with a BDF table returns the same strings as C after a bitmap strike has been selected.
    - id: error_non_bdf_face
      description: Non-BDF faces and SFNT faces without a usable BDF table return the pinned C error classification.
    - id: error_sfnt_bdf_without_selected_strike
      description: SFNT fonts with a BDF table but no selected bitmap strike return the same C error classification.
    - id: error_null_face_or_outputs
      description: Null face, null acharset_encoding, and null acharset_registry pointers return the pinned C error classification and match C output preservation behavior.
  # needs-input: operation=FT_Get_BDF_Charset_ID; fixture_asset=BDF font with STARTCHAR/CHARSET metadata, SFNT bitmap font with BDF table, and input/fonts/DejaVuSans.ttf non-BDF control; params live faces before/after strike selection plus null output pointer variants; expected output shape=FT_Error plus charset_encoding and charset_registry C string contents/pointer-null classification; comparison=exact C oracle error, string contents, pointer ownership/lifetime classification, and output write/preservation behavior.
