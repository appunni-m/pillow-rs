- id: ftmodapi.FT_Module_Interface
  kind: type
  symbol: FT_Module_Interface
  header: freetype/ftmodapi.h
  description: Public module interface typedef from freetype/ftmodapi.h; the pinned header aliases FT_Module_Interface to FT_Pointer and uses it for module requester return values and module-specific interface pointers.
  cases:
    - id: alias_defined
      description: Including freetype/ftmodapi.h exposes FT_Module_Interface as the same ABI shape as FT_Pointer.
    - id: requester_return_type
      description: FT_Module_Requester returns FT_Module_Interface and module get_interface implementations in the pinned source return service pointers or NULL through that typeless pointer alias.
  # needs-input: operation=FT_Get_Module_Interface or module requester through a C ABI facade; fixture_asset=library with default modules loaded; params={module_name:"sfnt" or "psnames", interface_name if requester is exposed}; output shape={pointer nullness/address category only, not pointee repr}; comparison=exact C/Rust/C-FFI/Wasm nullness and stable service-availability classification.

- id: ftmoderr.FT_MODERR_END_LIST
  kind: macro
  symbol: FT_MODERR_END_LIST
  header: freetype/ftmoderr.h
  description: Public module-error list hook macro from freetype/ftmoderr.h; in default enum mode it emits the FT_Mod_Err_Max terminator and closes the enum, then is undefined during header cleanup.
  cases:
    - id: default_enum_closes_with_max
      description: With FT_MODERRDEF undefined, ftmoderr.h defines FT_MODERR_END_LIST as "FT_Mod_Err_Max };" and invokes it after all FT_MODERRDEF module entries.
    - id: custom_table_end_hook
      description: A client-provided FT_MODERR_END_LIST is invoked after the module-error list, allowing generated tables, and ftmoderr.h cleanup removes the hook macro afterward.
  # needs-input: operation=C preprocessor/compile fixture; fixture_asset=small translation unit redefining FTMODERR_H_, FT_MODERRDEF, FT_MODERR_START_LIST, and FT_MODERR_END_LIST around #include <freetype/ftmoderr.h>; params={custom end emits sentinel row}; output shape={compiled table or preprocessed token stream}; comparison=exact hook order and post-include undef behavior.

- id: ftmoderr.FT_MODERR_START_LIST
  kind: macro
  symbol: FT_MODERR_START_LIST
  header: freetype/ftmoderr.h
  description: Public module-error list hook macro from freetype/ftmoderr.h; in default enum mode it opens the FT_Mod_Err_* enumeration before the module entries.
  cases:
    - id: default_enum_opens_list
      description: With FT_MODERRDEF undefined, ftmoderr.h defines FT_MODERR_START_LIST as "enum {" and invokes it before the pinned FT_MODERRDEF entries.
    - id: custom_table_start_hook
      description: A client-provided FT_MODERR_START_LIST is invoked before the first module entry, allowing generated tables, and ftmoderr.h cleanup removes the hook macro afterward.
  # needs-input: operation=C preprocessor/compile fixture; fixture_asset=small translation unit redefining FTMODERR_H_, FT_MODERRDEF, FT_MODERR_START_LIST, and FT_MODERR_END_LIST around #include <freetype/ftmoderr.h>; params={custom start emits table opener}; output shape={compiled table or preprocessed token stream}; comparison=exact hook order and cleanup behavior.

- id: ftmoderr.FT_NEED_EXTERN_C
  kind: macro
  symbol: FT_NEED_EXTERN_C
  header: freetype/ftmoderr.h
  description: Header-internal public preprocessor control macro used by ftmoderr.h to open and close extern "C" only for the default C++ enum expansion path.
  cases:
    - id: cplusplus_default_wrapper
      description: In C++ default mode, ftmoderr.h defines FT_NEED_EXTERN_C before opening extern "C" and closes the block near cleanup.
    - id: cleanup_undefines_macro
      description: ftmoderr.h undefines FT_NEED_EXTERN_C during cleanup so it is not visible after a normal include.
    - id: custom_moderrdef_skips_default_wrapper
      description: When FT_MODERRDEF is already defined by the includer, the default setup block is skipped and ftmoderr.h does not create its own FT_NEED_EXTERN_C wrapper.
  # needs-input: operation=C and C++ preprocessor fixture; fixture_asset=small C and C++ translation units including freetype/ftmoderr.h with and without custom FT_MODERRDEF; params={post_include_macro_probe}; output shape={preprocessed token stream and macro-defined status}; comparison=exact extern wrapper presence and post-include undef behavior.

- id: ftmoderr.FT_Mod_Err_Autofit
  kind: error
  symbol: FT_Mod_Err_Autofit
  header: freetype/ftmoderr.h
  description: Public autofitter module error base emitted by FT_MODERRDEF(Autofit, 0x100, "autofitter module") in the pinned ftmoderr.h module list.
  cases:
    - id: value_matches_header
      description: With FT_CONFIG_OPTION_USE_MODULE_ERRORS enabled, the value is exactly 0x100; without module errors, FT_MODERRDEF maps it to 0.
    - id: module_error_prefix_used
      description: src/autofit/aferrors.h defines FT_ERR_BASE as FT_Mod_Err_Autofit before including fterrors.h, so AF_Err_* values compose this base with FT_Err_* low bytes when module errors are enabled.
  # needs-input: operation=FT_Property_Set and autofit load paths that return AF_Err_*; fixture_asset=valid scalable font plus invalid autofit property request; params={module:"autofitter", property_name invalid or invalid value}; output shape={FT_Error, FT_ERROR_BASE, FT_ERROR_MODULE}; comparison=exact C oracle composed error value when module errors are enabled and exact low-byte error classification otherwise.

