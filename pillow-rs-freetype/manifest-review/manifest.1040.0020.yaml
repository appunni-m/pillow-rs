- id: ttnameid.TT_PLATFORM_APPLE_UNICODE
  kind: constant
  symbol: TT_PLATFORM_APPLE_UNICODE
  header: freetype/ttnameid.h
  description: Platform id 0 for Apple Unicode charmaps and name records.
  cases:
    - id: value_matches_header
      description: Macro expands to integer value 0 in the pinned C public header.
    - id: import_contract
      description: Public C code can import freetype/ttnameid.h and use TT_PLATFORM_APPLE_UNICODE as a constant expression.
    - id: unicode_charmap_platform_runtime
      description: C oracle exposes platform_id 0 for an Apple Unicode charmap/name fixture and preserves the matching encoding_id fields.
      # needs-input: SFNT fixture with platform 0 cmap/name entries; compare FT_CharMapRec platform_id/encoding_id and FT_Get_Sfnt_Name output fields against C.

