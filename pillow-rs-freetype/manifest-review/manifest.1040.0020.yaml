- id: ttnameid.TT_UCR_ALPHABETIC_PRESENTATION_FORMS
  kind: constant
  symbol: TT_UCR_ALPHABETIC_PRESENTATION_FORMS
  header: freetype/ttnameid.h
  description: OS/2 ulUnicodeRange2 bit mask for Alphabetic Presentation Forms.
  cases:
    - id: value_matches_header
      description: Macro expands to (1UL << 30), value 0x40000000, in the pinned C public header.
    - id: import_contract
      description: Public C code can import freetype/ttnameid.h and use TT_UCR_ALPHABETIC_PRESENTATION_FORMS as an unsigned long constant expression.
    - id: os2_unicode_range_bit_runtime
      description: C oracle reports this bit in the OS/2 ulUnicodeRange fields for a font declaring U+FB00-U+FB4F coverage.
      # needs-input: SFNT fixture with OS/2 ulUnicodeRange2 bit 30 set; compare TT_OS2 ulUnicodeRange fields from FT_Get_Sfnt_Table against C.

