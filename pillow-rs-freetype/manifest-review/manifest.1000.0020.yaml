- id: ttnameid.TT_MAC_LANGID_TIBETAN
  kind: constant
  symbol: TT_MAC_LANGID_TIBETAN
  header: freetype/ttnameid.h
  description: Public Mac platform language ID constant for Tibetan name-table records; pinned FreeType defines it as 63.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 63 as defined by pinned freetype/ttnameid.h.
    - id: public_import_contract
      description: A C translation unit including <freetype/ttnameid.h> can reference TT_MAC_LANGID_TIBETAN as a preprocessor-visible public constant.
    - id: representative_name_record_language_match
      description: A representative Mac Tibetan name record tagged with language ID 63 is selected and reported with the same scalar fields and string bytes as the C oracle.
  # needs-input: operation=FT_Get_Sfnt_Name; fixture_asset=input/fonts/names/mac-tibetan.ttf; params={platform_id=TT_PLATFORM_MACINTOSH, encoding_id=TT_MAC_ID_TIBETAN, language_id=TT_MAC_LANGID_TIBETAN, name_id=TT_NAME_ID_FULL_NAME}; expected output shape={FT_Error, name_index, platform_id, encoding_id, language_id, name_id, string_bytes}; comparison=exact C oracle status and name-record scalar/string bytes.

