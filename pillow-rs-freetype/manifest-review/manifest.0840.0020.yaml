- id: fttypes.FT_UShort
  kind: type
  symbol: FT_UShort
  header: freetype/fttypes.h
  description: Public unsigned-short typedef used throughout FreeType public records and scalar API fields.
  cases:
    - id: alias_defined
      description: The pinned C header defines FT_UShort as unsigned short.
    - id: abi_width_alignment_matches_c
      description: Size and alignment match C unsigned short on the target ABI and remain distinct from FT_UInt and FT_ULong widths.
    - id: winfnt_header_field_contract
      description: WinFNT header fields such as version, file_type, ascent, weight, and bytes_per_row are read as little-endian FT_UShort values.
  # needs-input: operation=ABI layout probe plus FT_Get_WinFNT_Header; fixture_asset=minimal .fnt/.fon assets with known FT_UShort header fields; params={font, face_index}; expected output shape={sizeof, alignof, selected FT_WinFNT_HeaderRec FT_UShort fields}; comparison=exact C ABI values and exact little-endian field values.

- id: ftwinfnt.FT_WinFNT_ID_CP1250
  kind: constant
  symbol: FT_WinFNT_ID_CP1250
  header: freetype/ftwinfnt.h
  description: Public WinFNT charset byte value for Windows code page 1250, East European.
  cases:
    - id: value_matches_header
      description: Value equals 238 in the pinned C public header.
    - id: charset_roundtrip_from_header
      description: A WinFNT face whose header charset byte is 238 reports the same value through FT_Get_WinFNT_Header.
  # needs-input: operation=FT_Get_WinFNT_Header; fixture_asset=.fnt or .fon with charset=238; params={font, face_index}; expected output shape={FT_Error, FT_WinFNT_HeaderRec.charset}; comparison=exact success status and charset byte against C oracle.

