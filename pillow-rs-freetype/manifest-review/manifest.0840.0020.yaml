- id: ftwinfnt.FT_WinFNT_ID_DEFAULT
  kind: constant
  symbol: FT_WinFNT_ID_DEFAULT
  header: freetype/ftwinfnt.h
  description: Public WinFNT charset byte value for Windows DEFAULT charset, documented as a don't-care enumeration value rather than valid font-file charset data.
  cases:
    - id: value_matches_header
      description: Value equals 1 in the pinned C public header.
    - id: invalid_as_real_font_charset
      description: The public header documents DEFAULT as not contained by valid font files, so runtime coverage should use it for value/import parity, not a success font-header fixture.
  # needs-input: operation=constant_eval plus malformed/synthetic WinFNT load if such inputs are intentionally supported; fixture_asset=no valid font asset should claim charset=1; params={symbol}; expected output shape={constant_value, optional load error for synthetic invalid font}; comparison=exact C macro value and exact C error if an invalid synthetic asset is added.

