- id: ftdriver.FT_Prop_GlyphToScriptMap
  kind: record
  symbol: FT_Prop_GlyphToScriptMap
  header: freetype/ftdriver.h
  description: FreeType public auto-hinter property payload for the "glyph-to-script-map" driver property from freetype/ftdriver.h.
  coverage:
    font_variability: required
  cases:
    - id: layout_matches_c
      description: Size, alignment, and field offsets for face then map match the pinned C header, with face as FT_Face and map as FT_UShort*.
    - id: property_get_returns_face_map
      description: FT_Property_Get(library, "autofitter", "glyph-to-script-map", &prop) fills prop.map with the face-global glyph_styles array for prop.face and keeps prop.face unchanged.
    - id: map_mutation_affects_autohint_script
      description: Mutating returned map entries before the first auto-hinted glyph is processed changes the script selected by the auto-hinter exactly like C.
    - id: invalid_face_error_matches_c
      description: Null or invalid prop.face returns the exact C error from af_property_get_face_globals without fabricating a map pointer.
  # needs-input: operation=FT_Property_Get; fixture_asset=TrueType/OpenType font with Latin, CJK, Indic, unmapped, and ligature glyphs plus a valid Unicode charmap; params module_name="autofitter", property_name="glyph-to-script-map", FT_Prop_GlyphToScriptMap.face=valid face before any FT_LOAD_FORCE_AUTOHINT load, then mutate selected map entries to FT_AUTOHINTER_SCRIPT_NONE/LATIN/CJK/INDIC before loading; expected output shape=FT_Error, prop.face, prop.map pointer-null classification, num_glyphs FT_UShort script array, and subsequent FT_Load_Glyph/FT_Render_Glyph metrics or bitmap under FT_LOAD_FORCE_AUTOHINT; comparison=exact C oracle error, pointer class, per-glyph script values, and post-mutation autohint output equality.
  # needs-input: operation=FT_Property_Get; fixture_asset=same font plus null/invalid face controls; params prop.face=null, stale face handle if ABI harness supports it, null value pointer classified separately by safety policy; expected output shape=FT_Error and sentinel-initialized prop.map before/after; comparison=exact C oracle error code and output mutation/preservation behavior.

- id: ftdriver.FT_Prop_IncreaseXHeight
  kind: record
  symbol: FT_Prop_IncreaseXHeight
  header: freetype/ftdriver.h
  description: FreeType public auto-hinter property payload for the "increase-x-height" driver property from freetype/ftdriver.h.
  coverage:
    font_variability: required
  cases:
    - id: layout_matches_c
      description: Size, alignment, and field offsets for face then limit match the pinned C header, with face as FT_Face and limit as FT_UInt.
    - id: property_set_get_round_trips_limit
      description: FT_Property_Set and FT_Property_Get for "autofitter"/"increase-x-height" store and retrieve globals->increase_x_height for the supplied face exactly like afmodule.c.
    - id: limit_changes_autohint_x_height
      description: For 6 <= ppem <= limit, auto-hinted Latin x-height rounding changes match C; limit 0 disables the special x-height increase behavior.
    - id: invalid_face_error_matches_c
      description: Null or invalid prop.face returns the exact C error from af_property_get_face_globals and preserves the caller-visible limit according to C.
  # needs-input: operation=FT_Set_Char_Size then FT_Property_Set/FT_Property_Get then FT_Load_Glyph with FT_LOAD_FORCE_AUTOHINT; fixture_asset=Latin font with x-height-bearing glyphs and stable native outlines; params ppem values 5, 6, 9, limit, limit+1, limit values 0, 6, 10, 14, valid face before glyph load, then get back the property; expected output shape=FT_Error, FT_Prop_IncreaseXHeight { face, limit }, glyph metrics, outline cbox, and rendered mask for representative lowercase glyphs; comparison=exact C oracle error, stored limit, 26.6 metrics/cbox, and bitmap bytes.
  # needs-input: operation=FT_Property_Set/FT_Property_Get; fixture_asset=same font plus null/invalid face controls; params prop.face=null, stale face handle if ABI harness supports it, null value pointer classified separately by safety policy; expected output shape=FT_Error and sentinel-initialized prop.limit before/after; comparison=exact C oracle error code and output mutation/preservation behavior.

- id: fterrdef.FT_Err_Array_Too_Large
  kind: error
  symbol: FT_Err_Array_Too_Large
  header: freetype/fterrdef.h
  description: FreeType public error code for an allocation count or derived array size that overflows the implementation limit.
  cases:
    - id: header_definition_matches
      description: Numeric value is exactly 0x0A and the public error string is "array allocation size too large" in the generic errors block of the pinned fterrdef.h.
    - id: ttc_header_overflow_returns_error
      description: An SFNT collection header whose count would overflow the TTC offset array guard returns FT_Err_Array_Too_Large like sfobjs.c.
    - id: allocator_growth_overflow_returns_error
      description: Internal array growth with new_count greater than FT_INT_MAX / item_size returns FT_Err_Array_Too_Large like ftutil.c without attempting allocation.
  # needs-input: operation=FT_New_Memory_Face or FT_Open_Face; fixture_asset=malformed TTC/SFNT with TTC count larger than stream_size / 32, plus a WOFF2/SVG/table fixture that trips a documented array-size guard if available; params face_index 0 and sentinel output face; expected output shape=FT_Error and output face pointer mutation/null classification; comparison=exact C oracle FT_Err_Array_Too_Large value 0x0A and output preservation/null behavior.

