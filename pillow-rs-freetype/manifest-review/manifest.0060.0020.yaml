- id: freetype.FT_LOAD_ADVANCE_ONLY
  kind: flag
  symbol: FT_LOAD_ADVANCE_ONLY
  header: freetype/freetype.h
  description: FreeType public-header load flag used internally by some font drivers.
  cases:
    - id: value_matches_header
      description: Numeric value matches the pinned FreeType header value 0x00000100.
    # needs-input: Add load_glyph and load_char cases with FT_LOAD_ADVANCE_ONLY alone and with FT_LOAD_RENDER on a scalable TrueType glyph; compare C glyph-slot metrics/advance and Rust error classification, expected shape glyph_slot_or_error.
    - id: unsupported_load_flag_error
      description: Current FFI load flag decoder must classify this unimplemented public-header bit explicitly instead of silently dropping it.

- id: freetype.FT_LOAD_BITMAP_METRICS_ONLY
