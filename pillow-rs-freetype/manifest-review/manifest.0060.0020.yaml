- id: freetype.FT_FSTYPE_EDITABLE_EMBEDDING
  kind: flag
  symbol: FT_FSTYPE_EDITABLE_EMBEDDING
  header: freetype/freetype.h
  description: FreeType public fsType flag constant from freetype/freetype.h.
  cases:
    - id: value_matches_header
      description: Value matches the pinned C public header value 0x0008.
    # needs-input: Add a font fixture whose OS/2 fsType contains 0x0008; call the public fsType query path, expect the returned u16 to include this bit exactly, and compare the value with the C oracle.
    - id: fs_type_value_observable
      description: Parsed OS/2 fsType exposes the editable embedding bit when present.

