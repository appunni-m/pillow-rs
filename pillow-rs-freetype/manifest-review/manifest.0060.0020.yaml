  description: FreeType public load flag constant from freetype/freetype.h.
  cases:
    - id: value_matches_header
      description: Numeric value matches the pinned FreeType header value 0x00400000.
    # needs-input: Add load_glyph and load_char cases using an embedded bitmap strike with FT_LOAD_BITMAP_METRICS_ONLY | FT_LOAD_RENDER; expect C to unset render and return bitmap metrics without bitmap bytes, compare slot metrics/format/bitmap fields or Rust unsupported error.
    - id: bitmap_metrics_only_load_behavior
      description: Loading bitmap metrics only is covered for bitmap glyphs and the unsupported Rust path is visible until implemented.
    # needs-input: Add outline-glyph load_glyph and load_char cases with FT_LOAD_BITMAP_METRICS_ONLY; expect C no-effect slot parity against default load, compare glyph_slot fields exactly or Rust unsupported error.
    - id: outline_no_effect_or_error
      description: Non-bitmap glyph behavior is classified as C no-effect or Rust unsupported error.

