- id: freetype.FT_LOAD_DEFAULT
  kind: flag
  symbol: FT_LOAD_DEFAULT
  header: freetype/freetype.h
  description: FreeType public default load flag value from freetype/freetype.h.
  cases:
    - id: value_matches_header
      description: Numeric value matches the pinned FreeType header value 0x00000000.
    - id: load_char_default_slot
      description: FT_Load_Char with FT_LOAD_DEFAULT returns default hinted glyph-slot metrics and no rendered bitmap.
      coverage:
        font_variability:
          folder: input/fonts
          sizes: [20]
          char_codes: [65]
          load_flags: [0]
    - id: load_glyph_default_slot
      description: FT_Load_Glyph with FT_LOAD_DEFAULT returns default hinted glyph-slot metrics and no rendered bitmap.
      coverage:
        font_variability:
          folder: input/fonts
          sizes: [20]
          glyph_indices: [36]
          load_flags: [0]

