      description: Value is 9 in the pinned C header.
    - id: private_blue_scale_runtime_value
      description: A Type1 Private dictionary exposes blue_scale as FT_Fixed, and MM blend coverage must show the C value selected or interpolated for the active design.
  # needs-input: operation=constant_eval plus FT_Get_PS_Font_Private and MM coordinate change; fixture_asset=PFA/PFB MM Type1 font with differing BlueScale values; params={font, design_coordinates}; expected output shape={constant_value, PS_PrivateRec.blue_scale before/after variation}; comparison=exact C oracle integer and FT_Fixed values.

