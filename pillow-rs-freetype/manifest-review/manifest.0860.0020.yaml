- id: ftwinfnt.FT_Get_WinFNT_Header
  kind: function
  symbol: FT_Get_WinFNT_Header
  header: freetype/ftwinfnt.h
  description: Public WinFNT helper that retrieves the parsed Windows FNT header through the WINFNT service.
  cases:
    - id: signature_and_dispatch_contract
      description: Public declaration returns FT_Error from FT_Face and FT_WinFNT_HeaderRec*, checks null face before null output, and dispatches through FT_SERVICE_ID_WINFNT.
    - id: winfnt_face_copies_header_success
      description: For a valid Windows FNT face, C copies the driver's stored FT_WinFNT_HeaderRec into the caller buffer and returns FT_Err_Ok.
    - id: null_face_returns_invalid_face_handle
      description: A null face returns Invalid_Face_Handle without touching the output buffer.
    - id: null_output_returns_invalid_argument
      description: A non-null face with a null header pointer returns Invalid_Argument before service dispatch.
    - id: non_winfnt_face_returns_invalid_argument
      description: A valid non-WinFNT face has no WINFNT service and returns Invalid_Argument.
  # needs-input: operation=FT_Get_WinFNT_Header; fixture_asset=valid .fnt/.fon font, valid TrueType/OpenType control font, null face/header harness rows; params={face_source, header_pointer_mode, initial_header_sentinel}; expected output shape={FT_Error, full FT_WinFNT_HeaderRec fields, sentinel_unchanged flag}; comparison=exact C oracle error code and copied field values.

- id: ftwinfnt.FT_WinFNT_HeaderRec
  kind: record
  symbol: FT_WinFNT_HeaderRec
  header: freetype/ftwinfnt.h
  description: Public Windows FNT header record exposing the parsed fixed-format FNT metadata fields.
  cases:
    - id: layout_matches_c
      description: Size, alignment, and field offsets match the pinned C header for all scalar fields, the 60-byte copyright array, and reserved1[4].
    - id: field_order_matches_header
      description: Field order is version, file_size, copyright, file_type, nominal_point_size, resolutions, metrics, style flags, charset, dimensions, character range, row size, offsets, reserved, flags, ABC spacing, color table offset, and reserved1.
    - id: copied_header_values_match_file
      description: Values copied by FT_Get_WinFNT_Header for a real WinFNT fixture match the parsed on-disk header, including offsets and charset.
  # needs-input: operation=C ABI layout probe plus FT_Get_WinFNT_Header; fixture_asset=valid .fnt/.fon font with known header bytes; params={font, face_index}; expected output shape={sizeof, alignof, field_offsets, copied_header}; comparison=exact C ABI layout and exact parsed field values.

- id: ftwinfnt.FT_WinFNT_Header
  kind: type
  symbol: FT_WinFNT_Header
  header: freetype/ftwinfnt.h
  description: Public handle typedef to FT_WinFNT_HeaderRec used by WinFNT clients.
  cases:
    - id: alias_defined
      description: Type alias is present as struct FT_WinFNT_HeaderRec_* in the pinned C public interface.
    - id: pointer_abi_contract
      description: The handle has pointer size/alignment and points to the same record layout used by FT_Get_WinFNT_Header.
    - id: mutable_output_handle_contract
      description: Passing a pointer to a caller-owned record lets C overwrite the record on success and preserve the sentinel on pre-dispatch errors.
  # needs-input: operation=C ABI typedef probe plus FT_Get_WinFNT_Header; fixture_asset=valid WinFNT font and non-WinFNT control font; params={header_storage, face_source}; expected output shape={pointer_size, pointer_alignment, FT_Error, record_mutation}; comparison=exact C ABI pointer contract and mutation behavior.

- id: otsvg.FT_SVG_DocumentRec
  kind: record
  symbol: FT_SVG_DocumentRec
  header: freetype/otsvg.h
  description: Public OT-SVG document record passed through glyph slots and SVG renderer hooks.
  cases:
    - id: layout_matches_c
      description: Size, alignment, and field offsets match the pinned C header for svg_document, svg_document_length, metrics, units_per_EM, glyph range, transform, and delta.
    - id: document_range_and_payload_fields
      description: The record preserves document pointer, byte length, start/end glyph ids, and units_per_EM exactly for an SVG table document.
    - id: transform_and_metrics_fields
      description: Metrics, transform matrix, and delta fields are exposed with the same nested public layouts as FT_Size_Metrics, FT_Matrix, and FT_Vector.
  # needs-input: operation=OT-SVG glyph load/render hook capture; fixture_asset=OpenType SVG font with at least one SVG document range; params={font, glyph_index, ppem, transform}; expected output shape={sizeof, alignof, field_offsets, document_length, glyph_range, metrics, units_per_EM, transform, delta}; comparison=exact C oracle record fields and ABI layout.

- id: otsvg.FT_SVG_Document
  kind: type
  symbol: FT_SVG_Document
  header: freetype/otsvg.h
  description: Public handle typedef to FT_SVG_DocumentRec used by OT-SVG renderer callbacks.
  cases:
    - id: alias_defined
      description: Type alias is present as struct FT_SVG_DocumentRec_* in the pinned C public interface.
    - id: pointer_abi_contract
      description: The handle has pointer size/alignment and points to the public SVG document record passed through glyph-slot other data.
    - id: renderer_callback_observes_document
      description: An SVG renderer hook can observe the same document fields through the public handle that C stored for the glyph.
  # needs-input: operation=SVG renderer hook capture during FT_Render_Glyph or FT_Glyph_To_Bitmap; fixture_asset=OpenType SVG font plus test SVG hooks; params={font, glyph_index, hook_behavior}; expected output shape={pointer_size, pointer_alignment, callback_document_fields, FT_Error}; comparison=exact C oracle callback-visible fields and status, with unsupported SVG module reported explicitly.

- id: t1tables.T1_Blend_Flags
  kind: enum
  symbol: T1_Blend_Flags
  header: freetype/t1tables.h
  description: Public enum identifying Multiple Master blend dictionary fields for Type1 font info and private dictionaries.
  cases:
    - id: enum_variants_match_header
      description: Variants match the pinned C header from T1_BLEND_UNDERLINE_POSITION through T1_BLEND_MAX, preserving insertion order and numeric values.
    - id: font_info_blend_group
      description: Underline position, underline thickness, and italic angle are the FontInfo blend dictionary fields.
    - id: private_blend_group
      description: Blue zones, standard widths/heights, stem snap arrays, blue scale/shift, family blues, and force bold are the Private blend dictionary fields.
    - id: max_tracks_variant_count
      description: T1_BLEND_MAX remains the sentinel after the last real blend field and equals the number of public blend fields.
  # needs-input: operation=constant_eval plus Type1 MM face load; fixture_asset=PFA/PFB Multiple Master Type1 font with blend font info/private dictionaries; params={font, design_coordinates}; expected output shape={enum_values, parsed PS_FontInfoRec fields, parsed PS_PrivateRec fields, variation-mutated fields}; comparison=exact C oracle values and record fields.

- id: t1tables.T1_EncodingType
  kind: enum
  symbol: T1_EncodingType
  header: freetype/t1tables.h
  description: Public enum describing Type1 encoding source classification.
  cases:
    - id: enum_variants_match_header
      description: Values match the pinned C header for NONE=0, ARRAY=1, STANDARD=2, ISOLATIN1=3, and EXPERT=4.
    - id: array_encoding_runtime_case
      description: A Type1 font with a custom Encoding array reports ARRAY and exposes encoding entries through PS_DICT_ENCODING_ENTRY.
    - id: standard_or_expert_runtime_cases
      description: Fonts using StandardEncoding, ISOLatin1Encoding, or ExpertEncoding report the corresponding public enum value through the Type1 dictionary service.
  # needs-input: operation=FT_Get_PS_Font_Value for PS_DICT_ENCODING_TYPE and PS_DICT_ENCODING_ENTRY; fixture_asset=PFA/PFB Type1 fonts with custom, StandardEncoding, ISOLatin1Encoding, and ExpertEncoding cases; params={font, encoding_entry_indexes}; expected output shape={T1_EncodingType value, entry byte strings or empty result}; comparison=exact C oracle enum and returned bytes.

- id: t1tables.T1_BLEND_BLUE_SCALE
