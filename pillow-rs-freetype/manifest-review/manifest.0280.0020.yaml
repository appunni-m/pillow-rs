- id: ftcolor.FT_Get_Color_Glyph_ClipBox
  kind: function
  symbol: FT_Get_Color_Glyph_ClipBox
  header: freetype/ftcolor.h
  description: FreeType C API function that retrieves a transformed COLR v1 ClipBox for a base glyph.
  cases:
    - id: clipbox_success_scaled_and_transformed
      description: For a glyph with a COLR v1 ClipBox, returns 1 and fills bottom_left, top_left, top_right, and bottom_right in 26.6 units after active size scaling and FT_Set_Transform effects.
    - id: no_clipbox_returns_false_preserves_output
      description: For a valid face and glyph with no matching ClipBox, returns 0 with caller-prefilled clip_box bytes classified against C.
    - id: null_and_non_sfnt_rejected
      description: Null face, null output pointer, and non-SFNT face inputs return 0 before writing public output.
    - id: malformed_clipbox_false_behavior
      description: Malformed ClipList formats, out-of-range offsets, unsupported ClipBox format bytes, and truncated coordinates return 0 with exact C output mutation or preservation behavior.
  # needs-input: operation=FT_Get_Color_Glyph_ClipBox; fixture_asset=COLR v1 font with ClipBox format 1, optional format 2 variation ClipBox, glyph without ClipBox, non-SFNT control font, and malformed synthetic COLR ClipList cases; params base_glyph values inside/outside gid ranges, ppem sizes, FT_Set_Transform matrix and delta, null-output probe where harness supports it; expected output shape=FT_Bool plus FT_ClipBox four FT_Vector corners and before/after sentinel classification; comparison=exact C oracle bool equality and exact 26.6 vector equality, including output preservation/mutation classification on false.

- id: ftcolor.FT_Get_Color_Glyph_Layer
  kind: function
  symbol: FT_Get_Color_Glyph_Layer
  header: freetype/ftcolor.h
  description: FreeType C API function that iterates COLR v0 glyph layers for a base glyph.
  cases:
    - id: layer_iteration_success
      description: Starting with iterator.p NULL, returns each COLR v0 layer in bottom-to-top order with glyph index, color index, num_layers, layer counter, and iterator cursor matching C.
    - id: foreground_color_index
      description: A layer color index of 0xFFFF is returned as the special foreground-color marker and is not validated as a CPAL entry index.
    - id: terminal_false_preserves_last_outputs
      description: After all layers are consumed, returns 0 and matches C for aglyph_index, acolor_index, and iterator state preservation.
    - id: invalid_inputs_rejected
      description: Null face, null output pointers, null iterator, non-SFNT faces, and base_glyph values at or above face->num_glyphs return 0 before writing outputs.
    - id: malformed_layer_record_false_behavior
      description: Malformed COLR v0 records with out-of-range layer glyph indexes or CPAL color indexes return 0 with exact C cursor and output mutation behavior.
  # needs-input: operation=FT_Get_Color_Glyph_Layer with optional FT_Palette_Data_Get and FT_Palette_Select for CPAL validation; fixture_asset=COLR v0 font with multiple layers, CPAL table, 0xFFFF foreground layer, no-layer glyph, non-SFNT control font, and malformed synthetic COLR layer records; params base_glyph, repeated calls on one FT_LayerIterator initialized with p=NULL, prefilled output sentinels, palette indexes; expected output shape=per-call FT_Bool, aglyph_index, acolor_index, FT_LayerIterator num_layers/layer/p identity class, and CPAL palette bounds data; comparison=exact C oracle equality for return values and fields, ordered layer sequence, terminal false behavior, and false-path output/cursor mutation classification.

- id: ftcolor.FT_Get_Color_Glyph_Paint
  kind: function
  symbol: FT_Get_Color_Glyph_Paint
  header: freetype/ftcolor.h
  description: FreeType C API function that retrieves the root opaque paint for a COLR v1 base glyph.
  cases:
    - id: root_paint_success_no_root_transform
      description: For a COLR v1 base glyph, returns 1 and fills FT_OpaquePaint with the root paint pointer and insert_root_transform cleared when FT_COLOR_NO_ROOT_TRANSFORM is requested.
    - id: root_paint_success_include_root_transform
      description: With FT_COLOR_INCLUDE_ROOT_TRANSFORM, returns 1 and marks the opaque paint so a following FT_Get_Paint emits C's synthetic root PaintTransform.
    - id: missing_or_invalid_root_returns_false
      description: Missing COLR table, COLR version without v1 base glyphs, no record for base_glyph, zero paint offset, and out-of-range paint offset return 0 with caller output classified against C.
    - id: non_null_opaque_paint_rejected
      description: If the caller passes an FT_OpaquePaint whose p field is already non-null, returns 0 and preserves the existing opaque-paint state like C.
    - id: null_and_non_sfnt_rejected
      description: Null face, null paint output, and non-SFNT face inputs return 0 before writing output.
    - id: downstream_paint_graph_contract
      description: The returned opaque paint is valid input for FT_Get_Paint, FT_Get_Paint_Layers, and FT_Get_Colorline_Stops traversal, with CPAL palette APIs used to resolve color indexes in fixture comparison.
  # needs-input: operation=FT_Get_Color_Glyph_Paint followed by FT_Get_Paint, FT_Get_Paint_Layers, FT_Get_Colorline_Stops, FT_Palette_Data_Get, FT_Palette_Select, and FT_Palette_Set_Foreground_Color; fixture_asset=COLR v1 font covering root transform, PaintColrLayers, solid/gradient/transform/composite/colr-glyph nodes, CPAL palettes, foreground color, missing-glyph control, non-SFNT control, and malformed root-offset cases; params base_glyph values, root_transform enum values, ppem sizes, FT_Set_Transform matrix/delta, palette indexes including valid and out-of-range, prefilled FT_OpaquePaint sentinel including non-null p; expected output shape=FT_Bool root result, FT_OpaquePaint p identity class and insert_root_transform, decoded FT_COLR_Paint graph nodes, layer/color-stop sequences, palette data and BGRA entries, and false-path before/after output classification; comparison=exact C oracle equality for booleans, enum/scalar fields, 16.16/26.6 fixed values, ordered traversal, CPAL records, and null/output preservation or mutation behavior.
