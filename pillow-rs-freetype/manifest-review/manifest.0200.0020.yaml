- id: ftcache.FTC_Manager_New
  kind: function
  symbol: FTC_Manager_New
  header: freetype/ftcache.h
  description: FreeType C API function that creates a cache manager with face requester callback, MRU face/size limits, and byte cache budget.
  cases:
    - id: planned_cache_subsystem_not_out_of_scope
      description: Cache manager creation is planned public C replacement surface; if cache is excluded in an interim build, expose a deliberate unsupported policy rather than omitting it.
    - id: success_defaults_for_zero_limits
      description: Zero max_faces, max_sizes, and max_bytes are replaced with C default limits and produce a usable manager.
    - id: success_custom_limits_and_req_data
      description: Custom limits and req_data are stored and later passed unchanged to the requester.
    - id: error_null_library
      description: Null library returns Invalid_Library_Handle and does not write a manager.
    - id: error_null_requester_or_output
      description: Null requester or amanager returns Invalid_Argument and matches C output preservation behavior.
    - id: lifecycle_create_lookup_reset_done
      description: A created manager supports face/size/cache lookup, reset, remove-face-id, and done lifecycle in C-compatible order.
  # needs-input: operation=FTC_Manager_New followed by LookupFace/LookupSize/Reset/Done smoke; fixture_asset=input/fonts/DejaVuSans.ttf callback fixture; params max_faces/max_sizes/max_bytes as 0 defaults and small custom values, req_data sentinel pointer, null library, null requester, null amanager; output shape=FT_Error, FTC_Manager pointer null/non-null, callback argument log on later lookup, default-limit behavior classification, lifecycle event log; comparison=exact C oracle error, output write behavior, callback req_data identity, and lifecycle behavior.

- id: ftcache.FTC_Manager_RemoveFaceID
  kind: function
  symbol: FTC_Manager_RemoveFaceID
  header: freetype/ftcache.h
  description: FreeType C API function that tells a cache manager a persistent FTC_FaceID is invalid and flushes matching faces, sizes, and cache nodes.
  cases:
    - id: planned_cache_subsystem_not_out_of_scope
      description: RemoveFaceID is required cache lifecycle surface for safe persistent face IDs and must not be classified as out_of_scope.
    - id: success_removes_unreferenced_face_size_and_nodes
      description: Unreferenced cached faces, sizes, cmap entries, and image nodes for the face ID are removed and later lookups re-request the face.
    - id: success_referenced_nodes_hidden_until_unref
      description: Referenced nodes are not returned by later same-face lookups and are destroyed only after FTC_Node_Unref releases them.
    - id: success_other_face_ids_unchanged
      description: Removing one face ID does not disturb cached entries for other persistent face IDs.
    - id: success_null_manager_noop
      description: Null manager is accepted as a no-op void function.
    - id: success_null_or_unknown_face_id
      description: Null or unknown face IDs follow C's selection/removal behavior without corrupting existing cache state.
  # needs-input: operation=FTC_Manager_New, CMap/Image cache lookups, FTC_Manager_RemoveFaceID, repeated lookup, FTC_Node_Unref; fixture_asset=two persistent face_id callback fixtures using input/fonts/DejaVuSans.ttf and another tracked font or mutated backing for same id; params face_id A/B, unknown face_id, null face_id, null manager, acquired image node with anode, remove while referenced, unref then cache pressure; output shape=void result plus requester invocation log, glyph/cmap results before/after removal, node pointer identity/ref lifecycle classification, surviving other-face cache results; comparison=exact C oracle cache invalidation, no-op behavior, node hiding/destroy-after-unref behavior, and other-face preservation.
