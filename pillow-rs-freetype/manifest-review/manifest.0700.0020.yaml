- id: ftoutln.FT_ORIENTATION_FILL_RIGHT
  kind: enum_variant
  symbol: FT_ORIENTATION_FILL_RIGHT
  header: freetype/ftoutln.h
  description: Public FT_Orientation alias for the TrueType fill-right convention.
  cases:
    - id: value_matches_header
      description: Value aliases FT_ORIENTATION_TRUETYPE and is 0 in the pinned C public header.
    - id: alias_matches_truetype_orientation
      description: C treats this value as the fill-right spelling of the same orientation returned for negative-area outlines.
  # needs-input: operation=constant_eval and FT_Outline_Get_Orientation; fixture_asset=synthetic clockwise and counter-clockwise outlines plus outline glyphs from tests/fixtures/input/fonts/DejaVuSans.ttf; params={outline_points, contours, tags}; expected output shape={constant_value, orientation_enum}; comparison=exact C oracle integer value and enum result.

- id: ftoutln.FT_ORIENTATION_NONE
  kind: enum_variant
  symbol: FT_ORIENTATION_NONE
  header: freetype/ftoutln.h
  description: Public FT_Orientation value used when C cannot determine a consistent fill direction.
  cases:
    - id: value_matches_header
      description: Value follows the two concrete orientations and is 2 in the pinned C public header.
    - id: returned_for_collapsed_or_zero_area
      description: FT_Outline_Get_Orientation returns this for collapsed cboxes and zero-area non-empty outlines.
    - id: returned_for_oversized_outline
      description: Outlines whose cbox exceeds the public orientation bound return NONE instead of overflowing the area calculation.
  # needs-input: operation=FT_Outline_Get_Orientation; fixture_asset=synthetic collapsed line, zero-area contour, and oversized outline binary records; params={points, tags, contours}; expected output shape={orientation_enum}; comparison=exact C oracle enum result.

- id: ftoutln.FT_ORIENTATION_POSTSCRIPT
  kind: enum_variant
  symbol: FT_ORIENTATION_POSTSCRIPT
  header: freetype/ftoutln.h
  description: Public FT_Orientation value for the PostScript fill-left convention.
  cases:
    - id: value_matches_header
      description: Value is 1 in the pinned C public header.
    - id: positive_area_returns_postscript
      description: FT_Outline_Get_Orientation returns POSTSCRIPT for outlines whose integrated area is positive.
  # needs-input: operation=FT_Outline_Get_Orientation; fixture_asset=synthetic positive-area outline plus CFF/PostScript outline glyphs where available; params={outline_points, tags, contours, optional font/glyph_index}; expected output shape={orientation_enum}; comparison=exact C oracle enum result.

- id: ftoutln.FT_ORIENTATION_TRUETYPE
  kind: enum_variant
  symbol: FT_ORIENTATION_TRUETYPE
  header: freetype/ftoutln.h
  description: Public FT_Orientation value for the TrueType fill-right convention.
  cases:
    - id: value_matches_header
      description: Value is 0 in the pinned C public header.
    - id: null_and_empty_return_truetype
      description: FT_Outline_Get_Orientation returns TRUETYPE for null outlines and outlines with no points.
    - id: negative_area_returns_truetype
      description: FT_Outline_Get_Orientation returns TRUETYPE for outlines whose integrated area is negative.
  # needs-input: operation=FT_Outline_Get_Orientation; fixture_asset=synthetic null/empty/negative-area outlines and TrueType glyph outlines from tests/fixtures/input/fonts/DejaVuSans.ttf; params={outline_pointer_class, points, tags, contours, glyph_index}; expected output shape={orientation_enum}; comparison=exact C oracle enum result.

- id: ftoutln.FT_Outline_Check
  kind: function
  symbol: FT_Outline_Check
  header: freetype/ftoutln.h
  description: Public outline descriptor validator for contour and point-count consistency.
  cases:
    - id: valid_empty_and_single_point
      description: Empty outlines and one-point single-contour outlines return FT_Err_Ok as C documents and implements.
    - id: valid_multi_contour_sequence
      description: Strictly increasing contour end indices ending at n_points-1 return success.
    - id: invalid_null_or_count_mismatch
      description: Null outlines, zero points with contours, zero contours with points, empty contours, repeated ends, and final-end mismatches return Invalid_Outline.
  # needs-input: operation=FT_Outline_Check; fixture_asset=synthetic outline records with valid empty, single-point, multi-contour, and malformed contour arrays; params={n_points, n_contours, contours}; expected output shape={FT_Error}; comparison=exact C oracle error code.

- id: ftoutln.FT_Outline_Copy
  kind: function
  symbol: FT_Outline_Copy
  header: freetype/ftoutln.h
  description: Public outline copy function for equal-sized source and target records.
  cases:
    - id: copies_arrays_and_flags
      description: Points, tags, contour ends, and source flags are copied exactly while preserving the target FT_OUTLINE_OWNER bit.
    - id: self_copy_noop
      description: Passing the same outline for source and target returns success without changing data.
    - id: invalid_pointer_or_size_mismatch
      description: Null source or target returns Invalid_Outline, while point or contour count mismatch returns Invalid_Argument.
  # needs-input: operation=FT_Outline_Copy; fixture_asset=synthetic outlines plus loaded glyph outlines from tests/fixtures/input/fonts/DejaVuSans.ttf; params={source_outline, target_outline, target_owner_flag}; expected output shape={FT_Error, target_points, target_tags, target_contours, target_flags}; comparison=exact C oracle arrays, flags, and error code.

- id: ftoutln.FT_Outline_Decompose
  kind: function
  symbol: FT_Outline_Decompose
  header: freetype/ftoutln.h
  description: Public outline walker that emits move, line, conic, and cubic callbacks.
  cases:
    - id: line_conic_cubic_event_order
      description: Callback event order and implied conic midpoint handling match C for line, quadratic, cubic, and multi-contour outlines.
    - id: shift_delta_applied_to_callbacks
      description: Callback coordinates use C's (coord << shift) - delta transform.
    - id: callback_error_propagates
      description: A non-zero callback return stops traversal and is returned unchanged.
    - id: invalid_outline_or_interface_errors
      description: Null outline returns Invalid_Outline, null callback interface returns Invalid_Argument, cubic-first contours and malformed cubic pairs return Invalid_Outline.
  # needs-input: operation=FT_Outline_Decompose; fixture_asset=synthetic line/conic/cubic/malformed outline binaries and CFF/TrueType glyph outlines; params={points, tags, contours, shift, delta, callback_failure_at}; expected output shape={FT_Error, ordered_callback_events}; comparison=exact C oracle events, transformed coordinates, and propagated error.

- id: ftoutln.FT_Outline_Done
  kind: function
  symbol: FT_Outline_Done
  header: freetype/ftoutln.h
  description: Public outline cleanup function for outlines allocated by FT_Outline_New or client-owned descriptors.
  cases:
    - id: owner_outline_frees_and_resets
      description: An outline with FT_OUTLINE_OWNER frees its arrays and is reset to the C null outline.
    - id: non_owner_outline_resets_only
      description: An outline without FT_OUTLINE_OWNER is reset without FreeType freeing client-owned point, tag, or contour buffers.
    - id: invalid_library_or_outline_errors
      description: Null library returns Invalid_Library_Handle and null outline returns Invalid_Outline.
  # needs-input: operation=FT_Outline_New followed by FT_Outline_Done and direct client-owned FT_Outline_Done; fixture_asset=no font needed, synthetic allocated and borrowed outline buffers; params={library_pointer_class, owner_flag, outline_pointer_class}; expected output shape={FT_Error, post_outline_record, allocation_event_log}; comparison=exact C oracle error code, null-outline fields, and free/no-free ownership behavior.

- id: ftoutln.FT_Outline_Embolden
  kind: function
  symbol: FT_Outline_Embolden
  header: freetype/ftoutln.h
  description: Public symmetric outline emboldening wrapper over FT_Outline_EmboldenXY.
  cases:
    - id: symmetric_strength_matches_xy
      description: Calling FT_Outline_Embolden(outline, strength) produces the same point deltas as FT_Outline_EmboldenXY(outline, strength, strength).
    - id: zero_strength_noop
      description: Strength values that halve to zero return success without changing outline points.
    - id: invalid_or_indeterminate_orientation_errors
      description: Null outlines return Invalid_Outline, and non-empty outlines whose orientation is NONE return Invalid_Argument.
  # needs-input: operation=FT_Outline_Embolden and FT_Outline_EmboldenXY; fixture_asset=TrueType and CFF outline glyphs plus synthetic zero-area outline; params={glyph_index, size, load_flags, strength}; expected output shape={FT_Error, mutated_points, cbox, orientation_before}; comparison=exact C oracle error code and 26.6 point/cbox values.

- id: ftoutln.FT_Outline_EmboldenXY
  kind: function
  symbol: FT_Outline_EmboldenXY
  header: freetype/ftoutln.h
  description: Public outline emboldening function with independent horizontal and vertical strength.
  cases:
    - id: anisotropic_strength_mutates_points
      description: Positive and negative x/y strengths mutate outline points according to C's orientation-aware lateral-bisector algorithm.
    - id: empty_outline_success
      description: Empty outlines whose orientation is NONE return success without point output.
    - id: invalid_orientation_or_null_errors
      description: Null outlines return Invalid_Outline and non-empty outlines with indeterminate orientation return Invalid_Argument.
  # needs-input: operation=FT_Outline_EmboldenXY; fixture_asset=outline glyphs with acute angles, composites, and synthetic empty/zero-area outlines; params={xstrength, ystrength, glyph_index, size, load_flags}; expected output shape={FT_Error, mutated_points, cbox}; comparison=exact C oracle error code and 26.6 point/cbox values.

- id: ftoutln.FT_Outline_Get_Bitmap
  kind: function
  symbol: FT_Outline_Get_Bitmap
  header: freetype/ftoutln.h
  description: Public convenience renderer that ORs an outline into a caller-provided bitmap.
  cases:
    - id: gray_lcd_modes_select_aa_flag
      description: GRAY, LCD, and LCD_V target pixel modes set FT_RASTER_FLAG_AA before delegating to FT_Outline_Render.
    - id: mono_target_uses_default_raster
      description: MONO targets render through the non-AA path and preserve C pitch and packed-bit output.
    - id: null_bitmap_and_delegate_errors
      description: Null bitmap returns Invalid_Argument; library, outline, oversized outline, or target-buffer errors match FT_Outline_Render and rasterizer behavior.
  # needs-input: operation=FT_Outline_Get_Bitmap; fixture_asset=outline glyphs from tests/fixtures/input/fonts/DejaVuSans.ttf and synthetic empty/oversized outlines; params={target_bitmap_fields, pixel_mode=[MONO,GRAY,LCD,LCD_V], glyph_index, size}; expected output shape={FT_Error, FT_Bitmap fields, buffer bytes/hash}; comparison=exact C oracle error code, bitmap descriptor, and output bytes.

- id: ftoutln.FT_Outline_Get_CBox
  kind: function
  symbol: FT_Outline_Get_CBox
  header: freetype/ftoutln.h
  description: Public control-box computation over all outline points.
  cases:
    - id: extrema_match_points
      description: xMin, yMin, xMax, and yMax are the exact extrema across all outline points including control points.
    - id: empty_outline_zero_box
      description: Outlines with zero points output a zero FT_BBox.
    - id: null_inputs_noop
      description: Null outline or null output box leaves the caller-provided output untouched as C does.
  # needs-input: operation=FT_Outline_Get_CBox; fixture_asset=synthetic positive/negative/control-point outlines and glyph outlines from tests/fixtures/input/fonts/DejaVuSans.ttf; params={points, tags, contours, initial_acbox}; expected output shape={FT_BBox fields or unchanged sentinel}; comparison=exact C oracle 26.6 extrema and null-input no-op behavior.

- id: ftoutln.FT_Outline_Get_Orientation
  kind: function
  symbol: FT_Outline_Get_Orientation
  header: freetype/ftoutln.h
  description: Public fill-orientation classifier based on the signed control-point polygon integral.
  cases:
    - id: null_empty_and_area_sign
      description: Null or empty outlines return TRUETYPE; negative area returns TRUETYPE; positive area returns POSTSCRIPT.
    - id: collapsed_and_oversized_return_none
      description: Collapsed cboxes, zero area, and cboxes outside +/-0x1000000 return NONE.
    - id: transformed_and_reversed_outlines
      description: FT_Outline_Reverse and sign-changing transforms flip the orientation result exactly as C reports.
  # needs-input: operation=FT_Outline_Get_Orientation after optional FT_Outline_Reverse/Transform; fixture_asset=synthetic oriented outlines and loaded glyph outlines from tests/fixtures/input/fonts/DejaVuSans.ttf; params={points, contours, transform_matrix, reverse_before_check}; expected output shape={orientation_enum}; comparison=exact C oracle enum result.

- id: ftoutln.FT_Outline_New
  kind: function
  symbol: FT_Outline_New
  header: freetype/ftoutln.h
  description: Public allocator for FT_Outline point, tag, and contour arrays.
  cases:
    - id: allocates_owner_outline
      description: Successful allocation zero-initializes the descriptor arrays, sets n_points and n_contours, and sets FT_OUTLINE_OWNER.
    - id: empty_outline_allocation
      description: Zero points and zero contours succeed with C-equivalent empty arrays/null pointers and owner flag behavior.
    - id: invalid_arguments_and_limits
      description: Null library, null output pointer, negative contour count, contours greater than points, and numPoints above FT_OUTLINE_POINTS_MAX return C-equivalent errors.
  # needs-input: operation=FT_Outline_New followed by FT_Outline_Check and FT_Outline_Done; fixture_asset=no font needed; params={numPoints, numContours, library_pointer_class, output_pointer_class}; expected output shape={FT_Error, FT_Outline fields, allocation_event_log}; comparison=exact C oracle error code, field values, owner flag, and cleanup behavior.

- id: ftoutln.FT_Outline_Render
  kind: function
  symbol: FT_Outline_Render
  header: freetype/ftoutln.h
  description: Public advanced outline renderer using FT_Raster_Params and the current outline renderer.
  cases:
    - id: bitmap_render_matches_c
      description: Non-direct rendering into a target bitmap matches C for pixel mode, pitch, dimensions, and bytes.
    - id: direct_render_clip_and_spans
      description: DIRECT rendering overwrites params.source with the outline and presets clip_box from cbox unless FT_RASTER_FLAG_CLIP is set, then emits C-equivalent spans.
    - id: renderer_fallback_and_errors
      description: Null library, null outline, null params, oversized cbox, invalid target, missing callbacks, and unsupported renderer modes return the same C error code.
  # needs-input: operation=FT_Outline_Render; fixture_asset=outline glyphs from tests/fixtures/input/fonts/DejaVuSans.ttf plus synthetic clipped, empty, malformed, and oversized outlines; params={FT_Raster_Params flags, target bitmap, gray_spans callback, clip_box}; expected output shape={FT_Error, mutated params.source, clip_box, bitmap bytes/hash, span event log}; comparison=exact C oracle fields, byte output/spans, and error code.

- id: ftoutln.FT_Outline_Reverse
  kind: function
  symbol: FT_Outline_Reverse
  header: freetype/ftoutln.h
  description: Public outline winding reversal helper that preserves each contour's first point.
  cases:
    - id: reverses_points_and_tags_per_contour
      description: For each contour, C keeps the first point fixed and reverses subsequent points and tags through the contour end.
    - id: toggles_reverse_fill_flag
      description: The FT_OUTLINE_REVERSE_FILL bit is toggled on each call while other flags are preserved.
    - id: null_outline_noop
      description: Passing a null outline performs no operation and reports no error because the function returns void.
  # needs-input: operation=FT_Outline_Reverse; fixture_asset=synthetic multi-contour line/conic/cubic outlines and loaded glyph outlines; params={points, tags, contours, flags, repeat_count}; expected output shape={mutated points, tags, contours, flags, orientation_before_after}; comparison=exact C oracle arrays, flags, and orientation result.

- id: ftoutln.FT_Outline_Transform
  kind: function
  symbol: FT_Outline_Transform
  header: freetype/ftoutln.h
  description: Public 2x2 fixed-point matrix transform applied to every outline point.
  cases:
    - id: matrix_transform_matches_c
      description: Identity, scale, rotation, shear, reflection, and negative matrices mutate all points using FT_Vector_Transform semantics.
    - id: null_inputs_noop
      description: Null outline, null matrix, or null outline->points returns without changing any observable data.
    - id: orientation_and_cbox_after_transform
      description: Transforms that reflect or shear outlines produce C-equivalent cbox and orientation changes.
  # needs-input: operation=FT_Outline_Transform followed by FT_Outline_Get_CBox and FT_Outline_Get_Orientation; fixture_asset=synthetic outlines and glyph outlines from tests/fixtures/input/fonts/DejaVuSans.ttf; params={matrix, points, null_pointer_variant}; expected output shape={mutated points, FT_BBox, orientation_enum}; comparison=exact C oracle 26.6 coordinates, cbox, orientation, and no-op behavior.

- id: ftoutln.FT_Outline_Translate
  kind: function
  symbol: FT_Outline_Translate
  header: freetype/ftoutln.h
  description: Public point-wise outline translation helper.
  cases:
    - id: offsets_all_points
      description: Every outline point is translated by xOffset and yOffset using C's ADD_LONG behavior.
    - id: empty_outline_success_noop
      description: Empty outlines remain empty and unchanged.
    - id: null_outline_noop
      description: Passing a null outline performs no operation because the function returns void.
  # needs-input: operation=FT_Outline_Translate followed by FT_Outline_Get_CBox; fixture_asset=synthetic outlines and loaded glyph outlines with positive and negative coordinates; params={xOffset, yOffset, points, null_pointer_variant}; expected output shape={mutated points, FT_BBox}; comparison=exact C oracle 26.6 coordinates, cbox, and no-op behavior.

- id: ftparams.FT_PARAM_TAG_IGNORE_PREFERRED_FAMILY
  kind: tag
  symbol: FT_PARAM_TAG_IGNORE_PREFERRED_FAMILY
  header: freetype/ftparams.h
  description: Deprecated public alias for FT_PARAM_TAG_IGNORE_TYPOGRAPHIC_FAMILY used with FT_Open_Face parameters.
  cases:
    - id: value_matches_header
      description: Value aliases FT_PARAM_TAG_IGNORE_TYPOGRAPHIC_FAMILY and expands to FT_MAKE_TAG('i','g','p','f').
    - id: open_face_ignores_typographic_family
      description: When passed to FT_Open_Face, C skips name ID 16 for face->family_name and falls back to the legacy family name path.
    - id: absent_or_unknown_param_uses_default_family
      description: Without this tag, or with unrelated tags, C keeps normal typographic/WWS family selection behavior.
  # needs-input: operation=FT_Open_Face with FT_Open_Args.params then inspect FT_FaceRec.family_name; fixture_asset=tests/fixtures/input/fonts/names/ot14-preferred-family.ttf with distinct name IDs 1 and 16 plus a control font lacking name ID 16; params={tags=[none,FT_PARAM_TAG_IGNORE_PREFERRED_FAMILY,unknown], face_index}; expected output shape={FT_Error, family_name string, style_name string}; comparison=exact C oracle error code and selected public face names.

- id: ftparams.FT_PARAM_TAG_IGNORE_PREFERRED_SUBFAMILY
  kind: tag
  symbol: FT_PARAM_TAG_IGNORE_PREFERRED_SUBFAMILY
  header: freetype/ftparams.h
  description: Deprecated public alias for FT_PARAM_TAG_IGNORE_TYPOGRAPHIC_SUBFAMILY used with FT_Open_Face parameters.
  cases:
    - id: value_matches_header
      description: Value aliases FT_PARAM_TAG_IGNORE_TYPOGRAPHIC_SUBFAMILY and expands to FT_MAKE_TAG('i','g','p','s').
    - id: open_face_ignores_typographic_subfamily
      description: When passed to FT_Open_Face, C skips name ID 17 for face->style_name and falls back to the legacy subfamily name path.
    - id: combined_family_and_subfamily_params
      description: Supplying both deprecated preferred-name tags applies both family and subfamily fallback decisions independently.
  # needs-input: operation=FT_Open_Face with FT_Open_Args.params then inspect FT_FaceRec.family_name/style_name; fixture_asset=tests/fixtures/input/fonts/names/ot14-preferred-family.ttf with distinct name IDs 1,2,16,17 plus a control font lacking name ID 17; params={tags=[none,FT_PARAM_TAG_IGNORE_PREFERRED_SUBFAMILY,both_preferred_aliases], face_index}; expected output shape={FT_Error, family_name string, style_name string}; comparison=exact C oracle error code and selected public face names.
