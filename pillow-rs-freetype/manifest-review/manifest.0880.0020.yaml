- id: t1tables.T1_BLEND_UNDERLINE_POSITION
  kind: enum_variant
  symbol: T1_BLEND_UNDERLINE_POSITION
  header: freetype/t1tables.h
  description: Public T1_Blend_Flags enum variant for the underline position blend dictionary field in Type 1 Multiple Master fonts.
  cases:
    - id: value_matches_header
      description: Value is exactly 0 in the pinned C header.
    - id: import_contract
      description: C clients can import freetype/t1tables.h and use T1_BLEND_UNDERLINE_POSITION as a T1_Blend_Flags value.
    - id: blend_dictionary_runtime
      description: Multiple Master Type 1 parsing uses this slot to indicate underline position blend data when present.
  # needs-input: operation=load Adobe Type 1 Multiple Master face and inspect blend dictionary/public MM variation behavior; fixture_asset=deterministic PFA/PFB MM font with blended UnderlinePosition; params={design_vector, dictionary_key=UnderlinePosition}; expected output shape={enum_value, blend presence bit, resulting font_info.underline_position}; comparison=exact C oracle value and resulting PS_FontInfoRec field.

