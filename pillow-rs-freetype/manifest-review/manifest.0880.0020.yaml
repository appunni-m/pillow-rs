- id: t1tables.FT_Get_PS_Font_Info
  kind: function
  symbol: FT_Get_PS_Font_Info
  header: freetype/t1tables.h
  description: Public API that retrieves PS_FontInfoRec for PostScript-backed faces through the POSTSCRIPT_INFO service.
  cases:
    - id: signature_matches_header
      description: Public declaration is FT_Error FT_Get_PS_Font_Info(FT_Face face, PS_FontInfo afont_info).
    - id: type1_success_copies_font_info
      description: For Type 1 faces, C copies the face font_info record and returns FT_Err_Ok, preserving string pointer ownership as face-owned data.
    - id: cff_cid_type42_supported_formats
      description: CFF, CID Type 1, and Type 42 faces expose the service when supported, with CFF2 returning Invalid_Argument.
    - id: non_postscript_or_missing_service_invalid_argument
      description: Non-PostScript faces and faces without ps_get_font_info return FT_Err_Invalid_Argument.
    - id: null_face_and_null_output_errors
      description: Null face returns FT_Err_Invalid_Face_Handle, while null afont_info returns FT_Err_Invalid_Argument before service lookup.
  # needs-input: operation=FT_Get_PS_Font_Info; fixture_asset=Type1, CFF, CID, Type42, CFF2 or equivalent, TrueType non-PS, and null-handle harness cases; params={font, face_index, output_pointer_mode}; expected output shape={FT_Error, PS_FontInfoRec fields, owned-string snapshot/nulls}; comparison=exact C oracle error code and copied record fields.

- id: t1tables.FT_Get_PS_Font_Private
  kind: function
  symbol: FT_Get_PS_Font_Private
  header: freetype/t1tables.h
  description: Public API that retrieves PS_PrivateRec for Type 1 faces through the POSTSCRIPT_INFO service.
  cases:
    - id: signature_matches_header
      description: Public declaration is FT_Error FT_Get_PS_Font_Private(FT_Face face, PS_Private afont_private).
    - id: type1_success_copies_private_dict
      description: For Type 1 faces, C copies the face private_dict record and returns FT_Err_Ok.
    - id: unsupported_postscript_formats_invalid_argument
      description: CFF, CID Type 1, and Type 42 expose no ps_get_font_private service in the pinned source and return FT_Err_Invalid_Argument.
    - id: non_postscript_or_missing_service_invalid_argument
      description: Non-PostScript faces and faces without the private-dictionary service return FT_Err_Invalid_Argument.
    - id: null_face_and_null_output_errors
      description: Null face returns FT_Err_Invalid_Face_Handle, while null afont_private returns FT_Err_Invalid_Argument before service lookup.
  # needs-input: operation=FT_Get_PS_Font_Private; fixture_asset=Type1 with populated Private dictionary, CFF/CID/Type42, TrueType non-PS, and null-handle harness cases; params={font, face_index, output_pointer_mode}; expected output shape={FT_Error, PS_PrivateRec fields}; comparison=exact C oracle error code and copied record fields.

- id: t1tables.FT_Get_PS_Font_Value
  kind: function
  symbol: FT_Get_PS_Font_Value
  header: freetype/t1tables.h
  description: Public API that retrieves individual PostScript dictionary values by PS_Dict_Keys, returning required byte length or zero when unavailable.
  cases:
    - id: signature_matches_header
      description: Public declaration is FT_Long FT_Get_PS_Font_Value(FT_Face face, PS_Dict_Keys key, FT_UInt idx, void* value, FT_Long value_len).
    - id: type1_scalar_string_and_array_values
      description: Type 1 service returns required byte counts and copies scalar, string, matrix, bbox, encoding, charstring, subr, FontInfo, and Private values when the output buffer is large enough.
    - id: sizing_query_and_short_buffer
      description: Null value or too-small value_len returns the required byte count without copying, and negative value_len is treated as zero by the Type 1 service.
    - id: invalid_key_or_index_returns_zero
      description: Unsupported keys, out-of-range array indexes, absent strings, and unavailable dictionary entries return 0 rather than a FreeType error code.
    - id: non_type1_or_missing_service_returns_zero
      description: Null face, non-PostScript faces, and PostScript services without ps_get_font_value return 0 from the public wrapper.
  # needs-input: operation=FT_Get_PS_Font_Value over representative PS_Dict_Keys; fixture_asset=Type1 font with known dictionary values, custom Encoding array, subrs/charstrings, plus CFF/CID/Type42/TrueType controls; params={font, key, idx, value_len, value_pointer_mode}; expected output shape={FT_Long required_len_or_zero, copied typed value bytes, untouched-buffer sentinel}; comparison=exact C oracle length and copied byte payload.

- id: t1tables.FT_Has_PS_Glyph_Names
  kind: function
  symbol: FT_Has_PS_Glyph_Names
  header: freetype/t1tables.h
  description: Public API that reports whether glyph names returned for a face are reliable PostScript glyph names.
  cases:
    - id: signature_matches_header
      description: Public declaration is FT_Int FT_Has_PS_Glyph_Names(FT_Face face).
    - id: type1_and_type42_return_true
      description: Type 1 and Type 42 service implementations in the pinned source return 1.
    - id: cff_follows_face_flag
      description: CFF returns whether FT_FACE_FLAG_GLYPH_NAMES is set on the face.
    - id: cid_true_type_and_null_return_false
      description: CID service has no ps_has_glyph_names callback, TrueType without the service returns 0, and a null face also returns 0.
  # needs-input: operation=FT_Has_PS_Glyph_Names; fixture_asset=Type1, Type42, CFF with/without glyph-name flag, CID Type1, TrueType, and null-handle harness cases; params={font, face_index}; expected output shape={FT_Int result}; comparison=exact C oracle integer result.

- id: t1tables.T1_FontInfo
  kind: type
  symbol: T1_FontInfo
  header: freetype/t1tables.h
  description: Deprecated public typedef alias for PS_FontInfoRec retained for Type 1 compatibility.
  cases:
    - id: alias_defined
      description: T1_FontInfo is typedefed to PS_FontInfoRec in the pinned C public header.
    - id: layout_alias_matches_ps_font_info
      description: Size, alignment, and field offsets are identical to PS_FontInfoRec because the alias names the same record type.
    - id: import_contract
      description: C clients can import freetype/t1tables.h and declare T1_FontInfo values without including private headers.
  # needs-input: operation=C ABI layout probe for T1_FontInfo and PS_FontInfoRec plus FT_Get_PS_Font_Info output decode; fixture_asset=Type1/CFF font with populated FontInfo strings and numeric fields; params={font}; expected output shape={sizeof, alignof, field_offsets, copied field values}; comparison=exact C ABI layout and public function output.

