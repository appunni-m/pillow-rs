# Reviewed replacement entries for tests/manifest.yaml subjects[140..160).
# Sources: freetype/include/freetype/freetype.h, freetype/src/base/ftcalc.c,
# freetype/src/base/ftobjs.c, and freetype/src/base/ftoutln.c.
- id: freetype.FT_MulFix
  kind: function
  symbol: FT_MulFix
  header: freetype/freetype.h
  description: FreeType C API function that multiplies an integer value by a 16.16 fixed-point factor with FreeType rounding.
  cases:
    - id: signed_scale_matches_c
      description: Positive and negative operands match the pinned C sign, rounding, and arithmetic-shift behavior.
    - id: second_argument_factor_cases
      description: Common scale factors in the second argument, including 0, 0x10000, fractional scales, and negative scales, match the C oracle.
    - id: large_operand_wraparound_matches_c
      description: Large-magnitude operands that exercise 32-bit FT_Long boundary behavior match the pinned C implementation.
  # needs-input: operation=FT_MulFix; fixture_asset=none; params operand pairs covering zero, +/-1, +/-64, +/-0x10000, fractional 16.16 factors, INT32_MIN/INT32_MAX-adjacent values, and asymmetric argument order; expected output shape=FT_Long result; comparison=exact pinned C numeric equality.

- id: freetype.FT_New_Face
  kind: function
  symbol: FT_New_Face
  header: freetype/freetype.h
  description: FreeType C API function that opens a face from a filesystem pathname by delegating to FT_Open_Face with FT_OPEN_PATHNAME.
  cases:
    - id: success_pathname_face
      description: Opening a valid pathname creates a face, glyph slot, active size, default Unicode charmap when present, and metadata matching the C oracle.
    - id: success_negative_face_index_probe
      description: A negative face_index probes supported font metadata, returning num_faces and named-instance count in style_flags without creating a normal glyph/size setup.
    - id: error_null_pathname
      description: A null pathname returns the pinned C invalid-argument classification.
    - id: error_null_library_or_aface
      description: Null library or required output face pointer errors match FT_Open_Face behavior.
    - id: error_missing_or_unknown_file
      description: Missing path, unreadable file, unsupported format, and out-of-range face index return the exact C error classification.
  # needs-input: operation=FT_New_Face; fixture_asset=input/fonts/DejaVuSans.ttf by pathname plus missing path and malformed bytes file; params face_index values 0, -1, out-of-range, and null pathname/library/aface variants; expected output shape=FT_Error, aface null/non-null, num_faces, face_index, family_name, style_name, face_flags, style_flags, num_charmaps, selected charmap encoding, glyph/size presence; comparison=exact C oracle status and scalar/string equality.

- id: freetype.FT_New_Memory_Face
  kind: function
  symbol: FT_New_Memory_Face
  header: freetype/freetype.h
  description: FreeType C API function that opens a face from caller-owned memory by delegating to FT_Open_Face with FT_OPEN_MEMORY.
  cases:
    - id: valid_font_bytes
      description: Accepts a tracked TrueType fixture from memory and creates face metadata, glyph slot, active size, and default Unicode charmap matching the C oracle.
      coverage:
        font_variability:
          folder: input/fonts
          sizes:
            - 20
    - id: success_negative_face_index_probe
      description: A negative face_index probes num_faces and named-instance count from memory without requiring normal face loading.
    - id: success_named_instance_index
      description: A variation font opened with named-instance bits in face_index exposes C-matching face_index, style_flags, and variation-related face_flags.
      coverage:
        font_variability:
          folder: deprecated/fonts_autohint
          sizes:
            - 20
    - id: error_null_file_base
      description: A null file_base returns the pinned C invalid-argument classification.
    - id: error_null_library_or_aface
      description: Null library or required output face pointer errors match FT_Open_Face behavior.
    - id: error_bad_size_or_unknown_format
      description: Negative/too-small sizes, malformed bytes, unsupported formats, and out-of-range face indexes return the exact C error classification.
  # needs-input: operation=FT_New_Memory_Face; fixture_asset=input/fonts/DejaVuSans.ttf bytes, deprecated/fonts_autohint/Ubuntu.ttf or another fvar font, malformed byte buffer; params face_index values 0, -1, named-instance encoded value, out-of-range, file_size values -1/0/valid, null library/file_base/aface variants; expected output shape=FT_Error, aface null/non-null, num_faces, face_index, family_name, style_name, face_flags, style_flags, num_charmaps, selected charmap encoding, glyph/size presence; comparison=exact C oracle status and scalar/string equality.

- id: freetype.FT_Open_Face
  kind: function
  symbol: FT_Open_Face
  header: freetype/freetype.h
  description: FreeType C API function that creates a face from FT_Open_Args, including memory, pathname, stream, driver, parameters, and negative face-index probe semantics.
  cases:
    - id: success_open_memory
      description: FT_OPEN_MEMORY opens valid font bytes and produces C-matching face metadata, glyph slot, active size, and selected charmap.
    - id: success_open_pathname
      description: FT_OPEN_PATHNAME opens a valid file path and produces the same public face state as the C oracle.
    - id: success_negative_face_index_probe
      description: Negative face_index returns supported-format probe metadata, including num_faces and named-instance count in style_flags.
    - id: success_open_variation_named_instance
      description: Named-instance bits in face_index for a variation font select the same instance and public face flags as C.
    - id: error_invalid_source_flags
      description: No source flag or multiple source flags in FT_Open_Args returns the exact C error and closes FT_OPEN_STREAM streams on error.
    - id: error_null_library_args_or_aface
      description: Null library, args, or required output face pointer cases match pinned C error behavior.
    - id: error_unknown_format_or_out_of_range_face
      description: Malformed sources, unsupported formats, forced incompatible driver, and out-of-range face indexes return the exact C error classification.
  # needs-input: operation=FT_Open_Face; fixture_asset=input/fonts/DejaVuSans.ttf as memory/path/custom FT_Stream, deprecated/fonts_autohint/Ubuntu.ttf or another fvar font, malformed byte buffer; params FT_Open_Args flags FT_OPEN_MEMORY, FT_OPEN_PATHNAME, FT_OPEN_STREAM, invalid multiple source flags, FT_OPEN_DRIVER compatible/incompatible, FT_OPEN_PARAMS with zero/recognized params, face_index 0/-1/named-instance/out-of-range, null library/args/aface variants; expected output shape=FT_Error, aface null/non-null, stream-close marker on error, num_faces, face_index, family_name, style_name, face_flags, style_flags, num_charmaps, selected charmap encoding, glyph/size presence; comparison=exact C oracle status, scalar/string equality, and stream lifecycle behavior.

- id: freetype.FT_Reference_Face
  kind: function
  symbol: FT_Reference_Face
  header: freetype/freetype.h
  description: FreeType C API function that increments a face's internal reference count so FT_Done_Face delays destruction.
  cases:
    - id: success_increments_refcount
      description: Referencing a live face succeeds, keeps the same face handle, and requires one additional FT_Done_Face before destruction.
    - id: success_multiple_references
      description: Multiple references require matching FT_Done_Face calls and preserve observable face state until the final release.
    - id: error_null_face
      description: Null face returns the pinned C invalid-face-handle classification.
  # needs-input: operation=FT_Reference_Face; fixture_asset=input/fonts/DejaVuSans.ttf bytes; params live FT_Face referenced once and twice, followed by repeated FT_Done_Face calls, plus null face; expected output shape=FT_Error statuses, same handle identity before final release, post-reference face scalar fields, and destruction timing marker; comparison=exact C oracle status and lifecycle sequence behavior without use-after-free reads.

- id: freetype.FT_Render_Glyph
  kind: function
  symbol: FT_Render_Glyph
  header: freetype/freetype.h
  description: FreeType C API function that converts a loaded glyph slot image to a bitmap using the selected render mode.
  cases:
    - id: supported_render_modes
      description: Renders a loaded glyph for supported FreeType render modes with C-matching bitmap metrics, pixel mode, pitch, placement, and bytes.
      coverage:
        font_variability:
          folder: input/fonts
          sizes:
            - 20
          char_codes:
            - 65
          load_flags:
            - 0
          render_modes:
            - 0
            - 1
    - id: invalid_render_mode
      description: Returns the expected FreeType error for an unsupported render mode without claiming bitmap-byte parity.
      coverage:
        font_variability:
          folder: input/fonts
          sizes:
            - 20
          char_codes:
            - 65
          load_flags:
            - 0
          render_modes:
            - 99
    - id: matrix_render
      description: Renders glyphs from the broad matrix fixture corpus for tracked fonts and sizes.
      coverage:
        font_variability:
          folder: deprecated/fonts_autohint
          sizes:
            - 10
            - 20
    - id: error_null_or_unowned_slot
      description: Null glyph slot, slot without face, or foreign slot handle returns the pinned C invalid-argument classification.
    - id: error_unloaded_or_unsupported_slot_format
      description: Unloaded glyph slots and unsupported glyph formats return the exact C renderer error classification.
  # needs-input: operation=FT_Render_Glyph; fixture_asset=input/fonts/DejaVuSans.ttf plus a color/SVG/SDF-capable font if those render paths are in scope; params glyph_index for 'A', size=20pt, load_flags covering default/no-hint/load-color where applicable, render_modes NORMAL/LIGHT/MONO/LCD/LCD_V/SDF/invalid, null slot and unloaded slot variants; expected output shape=FT_Error, slot format, bitmap pixel_mode, width, rows, pitch, bitmap_left, bitmap_top, advance, and bitmap bytes; comparison=exact C oracle status, scalar equality, and byte equality for successful bitmap render modes.

- id: freetype.FT_Request_Size
  kind: function
  symbol: FT_Request_Size
  header: freetype/freetype.h
  description: FreeType C API function that resizes the active FT_Size from an FT_Size_RequestRec without FT_Set_Char_Size zero normalization.
  cases:
    - id: success_nominal_request
      description: NOMINAL requests for scalable fonts update active size metrics exactly like the C oracle.
    - id: success_request_type_matrix
      description: REAL_DIM, BBOX, CELL, and SCALES request types produce C-matching x/y ppem, scales, ascender, descender, height, and max advance.
    - id: success_bitmap_request_match
      description: Bitmap-only or embedded-bitmap faces select or match strikes according to C driver behavior when applicable.
    - id: error_null_face_or_request
      description: Null face and null FT_Size_Request pointer return the pinned C error classifications.
    - id: error_invalid_request_or_unavailable_strike
      description: Invalid request type, invalid dimensions, or unmatched bitmap strike returns exact C errors and leaves observable active size behavior matching C.
  # needs-input: operation=FT_Request_Size; fixture_asset=input/fonts/DejaVuSans.ttf plus a bitmap-strike font; params FT_Size_RequestRec types NOMINAL/REAL_DIM/BBOX/CELL/SCALES/MAX, width/height zero/nonzero/fractional 26.6, direct 16.16 scales, dpi zero/nonzero/asymmetric, null face/req; expected output shape=FT_Error and active face->size->metrics x_ppem, y_ppem, x_scale, y_scale, ascender, descender, height, max_advance; comparison=exact C oracle status and metric equality after each request.

- id: freetype.FT_RoundFix
  kind: function
  symbol: FT_RoundFix
  header: freetype/freetype.h
  description: FreeType C API function that rounds a 16.16 fixed-point value to the nearest integral 16.16 value, with halfway cases away from zero.
  cases:
    - id: exact_integer_passthrough
      description: Integral 16.16 inputs, including zero and negative integers, are returned unchanged.
    - id: positive_fraction_rounds_nearest
      description: Positive fractional inputs round to nearest integral 16.16 value with halfway cases away from zero.
    - id: negative_fraction_rounds_nearest
      description: Negative fractional inputs round to nearest integral 16.16 value with halfway cases away from zero.
    - id: wraparound_matches_c
      description: Boundary values match the pinned C wrap-around arithmetic.
  # needs-input: operation=FT_RoundFix; fixture_asset=none; params 16.16 values 0, +/-1.0, +/-0.49998, +/-0.5, +/-0.50002, INT32_MIN/INT32_MAX-adjacent values; expected output shape=FT_Fixed result; comparison=exact pinned C numeric equality.

- id: freetype.FT_Select_Charmap
  kind: function
  symbol: FT_Select_Charmap
  header: freetype/freetype.h
  description: FreeType C API function that selects the best charmap for a requested FT_Encoding tag.
  cases:
    - id: success_select_unicode_best
      description: Selecting FT_ENCODING_UNICODE chooses the C-preferred Unicode charmap when multiple Unicode charmaps are present.
    - id: success_select_present_encoding
      description: Selecting a present non-Unicode or FT_ENCODING_NONE charmap updates face->charmap and later character lookup behavior like C.
    - id: error_null_face
      description: Null face returns the pinned C invalid-face-handle classification.
    - id: error_missing_encoding
      description: Missing encodings return the exact C invalid-argument classification without changing the active charmap.
  # needs-input: operation=FT_Select_Charmap; fixture_asset=input/fonts/DejaVuSans.ttf plus a font with multiple Unicode cmap subtables and a non-Unicode/FT_ENCODING_NONE control if available; params encodings FT_ENCODING_UNICODE, FT_ENCODING_NONE, FT_ENCODING_MS_SYMBOL or another present encoding, and absent tags; expected output shape=FT_Error, selected charmap index/platform_id/encoding_id/encoding, and FT_Get_Char_Index results for representative charcodes; comparison=exact C oracle status and scalar equality.

- id: freetype.FT_Select_Size
  kind: function
  symbol: FT_Select_Size
  header: freetype/freetype.h
  description: FreeType C API function that selects a bitmap strike and updates the active size metrics for that strike.
  cases:
    - id: success_select_bitmap_strike
      description: Selecting each available bitmap strike updates active size metrics and subsequent bitmap loading behavior like the C oracle.
    - id: success_embedded_bitmap_outline_fallback
      description: For outline fonts with embedded bitmaps, missing glyphs in a selected strike fall back or error according to C load flags.
    - id: error_no_fixed_sizes_or_null_face
      description: Null faces and faces without FT_FACE_FLAG_FIXED_SIZES return the pinned C invalid-face-handle classification.
    - id: error_strike_index_out_of_range
      description: Negative and too-large strike indexes return the pinned C invalid-argument classification.
  # needs-input: operation=FT_Select_Size; fixture_asset=font with CBLC/CBDT, EBLC/EBDT, bdat/bloc, or bitmap-only strikes plus input/fonts/DejaVuSans.ttf as no-strike control; params strike_index -1, 0, each valid index, and num_fixed_sizes; expected output shape=FT_Error, face->size->metrics fields, selected available_sizes row, optional FT_Load_Glyph bitmap slot fields for a present and missing glyph; comparison=exact C oracle status, metric equality, and bitmap byte equality where loading succeeds.

- id: freetype.FT_Set_Char_Size
  kind: function
  symbol: FT_Set_Char_Size
  header: freetype/freetype.h
  description: FreeType C API helper that normalizes point size and resolution inputs, then requests NOMINAL active size metrics.
  cases:
    - id: set_size
      description: Updates active size fields without error for tracked scalable fonts.
    - id: success_zero_dimension_and_resolution_normalization
      description: Zero width/height mirror the nonzero dimension, zero dpi mirrors the other dpi, and both zero dpi become 72dpi like C.
    - id: success_fractional_point_size_rounding
      description: Fractional 26.6 point sizes produce C-matching rounded ppem, scales, and active metrics.
    - id: error_null_face
      description: Null face returns the pinned C invalid-face-handle classification through FT_Request_Size.
    - id: error_invalid_or_unscalable_face
      description: Bitmap-only, malformed, or unsupported size requests return the exact C error classification.
  # needs-input: operation=FT_Set_Char_Size; fixture_asset=input/fonts/DejaVuSans.ttf plus bitmap-only/non-scalable fixture; params char_width/char_height values 0, 64, 20*64, fractional 20.5*64, asymmetric values, horz_resolution/vert_resolution 0/72/96/asymmetric, null face; expected output shape=FT_Error and active face->size->metrics x_ppem, y_ppem, x_scale, y_scale, ascender, descender, height, max_advance plus one loaded glyph metrics row; comparison=exact C oracle status and metric equality.

- id: freetype.FT_Set_Charmap
  kind: function
  symbol: FT_Set_Charmap
  header: freetype/freetype.h
  description: FreeType C API function that selects a specific charmap handle belonging to a face.
  cases:
    - id: success_set_face_charmap
      description: Setting each valid face-owned non-format-14 charmap updates face->charmap and subsequent character lookup behavior like C.
    - id: error_null_face
      description: Null face returns the pinned C invalid-face-handle classification.
    - id: error_null_or_foreign_charmap
      description: Null charmap or a charmap not listed in the face returns the exact C invalid-argument classification without changing the active charmap.
    - id: error_format14_charmap
      description: Selecting an OpenType format 14 variation-selector charmap fails like C because it does not map character codes to glyph indices.
  # needs-input: operation=FT_Set_Charmap; fixture_asset=input/fonts/DejaVuSans.ttf plus a font with cmap format 14 and a second face/font for a foreign charmap; params each face->charmaps entry, null charmap, foreign charmap, format-14 charmap; expected output shape=FT_Error, selected charmap index/platform_id/encoding_id/encoding, and FT_Get_Char_Index results for representative charcodes; comparison=exact C oracle status and scalar equality.

- id: freetype.FT_Set_Pixel_Sizes
  kind: function
  symbol: FT_Set_Pixel_Sizes
  header: freetype/freetype.h
  description: FreeType C API helper that normalizes pixel dimensions, clamps them to FreeType limits, and requests NOMINAL active size metrics.
  cases:
    - id: set_pixel_size
      description: Updates active pixel dimensions without error for tracked scalable fonts.
    - id: success_zero_dimension_normalization
      description: Zero width or height mirrors the nonzero dimension, and both zero dimensions clamp to one pixel like C.
    - id: success_large_dimension_clamp
      description: Pixel dimensions at or above 0xFFFF clamp to the pinned C maximum before requesting metrics.
    - id: error_null_face
      description: Null face returns the pinned C invalid-face-handle classification through FT_Request_Size.
    - id: error_invalid_or_unscalable_face
      description: Bitmap-only, malformed, or unsupported size requests return the exact C error classification.
  # needs-input: operation=FT_Set_Pixel_Sizes; fixture_asset=input/fonts/DejaVuSans.ttf plus bitmap-only/non-scalable fixture; params pixel_width/pixel_height values 0, 1, 10, 20, asymmetric values, 0xFFFF, 0x10000, null face; expected output shape=FT_Error and active face->size->metrics x_ppem, y_ppem, x_scale, y_scale, ascender, descender, height, max_advance plus one loaded glyph metrics row; comparison=exact C oracle status and metric equality.

- id: freetype.FT_Set_Transform
  kind: function
  symbol: FT_Set_Transform
  header: freetype/freetype.h
  description: FreeType C API function that stores a face-scoped matrix and delta applied to future scalable glyph loads and advances.
  cases:
    - id: success_identity_and_null_transform
      description: Null matrix and delta reset to identity matrix and zero vector like the C source.
    - id: success_matrix_and_delta_transform
      description: Rotation, scale, shear, and translation transforms affect future glyph outline/bitmap placement and advance while leaving glyph metrics behavior matching C.
    - id: success_null_face_noop
      description: Null face is a no-op with no returned error because the C API returns void.
    - id: load_ignore_transform_behavior
      description: FT_LOAD_IGNORE_TRANSFORM suppresses the stored transform during glyph loading like C.
  # needs-input: operation=FT_Set_Transform followed by FT_Load_Glyph and FT_Render_Glyph; fixture_asset=input/fonts/DejaVuSans.ttf; params matrix NULL/identity/scale/rotate/shear, delta NULL/{x,y}, size=20pt, glyph_index for 'A', load_flags default and FT_LOAD_IGNORE_TRANSFORM; expected output shape=slot outline cbox/bbox, advance vector, bitmap placement, bitmap dimensions, and bytes after render; comparison=exact C oracle scalar and byte equality, with null-face call verified as no-op/no-crash.

- id: freetype.FT_Vector_Transform
  kind: function
  symbol: FT_Vector_Transform
  header: freetype/freetype.h
  description: FreeType C API function that transforms one FT_Vector through a 2x2 FT_Matrix using FT_MulFix for each product.
  cases:
    - id: success_identity_scale_rotate_shear
      description: Identity, scale, rotate, and shear matrices update vector coordinates exactly like the C FT_MulFix-based implementation.
    - id: success_signed_and_fractional_values
      description: Positive, negative, and fractional 16.16 matrix coefficients match C rounding and addition behavior.
    - id: null_vector_or_matrix_noop
      description: Null vector or null matrix is a no-op in the pinned C implementation.
    - id: overflow_wraparound_matches_c
      description: Large vector and matrix values match the C implementation's FT_Long arithmetic behavior.
  # needs-input: operation=FT_Vector_Transform; fixture_asset=none; params vectors with zero, positive, negative, and INT32-adjacent coordinates; matrices identity, zero, scale, rotation approximation, shear, negative coefficients, and overflow-prone coefficients; expected output shape=mutated FT_Vector x/y or unchanged sentinel for null vector/matrix; comparison=exact pinned C numeric equality.

- id: freetype.FT_HAS_COLOR
  kind: macro
  symbol: FT_HAS_COLOR
  header: freetype/freetype.h
  description: FreeType public macro that returns true iff FT_FaceRec.face_flags contains FT_FACE_FLAG_COLOR.
  cases:
    - id: face_flags_bit_probe
      description: Macro result is exactly the boolean value of the FT_FACE_FLAG_COLOR bit in face_flags.
    - id: color_font_semantics
      description: Fonts with COLR/CPAL, CBDT/CBLC, sbix, or SVG color data report the same color capability as the C oracle.
    - id: outline_control_false
      description: Ordinary outline fonts without color glyph tables, such as DejaVuSans.ttf, report false like C.
  # needs-input: operation=FT_HAS_COLOR; fixture_asset=color font with COLR/CPAL, CBDT/CBLC, sbix, or SVG table plus input/fonts/DejaVuSans.ttf control; params live FT_Face after FT_New_Memory_Face; expected output shape=FT_Bool macro value and raw face_flags FT_FACE_FLAG_COLOR bit; comparison=exact C oracle boolean and bit equality.

- id: freetype.FT_HAS_FAST_GLYPHS
  kind: macro
  symbol: FT_HAS_FAST_GLYPHS
  header: freetype/freetype.h
  description: Deprecated FreeType public macro that is pinned to constant false in freetype/freetype.h.
  cases:
    - id: constant_false
      description: Macro result is 0 for every face because the pinned public header defines FT_HAS_FAST_GLYPHS(face) as 0.
    - id: ignores_face_flags
      description: The macro does not inspect FT_FACE_FLAG_FAST_GLYPHS or any other face_flags bit.
  # needs-input: operation=FT_HAS_FAST_GLYPHS; fixture_asset=input/fonts/DejaVuSans.ttf plus synthetic C-side face_flags values if ABI test can construct an FT_FaceRec; params live face and face_flags with/without FT_FACE_FLAG_FAST_GLYPHS; expected output shape=FT_Bool/int macro value; comparison=exact C header macro value 0 for all inputs.

- id: freetype.FT_HAS_FIXED_SIZES
  kind: macro
  symbol: FT_HAS_FIXED_SIZES
  header: freetype/freetype.h
  description: FreeType public macro that returns true iff FT_FaceRec.face_flags contains FT_FACE_FLAG_FIXED_SIZES.
  cases:
    - id: face_flags_bit_probe
      description: Macro result is exactly the boolean value of the FT_FACE_FLAG_FIXED_SIZES bit in face_flags.
    - id: bitmap_strike_font_true
      description: Fonts with embedded bitmap strikes report true and expose matching num_fixed_sizes and available_sizes metadata.
    - id: scalable_outline_control_false
      description: Scalable outline fonts without bitmap strikes report false like C.
  # needs-input: operation=FT_HAS_FIXED_SIZES; fixture_asset=font with CBLC/CBDT, EBLC/EBDT, bdat/bloc, or bitmap-only strikes plus input/fonts/DejaVuSans.ttf control; params live FT_Face after FT_New_Memory_Face; expected output shape=FT_Bool macro value, raw face_flags FT_FACE_FLAG_FIXED_SIZES bit, num_fixed_sizes, available_sizes rows; comparison=exact C oracle boolean, bit, and strike metadata equality.

- id: freetype.FT_HAS_GLYPH_NAMES
  kind: macro
  symbol: FT_HAS_GLYPH_NAMES
  header: freetype/freetype.h
  description: FreeType public macro that returns true iff FT_FaceRec.face_flags contains FT_FACE_FLAG_GLYPH_NAMES.
  cases:
    - id: face_flags_bit_probe
      description: Macro result is exactly the boolean value of the FT_FACE_FLAG_GLYPH_NAMES bit in face_flags.
    - id: glyph_names_font_true
      description: A font with accessible glyph names reports true and FT_Get_Glyph_Name/FT_Get_Name_Index behavior matches C.
      coverage:
        font_variability:
          folder: input/fonts
          sizes:
            - 20
    - id: no_glyph_names_control_false
      description: A font without accessible glyph names reports false and glyph-name APIs fail or return zero like C.
  # needs-input: operation=FT_HAS_GLYPH_NAMES; fixture_asset=input/fonts/DejaVuSans.ttf plus a font without post/CFF glyph names; params live FT_Face and representative glyph indexes/names; expected output shape=FT_Bool macro value, raw face_flags FT_FACE_FLAG_GLYPH_NAMES bit, FT_Get_Glyph_Name status/name, FT_Get_Name_Index result; comparison=exact C oracle boolean, bit, status, and string/index equality.

- id: freetype.FT_HAS_HORIZONTAL
  kind: macro
  symbol: FT_HAS_HORIZONTAL
  header: freetype/freetype.h
  description: FreeType public macro that returns true iff FT_FaceRec.face_flags contains FT_FACE_FLAG_HORIZONTAL.
  cases:
    - id: face_flags_bit_probe
      description: Macro result is exactly the boolean value of the FT_FACE_FLAG_HORIZONTAL bit in face_flags.
    - id: horizontal_metrics_font_true
      description: Supported SFNT outline fonts with hhea/hmtx horizontal metrics, such as DejaVuSans.ttf, report true and expose C-matching horizontal advances.
      coverage:
        font_variability:
          folder: input/fonts
          sizes:
            - 20
    - id: no_horizontal_metrics_control
      description: Any fixture format lacking horizontal metrics reports the same false or synthesized behavior as the C oracle.
  # needs-input: operation=FT_HAS_HORIZONTAL; fixture_asset=input/fonts/DejaVuSans.ttf plus any available nonstandard/bitmap fixture without horizontal metrics if the pinned C driver supports one; params live FT_Face and representative glyph indexes after FT_Set_Char_Size; expected output shape=FT_Bool macro value, raw face_flags FT_FACE_FLAG_HORIZONTAL bit, hhea/hmtx-derived face metrics, and loaded glyph horizontal advance metrics; comparison=exact C oracle boolean, bit, and metric equality.
