- id: ttnameid.TT_UCR_BOX_DRAWING
  kind: constant
  symbol: TT_UCR_BOX_DRAWING
  header: freetype/ttnameid.h
  description: Public OS/2 ulUnicodeRange2 bit mask for Box Drawing; pinned FreeType defines it as 1UL << 11, value 2048.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 2048 as defined by pinned freetype/ttnameid.h.
    - id: public_import_contract
      description: A C translation unit including <freetype/ttnameid.h> can reference TT_UCR_BOX_DRAWING as a preprocessor-visible public constant.
    - id: representative_os2_unicode_range_bit
      description: A representative SFNT fixture with Box Drawing coverage exposes TT_OS2.ulUnicodeRange2 with the TT_UCR_BOX_DRAWING bit set exactly as the C oracle reports.
  # needs-input: operation=FT_Get_Sfnt_Table; fixture_asset=input/fonts/os2/ucr-box-drawing.ttf; params={sfnt_table=FT_SFNT_OS2}; expected output shape={FT_Error, TT_OS2.ulUnicodeRange1, TT_OS2.ulUnicodeRange2, TT_OS2.ulUnicodeRange3, TT_OS2.ulUnicodeRange4}; comparison=exact C oracle status and 32-bit OS/2 unicode-range fields.

