- id: ftcolor.FT_PaintRadialGradient
  kind: record
  symbol: FT_PaintRadialGradient
  header: freetype/ftcolor.h
  description: FreeType public COLR v1 PaintRadialGradient record from freetype/ftcolor.h.
  cases:
    - id: layout_matches_c
      description: Size, alignment, and field offsets for colorline, c0, r0, c1, and r1 match the pinned C header.
    - id: field_order_matches_c
      description: Field order is colorline, c0, r0, c1, r1 exactly, with centers as FT_Vector and radii as 16.16 FT_Pos values.
    - id: get_paint_radial_gradient_values
      description: FT_Get_Paint returns ColorLine plus c0/r0/c1/r1 values exactly as C, including variable COLR v1 interpolation when available.
  # needs-input: operation=FT_Get_Color_Glyph_Paint, FT_Get_Paint, and FT_Get_Colorline_Stops; fixture_asset=COLR v1 font with static and variable PaintRadialGradient records covering equal centers, distinct centers, r0=0, r1=0, r0<r1, r0>r1, negative coordinates, and nested transforms; params resolve gradients under default and varied design coordinates, then iterate color stops; expected output shape=FT_COLR_Paint { format=FT_COLR_PAINTFORMAT_RADIAL_GRADIENT, u.radial_gradient { colorline { extend, color_stop_iterator }, c0, r0, c1, r1 } } plus FT_ColorStop sequence; comparison=exact C oracle format, 16.16 center/radius fields, colorline iterator fields, color stop sequence, variable interpolation, and output preservation on malformed/truncated gradient data.

