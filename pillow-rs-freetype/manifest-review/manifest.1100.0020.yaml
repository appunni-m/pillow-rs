- id: ttnameid.TT_UCR_HALFWIDTH_FULLWIDTH_FORMS
  kind: constant
  symbol: TT_UCR_HALFWIDTH_FULLWIDTH_FORMS
  header: freetype/ttnameid.h
  description: Public OS/2 Unicode-range bit macro for Halfwidth and Fullwidth Forms; pinned FreeType defines it as (1UL << 4) for U+FF00-U+FFEF.
  cases:
    - id: value_matches_header
      description: Macro expression is exactly (1UL << 4) as defined by pinned freetype/ttnameid.h.
    - id: public_import_contract
      description: A C translation unit including <freetype/ttnameid.h> can reference TT_UCR_HALFWIDTH_FULLWIDTH_FORMS as a public preprocessor constant.
    - id: representative_os2_unicode_range_match
      description: A representative font with Halfwidth and Fullwidth Forms coverage reports the matching OS/2 unicode-range bit through the same fields as the C oracle.
  # needs-input: operation=FT_Get_Sfnt_Table(face, ft_sfnt_os2); fixture_asset=input/fonts/os2-ranges/halfwidth-fullwidth.ttf; params={codepoints=[U+FF01, U+FF66]}; expected output shape={FT_Error, has_os2_table, ulUnicodeRange1, ulUnicodeRange2, ulUnicodeRange3, ulUnicodeRange4}; comparison=exact C oracle status and OS/2 unicode-range fields.

