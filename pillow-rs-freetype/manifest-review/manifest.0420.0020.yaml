- id: fterrors.FT_ERROR_END_LIST
  kind: macro
  symbol: FT_ERROR_END_LIST
  header: freetype/fterrors.h
  description: Public error-list hook macro consumed by freetype/fterrors.h after including fterrdef.h; the default enum-mode definition appends FT_ERR_CAT(FT_ERR_PREFIX, Max) and closes the enum.
  cases:
    - id: default_enum_closes_with_max
      description: With FT_ERRORDEF undefined, fterrors.h defines FT_ERROR_END_LIST as the enum terminator FT_ERR_CAT(FT_ERR_PREFIX, Max) followed by the closing brace and semicolon.
    - id: custom_error_string_table_end
      description: When a client predefines FT_ERROR_END_LIST before including fterrors.h, the macro is invoked after all FT_ERRORDEF entries and then undefined by fterrors.h cleanup.
  # needs-input: operation=C preprocessor/compile fixture; fixture_asset=small C translation unit redefining FTERRORS_H_, FT_ERRORDEF, FT_ERROR_START_LIST, and FT_ERROR_END_LIST around #include <freetype/fterrors.h>; params={custom end macro emits sentinel row}; output shape={compiled table/switch or preprocessed token stream}; comparison=exact C preprocessor expansion order and cleanup undef behavior.

- id: fterrors.FT_ERROR_START_LIST
  kind: macro
  symbol: FT_ERROR_START_LIST
  header: freetype/fterrors.h
  description: Public error-list hook macro consumed by freetype/fterrors.h before the generated fterrdef.h entries; the default enum-mode definition opens the FT_Err_ enumeration.
  cases:
    - id: default_enum_opens_error_list
      description: With FT_ERRORDEF undefined, fterrors.h defines FT_ERROR_START_LIST as enum { before including the pinned fterrdef.h list.
    - id: custom_error_string_table_start
      description: When a client predefines FT_ERROR_START_LIST before including fterrors.h, the macro is invoked before all FT_ERRORDEF entries and then undefined by fterrors.h cleanup.
  # needs-input: operation=C preprocessor/compile fixture; fixture_asset=small C translation unit redefining FTERRORS_H_, FT_ERRORDEF, FT_ERROR_START_LIST, and FT_ERROR_END_LIST around #include <freetype/fterrors.h>; params={custom start macro emits array/switch opener}; output shape={compiled table/switch or preprocessed token stream}; comparison=exact C preprocessor expansion order and cleanup undef behavior.

- id: fterrors.FT_ERR_BASE
  kind: macro
  symbol: FT_ERR_BASE
  header: freetype/fterrors.h
  description: Error-base setup macro used by freetype/fterrors.h to add module-specific offsets to FT_ERRORDEF_ values before the macro is undefined during header cleanup.
  cases:
    - id: default_base_zero
      description: In the pinned public configuration where FT_CONFIG_OPTION_USE_MODULE_ERRORS is undefined, fterrors.h undefines any incoming FT_ERR_BASE and sets FT_ERR_BASE to 0 while expanding fterrdef.h.
    - id: module_errors_base
      description: With FT_CONFIG_OPTION_USE_MODULE_ERRORS enabled, fterrors.h defaults FT_ERR_BASE to FT_Mod_Err_Base unless a module-specific error header has already defined a module base.
    - id: cleanup_undefines_macro
      description: After error enumeration expansion, fterrors.h undefines FT_ERR_BASE so it is not a persistent application-visible constant after a normal include.
  # needs-input: operation=C preprocessor/compile fixture; fixture_asset=small C translation units for default config and module-error config/module header include; params={include <freetype/fterrors.h>, optional FT_CONFIG_OPTION_USE_MODULE_ERRORS/module FT_ERR_BASE}; output shape={preprocessed expansion of FT_ERRORDEF_ values and post-include macro-defined check}; comparison=exact C preprocessor values, module offset behavior, and post-include undef status.
