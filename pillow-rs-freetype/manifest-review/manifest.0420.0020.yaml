- id: fterrdef.FT_Err_Stack_Overflow
  kind: error
  symbol: FT_Err_Stack_Overflow
  header: freetype/fterrdef.h
  description: Public TrueType/CFF stack error code defined by FT_ERRORDEF_(Stack_Overflow, 0x82) in freetype/fterrdef.h.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 130 and the public error string is "stack overflow" in the pinned fterrdef.h TrueType and SFNT errors block.
    - id: tt_interpreter_stack_overflow
      description: ttinterp.c returns FT_Err_Stack_Overflow when bytecode pushes beyond the TrueType interpreter stack limit during FT_Load_Glyph.
    - id: cff_charstring_stack_overflow
      description: cffdecode.c and the CFF/Type 1 stack helpers map excessive operand stack growth to FT_Err_Stack_Overflow.
  # needs-input: operation=FT_Load_Glyph; fixture_asset=synthetic TrueType font with prep/glyf bytecode that exceeds interpreter stack capacity plus synthetic CFF/Type1 charstring with excessive operands; params={glyph_index, pixel_size, load_flags:FT_LOAD_DEFAULT}; output shape={FT_Error, glyph slot preservation}; comparison=exact C oracle error code 130 and interpreter/decoder failure classification.

