- id: fterrdef.FT_Err_Raster_Negative_Height
  kind: error
  symbol: FT_Err_Raster_Negative_Height
  header: freetype/fterrdef.h
  description: Public raster error code defined by FT_ERRORDEF_(Raster_Negative_Height, 0x63) in freetype/fterrdef.h.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 99 and the public error string is "negative height while rastering" in the pinned fterrdef.h raster errors block.
    - id: monochrome_raster_negative_height
      description: The monochrome raster path returns FT_Err_Raster_Negative_Height when ftraster.c detects a descending profile with negative height during FT_Render_Glyph or FT_Outline_Render.
  # needs-input: operation=FT_Render_Glyph and FT_Outline_Render; fixture_asset=synthetic outline/font that drives the monochrome rasterizer into the ftraster.c negative-height profile path; params={render_mode:FT_RENDER_MODE_MONO, load_flags:FT_LOAD_DEFAULT, pixel_size}; output shape={FT_Error, glyph slot bitmap fields}; comparison=exact C oracle error code 99 and unchanged/cleared bitmap-slot mutation behavior.

- id: fterrdef.FT_Err_Raster_Overflow
