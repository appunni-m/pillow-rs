      description: Numeric value is exactly 98 and the public error string is "raster overflow" in the pinned fterrdef.h raster errors block.
    - id: raster_buffer_or_cell_overflow
      description: Rasterizers return FT_Err_Raster_Overflow for cell, band, or bitmap buffer exhaustion, including ftraster.c, ftgrays.c, ftsmooth.c, ftrend1.c, and ftsdfrend.c emitters.
  # needs-input: operation=FT_Render_Glyph and FT_Outline_Render; fixture_asset=oversized synthetic outline/font or constrained target bitmap that reaches the raster overflow path; params={render_mode:FT_RENDER_MODE_NORMAL and FT_RENDER_MODE_MONO, pixel_size large enough to overflow bands/cells}; output shape={FT_Error, bitmap metadata, optional partial buffer hash}; comparison=exact C oracle error code 98 and public output mutation behavior.

