      description: Numeric value is exactly 161 and the public error string is "argument stack underflow" in the pinned fterrdef.h CFF, CID, and Type 1 errors block.
    - id: cff_charstring_missing_operands
      description: cffdecode.c, cffparse.c, cffload.c, and t1decode.c return FT_Err_Stack_Underflow when a charstring or dictionary operator is missing required operands.
  # needs-input: operation=FT_Load_Glyph and FT_New_Memory_Face; fixture_asset=synthetic CFF/Type1 font with a charstring or dictionary operator requiring operands that are absent; params={face_index:0, glyph_index, pixel_size, load_flags:FT_LOAD_DEFAULT}; output shape={FT_Error}; comparison=exact C oracle error code 161 and no successful glyph outline.

