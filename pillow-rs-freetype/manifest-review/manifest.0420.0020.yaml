  # needs-input: operation=FT_New_Memory_Face and FT_Open_Face; fixture_asset=small binary blob with valid stream bytes but no recognized font signature plus malformed per-driver probe samples; params={face_index:0}; output shape={FT_Error, face pointer/nullness}; comparison=exact C oracle error code 2 and no leaked/partially initialized face.

