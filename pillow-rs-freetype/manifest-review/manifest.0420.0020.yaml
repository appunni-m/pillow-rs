- id: fterrdef.FT_Err_Unimplemented_Feature
  kind: error
  symbol: FT_Err_Unimplemented_Feature
  header: freetype/fterrdef.h
  description: Public unsupported-feature error code defined by FT_ERRORDEF_(Unimplemented_Feature, 0x07) in freetype/fterrdef.h.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 7 and the public error string is "unimplemented feature" in the pinned fterrdef.h generic errors block.
    - id: optional_module_feature_disabled
      description: Public APIs return FT_Err_Unimplemented_Feature when optional support is unavailable, including ftbzip2.c, ftgzip.c, ftlzw.c, ftlcdfil.c, ftgxval.c, ftotval.c, ftcolor.c, and several driver property paths.
    - id: unsupported_font_feature
      description: Load/query paths may return FT_Err_Unimplemented_Feature for unsupported font features such as unsupported CFF charstrings, bitmap compression, SVG hooks, or driver fast advances.
  # needs-input: operation=FT_Stream_OpenBzip2, FT_Stream_OpenLZW, FT_Library_SetLcdFilter, FT_TrueTypeGX_Validate, FT_OpenType_Validate, FT_Get_Advance, and color/SVG query APIs as applicable; fixture_asset=compressed stream sample, variable/font-validation sample, and font with unsupported glyph feature; params={feature-specific flags and build capabilities}; output shape={FT_Error, optional output pointer preservation}; comparison=exact C oracle error code 7 and feature-disabled vs malformed-input distinction.

