- id: ftgxval.FT_ClassicKern_Free
  kind: function
  symbol: FT_ClassicKern_Free
  header: freetype/ftgxval.h
  description: Public C API function that frees a classic kern validation buffer allocated by FT_ClassicKern_Validate.
  cases:
    - id: null_face_noop
      description: Passing a null face returns without touching the table pointer, matching ftgxval.c.
    - id: frees_classic_kern_validation_buffer
      description: A buffer returned by FT_ClassicKern_Validate is accepted and released through the face memory allocator.
  # needs-input: operation=FT_ClassicKern_Validate followed by FT_ClassicKern_Free; fixture_asset=TrueType font with classic 16-bit kern table; params validation_flags=FT_VALIDATE_MS, FT_VALIDATE_APPLE, and FT_VALIDATE_CKERN; expected output shape=validate FT_Error plus ckern_table presence/bytes and free completion status; comparison=exact C oracle error code, non-null/null class, table bytes/hash before free, and no error/crash on free or null-face no-op.

- id: ftgxval.FT_ClassicKern_Validate
  kind: function
  symbol: FT_ClassicKern_Validate
  header: freetype/ftgxval.h
  description: Public C API function that validates classic 16-bit kern tables and returns a validator-owned table buffer.
  cases:
    - id: validates_ms_classic_kern
      description: With FT_VALIDATE_MS, returns C-compatible success/error and ckern_table output for Microsoft classic kern data.
    - id: validates_apple_classic_kern
      description: With FT_VALIDATE_APPLE, returns C-compatible success/error and ckern_table output for Apple classic kern data.
    - id: rejects_invalid_arguments
      description: Null face reports Invalid_Face_Handle and null ckern_table output pointer reports Invalid_Argument.
    - id: reports_unimplemented_or_invalid_table
      description: Fonts without validator support or incompatible kern dialects return the same public error as C.
  # needs-input: operation=FT_ClassicKern_Validate; fixture_asset=fonts with valid MS classic kern, valid Apple classic kern, no kern table, malformed/truncated kern table, and non-SFNT face; params validation_flags=FT_VALIDATE_MS, FT_VALIDATE_APPLE, FT_VALIDATE_CKERN, and unsupported flag combinations; expected output shape=FT_Error plus ckern_table null/non-null and bytes/hash; comparison=exact C oracle error code, output pointer presence class, copied table bytes/hash, and output preservation on errors.

- id: ftgxval.FT_TrueTypeGX_Free
  kind: function
  symbol: FT_TrueTypeGX_Free
  header: freetype/ftgxval.h
  description: Public C API function that frees a TrueTypeGX validation table buffer allocated by FT_TrueTypeGX_Validate.
  cases:
    - id: null_face_noop
      description: Passing a null face returns without touching the table pointer, matching ftgxval.c.
    - id: frees_gx_validation_buffer
      description: A table buffer returned by FT_TrueTypeGX_Validate is accepted and released through the face memory allocator.
  # needs-input: operation=FT_TrueTypeGX_Validate followed by FT_TrueTypeGX_Free; fixture_asset=AAT/GX font with at least one validated table; params validation_flags covering one table and FT_VALIDATE_GX; expected output shape=validate FT_Error plus table slot presence/bytes and free completion status; comparison=exact C oracle error code, table bytes/hash before free, and no error/crash on free or null-face no-op.

- id: ftgxval.FT_TrueTypeGX_Validate
  kind: function
  symbol: FT_TrueTypeGX_Validate
  header: freetype/ftgxval.h
  description: Public C API function that validates TrueTypeGX/AAT tables and returns validator-owned table buffers.
  cases:
    - id: validates_selected_gx_tables
      description: Selected validation bits return C-compatible success/error and table slot outputs.
    - id: validates_all_gx_tables
      description: FT_VALIDATE_GX validates all supported GX/AAT table bits and leaves absent or unsupported table slots null like C.
    - id: rejects_invalid_arguments
      description: Null face reports Invalid_Face_Handle and null tables array reports Invalid_Argument.
    - id: respects_table_length
      description: table_length limits which output slots can be populated, matching the gxvalid service behavior.
    - id: reports_unimplemented_or_invalid_table
      description: Fonts without GX validator support or malformed requested tables return the same public error as C.
  # needs-input: operation=FT_TrueTypeGX_Validate; fixture_asset=AAT/GX fonts with feat/mort/morx/bsln/just/kern/opbd/trak/prop/lcar coverage, plus fonts without GX tables and malformed table variants; params validation_flags single-bit, multi-bit, FT_VALIDATE_GX, zero, unknown bits, and table_length 0/short/full; expected output shape=FT_Error plus tables array slot null/non-null and bytes/hash; comparison=exact C oracle error code, per-slot presence class, copied table bytes/hash, output preservation on errors, and same behavior for absent tables.

- id: ftgzip.FT_Gzip_Uncompress
  kind: function
  symbol: FT_Gzip_Uncompress
  header: freetype/ftgzip.h
  description: Public C API function that inflates gzip/zlib input bytes into a caller-provided output buffer.
  cases:
    - id: uncompresses_valid_gzip_buffer
      description: Valid compressed input produces the same output bytes and used output_len as C.
    - id: rejects_invalid_arguments
      description: Null memory, output_len, or output pointer reports Invalid_Argument like C.
    - id: reports_buffer_too_small
      description: An output buffer that cannot hold the uncompressed data reports Array_Too_Large like C.
    - id: reports_invalid_compressed_data
      description: Truncated or corrupt compressed data reports Invalid_Table like C.
    - id: reports_unimplemented_without_zlib
      description: Builds without zlib support return Unimplemented_Feature for the same call surface.
  # needs-input: operation=FT_Gzip_Uncompress; fixture_asset=small gzip buffer, zlib-wrapped buffer, empty gzip payload, truncated gzip, corrupt gzip, and payload larger than output buffer; params output_len exact, oversized, zero, and undersized; expected output shape=FT_Error, output_len after call, and output bytes prefix; comparison=exact C oracle error code, output_len mutation, output byte equality/hash on success, and output preservation class on errors.

- id: ftgzip.FT_Stream_OpenGzip
  kind: function
  symbol: FT_Stream_OpenGzip
  header: freetype/ftgzip.h
  description: Public C API function that wraps an existing stream as a gzip-decompressing FreeType stream.
  cases:
    - id: opens_valid_gzip_stream
      description: A valid gzip source stream opens with C-compatible size, read, close, base, and descriptor behavior.
    - id: rejects_invalid_stream_handles
      description: Null target or source stream reports Invalid_Stream_Handle like C.
    - id: rejects_invalid_gzip_header
      description: Non-gzip or malformed gzip headers return the same public error as C before allocating a wrapper.
    - id: reports_unimplemented_without_zlib
      description: Builds without zlib support return Unimplemented_Feature for the same call surface.
  # needs-input: operation=FT_Stream_OpenGzip then stream read/close; fixture_asset=small gzip font/PCF payload under the in-memory threshold, large gzip payload over the streaming threshold, malformed gzip header, and plain uncompressed bytes; params source stream positions 0/nonzero and read ranges at beginning/middle/end; expected output shape=FT_Error plus opened stream fields and read bytes; comparison=exact C oracle error code, stream size/base/read/close presence class, decompressed read bytes/hash, source stream lifetime behavior, and close behavior.

- id: ftimage.FT_Curve_Tag_Conic
  kind: constant
  symbol: FT_Curve_Tag_Conic
  header: freetype/ftimage.h
  description: Deprecated public curve-tag alias for FT_CURVE_TAG_CONIC.
  cases:
    - id: value_matches_header
      description: Value matches FT_CURVE_TAG_CONIC, which is 0x00 in the pinned C header.
    - id: curve_tag_classifies_conic_points
      description: FT_CURVE_TAG masks outline point tags so this value classifies conic control points.
  # needs-input: operation=FT_Outline_Decompose; fixture_asset=outline fixture/font glyph with consecutive conic off-curve points and implicit midpoint handling; params shift/delta zero and nonzero; expected output shape=ordered callback event list; comparison=exact C oracle move/conic/line event order, transformed coordinates, implicit midpoint coordinates, and callback error propagation.

