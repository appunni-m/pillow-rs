- id: ftimage.FT_Outline_ConicTo_Func
  kind: macro
  symbol: FT_Outline_ConicTo_Func
  header: freetype/ftimage.h
  description: Deprecated public macro alias for the FT_Outline_ConicToFunc callback typedef.
  cases:
    - id: macro_alias_matches_typedef
      description: Macro expands to FT_Outline_ConicToFunc in the pinned C header.
    - id: callback_abi_matches_c
      description: Callback ABI is int (*)(const FT_Vector* control, const FT_Vector* to, void* user).
    - id: decompose_propagates_callback_error
      description: Non-zero conic_to callback return aborts FT_Outline_Decompose with the same error value as C.
  # needs-input: operation=FT_Outline_Decompose with instrumented conic_to callback; fixture_asset=outline fixture/font glyph with one conic segment, consecutive conic controls, and closing conic segment; params callback return 0 and selected nonzero values; expected output shape=ordered callback event list plus FT_Error; comparison=exact C oracle callback ordering, control/to coordinates after shift/delta, implicit midpoint generation, and first nonzero callback error propagation.

