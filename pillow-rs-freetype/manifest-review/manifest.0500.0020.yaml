- id: ftgxval.FT_VALIDATE_opbd
  kind: flag
  symbol: FT_VALIDATE_opbd
  header: freetype/ftgxval.h
  description: Public TrueTypeGX validation bit for the AAT opbd table.
  cases:
    - id: value_matches_header
      description: Value equals FT_VALIDATE_GX_START shifted by FT_VALIDATE_opbd_INDEX in the pinned C header.
    - id: gx_validate_selects_opbd_table
      description: FT_TrueTypeGX_Validate observes this bit when deciding whether to validate and return the opbd table slot.
  # needs-input: operation=FT_TrueTypeGX_Validate; fixture_asset=AAT/GX font with an opbd table plus a control font without opbd; params validation_flags=FT_VALIDATE_opbd and table_length=FT_VALIDATE_GX_LENGTH; expected output shape=tables[FT_VALIDATE_opbd_INDEX] null/non-null plus FT_Error; comparison=exact C oracle error code, table pointer presence class, copied table bytes/hash when non-null, and untouched unrequested table slots.

- id: ftgxval.FT_VALIDATE_opbd_INDEX
  kind: constant
  symbol: FT_VALIDATE_opbd_INDEX
  header: freetype/ftgxval.h
  description: Public table index used for the opbd entry in FT_TrueTypeGX_Validate output arrays.
  cases:
    - id: value_matches_header
      description: Value is 6 in the pinned C header.
    - id: indexes_gx_validate_output_slot
      description: The index selects the opbd output slot in the FT_TrueTypeGX_Validate tables array.
  # needs-input: operation=FT_TrueTypeGX_Validate; fixture_asset=AAT/GX font with opbd; params table_length=FT_VALIDATE_GX_LENGTH and validation_flags including FT_VALIDATE_opbd; expected output shape=array slot occupancy by index; comparison=exact C oracle slot index and null/non-null class.

