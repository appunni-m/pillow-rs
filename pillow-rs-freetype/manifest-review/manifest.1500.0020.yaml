- id: ttnameid.TT_MS_LANGID_TURKISH_TURKEY
  kind: tag
  symbol: TT_MS_LANGID_TURKISH_TURKEY
  header: freetype/ttnameid.h
  description: Microsoft platform language id for Turkish as used in Turkey name records.
  cases:
    - id: value_matches_header
      description: Macro expands to integer value 0x041F in the pinned C public header.
    - id: public_import_contract
      description: A C translation unit including <freetype/ttnameid.h> can reference TT_MS_LANGID_TURKISH_TURKEY as a public constant expression.
    - id: windows_turkish_name_runtime
      description: C oracle exposes Microsoft name records with language_id 0x041F and preserves Turkish UTF-16BE string bytes.
  # needs-input: operation=FT_Get_Sfnt_Name; fixture_asset=input/fonts/name-cmap/windows-name-tr-tr.ttf; params={platform_id=TT_PLATFORM_MICROSOFT, encoding_id=TT_MS_ID_UNICODE_CS, language_id=TT_MS_LANGID_TURKISH_TURKEY}; expected output shape={FT_Error, name_count, platform_id, encoding_id, language_id, name_id, string_len, string_bytes}; comparison=exact C oracle name-record fields and bytes.

