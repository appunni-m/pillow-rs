- id: fterrdef.FT_Err_Invalid_Opcode
  kind: error
  symbol: FT_Err_Invalid_Opcode
  header: freetype/fterrdef.h
  description: FreeType public TrueType bytecode error from freetype/fterrdef.h.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 128, matching FT_ERRORDEF_(Invalid_Opcode, 0x80) in the pinned header.
    - id: tt_bytecode_invalid_opcode
      description: FT_Load_Glyph on a synthetic TrueType program containing an undefined opcode returns FT_Err_Invalid_Opcode from ttinterp.c instead of collapsing the failure into Invalid_File_Format.
  # needs-input: operation=FT_Load_Glyph; fixture_asset=synthetic TrueType font with valid sfnt scaffolding and a prep or glyph instruction stream containing an opcode not implemented by FreeType's TrueType interpreter; params={glyph_index, pixel_size, load_flags:FT_LOAD_DEFAULT}; output shape={FT_Error}; comparison=exact C oracle error code 128 and no glyph-slot success mutation.

- id: fterrdef.FT_Err_Invalid_Outline
  kind: error
  symbol: FT_Err_Invalid_Outline
  header: freetype/fterrdef.h
  description: FreeType public outline validation error from freetype/fterrdef.h.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 20, matching FT_ERRORDEF_(Invalid_Outline, 0x14) in the pinned header.
    - id: malformed_outline_rejected
      description: A malformed outline with inconsistent contour endpoints or point counts returns FT_Err_Invalid_Outline through FT_Outline_Check, glyph loading, or rendering paths.
    - id: rust_invalid_outline_mapping
      description: Rust FontError::InvalidOutline maps to FT_Err_Invalid_Outline in the FFI facade.
  # needs-input: operation=FT_Load_Glyph and FT_Render_Glyph; fixture_asset=synthetic TrueType font whose glyf outline has invalid contour endpoint ordering or truncated point data; params={glyph_index, pixel_size, load_flags:FT_LOAD_DEFAULT|FT_LOAD_RENDER}; output shape={FT_Error, optional glyph slot preservation}; comparison=exact C oracle error code 20 and slot mutation behavior.

