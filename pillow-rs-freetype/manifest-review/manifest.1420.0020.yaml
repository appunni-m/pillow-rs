- id: ttnameid.TT_MS_LANGID_QUECHUA_PERU
  kind: tag
  symbol: TT_MS_LANGID_QUECHUA_PERU
  header: freetype/ttnameid.h
  description: Microsoft platform language id for Quechua as used in Peru name records.
  cases:
    - id: value_matches_header
      description: Macro expands to integer value 0x0C6B in the pinned C public header.
    - id: public_import_contract
      description: A C translation unit including <freetype/ttnameid.h> can reference TT_MS_LANGID_QUECHUA_PERU as a public constant expression.
    - id: windows_quechua_peru_name_runtime
      description: C oracle exposes Microsoft name records with language_id 0x0C6B and preserves the exact UTF-16BE string bytes.
