  # needs-input: operation=FT_LOAD_TARGET_MODE; fixture_asset=none; params load_flags values [0, FT_LOAD_RENDER|FT_LOAD_TARGET_NORMAL, FT_LOAD_RENDER|FT_LOAD_TARGET_MONO, FT_LOAD_RENDER|FT_LOAD_TARGET_LCD, FT_LOAD_RENDER|FT_LOAD_TARGET_LCD_V, 0x000F0000, 0x00100000]; expected output shape=signed integer render mode value from pinned C header; comparison=exact numeric equality.
