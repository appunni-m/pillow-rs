- id: freetype.FT_LOAD_NO_SCALE
  kind: flag
  symbol: FT_LOAD_NO_SCALE
  header: freetype/freetype.h
  description: FreeType public load flag from freetype/freetype.h.
  cases:
    - id: value_matches_header
      description: Numeric flag value matches the pinned FreeType header.
    - id: unscaled_load_behavior
      description: FT_Load_Glyph preserves unscaled outline and metrics behavior when FT_LOAD_NO_SCALE is set.
  # needs-input: operation=FT_Load_Glyph; fixture_asset=input/fonts/DejaVuSans.ttf; params face_index=0, glyph_index=36, size=20pt, load_flags=FT_LOAD_NO_SCALE; expected output shape=slot metrics, outline cbox/bbox, and advance in unscaled font units; comparison=exact C oracle numeric equality.

