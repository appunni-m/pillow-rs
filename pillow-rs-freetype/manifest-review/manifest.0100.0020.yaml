  - id: freetype.FT_Attach_File
    kind: function
    symbol: FT_Attach_File
    header: freetype/freetype.h
    description: FreeType C API function that attaches driver-specific auxiliary data to an existing face from a pathname.
    cases:
      # needs-input: operation FT_Attach_File; fixture pair Type 1 PFA/PFB plus matching AFM file with kerning data; params face from the Type 1 font and AFM pathname; expected output shape FT_Error plus before/after FT_Get_Kerning or track-kerning values; comparison rule exact C error code and exact 26.6 kerning vector parity.
      - id: success_attach_auxiliary_file
        description: Attaching a supported auxiliary metrics file to a live face returns the same FreeType error code and mutates later face queries like the C oracle.
      - id: error_null_face
        description: Null face handle returns the pinned C FreeType error classification.
      - id: error_null_pathname
        description: Null pathname returns the pinned C FreeType error classification without mutating the face.
      - id: error_missing_or_unsupported_file
        description: Missing path, malformed auxiliary file, or unsupported driver attachment returns the same C error code and leaves observable face state unchanged.

  - id: freetype.FT_Attach_Stream
    kind: function
    symbol: FT_Attach_Stream
    header: freetype/freetype.h
    description: FreeType C API function that attaches driver-specific auxiliary data to an existing face from FT_Open_Args.
    cases:
      # needs-input: operation FT_Attach_Stream; fixture pair Type 1 PFA/PFB plus matching AFM bytes; params FT_Open_Args with FT_OPEN_MEMORY and the AFM memory buffer; expected output shape FT_Error plus before/after FT_Get_Kerning or track-kerning values; comparison rule exact C error code and exact 26.6 kerning vector parity.
      - id: success_attach_auxiliary_stream
        description: Attaching a supported auxiliary metrics stream to a live face returns the same FreeType error code and mutates later face queries like the C oracle.
      - id: error_null_face
        description: Null face handle returns the pinned C FreeType error classification.
      - id: error_null_open_args
        description: Null FT_Open_Args pointer returns the pinned C FreeType error classification without mutating the face.
      - id: error_invalid_open_args_or_unsupported_driver
        description: Invalid source flags, bad stream data, or a driver without attachment support returns the same C error code and leaves observable face state unchanged.

  - id: freetype.FT_CeilFix
    kind: function
    symbol: FT_CeilFix
    header: freetype/freetype.h
    description: FreeType C API function that rounds a 16.16 fixed-point value toward plus infinity.
    cases:
      - id: exact_integer_passthrough
        description: Integral 16.16 inputs, including zero and negative integers, are returned unchanged.
      - id: positive_fraction_rounds_up
        description: Positive fractional 16.16 inputs round to the next integral 16.16 value.
      - id: negative_fraction_rounds_toward_plus_infinity
        description: Negative fractional 16.16 inputs round toward plus infinity and match C wrap-around arithmetic at edge values.

  - id: freetype.FT_DivFix
    kind: function
    symbol: FT_DivFix
    header: freetype/freetype.h
    description: FreeType C API function that computes a fixed-point quotient with FreeType rounding and overflow behavior.
    cases:
      - id: signed_quotient_matches_c
        description: Positive and negative numerator/denominator combinations match C sign-stripping, rounding, and 16.16 quotient behavior.
      - id: zero_denominator_sentinel
        description: A zero denominator returns the pinned C sentinel value.
      - id: overflow_wraparound_matches_c
        description: Large-magnitude inputs match the pinned C implementation's wrap-around and saturation behavior.

  - id: freetype.FT_Done_Face
    kind: function
    symbol: FT_Done_Face
    header: freetype/freetype.h
    description: FreeType C API function that releases a face object and its child slots and sizes.
    cases:
      - id: success_releases_face
        description: A face created by a C-compatible constructor is released successfully and associated child slots and sizes are torn down.
      - id: reference_count_decrements
        description: A referenced face is only destroyed when the C reference count reaches zero.
      - id: error_null_face
        description: Null face handle returns the pinned C FreeType error classification.
      - id: error_invalid_or_foreign_face_handle
        description: Invalid or non-owned face handles are rejected according to the C ABI safety policy without claiming use-after-free parity.

  - id: freetype.FT_Done_FreeType
    kind: function
    symbol: FT_Done_FreeType
    header: freetype/freetype.h
    description: FreeType C API function that destroys a library object and all children owned by it.
    cases:
      - id: success_releases_library_and_children
        description: A library created by FT_Init_FreeType is released successfully and all owned faces, sizes, glyph slots, modules, and streams are torn down.
      - id: error_null_library
        description: Null library handle returns the pinned C FreeType error classification.
      - id: error_invalid_or_foreign_library_handle
        description: Invalid or non-owned library handles are rejected according to the C ABI safety policy without claiming use-after-free parity.

  - id: freetype.FT_Face_CheckTrueTypePatents
    kind: function
    symbol: FT_Face_CheckTrueTypePatents
    header: freetype/freetype.h
    description: FreeType C API function that reports whether a face uses patented TrueType bytecode instructions in the pinned C API surface.
    cases:
      # needs-input: operation FT_Face_CheckTrueTypePatents; fixture fonts one TrueType face with bytecode programs and one non-TrueType or unhinted outline face; params live FT_Face handles; expected output shape FT_Bool; comparison rule exact boolean parity with pinned C FreeType build.
      - id: truetype_face_result
        description: Live TrueType faces return the same boolean patent-check result as the pinned C oracle.
      - id: non_truetype_face_result
        description: Non-TrueType or unsupported faces return the same boolean result as the pinned C oracle.
      - id: null_face_result
        description: Null face handle returns the same boolean result as the pinned C oracle.

  - id: freetype.FT_Face_GetCharVariantIndex
    kind: function
    symbol: FT_Face_GetCharVariantIndex
    header: freetype/freetype.h
    description: FreeType C API function that maps a Unicode character plus variation selector to a glyph index.
    coverage:
      font_variability: required
    cases:
      # needs-input: operation FT_Face_GetCharVariantIndex; fixture font with cmap format 14 containing default and non-default UVS mappings plus a control font without format 14; params Unicode charcode and variation selector combinations; expected output shape FT_UInt glyph index; comparison rule exact glyph index parity, including 0 for undefined selector, undefined char, no format 14 table, or non-Unicode current charmap.
      - id: non_default_variant_glyph_index
        description: A non-default Unicode variation sequence returns the same nonzero glyph index as the C oracle.
      - id: default_or_missing_variant_returns_c_value
        description: Default variants, undefined characters, undefined selectors, missing format 14 subtables, and non-Unicode charmaps return the exact C value.
      - id: null_face_returns_zero
        description: Null face handle returns the same zero result as the C oracle.

  - id: freetype.FT_Face_GetCharVariantIsDefault
    kind: function
    symbol: FT_Face_GetCharVariantIsDefault
    header: freetype/freetype.h
    description: FreeType C API function that classifies whether a Unicode variation sequence uses the default charmap glyph.
    coverage:
      font_variability: required
    cases:
      # needs-input: operation FT_Face_GetCharVariantIsDefault; fixture font with cmap format 14 default and non-default UVS mappings plus a control font without format 14; params Unicode charcode and variation selector combinations; expected output shape FT_Int; comparison rule exact parity for 1 default, 0 non-default, and -1 not-a-variation cases.
      - id: default_variant_returns_one
        description: A default Unicode variation sequence returns 1 like the C oracle.
      - id: non_default_variant_returns_zero
        description: A non-default Unicode variation sequence returns 0 like the C oracle.
      - id: missing_variant_returns_negative_one
        description: Undefined selector, undefined char, missing format 14 table, and null face cases return the same not-a-variation result as the C oracle.

  - id: freetype.FT_Face_GetCharsOfVariant
    kind: function
    symbol: FT_Face_GetCharsOfVariant
    header: freetype/freetype.h
    description: FreeType C API function that returns the zero-terminated Unicode character list for a variation selector.
    coverage:
      font_variability: required
    cases:
      # needs-input: operation FT_Face_GetCharsOfVariant; fixture font with cmap format 14 covering multiple characters for at least one selector plus a control font without format 14; params variation selector values with present and absent lists; expected output shape face-owned zero-terminated FT_UInt32 array or NULL; comparison rule exact ordered list contents, terminating zero, NULL behavior, and overwrite-on-next-FreeType-call lifetime where observable.
      - id: present_selector_returns_char_list
        description: A selector present in cmap format 14 returns the same ordered zero-terminated character list as the C oracle.
      - id: absent_or_empty_selector_returns_null
        description: Absent selectors, empty lists, missing format 14 subtables, and null face cases return NULL like the C oracle.
      - id: result_buffer_lifetime
        description: Returned face-owned arrays remain valid only until the next FreeType call according to the C oracle lifetime rule.

  - id: freetype.FT_Face_GetVariantSelectors
    kind: function
    symbol: FT_Face_GetVariantSelectors
    header: freetype/freetype.h
    description: FreeType C API function that returns the zero-terminated list of variation selectors present in a face.
    coverage:
      font_variability: required
    cases:
      # needs-input: operation FT_Face_GetVariantSelectors; fixture font with cmap format 14 containing multiple standardized and/or ideographic variation selectors plus a control font without format 14; params live and null FT_Face handles; expected output shape face-owned zero-terminated FT_UInt32 array or NULL; comparison rule exact ordered selector list contents, terminating zero, NULL behavior, and overwrite-on-next-FreeType-call lifetime where observable.
      - id: face_with_variants_returns_selector_list
        description: A face with a valid cmap format 14 table returns the same ordered zero-terminated selector list as the C oracle.
      - id: no_variants_returns_null
        description: Faces without a valid variation selector cmap table and null face handles return NULL like the C oracle.
      - id: result_buffer_lifetime
        description: Returned face-owned arrays remain valid only until the next FreeType call according to the C oracle lifetime rule.

  - id: freetype.FT_Face_GetVariantsOfChar
    kind: function
    symbol: FT_Face_GetVariantsOfChar
    header: freetype/freetype.h
    description: FreeType C API function that returns the zero-terminated selector list active for a Unicode character.
    coverage:
      font_variability: required
    cases:
      # needs-input: operation FT_Face_GetVariantsOfChar; fixture font with cmap format 14 where at least one character has multiple selectors plus a control font without format 14; params charcodes with present, absent, and undefined variant lists; expected output shape face-owned zero-terminated FT_UInt32 array or NULL; comparison rule exact ordered selector list contents, terminating zero, NULL behavior, and overwrite-on-next-FreeType-call lifetime where observable.
      - id: char_with_variants_returns_selector_list
        description: A character with variation selector entries returns the same ordered zero-terminated selector list as the C oracle.
      - id: char_without_variants_returns_null
        description: Characters without variation selector entries, missing format 14 subtables, and null face cases return NULL like the C oracle.
      - id: result_buffer_lifetime
        description: Returned face-owned arrays remain valid only until the next FreeType call according to the C oracle lifetime rule.
