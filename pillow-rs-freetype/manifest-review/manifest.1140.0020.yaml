- id: ttnameid.TT_UCR_ORIYA
  kind: constant
  symbol: TT_UCR_ORIYA
  header: freetype/ttnameid.h
  description: OS/2 ulUnicodeRange1 bit mask for Oriya/Odia.
  cases:
    - id: value_matches_header
      description: Macro expands to (1UL << 19), value 0x00080000, in the pinned C public header.
    - id: import_contract
      description: Public C code can import freetype/ttnameid.h and use TT_UCR_ORIYA as an unsigned long constant expression.
    - id: os2_oriya_range_runtime
      description: C oracle reports this bit in the OS/2 ulUnicodeRange fields for a font declaring U+0B00-U+0B7F coverage.
      # needs-input: SFNT fixture with OS/2 ulUnicodeRange1 bit 19 set; compare TT_OS2 ulUnicodeRange fields from FT_Get_Sfnt_Table against C.

