- id: ttnameid.TT_MAC_LANGID_RUNDI
  kind: constant
  symbol: TT_MAC_LANGID_RUNDI
  header: freetype/ttnameid.h
  description: Public Mac platform language ID constant for Rundi name-table records; pinned FreeType defines it as 91.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 91 as defined by pinned freetype/ttnameid.h.
    - id: public_import_contract
      description: A C translation unit including <freetype/ttnameid.h> can reference TT_MAC_LANGID_RUNDI as a preprocessor-visible public constant.

