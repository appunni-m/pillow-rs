    - id: public_import_contract
      description: A C translation unit including <freetype/tttables.h> can pass FT_SFNT_MAXP to FT_Get_Sfnt_Table.
    - id: get_sfnt_table_maxp
      description: C oracle returns a non-null TT_MaxProfile pointer for an SFNT face with a valid maxp table.
  # needs-input: operation=FT_Get_Sfnt_Table; fixture_asset=input/fonts/sfnt/basic-ttf.ttf; params={tag=FT_SFNT_MAXP}; expected output shape={pointer_null, TT_MaxProfile fields}; comparison=exact C oracle nullness and TT_MaxProfile field values, including FreeType's maxFunctionDefs minimum adjustment.

- id: tttables.FT_SFNT_OS2
  kind: enum_variant
  symbol: FT_SFNT_OS2
  header: freetype/tttables.h
  description: FT_Sfnt_Tag enum variant selecting the parsed TT_OS2 record.
  cases:
    - id: value_matches_header
      description: Enum variant has integer value 2 in the pinned C public header.
    - id: public_import_contract
      description: A C translation unit including <freetype/tttables.h> can pass FT_SFNT_OS2 to FT_Get_Sfnt_Table.
    - id: get_sfnt_table_os2_present_or_null
      description: C oracle returns TT_OS2 only when the parsed OS/2 version sentinel is not 0xFFFF; missing OS/2 returns NULL.
  # needs-input: operation=FT_Get_Sfnt_Table; fixture_asset=input/fonts/sfnt/basic-ttf.ttf and input/fonts/sfnt/no-os2.ttf; params={tag=FT_SFNT_OS2}; expected output shape={pointer_null, TT_OS2 scalar fields if present}; comparison=exact C oracle nullness and TT_OS2 fields.

- id: tttables.FT_SFNT_PCLT
  kind: enum_variant
  symbol: FT_SFNT_PCLT
  header: freetype/tttables.h
  description: FT_Sfnt_Tag enum variant selecting the parsed TT_PCLT record.
  cases:
    - id: value_matches_header
      description: Enum variant has integer value 6 in the pinned C public header.
    - id: public_import_contract
      description: A C translation unit including <freetype/tttables.h> can pass FT_SFNT_PCLT to FT_Get_Sfnt_Table.
    - id: get_sfnt_table_pclt_present_or_null
