- id: tttables.FT_Get_CMap_Format
  kind: function
  symbol: FT_Get_CMap_Format
  header: freetype/tttables.h
  description: Public API returning the SFNT cmap subtable format for a charmap or -1 when unavailable.
  cases:
    - id: import_contract
      description: Declaration is visible from freetype/tttables.h as FT_Long FT_Get_CMap_Format(FT_CharMap charmap).
    - id: sfnt_charmap_formats
      description: For real SFNT charmaps, C oracle returns exact cmap format numbers such as 4, 12, 13, or 14.
    - id: invalid_or_non_sfnt_returns_minus_one
      description: Null charmaps, charmaps without a face, and faces without a TT_CMAP service return -1.
  # needs-input: operation=FT_Get_CMap_Format; fixture_asset=input/fonts/cmap/cmap-format-4-12-14.ttf and synthetic invalid charmap handles; params={charmap_index, invalid_kind:null/no_face/non_sfnt}; expected output shape={FT_Long format}; comparison=exact C oracle signed integer return.

- id: tttables.FT_Get_CMap_Language_ID
  kind: function
  symbol: FT_Get_CMap_Language_ID
  header: freetype/tttables.h
  description: Public API returning the OpenType cmap language id for a charmap, or zero when unavailable.
  cases:
    - id: import_contract
      description: Declaration is visible from freetype/tttables.h as FT_ULong FT_Get_CMap_Language_ID(FT_CharMap charmap).
    - id: sfnt_charmap_language
      description: For SFNT charmaps, C oracle returns the language field reported by the TT_CMAP service, including 0xFFFFFFFF for format 14.
    - id: invalid_or_no_service_returns_zero
      description: Null charmaps, charmaps without a face, and faces without a TT_CMAP service return 0.
  # needs-input: operation=FT_Get_CMap_Language_ID; fixture_asset=input/fonts/cmap/cmap-language-and-format14.ttf and synthetic invalid charmap handles; params={charmap_index, invalid_kind:null/no_face/non_sfnt}; expected output shape={FT_ULong language_id}; comparison=exact C oracle unsigned integer return.

- id: tttables.FT_Get_Sfnt_Table
  kind: function
  symbol: FT_Get_Sfnt_Table
  header: freetype/tttables.h
  description: Public API returning a face-owned pointer to parsed SFNT table records selected by FT_Sfnt_Tag.
  cases:
    - id: import_contract
      description: Declaration is visible from freetype/tttables.h as void* FT_Get_Sfnt_Table(FT_Face face, FT_Sfnt_Tag tag).
    - id: parsed_table_success
      description: For valid SFNT faces, C oracle returns non-null pointers for loaded records such as HEAD, MAXP, HHEA, and POST.
    - id: optional_table_null
      description: Optional records such as VHEA, OS2, and PCLT return NULL when the corresponding parsed table state is absent.
    - id: invalid_face_or_tag_null
      description: Null faces, non-SFNT faces, and unsupported tags return NULL instead of an FT_Error.
  # needs-input: operation=FT_Get_Sfnt_Table; fixture_asset=input/fonts/sfnt/basic-ttf.ttf, input/fonts/sfnt/vertical-metrics.ttf, input/fonts/sfnt/no-os2.ttf; params={tag, face_kind:null/non_sfnt/sfnt}; expected output shape={pointer_null, record_kind, selected record scalar fields if non_null}; comparison=exact C oracle nullness and field values, never raw process addresses.

- id: tttables.FT_Load_Sfnt_Table
  kind: function
  symbol: FT_Load_Sfnt_Table
  header: freetype/tttables.h
  description: Public API loading raw SFNT table bytes, whole font bytes, or the selected table directory into client memory.
  cases:
    - id: import_contract
      description: Declaration is visible from freetype/tttables.h as FT_Error FT_Load_Sfnt_Table(FT_Face face, FT_ULong tag, FT_Long offset, FT_Byte* buffer, FT_ULong* length).
    - id: length_probe_success
      description: With length non-null and *length zero, C returns FT_Err_Ok and writes the full size for a present table, tag 0 whole font, or tag 1 table directory.
    - id: byte_load_success
      description: With a valid buffer and requested length, C copies exact raw bytes from the selected table or font slice and updates observable length state as C does.
    - id: missing_table_or_invalid_face_error
      description: Missing table tags return FT_Err_Table_Missing while null or non-SFNT faces return FT_Err_Invalid_Face_Handle.
    - id: offset_and_length_errors
      description: Offsets beyond the selected source and invalid buffer/length combinations return the exact C oracle FT_Error without fabricating bytes.
  # needs-input: operation=FT_Load_Sfnt_Table; fixture_asset=input/fonts/sfnt/basic-ttf.ttf; params={tag:TTAG_head/TTAG_maxp/0/1/missing, offset, buffer_kind:null/allocated, length_state:null/zero/nonzero}; expected output shape={FT_Error, length_after, bytes_written, bytes_hash, bytes_prefix}; comparison=exact C oracle error code, length mutation, and raw byte output.

- id: tttables.FT_Sfnt_Table_Info
  kind: function
  symbol: FT_Sfnt_Table_Info
  header: freetype/tttables.h
  description: Public API returning SFNT table directory tag and length metadata or table count.
  cases:
    - id: import_contract
      description: Declaration is visible from freetype/tttables.h as FT_Error FT_Sfnt_Table_Info(FT_Face face, FT_UInt table_index, FT_ULong* tag, FT_ULong* length).
    - id: table_count_query
      description: Passing a null tag ignores table_index and writes the number of SFNT tables to length.
    - id: indexed_table_info
      description: With valid tag and length pointers, C returns the exact table directory tag and length for the requested index.
    - id: invalid_index_or_arguments
      description: An out-of-range index returns FT_Err_Table_Missing and a null length pointer returns FT_Err_Invalid_Argument through the SFNT service.
    - id: invalid_face_error
      description: Null or non-SFNT faces return FT_Err_Invalid_Face_Handle.
  # needs-input: operation=FT_Sfnt_Table_Info; fixture_asset=input/fonts/sfnt/basic-ttf.ttf; params={table_index:first/middle/last/out_of_range, tag_ptr:null/non_null, length_ptr:null/non_null, face_kind:null/non_sfnt/sfnt}; expected output shape={FT_Error, tag_after, length_after}; comparison=exact C oracle error code and out-parameter mutation.

- id: tttables.TT_Header
  kind: record
  symbol: TT_Header
  header: freetype/tttables.h
  description: Public C record modeling the parsed TrueType head table returned through FT_Get_Sfnt_Table(FT_SFNT_HEAD).
  cases:
    - id: public_import_contract
      description: A C translation unit including <freetype/tttables.h> can name TT_Header and access its public fields.
    - id: abi_layout_matches_header
      description: C probe verifies sizeof, alignof, and offsetof for every TT_Header field including Created[2] and Modified[2].
    - id: get_sfnt_table_head_fields
      description: C oracle exposes parsed head fields exactly, including fixed versions, checksum adjustment, bounding box, flags, units per EM, and loca format.
  # needs-input: operation=FT_Get_Sfnt_Table(FT_SFNT_HEAD); fixture_asset=input/fonts/sfnt/basic-ttf.ttf; params={tag=FT_SFNT_HEAD}; expected output shape={pointer_null:false, Table_Version, Font_Revision, CheckSum_Adjust, Magic_Number, Flags, Units_Per_EM, Created[2], Modified[2], xMin, yMin, xMax, yMax, Mac_Style, Lowest_Rec_PPEM, Font_Direction, Index_To_Loc_Format, Glyph_Data_Format, abi_size, abi_align, field_offsets}; comparison=exact C oracle fields and ABI layout.

- id: tttables.TT_HoriHeader
  kind: record
  symbol: TT_HoriHeader
  header: freetype/tttables.h
  description: Public C record modeling the parsed hhea and hmtx linkage returned through FT_Get_Sfnt_Table(FT_SFNT_HHEA).
  cases:
    - id: public_import_contract
      description: A C translation unit including <freetype/tttables.h> can name TT_HoriHeader and access its public fields.
    - id: abi_layout_matches_header
      description: C probe verifies sizeof, alignof, and offsetof for all scalar fields, Reserved[4], long_metrics, and short_metrics.
    - id: get_sfnt_table_hhea_fields
      description: C oracle exposes parsed horizontal metrics header fields and pointer-nullness classes for hmtx linkage fields.
    - id: variation_metrics_runtime
      description: For a variable font with MVAR data, C oracle can change caret slope/offset fields after variation coordinate APIs.
  # needs-input: operation=FT_Get_Sfnt_Table(FT_SFNT_HHEA) before/after FT_Set_Var_Design_Coordinates; fixture_asset=input/fonts/variation/mvar-horizontal-metrics.ttf and input/fonts/sfnt/basic-ttf.ttf; params={tag=FT_SFNT_HHEA, variation_coords:default/changed}; expected output shape={pointer_null:false, Version, Ascender, Descender, Line_Gap, advance_Width_Max, min_Left_Side_Bearing, min_Right_Side_Bearing, xMax_Extent, caret_Slope_Rise, caret_Slope_Run, caret_Offset, Reserved[4], metric_Data_Format, number_Of_HMetrics, long_metrics_nullness, short_metrics_nullness, abi_size, abi_align, field_offsets}; comparison=exact C oracle fields and ABI layout, pointer comparison by nullness only.

- id: tttables.TT_MaxProfile
  kind: record
  symbol: TT_MaxProfile
  header: freetype/tttables.h
  description: Public C record modeling the parsed maxp table returned through FT_Get_Sfnt_Table(FT_SFNT_MAXP).
  cases:
    - id: public_import_contract
      description: A C translation unit including <freetype/tttables.h> can name TT_MaxProfile and access its public fields.
    - id: abi_layout_matches_header
      description: C probe verifies sizeof, alignof, and offsetof for version, numGlyphs, and every maxp limit field.
    - id: get_sfnt_table_maxp_fields
      description: C oracle exposes parsed maxp fields exactly, including zero-filled extra fields for version below 1.0 and the maxFunctionDefs minimum adjustment for TrueType maxp version 1.0.
    - id: malformed_table_error_source
      description: Fonts with truncated or invalid maxp fail during face load or expose C's adjusted parsed maxp state, never a hand-built partial record.
  # needs-input: operation=FT_Get_Sfnt_Table(FT_SFNT_MAXP) after FT_New_Face; fixture_asset=input/fonts/sfnt/basic-ttf.ttf, input/fonts/sfnt/cff-maxp-0500.otf, input/fonts/sfnt/tt-maxp-small-functiondefs.ttf; params={tag=FT_SFNT_MAXP}; expected output shape={face_load_FT_Error, pointer_null, version, numGlyphs, maxPoints, maxContours, maxCompositePoints, maxCompositeContours, maxZones, maxTwilightPoints, maxStorage, maxFunctionDefs, maxInstructionDefs, maxStackElements, maxSizeOfInstructions, maxComponentElements, maxComponentDepth, abi_size, abi_align, field_offsets}; comparison=exact C oracle load status, field values, and ABI layout.
