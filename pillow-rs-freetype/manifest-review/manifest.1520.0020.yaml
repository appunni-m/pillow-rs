- id: ttnameid.TT_MS_LANGID_YORUBA_NIGERIA
  kind: tag
  symbol: TT_MS_LANGID_YORUBA_NIGERIA
  header: freetype/ttnameid.h
  description: Microsoft platform language id for Yoruba as used in Nigeria name records.
  cases:
    - id: value_matches_header
      description: Macro expands to integer value 0x046A in the pinned C public header.
    - id: public_import_contract
      description: A C translation unit including <freetype/ttnameid.h> can reference TT_MS_LANGID_YORUBA_NIGERIA as a public constant expression.
    - id: windows_yoruba_name_runtime
      description: C oracle exposes Microsoft name records with language_id 0x046A and preserves Yoruba UTF-16BE string bytes.
  # needs-input: operation=FT_Get_Sfnt_Name; fixture_asset=input/fonts/name-cmap/windows-name-yo-ng.ttf; params={platform_id=TT_PLATFORM_MICROSOFT, encoding_id=TT_MS_ID_UNICODE_CS, language_id=TT_MS_LANGID_YORUBA_NIGERIA}; expected output shape={FT_Error, name_count, platform_id, encoding_id, language_id, name_id, string_len, string_bytes}; comparison=exact C oracle name-record fields and bytes.

- id: ttnameid.TT_MS_LANGID_ZULU_SOUTH_AFRICA
  kind: tag
  symbol: TT_MS_LANGID_ZULU_SOUTH_AFRICA
  header: freetype/ttnameid.h
  description: Legacy Microsoft platform language id alias for Zulu as used in South Africa name records.
  cases:
    - id: value_matches_header
      description: Macro aliases TT_MS_LANGID_ISIZULU_SOUTH_AFRICA and therefore expands to integer value 0x0435 in the pinned C public header.
    - id: alias_matches_canonical
      description: Macro expansion is identical to TT_MS_LANGID_ISIZULU_SOUTH_AFRICA in the pinned C public header.
    - id: public_import_contract
      description: A C translation unit including <freetype/ttnameid.h> can reference TT_MS_LANGID_ZULU_SOUTH_AFRICA as a public constant expression.
    - id: windows_zulu_name_runtime
      description: C oracle exposes Microsoft name records with language_id 0x0435 and preserves Zulu UTF-16BE string bytes.
  # needs-input: operation=FT_Get_Sfnt_Name; fixture_asset=input/fonts/name-cmap/windows-name-zu-za.ttf; params={platform_id=TT_PLATFORM_MICROSOFT, encoding_id=TT_MS_ID_UNICODE_CS, language_id=TT_MS_LANGID_ZULU_SOUTH_AFRICA}; expected output shape={FT_Error, name_count, platform_id, encoding_id, language_id, name_id, string_len, string_bytes}; comparison=exact C oracle name-record fields and bytes, with alias value equal to TT_MS_LANGID_ISIZULU_SOUTH_AFRICA.

- id: ttnameid.TT_UCR_TAGS
  kind: tag
  symbol: TT_UCR_TAGS
  header: freetype/ttnameid.h
  description: Public macro aggregate containing all TT_UCR_* Unicode-range bit definitions.
  cases:
    - id: public_import_contract
      description: A C translation unit including <freetype/ttnameid.h> can use TT_UCR_TAGS in macro-expansion probes.
    - id: aggregate_contains_header_ranges
      description: The aggregate expands to the pinned public TT_UCR_* range list, including deprecated aliases for compatibility names.
    - id: os2_unicode_range_runtime
      description: C oracle exposes selected range bits through TT_OS2 ulUnicodeRange fields without depending on the aggregate macro at runtime.
  # needs-input: operation=FT_Get_Sfnt_Table(FT_SFNT_OS2); fixture_asset=input/fonts/sfnt/os2-unicode-range-coverage.ttf; params={tag=FT_SFNT_OS2, ranges=[latin,arabic_presentation,ancient_symbols,game_tiles]}; expected output shape={pointer_null:false, TT_OS2.ulUnicodeRange1, ulUnicodeRange2, ulUnicodeRange3, ulUnicodeRange4}; comparison=exact C oracle bit fields plus compile-time aggregate membership probe for TT_UCR_TAGS.

- id: tttables.FT_Sfnt_Tag
  kind: enum
  symbol: FT_Sfnt_Tag
  header: freetype/tttables.h
  description: Public enum selecting parsed SFNT table records returned by FT_Get_Sfnt_Table.
  cases:
    - id: public_import_contract
      description: A C translation unit including <freetype/tttables.h> can name FT_Sfnt_Tag and pass it to FT_Get_Sfnt_Table.
    - id: enum_value_order
      description: Enum values follow pinned C order HEAD=0, MAXP=1, OS2=2, HHEA=3, VHEA=4, POST=5, PCLT=6, MAX=7.
    - id: invalid_enum_returns_null
      description: Passing a value outside the public enum range to FT_Get_Sfnt_Table returns NULL for an SFNT face.
  # needs-input: operation=FT_Get_Sfnt_Table; fixture_asset=input/fonts/sfnt/basic-ttf.ttf; params={tags=[FT_SFNT_HEAD,FT_SFNT_MAXP,FT_SFNT_OS2,FT_SFNT_HHEA,FT_SFNT_VHEA,FT_SFNT_POST,FT_SFNT_PCLT,FT_SFNT_MAX,999]}; expected output shape={tag, pointer_null, record_type_if_non_null}; comparison=exact C oracle nullness and tag-to-record mapping.

- id: tttables.FT_SFNT_HEAD
  kind: enum_variant
  symbol: FT_SFNT_HEAD
  header: freetype/tttables.h
  description: FT_Sfnt_Tag enum variant selecting the parsed TT_Header record.
  cases:
    - id: value_matches_header
      description: Enum variant has integer value 0 in the pinned C public header.
    - id: public_import_contract
      description: A C translation unit including <freetype/tttables.h> can pass FT_SFNT_HEAD to FT_Get_Sfnt_Table.
    - id: get_sfnt_table_head
      description: C oracle returns a non-null TT_Header pointer for an SFNT face with a valid head table and NULL for invalid or non-SFNT face handles.
  # needs-input: operation=FT_Get_Sfnt_Table; fixture_asset=input/fonts/sfnt/basic-ttf.ttf; params={tag=FT_SFNT_HEAD}; expected output shape={pointer_null, TT_Header fields if present}; comparison=exact C oracle nullness and TT_Header field values.

- id: tttables.FT_SFNT_HHEA
  kind: enum_variant
  symbol: FT_SFNT_HHEA
  header: freetype/tttables.h
  description: FT_Sfnt_Tag enum variant selecting the parsed TT_HoriHeader record.
  cases:
    - id: value_matches_header
      description: Enum variant has integer value 3 in the pinned C public header.
    - id: public_import_contract
      description: A C translation unit including <freetype/tttables.h> can pass FT_SFNT_HHEA to FT_Get_Sfnt_Table.
    - id: get_sfnt_table_hhea
      description: C oracle returns a non-null TT_HoriHeader pointer for an SFNT face with a valid hhea table.
  # needs-input: operation=FT_Get_Sfnt_Table; fixture_asset=input/fonts/sfnt/basic-ttf.ttf; params={tag=FT_SFNT_HHEA}; expected output shape={pointer_null, TT_HoriHeader scalar fields, long_metrics_nullness, short_metrics_nullness}; comparison=exact C oracle nullness, scalar fields, and pointer-nullness classes.

- id: tttables.FT_SFNT_MAX
  kind: enum_variant
  symbol: FT_SFNT_MAX
  header: freetype/tttables.h
  description: Sentinel FT_Sfnt_Tag enum variant immediately after the public table selectors.
  cases:
    - id: value_matches_header
      description: Enum variant has integer value 7 in the pinned C public header.
    - id: public_import_contract
      description: A C translation unit including <freetype/tttables.h> can reference FT_SFNT_MAX as the enum sentinel.
    - id: get_sfnt_table_sentinel_returns_null
      description: C oracle returns NULL when FT_SFNT_MAX is passed to FT_Get_Sfnt_Table because the service switch has no record for the sentinel.
  # needs-input: operation=FT_Get_Sfnt_Table; fixture_asset=input/fonts/sfnt/basic-ttf.ttf; params={tag=FT_SFNT_MAX}; expected output shape={pointer_null:true}; comparison=exact C oracle nullness.

