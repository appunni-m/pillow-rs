- id: tttables.FT_SFNT_POST
  kind: enum_variant
  symbol: FT_SFNT_POST
  header: freetype/tttables.h
  description: FT_Sfnt_Tag enum variant selecting the parsed TT_Postscript record.
  cases:
    - id: value_matches_header
      description: Enum variant has integer value 5 in the pinned C public header.
    - id: public_import_contract
      description: A C translation unit including <freetype/tttables.h> can pass FT_SFNT_POST to FT_Get_Sfnt_Table.
    - id: get_sfnt_table_post
      description: C oracle returns a TT_Postscript pointer for an SFNT face and exposes parsed post table fields.
  # needs-input: operation=FT_Get_Sfnt_Table; fixture_asset=input/fonts/sfnt/basic-ttf.ttf; params={tag=FT_SFNT_POST}; expected output shape={pointer_null, TT_Postscript fields}; comparison=exact C oracle nullness and TT_Postscript fields.

- id: tttables.FT_SFNT_VHEA
  kind: enum_variant
  symbol: FT_SFNT_VHEA
  header: freetype/tttables.h
  description: FT_Sfnt_Tag enum variant selecting the parsed TT_VertHeader record.
  cases:
    - id: value_matches_header
      description: Enum variant has integer value 4 in the pinned C public header.
    - id: public_import_contract
      description: A C translation unit including <freetype/tttables.h> can pass FT_SFNT_VHEA to FT_Get_Sfnt_Table.
    - id: get_sfnt_table_vhea_present_or_null
      description: C oracle returns TT_VertHeader only when vertical_info is present; otherwise FT_Get_Sfnt_Table returns NULL.
