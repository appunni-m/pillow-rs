- id: ftmm.FT_Get_Var_Blend_Coordinates
  kind: function
  symbol: FT_Get_Var_Blend_Coordinates
  header: freetype/ftmm.h
  description: Public C API alias for retrieving the current normalized variation blend coordinates.
  cases:
    - id: success_default_blend_coordinates
      description: On a variable face at its default instance, returns one 16.16 normalized coordinate per axis with C-compatible default values.
    - id: success_after_set_var_blend_coordinates
      description: After FT_Set_Var_Blend_Coordinates, returns the active normalized coordinates exactly as C exposes them after avar/service normalization.
    - id: excess_output_coordinates_zero_filled
      description: If num_coords exceeds the axis count, excess output entries are set to zero for TrueType GX/OpenType variation faces.
    - id: error_null_coords
      description: A null coords pointer returns Invalid_Argument before service dispatch.
    - id: error_non_variable_or_invalid_face
      description: Invalid face handles and faces without a multiple-master service return the same C error class.
  # needs-input: operation=FT_Get_Var_Blend_Coordinates after open/set/reset; fixture_asset=single-axis and multi-axis variable TrueType fonts, including an avar-mapped font; params={face_index, num_coords, prior_set_blend_coords, prior_set_design_coords, coords_null}; output shape={FT_Error, normalized FT_Fixed coordinate array, face_flags variation bit, glyph metrics/cbox/render bytes for a representative glyph}; comparison=exact C oracle error code, coordinate values including zero-filled excess, variation flag, and downstream glyph output.

- id: ftmm.FT_Get_Var_Design_Coordinates
  kind: function
  symbol: FT_Get_Var_Design_Coordinates
  header: freetype/ftmm.h
  description: Public C API for retrieving the current variation design-space coordinates.
  cases:
    - id: success_default_design_coordinates
      description: Returns default 16.16 design coordinates for TrueType GX/OpenType variation faces and whole-number design coordinates for Adobe MM faces.
    - id: success_after_set_var_design_coordinates
      description: Returns the active design coordinates after FT_Set_Var_Design_Coordinates, including clamping and missing-axis defaults applied by C.
    - id: success_named_instance_design_coordinates
      description: After FT_Set_Named_Instance, returns the named instance coordinates selected by C.
    - id: excess_output_coordinates_zero_filled
      description: If num_coords exceeds the axis count, excess output entries are set to zero.
    - id: error_null_coords
      description: A null coords pointer returns Invalid_Argument before service dispatch.
  # needs-input: operation=FT_Get_Var_Design_Coordinates after open/set/named-instance/reset; fixture_asset=variable fonts with wght, wdth, opsz axes and named instances plus an Adobe MM fixture if supported; params={face_index, instance_index, num_coords, design_coords, coords_null}; output shape={FT_Error, FT_Fixed design coordinate array, selected instance bits, glyph metrics/cbox/render bytes}; comparison=exact C oracle error code, coordinate array including zero-filled excess, face_index bits, and downstream glyph output.

- id: ftmm.FT_Set_MM_Blend_Coordinates
  kind: function
  symbol: FT_Set_MM_Blend_Coordinates
  header: freetype/ftmm.h
  description: Public C API for setting normalized blend coordinates through the historical multiple-master interface.
  cases:
    - id: success_set_normalized_coordinates
      description: Sets normalized 16.16 coordinates and updates the face variation flag exactly as C does for supported variation services.
    - id: success_partial_and_extra_coordinates
      description: Fewer coordinates use defaults for remaining axes, while excess coordinates are ignored by the C service.
    - id: success_reset_to_default
      description: Calling with num_coords zero and coords null resets the face to the default variation state and clears the variation flag.
    - id: error_null_coords_with_nonzero_count
      description: Nonzero num_coords with a null coords pointer returns Invalid_Argument before service dispatch.
    - id: output_changes_for_active_blend
      description: Setting non-default blend coordinates changes variable glyph metrics, cbox/bbox, and rendered bytes in the same way as C.
  # needs-input: operation=FT_Set_MM_Blend_Coordinates followed by FT_Get_Var_Blend_Coordinates and glyph load/render; fixture_asset=variable TrueType fonts with gvar/HVAR/MVAR coverage and Adobe MM fixture where available; params={blend_coords, num_coords, coords_null, glyph_index, size, load_flags}; output shape={FT_Error, returned blend coords, face_flags variation bit, metrics, outline cbox/bbox, bitmap descriptor/bytes}; comparison=exact C oracle error code, coordinate state, variation flag, metrics, geometry, and render bytes.

- id: ftmm.FT_Set_MM_Design_Coordinates
  kind: function
  symbol: FT_Set_MM_Design_Coordinates
  header: freetype/ftmm.h
  description: Public C API for setting Adobe Multiple Master design coordinates.
  cases:
    - id: success_adobe_mm_design_coordinates
      description: On an Adobe MM face, sets FT_Long design coordinates and marks the face as variation when num_coords is nonzero.
    - id: success_partial_extra_and_reset
      description: Fewer coordinates use defaults, extra coordinates are ignored, and num_coords zero with null coords resets C variation state.
    - id: error_null_coords_with_nonzero_count
      description: Nonzero num_coords with a null coords pointer returns Invalid_Argument before service dispatch.
    - id: error_non_adobe_variation_face
      description: TrueType GX/OpenType variation faces and non-variable faces return C-compatible Invalid_Argument for the Adobe-only design setter.
    - id: output_changes_for_mm_design
      description: Non-default Adobe MM design coordinates change glyph metrics and outlines according to C interpolation.
  # needs-input: operation=FT_Set_MM_Design_Coordinates followed by FT_Get_Var_Design_Coordinates and glyph load/render; fixture_asset=deterministic Adobe Multiple Master font plus non-MM variable TrueType control font; params={FT_Long design_coords, num_coords, coords_null, glyph_index, size}; output shape={FT_Error, design coordinate array, face_flags variation bit, glyph metrics, cbox/bbox, render bytes}; comparison=exact C oracle success/error code, coordinate/default/reset behavior, variation flag, and glyph output.

- id: ftmm.FT_Set_MM_WeightVector
  kind: function
  symbol: FT_Set_MM_WeightVector
  header: freetype/ftmm.h
  description: Public C API for setting Adobe Multiple Master design weights directly.
  cases:
    - id: success_set_weight_vector
      description: Sets Adobe MM weight vector entries and marks the face as variation when len is nonzero.
    - id: success_short_long_and_reset
      description: Short vectors zero-fill remaining design weights, long vectors ignore excess values, and len zero with null weightvector resets defaults.
    - id: success_unenforced_weight_sum
      description: C does not enforce the Adobe documentation requirement that weights sum to approximately one.
    - id: error_null_weightvector_with_nonzero_len
      description: Nonzero len with a null weightvector pointer returns Invalid_Argument before service dispatch.
    - id: error_unsupported_on_true_type_variations
      description: TrueType/OpenType variation services do not implement set_mm_weightvector and return C-compatible Invalid_Argument.
  # needs-input: operation=FT_Set_MM_WeightVector followed by FT_Get_MM_WeightVector and glyph load/render; fixture_asset=Adobe Multiple Master font with multiple designs plus variable TrueType control font; params={weightvector FT_Fixed array, len, weightvector_null, glyph_index, size}; output shape={FT_Error, returned vector length/values, face_flags variation bit, glyph metrics, cbox/bbox, render bytes}; comparison=exact C oracle error code, vector truncation/zero-fill/reset behavior, variation flag, and glyph output.

- id: ftmm.FT_Set_Named_Instance
  kind: function
  symbol: FT_Set_Named_Instance
  header: freetype/ftmm.h
  description: Public C API for selecting or clearing the current named variation instance.
  cases:
    - id: success_select_named_instance
      description: Selecting a valid one-based named instance sets face_index bits 16 through 30 and resets explicit variation coordinates.
    - id: success_clear_named_instance
      description: Instance index zero clears the named-instance bits and resets variation state.
    - id: success_adobe_mm_resets_default
      description: On Adobe MM fonts, the function resets the face to its default instance rather than selecting a named style.
    - id: error_invalid_instance_index
      description: Out-of-range named instance indexes return the same C error and leave prior observable state unchanged.
    - id: output_changes_to_named_instance
      description: Named instance selection updates glyph metrics, PostScript-name construction, outlines, and render bytes exactly as C.
  # needs-input: operation=FT_Set_Named_Instance followed by coordinate getters, name query, and glyph load/render; fixture_asset=variable font with at least two named instances and a synthesized default instance case, plus Adobe MM fixture; params={initial_face_index, instance_index, previous_design_or_blend_coords, glyph_index, size}; output shape={FT_Error, face_index bits, face_flags variation bit, design/blend coordinate arrays, PostScript name, metrics, cbox/bbox, bitmap bytes}; comparison=exact C oracle error code, bit encoding, reset behavior, coordinate state, name output, and glyph output.

- id: ftmm.FT_Set_Var_Blend_Coordinates
  kind: function
  symbol: FT_Set_Var_Blend_Coordinates
  header: freetype/ftmm.h
  description: Public C API alias for setting normalized variation blend coordinates.
  cases:
    - id: success_aliases_mm_blend_setter
      description: Uses the same multiple-master service path as FT_Set_MM_Blend_Coordinates for supported variation faces.
    - id: success_partial_extra_and_reset
      description: Fewer coordinates use defaults, excess coordinates are ignored, and num_coords zero with null coords resets to the selected default.
    - id: success_variation_flag_matches_c
      description: C sets or clears FT_FACE_FLAG_VARIATION according to service results, including the internal variable-state signal.
    - id: error_null_coords_with_nonzero_count
      description: Nonzero num_coords with null coords returns Invalid_Argument before service dispatch.
    - id: output_changes_for_active_blend
      description: Non-default blend coordinates affect metrics, geometry, and render bytes exactly like the C oracle.
  # needs-input: operation=FT_Set_Var_Blend_Coordinates followed by FT_Get_Var_Blend_Coordinates and glyph load/render; fixture_asset=single-axis and multi-axis variable fonts with avar/gvar/HVAR/MVAR-sensitive glyphs; params={blend_coords, num_coords, coords_null, glyph_index, size, load_flags}; output shape={FT_Error, normalized coordinates, face_flags variation bit, metrics, cbox/bbox, bitmap descriptor/bytes}; comparison=exact C oracle error code, alias coordinate behavior, variation flag, metrics, geometry, and render bytes.

- id: ftmm.FT_Set_Var_Design_Coordinates
  kind: function
  symbol: FT_Set_Var_Design_Coordinates
  header: freetype/ftmm.h
  description: Public C API for setting design-space coordinates for Adobe MM, TrueType GX, and OpenType variation fonts.
  cases:
    - id: success_set_design_coordinates
      description: Sets 16.16 design coordinates for TrueType/OpenType variable fonts and updates C variation state.
    - id: success_partial_extra_and_reset
      description: Missing axes use defaults, excess axes are ignored, and zero coordinates with null pointer resets to the current named instance or base default.
    - id: success_updates_metrics_variations
      description: When the font has MVAR/HVAR/VVAR service support, C adjusts face and glyph metrics after coordinate changes.
    - id: error_null_coords_with_nonzero_count
      description: Nonzero num_coords with a null coords pointer returns Invalid_Argument before service dispatch.
    - id: output_changes_for_design_coordinates
      description: Non-default design coordinates affect glyph deltas, cbox/bbox, and rendered output exactly as C.
  # needs-input: operation=FT_Set_Var_Design_Coordinates followed by coordinate getters and glyph load/render; fixture_asset=variable fonts with wght/wdth/opsz axes, avar mapping, gvar glyph deltas, and HVAR/VVAR/MVAR metric deltas; params={design_coords FT_Fixed array, num_coords, coords_null, glyph_index, size, load_flags}; output shape={FT_Error, design coords, blend coords, face_flags variation bit, face/size metrics, glyph metrics, cbox/bbox, bitmap bytes}; comparison=exact C oracle error code, coordinate normalization, variation flag, metrics, geometry, and render bytes.

- id: ftmm.FT_MM_Axis
  kind: record
  symbol: FT_MM_Axis
  header: freetype/ftmm.h
  description: Public Adobe Multiple Master axis descriptor record.
  cases:
    - id: layout_matches_c
      description: Size, alignment, and field offsets for name, minimum, and maximum match the pinned C header.
    - id: field_types_match_c
      description: name is FT_String*, and minimum/maximum are FT_Long design coordinates.
    - id: populated_by_get_multi_master
      description: FT_Get_Multi_Master fills axis names and min/max design coordinates for Adobe MM fonts exactly as C.
  # needs-input: operation=FT_Get_Multi_Master; fixture_asset=Adobe Multiple Master font with multiple named axes; params={face_index}; output shape={FT_Error, FT_Multi_Master.num_axis, each FT_MM_Axis name/minimum/maximum}; comparison=exact C oracle layout metadata and field values including pointer nullability/string bytes.

- id: ftmm.FT_MM_Var
  kind: record
  symbol: FT_MM_Var
  header: freetype/ftmm.h
  description: Public allocated variation descriptor returned by FT_Get_MM_Var.
  cases:
    - id: layout_matches_c
      description: Size, alignment, and field offsets for num_axis, num_designs, num_namedstyles, axis, and namedstyle match the pinned C header.
    - id: ownership_matches_c
      description: The descriptor is allocated by FT_Get_MM_Var and released with FT_Done_MM_Var using the owning library.
    - id: populated_for_variable_true_type
      description: Variable TrueType/OpenType faces expose axis and namedstyle arrays with C-compatible counts and pointer nullability.
    - id: populated_for_adobe_mm
      description: Adobe MM faces report zero named styles and Adobe-specific num_designs/axis values.
  # needs-input: operation=FT_Get_MM_Var and FT_Done_MM_Var; fixture_asset=multi-axis variable TrueType font with named instances, hidden-axis font, and Adobe MM fixture; params={face_index, call_done=true}; output shape={FT_Error, descriptor layout, counts, axis array, namedstyle array, allocation/free event class}; comparison=exact C oracle field values, pointer nullability, array contents, hidden-axis storage adjacency, and successful release behavior.

- id: ftmm.FT_Multi_Master
  kind: record
  symbol: FT_Multi_Master
  header: freetype/ftmm.h
  description: Public Adobe Multiple Master descriptor with inline FT_MM_Axis array.
  cases:
    - id: layout_matches_c
      description: Size, alignment, and field offsets for num_axis, num_designs, and inline axis array match the pinned C header.
    - id: inline_axis_capacity_matches_c
      description: The axis array contains T1_MAX_MM_AXIS entries inline and is not a pointer.
    - id: populated_by_adobe_mm_service
      description: FT_Get_Multi_Master fills num_axis, num_designs, and axis descriptors for Adobe MM fonts and rejects non-MM variation faces.
  # needs-input: operation=FT_Get_Multi_Master; fixture_asset=Adobe Multiple Master font plus non-MM variable TrueType control font; params={face_index}; output shape={FT_Error, num_axis, num_designs, inline axis entries including unused slots}; comparison=exact C oracle error code, layout metadata, axis capacity, and populated field values.

- id: ftmm.FT_Var_Axis
  kind: record
  symbol: FT_Var_Axis
  header: freetype/ftmm.h
  description: Public axis descriptor used inside FT_MM_Var for Adobe MM and OpenType variation fonts.
  cases:
    - id: layout_matches_c
      description: Size, alignment, and field offsets for name, minimum, def, maximum, tag, and strid match the pinned C header.
    - id: variable_font_axis_values
      description: For OpenType variation fonts, min/default/max are 16.16 values and tag/strid match fvar/name-table data.
    - id: adobe_mm_axis_values
      description: For Adobe MM fonts, coordinates are whole-number fixed values and FreeType supplies tag/name data where available.
    - id: hidden_axis_flag_adjacent_storage
      description: Hidden-axis flags are not fields in this record; FT_Get_Var_Axis_Flags reads the separate C storage after FT_MM_Var.
  # needs-input: operation=FT_Get_MM_Var plus FT_Get_Var_Axis_Flags; fixture_asset=variable fonts with wght/wdth/opsz axes and one hidden axis, plus Adobe MM fixture; params={axis_index}; output shape={FT_Error, FT_Var_Axis fields, axis flag value, name string bytes}; comparison=exact C oracle field values, tag numeric values, string ID/name bytes, and hidden flag.

- id: ftmm.FT_Var_Named_Style
  kind: record
  symbol: FT_Var_Named_Style
  header: freetype/ftmm.h
  description: Public named instance descriptor used inside FT_MM_Var for TrueType GX/OpenType variation fonts.
  cases:
    - id: layout_matches_c
      description: Size, alignment, and field offsets for coords, strid, and psid match the pinned C header.
    - id: coordinates_array_matches_axis_count
      description: coords points to one 16.16 design coordinate per variation axis for each named style.
    - id: psid_missing_sentinel_matches_c
      description: A missing PostScript name uses the public 0xFFFF psid sentinel exactly as C exposes it.
    - id: selected_instance_matches_descriptor
      description: FT_Set_Named_Instance selects coordinates that match the corresponding namedstyle descriptor.
  # needs-input: operation=FT_Get_MM_Var followed by FT_Set_Named_Instance for each style; fixture_asset=variable font with multiple named instances including one missing PostScript name; params={instance_index, axis_count}; output shape={FT_Error, namedstyle coords array, strid, psid, selected design coordinates, PostScript name}; comparison=exact C oracle descriptor fields, coordinate values, sentinel use, and selected-instance state.

- id: ftmodapi.FT_DEBUG_HOOK_TRUETYPE
  kind: constant
  symbol: FT_DEBUG_HOOK_TRUETYPE
  header: freetype/ftmodapi.h
  description: Public debug-hook index macro for the TrueType bytecode debugger hook.
  cases:
    - id: value_matches_header
      description: Value matches the pinned C public header.
    - id: debug_hook_index_import_contract
      description: FT_Set_Debug_Hook accepts this index as the TrueType hook slot without changing the macro value across import paths.
  # needs-input: operation=constant import and FT_Set_Debug_Hook; fixture_asset=TrueType font with bytecode instructions; params={hook_index:FT_DEBUG_HOOK_TRUETYPE, hook_pointer_null_or_valid, glyph_index, load_flags}; output shape={macro value, FT_Error/void call status, hook invocation event class during glyph load}; comparison=exact C oracle macro value and debug-hook slot behavior when debug hooks are enabled.

- id: ftmodapi.FT_MODULE_DRIVER_HAS_HINTER
  kind: constant
  symbol: FT_MODULE_DRIVER_HAS_HINTER
  header: freetype/ftmodapi.h
  description: Public module flag bit indicating that a font driver provides its own hinter.
  cases:
    - id: value_matches_header
      description: Value is 0x400 in the pinned C public header.
    - id: present_on_native_hinter_drivers
      description: TrueType builds with bytecode interpreter, Type1, CID, Type42, and CFF driver class flags expose this bit according to C build configuration.
  # needs-input: operation=FT_Get_Module then inspect public module class flags through C ABI surface; fixture_asset=library with default modules and representative TrueType/Type1/CFF faces; params={module_name, build_options}; output shape={macro value, module_flags bitset, driver name}; comparison=exact C oracle macro value and bit presence/absence per module/build.

- id: ftmodapi.FT_MODULE_DRIVER_HINTS_LIGHTLY
  kind: constant
  symbol: FT_MODULE_DRIVER_HINTS_LIGHTLY
  header: freetype/ftmodapi.h
  description: Public module flag bit indicating that a driver's hinter produces LIGHT hints.
  cases:
    - id: value_matches_header
      description: Value is 0x800 in the pinned C public header.
    - id: cff_driver_sets_light_hint_flag
      description: The CFF driver class combines this bit with font-driver, scalable, and has-hinter flags.
  # needs-input: operation=FT_Get_Module for cff driver and load a CFF face with light hint target; fixture_asset=CFF/OpenType font; params={module_name:cff, load_target:FT_LOAD_TARGET_LIGHT, glyph_index, size}; output shape={macro value, module_flags bitset, glyph metrics/cbox/render bytes}; comparison=exact C oracle macro value, flag bitset, and light-hinted glyph output.

- id: ftmodapi.FT_MODULE_DRIVER_NO_OUTLINES
  kind: constant
  symbol: FT_MODULE_DRIVER_NO_OUTLINES
  header: freetype/ftmodapi.h
  description: Public module flag bit indicating that a font driver does not support vector outlines.
  cases:
    - id: value_matches_header
      description: Value is 0x200 in the pinned C public header.
    - id: bitmap_driver_flags_match_c
      description: Bitmap-only drivers such as BDF, PCF, and Windows FNT expose this bit in their C module class flags.
  # needs-input: operation=FT_Get_Module plus open/load bitmap-only fonts; fixture_asset=BDF, PCF, and Windows FNT bitmap fonts; params={module_name, glyph_index, size}; output shape={macro value, module_flags bitset, glyph format, bitmap descriptor/bytes, outline pointer/null class}; comparison=exact C oracle macro value, driver flag bitset, no-outline behavior, and bitmap output.

- id: ftmodapi.FT_MODULE_DRIVER_SCALABLE
  kind: constant
  symbol: FT_MODULE_DRIVER_SCALABLE
  header: freetype/ftmodapi.h
  description: Public module flag bit indicating that a font driver supports scalable fonts.
  cases:
    - id: value_matches_header
      description: Value is 0x100 in the pinned C public header.
    - id: scalable_driver_flags_match_c
      description: Scalable drivers such as TrueType, CFF, Type1, CID, and Type42 expose this bit in their C module class flags.
  # needs-input: operation=FT_Get_Module plus open/load scalable fonts; fixture_asset=TrueType, CFF, Type1, CID, and Type42 scalable font fixtures; params={module_name, glyph_index, size}; output shape={macro value, module_flags bitset, glyph outline metrics/cbox/render bytes}; comparison=exact C oracle macro value, driver flag bitset, scalable outline behavior, and glyph output.

- id: ftmodapi.FT_MODULE_FONT_DRIVER
  kind: constant
  symbol: FT_MODULE_FONT_DRIVER
  header: freetype/ftmodapi.h
  description: Public module flag bit indicating that a module is a font driver.
  cases:
    - id: value_matches_header
      description: Value is 1 in the pinned C public header.
    - id: font_driver_modules_set_bit
      description: Font driver modules set this bit while non-driver modules such as autofitter, psnames, renderers, and validators do not.
  # needs-input: operation=FT_Get_Module over default module names; fixture_asset=library with default modules loaded; params={module_names:[truetype,cff,type1,bdf,pcf,autofitter,smooth,psnames]}; output shape={macro value, module_flags bitset, driver/non-driver classification}; comparison=exact C oracle macro value and module classification bitset.

- id: ftmodapi.FT_MODULE_HINTER
  kind: constant
  symbol: FT_MODULE_HINTER
  header: freetype/ftmodapi.h
  description: Public module flag bit indicating that a module is a glyph hinter.
  cases:
    - id: value_matches_header
      description: Value is 4 in the pinned C public header.
    - id: autofitter_module_sets_hinter_bit
      description: The autofitter module class exposes this bit while font drivers with native hinters use FT_MODULE_DRIVER_HAS_HINTER instead.
  # needs-input: operation=FT_Get_Module for autofitter and native-hinting font drivers; fixture_asset=library with default modules and a TrueType font for hinted load comparison; params={module_names:[autofitter,truetype,type1,cff], glyph_index, load_flags}; output shape={macro value, module_flags bitsets, hinted glyph metrics/cbox/render bytes}; comparison=exact C oracle macro value, module bit classification, and distinction from native driver-hinter flags.
