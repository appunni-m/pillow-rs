- id: ttnameid.TT_UCR_SYRIAC
  kind: constant
  symbol: TT_UCR_SYRIAC
  header: freetype/ttnameid.h
  description: Public OS/2 Unicode-range bit macro for Syriac; pinned FreeType defines it as (1UL << 7) for U+0700-U+074F.
  cases:
    - id: value_matches_header
      description: Macro expression is exactly (1UL << 7), evaluating to 128, as defined by pinned freetype/ttnameid.h.
    - id: public_import_contract
      description: A C translation unit including <freetype/ttnameid.h> can reference TT_UCR_SYRIAC as a public preprocessor constant.
    - id: representative_os2_unicode_range_match
      description: A representative Syriac font reports the Syriac unicode-range bit through OS/2 fields exactly like the C oracle.
  # needs-input: operation=FT_Get_Sfnt_Table(face, ft_sfnt_os2); fixture_asset=input/fonts/os2-ranges/syriac.ttf; params={codepoints=[U+0710]}; expected output shape={FT_Error, has_os2_table, ulUnicodeRange1, ulUnicodeRange2, ulUnicodeRange3, ulUnicodeRange4}; comparison=exact C oracle status and OS/2 unicode-range fields.

