- id: tttables.TT_OS2
  kind: record
  symbol: TT_OS2
  header: freetype/tttables.h
  description: Public record modeling the TrueType/OpenType OS/2 table returned by FT_Get_Sfnt_Table with FT_SFNT_OS2.
  cases:
    - id: layout_matches_c
      description: Size, alignment, and field offsets match the pinned C TT_OS2 struct, including panose[10], ulUnicodeRange1..4, achVendID[4], version-gated code-page, metric, and optical-size fields.
    - id: field_order_matches_header
      description: Field order exactly follows freetype/tttables.h from version through usUpperOpticalPointSize; the loader reads the base 78-byte frame, optional version 1, version 2, and version 5 tails in that order.
    - id: public_import_contract
      description: A C translation unit including <freetype/tttables.h> can name TT_OS2 and use TT_OS2* as the cast target for FT_Get_Sfnt_Table(face, FT_SFNT_OS2).
    - id: sfnt_table_present_runtime
      description: C oracle returns a non-null TT_OS2 pointer for an SFNT face with an OS/2 table and exposes exact parsed scalar and array fields.
    - id: sfnt_table_missing_runtime
      description: C oracle returns NULL for FT_SFNT_OS2 when the face is SFNT but the OS/2 table is absent and face->os2.version is the 0xFFFF missing-table sentinel.
  # needs-input: operation=FT_Get_Sfnt_Table; fixture_asset=input/fonts/sfnt/os2-v5-full.ttf; params={tag=FT_SFNT_OS2}; expected output shape={pointer_null, version, xAvgCharWidth, usWeightClass, usWidthClass, fsType, ySubscriptXSize, ySubscriptYSize, ySubscriptXOffset, ySubscriptYOffset, ySuperscriptXSize, ySuperscriptYSize, ySuperscriptXOffset, ySuperscriptYOffset, yStrikeoutSize, yStrikeoutPosition, sFamilyClass, panose[10], ulUnicodeRange1, ulUnicodeRange2, ulUnicodeRange3, ulUnicodeRange4, achVendID[4], fsSelection, usFirstCharIndex, usLastCharIndex, sTypoAscender, sTypoDescender, sTypoLineGap, usWinAscent, usWinDescent, ulCodePageRange1, ulCodePageRange2, sxHeight, sCapHeight, usDefaultChar, usBreakChar, usMaxContext, usLowerOpticalPointSize, usUpperOpticalPointSize}; comparison=exact C oracle field values and array bytes, with no raw pointer-address comparison.
  # needs-input: operation=FT_Get_Sfnt_Table; fixture_asset=input/fonts/sfnt/mac-no-os2.ttf; params={tag=FT_SFNT_OS2}; expected output shape={pointer_null}; comparison=exact C oracle nullness for missing optional OS/2 table.

- id: tttables.TT_PCLT
  kind: record
  symbol: TT_PCLT
  header: freetype/tttables.h
  description: Public record modeling the optional TrueType PCLT table returned by FT_Get_Sfnt_Table with FT_SFNT_PCLT.
  cases:
    - id: layout_matches_c
      description: Size, alignment, and field offsets match the pinned C TT_PCLT struct, including TypeFace[16], CharacterComplement[8], FileName[6], signed char fields, and trailing byte fields.
    - id: field_order_matches_header
      description: Field order exactly follows freetype/tttables.h from Version through Reserved; tt_face_load_pclt reads the 54-byte frame in the same sequence.
    - id: public_import_contract
      description: A C translation unit including <freetype/tttables.h> can name TT_PCLT and use TT_PCLT* as the cast target for FT_Get_Sfnt_Table(face, FT_SFNT_PCLT).
    - id: sfnt_table_present_runtime
      description: C oracle returns a non-null TT_PCLT pointer only when the optional PCLT table was loaded and pclt.Version is non-zero.
    - id: sfnt_table_missing_runtime
      description: C oracle returns NULL for FT_SFNT_PCLT when the SFNT face has no PCLT table or the parsed Version field remains zero.
  # needs-input: operation=FT_Get_Sfnt_Table; fixture_asset=input/fonts/sfnt/pclt-present.ttf; params={tag=FT_SFNT_PCLT}; expected output shape={pointer_null, Version, FontNumber, Pitch, xHeight, Style, TypeFamily, CapHeight, SymbolSet, TypeFace[16], CharacterComplement[8], FileName[6], StrokeWeight, WidthType, SerifStyle, Reserved}; comparison=exact C oracle field values and fixed-array bytes, with signed FT_Char values preserved.
  # needs-input: operation=FT_Get_Sfnt_Table; fixture_asset=input/fonts/sfnt/pclt-missing.ttf; params={tag=FT_SFNT_PCLT}; expected output shape={pointer_null}; comparison=exact C oracle nullness for missing optional PCLT table.

- id: tttables.TT_Postscript
  kind: record
  symbol: TT_Postscript
  header: freetype/tttables.h
  description: Public record modeling the TrueType/OpenType post table scalar header returned by FT_Get_Sfnt_Table with FT_SFNT_POST.
  cases:
    - id: layout_matches_c
      description: Size, alignment, and field offsets match the pinned C TT_Postscript struct from FormatType through maxMemType1.
    - id: field_order_matches_header
      description: Field order exactly follows freetype/tttables.h; tt_face_load_post reads the 32-byte frame as FormatType, italicAngle, underlinePosition, underlineThickness, isFixedPitch, and the four memory bound fields.
    - id: public_import_contract
      description: A C translation unit including <freetype/tttables.h> can name TT_Postscript and use TT_Postscript* as the cast target for FT_Get_Sfnt_Table(face, FT_SFNT_POST).
    - id: sfnt_table_runtime
      description: C oracle returns the face-owned TT_Postscript record for FT_SFNT_POST and exposes exact scalar fields; glyph names are not part of this record.
    - id: invalid_post_format_error_runtime
      description: C oracle rejects unsupported post FormatType values during face load with Invalid_Post_Table_Format before this record can be used successfully.
  # needs-input: operation=FT_Get_Sfnt_Table; fixture_asset=input/fonts/sfnt/post-format-2.ttf; params={tag=FT_SFNT_POST}; expected output shape={pointer_null, FormatType, italicAngle, underlinePosition, underlineThickness, isFixedPitch, minMemType42, maxMemType42, minMemType1, maxMemType1}; comparison=exact C oracle field values, excluding glyph-name data by design.
  # needs-input: operation=FT_New_Face; fixture_asset=input/fonts/sfnt/post-invalid-format.ttf; params={}; expected output shape={FT_Error}; comparison=exact C oracle error classification Invalid_Post_Table_Format.

- id: tttables.TT_VertHeader
  kind: record
  symbol: TT_VertHeader
  header: freetype/tttables.h
  description: Public record modeling the TrueType/OpenType vertical header and vmtx linkage returned by FT_Get_Sfnt_Table with FT_SFNT_VHEA.
  cases:
    - id: layout_matches_c
      description: Size, alignment, and field offsets match the pinned C TT_VertHeader struct, including Reserved[4], number_Of_VMetrics, long_metrics, and short_metrics.
    - id: field_order_matches_header
      description: Field order exactly follows freetype/tttables.h and mirrors TT_HoriHeader shape while using vertical metric names from Version through short_metrics.
    - id: public_import_contract
      description: A C translation unit including <freetype/tttables.h> can name TT_VertHeader and use TT_VertHeader* as the cast target for FT_Get_Sfnt_Table(face, FT_SFNT_VHEA).
    - id: sfnt_table_present_runtime
      description: C oracle returns a non-null TT_VertHeader pointer for FT_SFNT_VHEA only when vertical_info is set and the vertical header/metrics tables are loaded.
    - id: sfnt_table_missing_runtime
      description: C oracle returns NULL for FT_SFNT_VHEA when an SFNT face has no vertical header information.
  # needs-input: operation=FT_Get_Sfnt_Table; fixture_asset=input/fonts/sfnt/vhea-vmtx-present.ttf; params={tag=FT_SFNT_VHEA}; expected output shape={pointer_null, Version, Ascender, Descender, Line_Gap, advance_Height_Max, min_Top_Side_Bearing, min_Bottom_Side_Bearing, yMax_Extent, caret_Slope_Rise, caret_Slope_Run, caret_Offset, Reserved[4], metric_Data_Format, number_Of_VMetrics, long_metrics_nullness, short_metrics_nullness}; comparison=exact C oracle field values and pointer nullness/identity class only, not raw process addresses.
  # needs-input: operation=FT_Get_Sfnt_Table; fixture_asset=input/fonts/sfnt/no-vhea.ttf; params={tag=FT_SFNT_VHEA}; expected output shape={pointer_null}; comparison=exact C oracle nullness for missing optional vertical header.
