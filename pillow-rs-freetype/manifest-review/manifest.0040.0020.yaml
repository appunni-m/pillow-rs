  cases:
    - id: value_matches_header
      description: Numeric value matches the pinned FreeType header, 1L << 15 (32768).
    - id: face_property_variation_selection
      description: Ubuntu.ttf can exercise FT_FACE_FLAG_VARIATION after selecting non-default variation coordinates, matching the C oracle.
      coverage:
