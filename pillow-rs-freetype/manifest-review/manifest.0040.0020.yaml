# Reviewed replacement entries for tests/manifest.yaml subjects[40..60).
# Sources: freetype/include/freetype/freetype.h and generated reference docs.
- id: freetype.FT_FACE_FLAG_CID_KEYED
  kind: flag
  symbol: FT_FACE_FLAG_CID_KEYED
  header: freetype/freetype.h
  description: FreeType public face_flags bit for CID-keyed faces.
  cases:
    - id: value_matches_header
      description: Numeric value matches the pinned FreeType header, 1L << 12 (4096).
# needs-input: face_flags semantic fixture for a CID-keyed non-SFNT face; call FT_New_Memory_Face, read FT_FaceRec.face_flags, compare FT_FACE_FLAG_CID_KEYED bit exactly against the C oracle, and include an FT_Load_Glyph invalid-CID case returning FT_Err_Invalid_Argument for an absent CID.

- id: freetype.FT_FACE_FLAG_COLOR
  kind: flag
  symbol: FT_FACE_FLAG_COLOR
  header: freetype/freetype.h
  description: FreeType public face_flags bit for faces with color glyph tables.
  cases:
    - id: value_matches_header
      description: Numeric value matches the pinned FreeType header, 1L << 14 (16384).
# needs-input: face_flags semantic fixture using a font with COLR/CPAL, CBDT/CBLC, sbix, or SVG table; call FT_New_Memory_Face, read FT_FaceRec.face_flags, and compare the FT_FACE_FLAG_COLOR bit exactly against the C oracle. Existing fixture fonts have no color glyph tables.

- id: freetype.FT_FACE_FLAG_EXTERNAL_STREAM
  kind: flag
  symbol: FT_FACE_FLAG_EXTERNAL_STREAM
  header: freetype/freetype.h
  description: FreeType public face_flags bit reserved for client-provided streams.
  cases:
    - id: value_matches_header
      description: Numeric value matches the pinned FreeType header, 1L << 10 (1024).
# needs-input: C ABI stream fixture using FT_Open_Face with FT_OPEN_STREAM and a custom FT_Stream; verify FT_FaceRec.face_flags has FT_FACE_FLAG_EXTERNAL_STREAM and that FT_Done_Face does not destroy the client-owned stream. This is not meaningful for memory-face fixtures.

- id: freetype.FT_FACE_FLAG_FAST_GLYPHS
  kind: flag
  symbol: FT_FACE_FLAG_FAST_GLYPHS
  header: freetype/freetype.h
  description: Deprecated FreeType public face_flags bit; docs say not to use or test it.
  cases:
    - id: value_matches_header
      description: Numeric value matches the pinned FreeType header, 1L << 7 (128).
# needs-input: no semantic font fixture should be added unless a pinned FreeType compatibility test requires it; the public docs mark FT_FACE_FLAG_FAST_GLYPHS deprecated and say not to use or test it.

- id: freetype.FT_FACE_FLAG_FIXED_SIZES
  kind: flag
  symbol: FT_FACE_FLAG_FIXED_SIZES
  header: freetype/freetype.h
  description: FreeType public face_flags bit for faces with bitmap strikes.
  cases:
    - id: value_matches_header
      description: Numeric value matches the pinned FreeType header, 1L << 1 (2).
# needs-input: face_flags semantic fixture using a font with bitmap strikes, for example CBLC/CBDT, EBLC/EBDT, bdat/bloc, or bitmap-only sfnt; call FT_New_Memory_Face, read FT_FaceRec.face_flags, num_fixed_sizes, and available_sizes, and compare the FT_FACE_FLAG_FIXED_SIZES bit and strike metadata exactly against the C oracle. Existing fixture fonts have no bitmap strike tables.

- id: freetype.FT_FACE_FLAG_FIXED_WIDTH
  kind: flag
  symbol: FT_FACE_FLAG_FIXED_WIDTH
  header: freetype/freetype.h
  description: FreeType public face_flags bit for fixed-width character faces.
  cases:
    - id: value_matches_header
      description: Numeric value matches the pinned FreeType header, 1L << 2 (4).
    - id: face_property_fixed_width_font
      description: DejaVuSansMono.ttf sets the fixed-width bit in FT_FaceRec.face_flags, matching the C oracle.
      coverage:
        font_variability:
          folder: deprecated/fonts_autohint
          sizes: [20]

