          sizes: [20]
# needs-input: variation-state semantic fixture using Ubuntu.ttf or another fvar font; call FT_New_Memory_Face, first assert FT_FACE_FLAG_MULTIPLE_MASTERS without FT_FACE_FLAG_VARIATION at the default instance, then call FT_Set_Var_Design_Coordinates or FT_Set_MM_Design_Coordinates with non-default coordinates and compare the FT_FACE_FLAG_VARIATION bit exactly against the C oracle.

