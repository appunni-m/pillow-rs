- id: ftcolor.FT_Get_Colorline_Stops
  kind: function
  symbol: FT_Get_Colorline_Stops
  header: freetype/ftcolor.h
  description: FreeType C API function that iterates COLR v1 gradient color stops from an FT_ColorLine iterator.
  coverage:
    font_variability: required
  cases:
    - id: success_iterates_static_colorline_stops
      description: Valid COLR v1 gradient color lines return 1 for each stop, write stop_offset as 16.16 converted from F2Dot14, write palette_index and alpha in ftcolor.h field order, advance iterator->p, and increment current_color_stop like ttcolr.c.
    - id: success_iterates_variable_colorline_stops
      description: Variable COLR v1 color lines advance over VarIdxBase entries and, when GX variation support is active, apply C-compatible deltas to stop_offset and alpha while preserving the public output shape.
    - id: end_of_iteration
      description: When current_color_stop is greater than or equal to num_color_stops, returns 0 and preserves color_stop and iterator state according to the pinned C source behavior.
    - id: error_null_or_invalid_iterator
      description: Null iterator, missing COLR table, out-of-range iterator->p, or truncated color stop data return 0 without fabricating output.
    - id: error_null_color_stop_policy
      description: Null color_stop behavior is classified against the pinned C oracle or, if unsafe in C, the project ABI safety policy is documented explicitly.
  # needs-input: operation=FT_Get_Color_Glyph_Paint, FT_Get_Paint, then FT_Get_Colorline_Stops; fixture_asset=COLR v1 font with static linear/radial/sweep gradients containing PAD, REPEAT, REFLECT color lines and at least 0, 1, 2, and 3 stops; params iterate each returned FT_ColorLine until FT_Get_Colorline_Stops returns 0, plus null face, null iterator, null color_stop, exhausted iterator, and corrupted/truncated COLR controls; expected output shape=per-call FT_Bool, FT_ColorStop { stop_offset, color { palette_index, alpha } }, and FT_ColorStopIterator { num_color_stops, current_color_stop, p/null-class, read_variable }; comparison=exact C oracle scalar equality, iterator progression/end equality, and output preservation/null-safety classification.
  # needs-input: operation=FT_Get_Colorline_Stops; fixture_asset=variable COLR v1 gradient font with VarColorLine and VarColorStop records; params at default coordinates and at non-default FT_Set_Var_Design_Coordinates values; expected output shape=interpolated FT_ColorStop sequence plus iterator state; comparison=exact C oracle 16.16 stop_offset and F2Dot14 alpha equality, including VarIdxBase cursor advancement.

- id: ftcolor.FT_Get_Paint
  kind: function
  symbol: FT_Get_Paint
  header: freetype/ftcolor.h
  description: FreeType C API function that resolves an FT_OpaquePaint into a public FT_COLR_Paint record for COLR v1 paint tables.
  coverage:
    font_variability: required
  cases:
    - id: success_resolves_each_supported_paint_format
      description: Valid opaque paint objects resolve to the same FT_COLR_Paint format and union member fields as C for COLR layers, solid, glyph, COLR glyph, linear gradient, radial gradient, sweep gradient, transform, translate, scale, rotate, skew, and composite paints.
    - id: success_inserts_root_transform
      description: Opaque paints with insert_root_transform set return a TRANSFORM paint that wraps the original opaque paint and reports the active size scale and FT_Set_Transform matrix/delta converted to FT_Affine23 16.16 fields like ttcolr.c.
    - id: error_null_or_missing_colr
      description: Null or non-COLR v1 face state, missing base glyph list, null COLR table, invalid opaque pointer, unsupported paint format, and truncated child tables return 0 and preserve the destination paint according to the C oracle.
    - id: error_null_output_policy
      description: Null FT_COLR_Paint output behavior is classified against pinned C behavior or the project ABI safety policy if the C path dereferences it.
  # needs-input: operation=FT_Get_Color_Glyph_Paint and FT_Get_Paint; fixture_asset=COLR v1 font with one glyph per paint format, including nested paints and transforms; params root_transform values NO_ROOT_TRANSFORM, ROOT_TRANSFORM, and varying FT_Set_Char_Size/FT_Set_Transform before FT_Get_Paint; expected output shape=FT_Bool plus FT_COLR_Paint { format, active union member fields, opaque child paint p/null-class and insert_root_transform }; comparison=exact C oracle enum/scalar/field equality and output preservation on 0 return.
  # needs-input: operation=FT_Get_Paint; fixture_asset=malformed COLR v1 font variants with bad paint offsets, unsupported formats, invalid color line offsets, invalid child paint offsets, and truncated records; params opaque paints obtained from root and layer paths where possible; expected output shape=FT_Bool plus destination FT_COLR_Paint sentinel preservation/mutation; comparison=exact C oracle return and write behavior.

- id: ftcolor.FT_Get_Paint_Layers
  kind: function
  symbol: FT_Get_Paint_Layers
  header: freetype/ftcolor.h
  description: FreeType C API function that iterates FT_OpaquePaint layer references from an FT_PaintColrLayers iterator.
  coverage:
    font_variability: required
  cases:
    - id: success_iterates_colr_v1_layers
      description: Valid FT_PaintColrLayers iterators return 1 for each layer, write FT_OpaquePaint.p and insert_root_transform, advance iterator->p, and increment iterator->layer like ttcolr.c.
    - id: end_of_iteration
      description: When iterator->layer equals iterator->num_layers, returns 0 and preserves output paint and iterator state according to the C oracle.
    - id: error_invalid_iterator_or_paint_offset
      description: Invalid iterator cursors, missing COLR data, out-of-range layer offsets, and paint offsets outside the v1 paint table return 0 without creating a usable opaque paint.
    - id: error_null_arguments_policy
      description: Null face, iterator, and output paint behavior is classified against pinned C behavior or the project ABI safety policy if the C path dereferences them.
  # needs-input: operation=FT_Get_Color_Glyph_Paint, FT_Get_Paint for FT_COLR_PAINTFORMAT_COLR_LAYERS, then FT_Get_Paint_Layers; fixture_asset=COLR v1 font with PaintColrLayers containing 0, 1, 2, and many layer offsets, including nested layer paints; params iterate until 0 return, then call once more, plus malformed layer-list offsets and null argument controls; expected output shape=per-call FT_Bool, FT_LayerIterator { num_layers, layer, p/null-class }, and FT_OpaquePaint { p/null-class, insert_root_transform }; comparison=exact C oracle scalar equality, iterator progression/end equality, and output preservation/null-safety classification.

- id: ftcolor.FT_Palette_Data_Get
  kind: function
  symbol: FT_Palette_Data_Get
  header: freetype/ftcolor.h
  description: FreeType C API function that retrieves read-only CPAL palette metadata into FT_Palette_Data.
  coverage:
    font_variability: required
  cases:
    - id: success_sfnt_cpal_palette_data
      description: SFNT faces with CPAL data return FT_Err_Ok and write num_palettes, palette_name_ids, palette_flags, num_palette_entries, and palette_entry_name_ids exactly as C exposes them.
    - id: success_sfnt_without_cpal
      description: SFNT faces without CPAL return FT_Err_Ok and write C-compatible zero/null FT_Palette_Data values.
    - id: success_non_sfnt_null_palette_data
      description: Non-SFNT faces return FT_Err_Ok and write the ftcolor.c null_palette_data record when color layers are compiled in.
    - id: error_null_face_or_output
      description: Null face returns Invalid_Face_Handle and null apalette returns Invalid_Argument, with destination preservation verified against C.
    - id: error_color_layers_disabled
      description: Builds without TT_CONFIG_OPTION_COLOR_LAYERS return Unimplemented_Feature and preserve outputs like the pinned C fallback.
  # needs-input: operation=FT_Palette_Data_Get; fixture_asset=CPAL/COLR font with palette labels, palette flags, entry labels, multiple palettes and entries, plus SFNT without CPAL and non-SFNT control if supported; params valid face, null face, null apalette, and sentinel-initialized FT_Palette_Data; expected output shape=FT_Error plus FT_Palette_Data { num_palettes, palette_name_ids array/null, palette_flags array/null, num_palette_entries, palette_entry_name_ids array/null }; comparison=exact C oracle error, scalar values, array contents/name-id 0xFFFF mapping, pointer-null classification, and output preservation on errors.

- id: ftcolor.FT_Palette_Select
  kind: function
  symbol: FT_Palette_Select
  header: freetype/ftcolor.h
  description: FreeType C API function that activates a CPAL palette and optionally returns the mutable FT_Color entry array managed by FreeType.
  coverage:
    font_variability: required
  cases:
    - id: success_selects_palette_and_returns_entries
      description: Valid palette indexes return FT_Err_Ok, set the active palette, and write an FT_Color array whose BGRA entries exactly match the selected CPAL palette.
    - id: success_null_output_selects_without_return
      description: A null apalette still selects the palette and returns FT_Err_Ok when the palette index is valid, matching ftcolor.h.
    - id: success_reselect_resets_user_modifications
      description: Reselecting the same palette after modifying returned entries resets colors to original CPAL values like C FreeType.
    - id: success_non_sfnt_returns_null_palette
      description: Non-SFNT faces return FT_Err_Ok and write NULL through apalette when the output pointer is provided.
    - id: error_null_face_or_invalid_palette_index
      description: Null face and out-of-range palette indexes return the pinned C error and preserve or write apalette exactly as C does.
    - id: error_color_layers_disabled
      description: Builds without TT_CONFIG_OPTION_COLOR_LAYERS return Unimplemented_Feature and preserve outputs like the pinned C fallback.
  # needs-input: operation=FT_Palette_Data_Get and FT_Palette_Select; fixture_asset=CPAL/COLR font with at least two palettes and distinct BGRA values; params palette indexes 0, last valid, out-of-range, null apalette, non-null apalette, modify returned palette entry then reselect; expected output shape=FT_Error plus active palette index side effect and FT_Color array { blue, green, red, alpha } or null; comparison=exact C oracle error, BGRA byte equality, pointer-null classification, reset behavior, and output preservation on errors.

- id: ftcolor.FT_Palette_Set_Foreground_Color
  kind: function
  symbol: FT_Palette_Set_Foreground_Color
  header: freetype/ftcolor.h
  description: FreeType C API function that sets the COLR foreground color used for palette index 0xFFFF.
  coverage:
    font_variability: required
  cases:
    - id: success_sets_sfnt_foreground_color
      description: Valid SFNT faces return FT_Err_Ok and later COLR rendering or blending observes the exact supplied FT_Color BGRA foreground color for palette index 0xFFFF.
    - id: success_non_sfnt_noop
      description: Non-SFNT faces return FT_Err_Ok without storing a foreground color, matching ftcolor.c.
    - id: default_foreground_color_policy
      description: Without an explicit foreground color, C-compatible default foreground is opaque white for dark-background palettes and opaque black otherwise.
    - id: error_null_face
      description: Null face returns Invalid_Face_Handle and no foreground state is changed.
    - id: error_color_layers_disabled
      description: Builds without TT_CONFIG_OPTION_COLOR_LAYERS return Unimplemented_Feature.
  # needs-input: operation=FT_Palette_Select, FT_Palette_Set_Foreground_Color, and render/blend path for COLR palette index 0xFFFF; fixture_asset=COLR/CPAL font with a layer or COLR v1 solid paint using palette_index 0xFFFF and palette flags for dark and non-dark backgrounds; params foreground colors including transparent, semi-transparent, opaque black, and opaque white; expected output shape=FT_Error plus rendered/blended BGRA or public layer color record for foreground index; comparison=exact C oracle error, BGRA byte equality, default foreground selection, and no-op behavior for non-SFNT.

- id: ftcolor.FT_Affine23
  kind: record
  symbol: FT_Affine23
  header: freetype/ftcolor.h
  description: FreeType public 2x3 affine transform record from freetype/ftcolor.h with 16.16 fixed-point coefficients.
  cases:
    - id: layout_matches_c
      description: Size, alignment, and field offsets for xx, xy, dx, yx, yy, and dy match the pinned C header.
    - id: field_order_matches_c
      description: Field order is xx, xy, dx, yx, yy, dy exactly, preserving the C row layout used by root transforms and PaintTransform.
    - id: root_transform_values
      description: FT_Get_Paint root-transform output writes FT_Affine23 scale, matrix, and translation fields in C-compatible 16.16 units.
  # needs-input: operation=FT_Get_Color_Glyph_Paint and FT_Get_Paint with root transform; fixture_asset=COLR v1 font with a root paint; params multiple sizes plus FT_Set_Transform matrix and delta; expected output shape=FT_COLR_Paint TRANSFORM with FT_Affine23 { xx, xy, dx, yx, yy, dy }; comparison=exact C oracle field equality and layout metadata equality.

- id: ftcolor.FT_ClipBox
  kind: record
  symbol: FT_ClipBox
  header: freetype/ftcolor.h
  description: FreeType public COLR v1 clip box record from freetype/ftcolor.h.
  cases:
    - id: layout_matches_c
