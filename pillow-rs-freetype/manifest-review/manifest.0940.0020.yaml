- id: ttnameid.TT_MAC_LANGID_INDONESIAN
  kind: constant
  symbol: TT_MAC_LANGID_INDONESIAN
  header: freetype/ttnameid.h
  description: Public Mac platform language ID constant for Indonesian name-table records; pinned FreeType defines it as 81.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 81 as defined by pinned freetype/ttnameid.h.
    - id: public_import_contract
      description: A C translation unit including <freetype/ttnameid.h> can reference TT_MAC_LANGID_INDONESIAN as a preprocessor-visible public constant.

