  # needs-input: operation=FT_Get_Sfnt_Name; fixture_asset=input/fonts/names/mac-roman-italian.ttf; params={platform_id=TT_PLATFORM_MACINTOSH, encoding_id=TT_MAC_ID_ROMAN, language_id=TT_MAC_LANGID_ITALIAN, name_id=TT_NAME_ID_FULL_NAME}; expected output shape={FT_Error, name_index, platform_id, encoding_id, language_id, name_id, string_bytes}; comparison=exact C oracle status and name-record scalar/string bytes.

