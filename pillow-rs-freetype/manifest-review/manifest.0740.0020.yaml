        description: Numeric value matches the pinned FreeType header value 1.
      # needs-input: Stroke a closed angled path with bevel join and compare the beveled corner outline arrays, tags, counts, and bbox/cbox exactly.
      - id: bevel_join_geometry
        description: Bevel joins produce the exact C corner geometry.

  - id: ftstroke.FT_STROKER_LINEJOIN_MITER
    kind: enum_variant
    symbol: FT_STROKER_LINEJOIN_MITER
    header: freetype/ftstroke.h
    description: Backward-compatible public alias for FT_STROKER_LINEJOIN_MITER_VARIABLE with value 2.
    cases:
