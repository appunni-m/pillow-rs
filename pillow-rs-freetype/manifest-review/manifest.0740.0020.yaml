  - id: ftsizes.FT_Activate_Size
    kind: function
    symbol: FT_Activate_Size
    header: freetype/ftsizes.h
    description: Activates an existing FT_Size by assigning it to the parent face's current size in the pinned FreeType C API.
    cases:
      - id: import_contract
        description: Include freetype/ftsizes.h and compile the exact C declaration FT_Error FT_Activate_Size(FT_Size size).
      # needs-input: Add a face fixture with two sizes created by FT_New_Size; set distinct pixel sizes on each, activate each handle, then load the same glyph. Compare C FreeType, Rust FFI, C FFI, and wasm status plus active size metrics and glyph-slot metrics exactly.
      - id: switches_current_face_size
        description: Activating alternate size handles changes face->size and subsequent load metrics to the selected size.
      # needs-input: Call FT_Activate_Size with a null size handle and compare exact FT_Err_Invalid_Size_Handle across C FreeType, Rust FFI, C FFI, and wasm.
      - id: null_size_error
        description: A null size handle returns Invalid_Size_Handle with no output payload.

  - id: ftsizes.FT_Done_Size
    kind: function
    symbol: FT_Done_Size
    header: freetype/ftsizes.h
    description: Discards an FT_Size allocated for a face and removes it from the face size list in the pinned FreeType C API.
    cases:
      - id: import_contract
        description: Include freetype/ftsizes.h and compile the exact C declaration FT_Error FT_Done_Size(FT_Size size).
      # needs-input: Create a secondary size, activate it, call FT_Done_Size, then activate/use the remaining default size. Compare status, surviving size metrics, and subsequent glyph metrics exactly; the deleted handle must not be reused after C frees it.
      - id: remove_secondary_size_success
        description: Destroying a secondary size succeeds and leaves the face usable through remaining size handles.
      # needs-input: Call FT_Done_Size with a null size handle and compare exact FT_Err_Invalid_Size_Handle.
      - id: null_size_error
        description: A null size handle returns Invalid_Size_Handle.

  - id: ftsizes.FT_New_Size
    kind: function
    symbol: FT_New_Size
    header: freetype/ftsizes.h
    description: Allocates a new FT_Size for a face without implicitly making it the current active size in the pinned FreeType C API.
    cases:
      - id: import_contract
        description: Include freetype/ftsizes.h and compile the exact C declaration FT_Error FT_New_Size(FT_Face face, FT_Size* size).
      # needs-input: Open a scalable font, call FT_New_Size, set a pixel size only after FT_Activate_Size, and compare status plus resulting size metrics and glyph metrics against C FreeType exactly.
      - id: create_secondary_size_success
        description: A valid face and output pointer produce a non-null secondary size that can be activated and used.
      # needs-input: Call FT_New_Size with null face and valid output pointer; compare exact FT_Err_Invalid_Face_Handle and null output.
      - id: null_face_error
        description: A null face returns Invalid_Face_Handle.
      # needs-input: Call FT_New_Size with valid face and null output pointer; compare exact FT_Err_Invalid_Argument.
      - id: null_output_pointer_error
        description: A null FT_Size output pointer returns Invalid_Argument.

  - id: ftsnames.FT_Get_Sfnt_LangTag
    kind: function
    symbol: FT_Get_Sfnt_LangTag
    header: freetype/ftsnames.h
    description: Retrieves a name-table format 1 language tag by language ID from the pinned FreeType C API.
    cases:
      - id: import_contract
        description: Include freetype/ftsnames.h and compile the exact C declaration FT_Error FT_Get_Sfnt_LangTag(FT_Face face, FT_UInt langID, FT_SfntLangTag* alangTag).
      # needs-input: Use an SFNT fixture with a format 1 name table and at least one language tag; call with a valid language_id greater than 0x8000 and compare status, UTF-16BE byte string, and string_len exactly.
      - id: format1_language_tag_success
        description: Valid format 1 language-tag records return exact raw bytes and byte length.
      # needs-input: Use a normal format 0 SFNT name-table fixture and call with 0x8001; compare FT_Err_Invalid_Table.
      - id: format0_invalid_table_error
        description: Format 0 name tables return Invalid_Table for language-tag lookup.
      # needs-input: Call with null face, null alangTag, langID <= 0x8000, and out-of-range langID as separate rows; compare exact Invalid_Argument behavior and unchanged/null output shape.
      - id: invalid_argument_errors
        description: Invalid handles, output pointers, and language IDs return Invalid_Argument.

  - id: ftsnames.FT_Get_Sfnt_Name
    kind: function
    symbol: FT_Get_Sfnt_Name
    header: freetype/ftsnames.h
    description: Retrieves an indexed SFNT name-table entry as raw platform, encoding, language, name ID, and byte payload fields.
    cases:
      - id: import_contract
        description: Include freetype/ftsnames.h and compile the exact C declaration FT_Error FT_Get_Sfnt_Name(FT_Face face, FT_UInt idx, FT_SfntName* aname).
      # needs-input: Use an SFNT fixture with Mac Roman and Windows UTF-16BE names; iterate indexes from 0 to FT_Get_Sfnt_Name_Count-1 and compare all scalar fields plus raw non-null-terminated string bytes exactly.
      - id: indexed_name_success
        description: Valid indexes return exact SFNT name metadata and raw string bytes.
      # needs-input: Call with idx equal to count and count+1, plus null face and null aname rows; compare exact Invalid_Argument and no string payload.
      - id: invalid_argument_errors
        description: Out-of-range index or invalid handles return Invalid_Argument.

  - id: ftsnames.FT_Get_Sfnt_Name_Count
    kind: function
    symbol: FT_Get_Sfnt_Name_Count
    header: freetype/ftsnames.h
    description: Returns the number of SFNT name-table records for an SFNT face, or zero for null/non-SFNT faces.
    cases:
      - id: import_contract
        description: Include freetype/ftsnames.h and compile the exact C declaration FT_UInt FT_Get_Sfnt_Name_Count(FT_Face face).
      # needs-input: Use SFNT fixtures with zero, one, and many name records; compare exact count with the subsequent successful FT_Get_Sfnt_Name index range.
      - id: sfnt_name_count_success
        description: SFNT faces return the exact C name-table record count.
      # needs-input: Call with null face and a non-SFNT fixture if available; compare exact zero return.
      - id: null_or_non_sfnt_returns_zero
        description: Null or non-SFNT faces return zero, not an error status.

  - id: ftsnames.FT_SfntLangTag
    kind: record
    symbol: FT_SfntLangTag
    header: freetype/ftsnames.h
    description: Public C record containing a raw non-null-terminated language-tag byte pointer and byte length.
    cases:
      - id: layout_matches_c
        description: Size, alignment, and field offsets for string and string_len match the pinned C header.
      # needs-input: Populate through FT_Get_Sfnt_LangTag on a format 1 name-table fixture and compare pointer-nullness, byte length, and copied raw UTF-16BE bytes exactly.
      - id: populated_from_langtag_lookup
        description: Runtime output shape preserves the exact C language-tag payload without string decoding.

  - id: ftsnames.FT_SfntName
    kind: record
    symbol: FT_SfntName
    header: freetype/ftsnames.h
    description: Public C record containing SFNT name platform, encoding, language, name ID, raw byte pointer, and byte length fields.
    cases:
      - id: layout_matches_c
        description: Size, alignment, and field offsets for all FT_SfntName fields match the pinned C header.
      # needs-input: Populate through FT_Get_Sfnt_Name for Mac Roman and Windows UTF-16BE entries and compare every scalar plus copied raw string bytes exactly.
      - id: populated_from_name_lookup
        description: Runtime output shape preserves exact SFNT name metadata and raw non-null-terminated bytes.

  - id: ftstroke.FT_StrokerBorder
    kind: enum
    symbol: FT_StrokerBorder
    header: freetype/ftstroke.h
    description: Public C enum selecting left or right generated stroker borders.
    cases:
      - id: enum_variants_match_header
        description: Enum members and numeric values match the pinned ftstroke.h declarations.
      # needs-input: Build closed clockwise and counter-clockwise outlines and use GetBorderCounts plus ExportBorder for both borders; compare point counts, contour counts, tags, and 26.6 coordinates exactly.
      - id: border_selection_runtime_shape
        description: Left and right border selection maps to exact C generated outline output.

  - id: ftstroke.FT_Stroker_LineCap
    kind: enum
    symbol: FT_Stroker_LineCap
    header: freetype/ftstroke.h
    description: Public C enum controlling the end shape of opened stroked subpaths.
    cases:
      - id: enum_variants_match_header
        description: Enum members and numeric values for butt, round, and square caps match the pinned ftstroke.h declarations.
      # needs-input: Stroke the same open line path with butt, round, and square caps; compare GetCounts, exported outline points/contours/tags, and exact bbox/cbox for each cap.
      - id: open_path_cap_geometry
        description: Each line cap produces the exact C outline geometry for an open path.

  - id: ftstroke.FT_Stroker_LineJoin
    kind: enum
    symbol: FT_Stroker_LineJoin
    header: freetype/ftstroke.h
    description: Public C enum controlling how stroker joins line and curve segments.
    cases:
      - id: enum_variants_match_header
        description: Enum members and alias values for round, bevel, miter variable, miter, and miter fixed match the pinned ftstroke.h declarations.
      # needs-input: Stroke a sharp two-segment path with round, bevel, miter variable, and miter fixed joins at multiple miter limits; compare exported outline geometry and counts exactly.
      - id: join_geometry_and_miter_limit
        description: Join style and miter-limit behavior match C output geometry exactly.

  - id: ftstroke.FT_STROKER_BORDER_LEFT
    kind: enum_variant
    symbol: FT_STROKER_BORDER_LEFT
    header: freetype/ftstroke.h
    description: Public FT_StrokerBorder enum variant selecting the left border with value 0.
    cases:
      - id: value_matches_header
        description: Numeric value matches the pinned FreeType header value 0.
      # needs-input: Export left border from a closed outline and compare exact point/contour/tag arrays and bbox/cbox with C output.
      - id: left_border_export_geometry
        description: Left border export uses the C left-border geometry.

  - id: ftstroke.FT_STROKER_BORDER_RIGHT
    kind: enum_variant
    symbol: FT_STROKER_BORDER_RIGHT
    header: freetype/ftstroke.h
    description: Public FT_StrokerBorder enum variant selecting the right border with value 1.
    cases:
      - id: value_matches_header
        description: Numeric value matches the pinned FreeType header value 1.
      # needs-input: Export right border from a closed outline and compare exact point/contour/tag arrays and bbox/cbox with C output; for opened paths verify the right border count is empty as C documents.
      - id: right_border_export_geometry
        description: Right border export uses the C right-border geometry and open-path empty-border behavior.

  - id: ftstroke.FT_STROKER_LINECAP_BUTT
    kind: enum_variant
    symbol: FT_STROKER_LINECAP_BUTT
    header: freetype/ftstroke.h
    description: Public FT_Stroker_LineCap enum variant for butt caps with value 0.
    cases:
      - id: value_matches_header
        description: Numeric value matches the pinned FreeType header value 0.
      # needs-input: Stroke a horizontal open line with butt caps and compare exported outline arrays and bbox/cbox exactly against C.
      - id: butt_cap_open_line_geometry
        description: Butt cap stops at the endpoint according to C stroker geometry.

  - id: ftstroke.FT_STROKER_LINECAP_ROUND
    kind: enum_variant
    symbol: FT_STROKER_LINECAP_ROUND
    header: freetype/ftstroke.h
