      - id: round_cap_open_line_geometry
        description: Round cap arc generation matches C stroker geometry.

  - id: ftstroke.FT_STROKER_LINECAP_SQUARE
    kind: enum_variant
    symbol: FT_STROKER_LINECAP_SQUARE
    header: freetype/ftstroke.h
