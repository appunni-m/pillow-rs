      # needs-input: Stroke the same sharp path with FT_STROKER_LINEJOIN_MITER and FT_STROKER_LINEJOIN_MITER_VARIABLE; compare both outputs to C and to each other exactly.
      - id: alias_matches_variable_join_geometry
