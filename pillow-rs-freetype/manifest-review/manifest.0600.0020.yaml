- id: ftlist.FT_List_Insert
  kind: function
  symbol: FT_List_Insert
  header: freetype/ftlist.h
  description: Public list API that inserts an FT_ListNode at the head of an FT_List.
  cases:
    - id: import_contract
      description: Declaration is visible from freetype/ftlist.h as void FT_List_Insert(FT_List list, FT_ListNode node).
    - id: insert_empty_list
      description: Inserting a node into an empty list makes both head and tail point to that node and sets node prev/next to null.
    - id: insert_non_empty_list
      description: Inserting a node before the existing head updates the new head, old head prev pointer, and leaves tail unchanged.
    - id: null_list_or_node_noop
      description: A null list or null node returns without mutating observable list or node state.
  # needs-input: operation=FT_List_Insert through C/Rust/WASM ABI harness; fixture_asset=synthetic FT_ListRec and heap/static FT_ListNodeRec records with sentinel data pointers; params={initial_order:empty/single/multiple, node_position:new, list_null:false/true, node_null:false/true}; output shape={void status class, head/tail data-token order, each node prev/next token, untouched sentinel fields}; comparison=exact C oracle pointer topology and no-op behavior.

- id: ftlist.FT_List_Iterate
  kind: function
  symbol: FT_List_Iterate
  header: freetype/ftlist.h
  description: Public list API that walks FT_List nodes and invokes an FT_List_Iterator callback.
  cases:
    - id: import_contract
      description: Declaration is visible from freetype/ftlist.h as FT_Error FT_List_Iterate(FT_List list, FT_List_Iterator iterator, void* user).
    - id: iterates_all_nodes_success
      description: With a valid iterator returning FT_Err_Ok, C visits every node in head-to-tail order and returns FT_Err_Ok.
    - id: stops_on_callback_error
      description: Iteration stops at the first nonzero callback return and returns that exact FT_Error without visiting later nodes.
    - id: iterator_can_mutate_current_node
      description: C snapshots next before the callback, so removing or relinking the current node during the callback follows the pinned ftutil.c traversal behavior.
    - id: null_list_or_iterator_error
      description: A null list or null iterator returns FT_Err_Invalid_Argument.
  # needs-input: operation=FT_List_Iterate with instrumented iterator callback; fixture_asset=synthetic FT_ListRec/FT_ListNodeRec list plus callback event recorder; params={initial_order:empty/single/multiple, callback_return_at_index:none/0/1/last, callback_mutation:none/remove_current/relink_current, list_null:false/true, iterator_null:false/true, user_token}; output shape={FT_Error, callback event log, visited node data-token order, user pointer identity, final list topology}; comparison=exact C oracle error code, callback order, early stop, next-snapshot traversal, and final mutation state.

- id: ftlist.FT_List_Remove
  kind: function
  symbol: FT_List_Remove
  header: freetype/ftlist.h
  description: Public list API that unlinks an FT_ListNode from an FT_List without freeing it.
  cases:
    - id: import_contract
      description: Declaration is visible from freetype/ftlist.h as void FT_List_Remove(FT_List list, FT_ListNode node).
    - id: remove_head_middle_tail
      description: Removing head, middle, and tail nodes updates adjacent prev/next links and head/tail fields exactly as C.
    - id: remove_only_node
      description: Removing the only node sets both list head and tail to null while leaving node data untouched.
    - id: null_list_or_node_noop
      description: A null list or null node returns without mutating observable list or node state.
    - id: membership_not_checked
      description: C trusts node prev/next membership and does not search the list before relinking around the supplied node.
  # needs-input: operation=FT_List_Remove through ABI harness; fixture_asset=synthetic FT_ListRec/FT_ListNodeRec topologies including valid member and foreign-node-with-links controls; params={initial_order:single/head/middle/tail, node_member:true/false, list_null:false/true, node_null:false/true}; output shape={void status class, head/tail data-token order, each node prev/next token, foreign list mutation class}; comparison=exact C oracle pointer topology, no-free behavior, and unchecked-membership side effects.

- id: ftlist.FT_List_Up
  kind: function
  symbol: FT_List_Up
  header: freetype/ftlist.h
  description: Public list API that moves an FT_ListNode to the head of an FT_List for LRU ordering.
  cases:
    - id: import_contract
      description: Declaration is visible from freetype/ftlist.h as void FT_List_Up(FT_List list, FT_ListNode node).
    - id: move_tail_or_middle_to_head
      description: Moving a tail or middle node relinks it as the new head and preserves the relative order of the remaining nodes.
    - id: already_head_noop
      description: Passing the current head returns without changing head, tail, or node links.
    - id: null_list_or_node_noop
      description: A null list or null node returns without mutating observable list or node state.
  # needs-input: operation=FT_List_Up through ABI harness; fixture_asset=synthetic FT_ListRec/FT_ListNodeRec list with two and three node orders; params={node_position:head/middle/tail, list_null:false/true, node_null:false/true}; output shape={void status class, head/tail data-token order, each node prev/next token}; comparison=exact C oracle pointer topology, already-head no-op, and no-op null handling.

- id: ftlogging.FT_Set_Default_Log_Handler
  kind: function
  symbol: FT_Set_Default_Log_Handler
  header: freetype/ftlogging.h
  description: Public debugging API that resets FreeType logging to the built-in handler when debug logging is enabled.
  cases:
    - id: import_contract
      description: Declaration is visible from freetype/ftlogging.h as void FT_Set_Default_Log_Handler(void).
    - id: debug_logging_resets_handler
      description: In an FT_DEBUG_LOGGING build, calling after FT_Set_Log_Handler clears the custom output handler.
    - id: non_debug_build_noop
      description: In a build without FT_DEBUG_LOGGING, the exported function exists and performs no observable logging state mutation.
  # needs-input: operation=FT_Set_Log_Handler then FT_Set_Default_Log_Handler with optional trace emission; fixture_asset=C callback harness built twice when possible with FT_DEBUG_LOGGING on/off; params={debug_logging_enabled:false/true, custom_handler_installed:true, emit_trace_after_reset:true}; output shape={void status class, callback invocation count, handler selection class, build capability}; comparison=exact C oracle callback/no-callback behavior and build-dependent no-op classification.

- id: ftlogging.FT_Set_Log_Handler
  kind: function
  symbol: FT_Set_Log_Handler
  header: freetype/ftlogging.h
  description: Public debugging API that installs a custom FT_Custom_Log_Handler when debug logging is enabled.
  cases:
    - id: import_contract
      description: Declaration is visible from freetype/ftlogging.h as void FT_Set_Log_Handler(FT_Custom_Log_Handler handler).
    - id: debug_logging_installs_handler
      description: In an FT_DEBUG_LOGGING build, a non-null handler becomes the target for later FreeType log callbacks.
    - id: null_handler_clears_or_disables_custom_output
      description: Passing a null handler stores the same handler state as C and must not synthesize a fallback callback.
    - id: non_debug_build_noop
      description: In a build without FT_DEBUG_LOGGING, the function ignores the handler argument.
  # needs-input: operation=FT_Set_Log_Handler with instrumented FT_Custom_Log_Handler plus trace/error emission trigger; fixture_asset=C callback harness and a FreeType operation that emits trace under FT_DEBUG_LOGGING; params={debug_logging_enabled:false/true, handler:null/custom, tracing_level}; output shape={void status class, callback event log, component/fmt pointer class, va_list-observed formatted text class, build capability}; comparison=exact C oracle handler installation, null handling, and no-op behavior.

- id: ftlogging.FT_Trace_Set_Default_Level
  kind: function
  symbol: FT_Trace_Set_Default_Level
  header: freetype/ftlogging.h
  description: Public debugging API that restores trace levels from the default FT2_DEBUG configuration when debug logging is enabled.
  cases:
    - id: import_contract
      description: Declaration is visible from freetype/ftlogging.h as void FT_Trace_Set_Default_Level(void).
    - id: debug_logging_restores_default_levels
      description: In an FT_DEBUG_LOGGING build, the function clears the custom trace-level string and reinitializes trace levels from FT2_DEBUG/default state.
    - id: non_debug_build_noop
      description: In a build without FT_DEBUG_LOGGING, the exported function exists and performs no observable trace mutation.
  # needs-input: operation=FT_Trace_Set_Level followed by FT_Trace_Set_Default_Level and trace-emitting operation; fixture_asset=C logging harness with controllable FT2_DEBUG environment and trace-capable operation; params={debug_logging_enabled:false/true, FT2_DEBUG:null/component-levels, custom_level:any:7/memory:0}; output shape={void status class, emitted trace event count by component, build capability}; comparison=exact C oracle default-level restoration and no-op behavior.

- id: ftlogging.FT_Trace_Set_Level
  kind: function
  symbol: FT_Trace_Set_Level
  header: freetype/ftlogging.h
  description: Public debugging API that sets runtime trace component levels from a text specification when debug logging is enabled.
  cases:
    - id: import_contract
      description: Declaration is visible from freetype/ftlogging.h as void FT_Trace_Set_Level(const char* tracing_level).
    - id: debug_logging_sets_component_levels
      description: In an FT_DEBUG_LOGGING build, valid component specifications update the trace level table used by later FT_TRACE calls.
    - id: null_or_invalid_level_string
      description: Null and malformed trace strings follow C parsing and initialization behavior without producing errors because the function returns void.
    - id: non_debug_build_noop
      description: In a build without FT_DEBUG_LOGGING, the function ignores the tracing_level argument.
  # needs-input: operation=FT_Trace_Set_Level then trace-emitting FreeType operation; fixture_asset=C logging harness with trace-capable operation and captured stderr/custom log callback; params={debug_logging_enabled:false/true, tracing_level:null/any:7 memory:0/unknown:7/malformed}; output shape={void status class, emitted trace event count by component, parsed-level class, build capability}; comparison=exact C oracle parsing effect, emitted trace selection, and no-op behavior.

- id: ftlzw.FT_Stream_OpenLZW
  kind: function
  symbol: FT_Stream_OpenLZW
  header: freetype/ftlzw.h
  description: Public LZW stream API that wraps an already-open FT_Stream for .Z-compressed font data when LZW support is compiled in.
  cases:
    - id: import_contract
      description: Declaration is visible from freetype/ftlzw.h as FT_Error FT_Stream_OpenLZW(FT_Stream stream, FT_Stream source).
    - id: opens_valid_lzw_stream
      description: With FT_CONFIG_OPTION_USE_LZW and valid .Z data, C initializes the target stream with memory, descriptor, read, close, pos, size, and null base fields.
    - id: invalid_header_error
      description: With LZW support enabled, a source stream without the LZW magic/header returns the same C error before allocating the LZW descriptor.
    - id: null_stream_or_source_error
      description: A null target stream or source stream returns FT_Err_Invalid_Stream_Handle.
    - id: unsupported_build_error
      description: Without FT_CONFIG_OPTION_USE_LZW, the exported function returns FT_Err_Unimplemented_Feature for all arguments.
  # needs-input: operation=FT_Stream_OpenLZW then stream read/seek/close; fixture_asset=small valid .pcf.Z or synthetic .Z binary, invalid-header binary, and FT_Stream memory wrapper records; params={lzw_enabled:false/true, target_stream:null/valid, source_stream:null/valid, read_offsets:[0,1,backward], read_counts:[0,1,64]}; output shape={FT_Error, target stream field snapshot, decoded byte chunks/hash, close side effects, source stream ownership class}; comparison=exact C oracle error code, stream field mutation, decoded bytes, backward-seek reset behavior, and unsupported-build classification.

- id: ftmm.T1_MAX_MM_AXIS
  kind: constant
  symbol: T1_MAX_MM_AXIS
  header: freetype/ftmm.h
  description: Public Type 1 Multiple Master constant defining the maximum axis count in FT_Multi_Master.
