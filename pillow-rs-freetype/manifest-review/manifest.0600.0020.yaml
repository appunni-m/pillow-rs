      description: Value is 4 in the pinned C public header.
    - id: record_array_capacity
      description: FT_Multi_Master.axis is declared with T1_MAX_MM_AXIS elements in the pinned C public header.
  # needs-input: operation=compile/import and ABI layout probe for FT_Multi_Master; fixture_asset=C ABI probe source including freetype/ftmm.h; params={constant:T1_MAX_MM_AXIS}; output shape={constant value, FT_Multi_Master axis array length, record size/offset snapshot}; comparison=exact C preprocessor value and layout-derived array capacity.

- id: ftmm.T1_MAX_MM_DESIGNS
  kind: constant
  symbol: T1_MAX_MM_DESIGNS
  header: freetype/ftmm.h
  description: Public Type 1 Multiple Master constant defining the maximum number of designs in FT_Multi_Master.
  cases:
    - id: value_matches_header
      description: Value is 16 in the pinned C public header.
    - id: record_design_capacity
