- id: ftmm.FT_VAR_AXIS_FLAG_HIDDEN
  kind: flag
  symbol: FT_VAR_AXIS_FLAG_HIDDEN
  header: freetype/ftmm.h
  description: Public OpenType variation axis flag indicating that an axis should be hidden from user interfaces.
  cases:
    - id: value_matches_header
      description: Value is 1 in the pinned C public header.
    - id: returned_by_axis_flags
      description: FT_Get_Var_Axis_Flags exposes the hidden bit from the FT_MM_Var axis-flags storage when the font contains a hidden axis.
  # needs-input: operation=FT_Get_MM_Var then FT_Get_Var_Axis_Flags; fixture_asset=variable OpenType font with at least one hidden axis plus variable font without hidden axes; params={axis_index:valid hidden/valid visible}; output shape={FT_Error, flags integer, hidden-bit boolean, MM_Var axis metadata}; comparison=exact C oracle flag value and returned axis flags.

- id: ftmm.FT_Done_MM_Var
  kind: function
  symbol: FT_Done_MM_Var
  header: freetype/ftmm.h
  description: Public variation API that frees an FT_MM_Var descriptor allocated by FT_Get_MM_Var.
  cases:
    - id: import_contract
      description: Declaration is visible from freetype/ftmm.h as FT_Error FT_Done_MM_Var(FT_Library library, FT_MM_Var* amaster).
    - id: frees_descriptor_success
      description: With a valid library and descriptor returned by FT_Get_MM_Var, C frees the allocation and returns FT_Err_Ok.
    - id: null_descriptor_success
      description: With a valid library and null descriptor, C returns FT_Err_Ok because FT_FREE on null is allowed.
    - id: null_library_error
      description: A null library returns FT_Err_Invalid_Library_Handle.
  # needs-input: operation=FT_Get_MM_Var followed by FT_Done_MM_Var; fixture_asset=variable OpenType/CFF2 font and valid FT_Library handle; params={library:null/valid, descriptor:null/from_get_mm_var}; output shape={FT_Error, allocation/free event class, descriptor pointer identity, leak/double-free guard result}; comparison=exact C oracle error code and ownership/free behavior.

- id: ftmm.FT_Get_Default_Named_Instance
  kind: function
  symbol: FT_Get_Default_Named_Instance
  header: freetype/ftmm.h
  description: Public variation API that returns the default named instance index when the face service provides it.
  cases:
    - id: import_contract
      description: Declaration is visible from freetype/ftmm.h as FT_Error FT_Get_Default_Named_Instance(FT_Face face, FT_UInt* instance_index).
    - id: variable_font_default_instance
      description: For a variable SFNT face with the service implemented, C returns FT_Err_Ok and writes the default named instance index.
    - id: service_without_default_instance_success
      description: If the multiple-master service exists but get_default_named_instance is null, C returns FT_Err_Ok without requiring a written value.
    - id: invalid_face_error
      description: A null face returns FT_Err_Invalid_Face_Handle and a non-multiple-master face returns FT_Err_Invalid_Argument.
  # needs-input: operation=FT_Get_Default_Named_Instance; fixture_asset=variable OpenType font with named instances, variable font without explicit default named instance if available, Adobe MM or Type1 service control if available, non-variable outline font; params={face:null/non_variable/variable, output_pointer:valid sentinel}; output shape={FT_Error, instance_index before/after, face variation metadata}; comparison=exact C oracle error code, written value or preserved sentinel, and service-availability behavior.

- id: ftmm.FT_Get_MM_Blend_Coordinates
  kind: function
  symbol: FT_Get_MM_Blend_Coordinates
  header: freetype/ftmm.h
  description: Public variation API that reads normalized blend coordinates from a multiple-master or variation face.
  cases:
    - id: import_contract
      description: Declaration is visible from freetype/ftmm.h as FT_Error FT_Get_MM_Blend_Coordinates(FT_Face face, FT_UInt num_coords, FT_Fixed* coords).
    - id: default_blend_coordinates
      description: For a variable face at default design, C writes normalized coordinates matching the service output for the requested count.
    - id: after_set_blend_coordinates
      description: After setting blend coordinates, C returns the updated normalized vector exactly.
    - id: partial_or_excess_count
      description: Requested coordinate counts smaller or larger than the axis count follow C service write-count behavior and preserve untouched sentinels.
    - id: invalid_face_or_coords_error
      description: A null coords pointer returns FT_Err_Invalid_Argument; a null face returns FT_Err_Invalid_Face_Handle; a non-variable face returns FT_Err_Invalid_Argument.
  # needs-input: operation=FT_Get_MM_Blend_Coordinates optionally after FT_Set_MM_Blend_Coordinates/FT_Set_Var_Blend_Coordinates; fixture_asset=variable OpenType font, Adobe MM font if available, non-variable font; params={face:null/non_variable/variable, num_coords:0/1/axis_count/axis_count+1, coords:null/valid, prior_blend:[default/min/max/mixed]}; output shape={FT_Error, coords array before/after, written element count, face variation flag}; comparison=exact C oracle error code, 16.16 coordinate values, sentinel preservation, and variation-state behavior.

- id: ftmm.FT_Get_MM_Var
  kind: function
  symbol: FT_Get_MM_Var
  header: freetype/ftmm.h
  description: Public variation API that allocates and returns an FT_MM_Var descriptor for supported variation faces.
  cases:
    - id: import_contract
      description: Declaration is visible from freetype/ftmm.h as FT_Error FT_Get_MM_Var(FT_Face face, FT_MM_Var** amaster).
    - id: variable_font_descriptor_success
      description: For a variable OpenType/CFF2 face, C allocates an FT_MM_Var descriptor with axis, named style, coordinate, tag, string, and flags data.
    - id: adobe_mm_descriptor_success
      description: For an Adobe MM face if available, C returns a descriptor through the same public function with Adobe-specific axis/default semantics.
    - id: null_output_error
      description: A null amaster output pointer returns FT_Err_Invalid_Argument.
    - id: invalid_or_non_variable_face_error
      description: A null face returns FT_Err_Invalid_Face_Handle and a non-multiple-master face returns FT_Err_Invalid_Argument.
  # needs-input: operation=FT_Get_MM_Var then FT_Done_MM_Var; fixture_asset=variable OpenType font with multiple axes/named instances, CFF2 variable font if available, Adobe MM font if available, non-variable outline font; params={face:null/non_variable/variable, output_pointer:null/valid}; output shape={FT_Error, descriptor pointer class, num_axis, num_designs, num_namedstyles, axis records, namedstyle records, axis flags, allocation/free event}; comparison=exact C oracle descriptor fields, tags, names as string ids/pointers class, numeric coordinates, error codes, and ownership.

- id: ftmm.FT_Get_MM_WeightVector
  kind: function
  symbol: FT_Get_MM_WeightVector
  header: freetype/ftmm.h
  description: Public Adobe Multiple Master API that reads the current weight vector when the face service implements it.
  cases:
    - id: import_contract
      description: Declaration is visible from freetype/ftmm.h as FT_Error FT_Get_MM_WeightVector(FT_Face face, FT_UInt* len, FT_Fixed* weightvector).
    - id: adobe_mm_weightvector_success
      description: For an Adobe MM face with get_mm_weightvector service, C writes the vector and length according to the service implementation.
    - id: len_without_buffer_error
      description: Passing a non-null len pointer with a null weightvector returns FT_Err_Invalid_Argument before service lookup.
    - id: unsupported_face_error
      description: Variable SFNT faces whose service lacks get_mm_weightvector and non-variable faces return FT_Err_Invalid_Argument; null face returns FT_Err_Invalid_Face_Handle.
  # needs-input: operation=FT_Get_MM_WeightVector optionally after FT_Set_MM_WeightVector; fixture_asset=Adobe Multiple Master font with weight vector support, variable OpenType font control, non-variable font; params={face:null/non_variable/sfnt_variable/adobe_mm, len_pointer:null/valid, weightvector:null/valid, vector_capacity}; output shape={FT_Error, len before/after, weightvector fixed values, sentinel preservation}; comparison=exact C oracle error code, written length, 16.16 vector values, and unsupported-service behavior.

- id: ftmm.FT_Get_Multi_Master
  kind: function
  symbol: FT_Get_Multi_Master
  header: freetype/ftmm.h
  description: Public legacy Adobe Multiple Master API that fills an FT_Multi_Master descriptor.
  cases:
    - id: import_contract
      description: Declaration is visible from freetype/ftmm.h as FT_Error FT_Get_Multi_Master(FT_Face face, FT_Multi_Master* amaster).
    - id: adobe_mm_descriptor_success
      description: For an Adobe MM face with get_mm service, C writes num_axis, num_designs, and FT_MM_Axis records into the caller-provided descriptor.
    - id: true_type_or_opentype_variation_error
      description: TrueType GX/OpenType variation faces do not use this legacy API and return FT_Err_Invalid_Argument unless their service exposes get_mm.
    - id: null_output_error
      description: A null amaster pointer returns FT_Err_Invalid_Argument before face service lookup.
    - id: invalid_or_non_variable_face_error
      description: A null face returns FT_Err_Invalid_Face_Handle and a non-multiple-master face returns FT_Err_Invalid_Argument.
  # needs-input: operation=FT_Get_Multi_Master; fixture_asset=Adobe Multiple Master font, variable OpenType font control, non-variable font; params={face:null/non_variable/opentype_variable/adobe_mm, output_pointer:null/valid sentinel}; output shape={FT_Error, FT_Multi_Master record fields, axis name/min/max map records, sentinel preservation}; comparison=exact C oracle error code, descriptor field values, array bounds, and unsupported-format behavior.

- id: ftmm.FT_Get_Var_Axis_Flags
  kind: function
  symbol: FT_Get_Var_Axis_Flags
  header: freetype/ftmm.h
  description: Public variation API that reads the flags associated with an FT_MM_Var axis.
  cases:
    - id: import_contract
      description: Declaration is visible from freetype/ftmm.h as FT_Error FT_Get_Var_Axis_Flags(FT_MM_Var* master, FT_UInt axis_index, FT_UInt* flags).
    - id: valid_axis_flags
      description: For each valid axis index, C reads the axis-flags array immediately following the FT_MM_Var record and writes the exact flag value.
    - id: hidden_axis_flag
      description: A hidden axis returns a flags value containing FT_VAR_AXIS_FLAG_HIDDEN when present in the fixture font.
    - id: out_of_range_axis_error
      description: axis_index greater than or equal to master->num_axis returns FT_Err_Invalid_Argument and preserves the output sentinel.
    - id: null_master_or_flags_error
      description: A null master pointer or null flags pointer returns FT_Err_Invalid_Argument.
  # needs-input: operation=FT_Get_MM_Var then FT_Get_Var_Axis_Flags for every axis and invalid indexes; fixture_asset=variable OpenType font with visible axes and hidden-axis fixture if available; params={master:null/from_get_mm_var, axis_index:0/last/num_axis/large, flags_pointer:null/valid sentinel}; output shape={FT_Error, flags before/after, axis tag/name/default/min/max, hidden-bit boolean}; comparison=exact C oracle error code, flag integer, sentinel preservation, and hidden-axis classification.
