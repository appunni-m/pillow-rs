  # needs-input: operation=compile/import and Adobe MM descriptor probe; fixture_asset=C ABI probe source plus Adobe Multiple Master font if available; params={constant:T1_MAX_MM_DESIGNS}; output shape={constant value, FT_Get_Multi_Master FT_Multi_Master.num_designs on fixture or unsupported classification}; comparison=exact C preprocessor value and C oracle descriptor capacity behavior.

- id: ftmm.T1_MAX_MM_MAP_POINTS
  kind: constant
  symbol: T1_MAX_MM_MAP_POINTS
  header: freetype/ftmm.h
  description: Public Type 1 Multiple Master constant defining the maximum axis design map points.
  cases:
    - id: value_matches_header
