- id: ttnameid.TT_MS_LANGID_ARABIC_IRAQ
  kind: tag
  symbol: TT_MS_LANGID_ARABIC_IRAQ
  header: freetype/ttnameid.h
  description: Microsoft platform language identifier tag for Arabic as used in Iraq.
  cases:
    - id: value_matches_header
      description: Macro expands to integer value 0x0801 in the pinned C public header.
    - id: public_import_contract
      description: A C translation unit including <freetype/ttnameid.h> can reference TT_MS_LANGID_ARABIC_IRAQ as a public constant expression.
    - id: microsoft_name_language_runtime
      description: C oracle preserves language_id 0x0801 for Microsoft name records instead of normalizing it to generic Arabic.
  # needs-input: operation=FT_Get_Sfnt_Name; fixture_asset=input/fonts/name-cmap/ms-arabic-iraq-name.ttf; params={platform_id=TT_PLATFORM_MICROSOFT, language_id=TT_MS_LANGID_ARABIC_IRAQ, name_id=TT_NAME_ID_FONT_FAMILY}; expected output shape={FT_Error, name_count, platform_id, encoding_id, language_id, name_id, string_len, string_bytes}; comparison=exact C oracle name-record fields and bytes.

