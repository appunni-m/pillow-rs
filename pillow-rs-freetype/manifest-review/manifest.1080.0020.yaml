- id: ttnameid.TT_UCR_CUNEIFORM
  kind: constant
  symbol: TT_UCR_CUNEIFORM
  header: freetype/ttnameid.h
  description: Public OS/2 ulUnicodeRange4 bit-mask constant for Cuneiform; pinned FreeType defines it as 1UL << 14, numeric value 16384, global Unicode-range bit 110.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 16384 as defined by pinned freetype/ttnameid.h for ulUnicodeRange4 bit 14.
    - id: public_import_contract
      description: A C translation unit including <freetype/ttnameid.h> can reference TT_UCR_CUNEIFORM as a preprocessor-visible public constant.
    - id: representative_os2_unicode_range4_bit
      description: A representative OS/2 table with global Unicode-range bit 110 set reports the same ulUnicodeRange4 mask as the C oracle.
  # needs-input: operation=FT_Get_Sfnt_Table(face, ft_sfnt_os2); fixture_asset=input/fonts/os2/ucr-cuneiform-range4.ttf; params={table=ft_sfnt_os2}; expected output shape={FT_Error, present, ulUnicodeRange1, ulUnicodeRange2, ulUnicodeRange3, ulUnicodeRange4}; comparison=exact C oracle status and OS/2 Unicode-range scalar fields.

