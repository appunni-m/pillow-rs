- id: fttypes.FT_Bytes
  kind: type
  symbol: FT_Bytes
  header: freetype/fttypes.h
  description: Public typedef for immutable byte buffers, declared as const FT_Byte* in the pinned FreeType C header.
  cases:
    - id: alias_defined_as_const_byte_pointer
      description: The public C declaration is typedef const FT_Byte* FT_Bytes, so ABI probes must treat the pointed-to bytes as read-only.
    - id: pointer_size_alignment_and_nullability
      description: The alias has pointer size/alignment and can represent NULL, non-NULL empty buffers, and non-empty binary buffers without changing type shape.
    - id: binary_input_domain_preserves_bytes
      description: Fixture inputs using FT_Bytes must carry binary data by asset reference or byte blob reference, with comparison based on bytes read by C and no class-name repr matching.

- id: fttypes.FT_Char
  kind: type
  symbol: FT_Char
  header: freetype/fttypes.h
  description: Public typedef for a signed single-byte character value, declared as signed char.
  cases:
    - id: alias_defined_as_signed_char
      description: The public C declaration is typedef signed char FT_Char.
    - id: size_alignment_and_signed_range
      description: Size and alignment match C signed char, with value-domain coverage for -128, -1, 0, 1, and 127 on the pinned ABI.
    - id: distinct_from_ft_string
      description: FT_Char is an explicitly signed numeric byte type and must not inherit the implementation-defined signedness of plain char or FT_String.

- id: fttypes.FT_Error
  kind: type
  symbol: FT_Error
  header: freetype/fttypes.h
  description: Public typedef for FreeType status codes, declared as int with zero meaning success.
  cases:
    - id: alias_defined_as_int
      description: The public C declaration is typedef int FT_Error.
    - id: zero_success_nonzero_error_domain
      description: Value-domain coverage includes 0 as success and representative non-zero base, module-composed, and unknown error values as integer status outputs.
    - id: exact_status_comparison_shape
      description: Runtime fixtures using FT_Error compare the actual integer value emitted by C, Rust FFI, C FFI, and wasm, not status-only success/failure buckets.

- id: fttypes.FT_F26Dot6
  kind: type
  symbol: FT_F26Dot6
  header: freetype/fttypes.h
  description: Public signed 26.6 fixed-point pixel-coordinate type, declared as signed long.
  cases:
    - id: alias_defined_as_signed_long
      description: The public C declaration is typedef signed long FT_F26Dot6.
    - id: size_alignment_and_signed_range
      description: Size and alignment match C signed long, with negative, zero, positive, and large safe 26.6 coordinate samples.
    - id: fractional_unit_domain
      description: Values are interpreted as integer pixels scaled by 64, so fixtures should include whole pixels, half pixels, and one-subpixel deltas.

- id: fttypes.FT_F2Dot14
  kind: type
  symbol: FT_F2Dot14
  header: freetype/fttypes.h
  description: Public signed 2.14 fixed-point coefficient type, declared as signed short.
  cases:
    - id: alias_defined_as_signed_short
      description: The public C declaration is typedef signed short FT_F2Dot14.
    - id: size_alignment_and_signed_range
      description: Size and alignment match C signed short, with boundary and representative normalized vector coefficient values.
    - id: fixed_point_domain
      description: Fixtures should cover -1.0, 0, +1.0, and near-boundary 2.14 values using exact integer representations.

- id: fttypes.FT_FWord
  kind: type
  symbol: FT_FWord
  header: freetype/fttypes.h
  description: Public signed 16-bit font-unit distance type, declared as signed short.
  cases:
    - id: alias_defined_as_signed_short
      description: The public C declaration is typedef signed short FT_FWord.
    - id: size_alignment_and_signed_range
      description: Size and alignment match C signed short, with min, negative, zero, positive, and max font-unit distances.
    - id: font_unit_distance_domain
      description: Runtime inputs using FT_FWord must compare raw design-unit values before scaling, not derived pixel metrics.

- id: fttypes.FT_Fixed
  kind: type
  symbol: FT_Fixed
  header: freetype/fttypes.h
  description: Public signed 16.16 fixed-point type, declared as signed long.
  cases:
    - id: alias_defined_as_signed_long
      description: The public C declaration is typedef signed long FT_Fixed.
    - id: size_alignment_and_signed_range
      description: Size and alignment match C signed long, with negative, zero, positive, and large safe 16.16 samples.
    - id: fractional_unit_domain
      description: Fixtures should include 0x00010000 for 1.0, fractional coefficients, negative coefficients, and transform-scale values as raw integers.

- id: fttypes.FT_Int
  kind: type
  symbol: FT_Int
  header: freetype/fttypes.h
  description: Public signed integer type, declared as signed int.
  cases:
    - id: alias_defined_as_signed_int
      description: The public C declaration is typedef signed int FT_Int.
    - id: size_alignment_and_signed_range
      description: Size and alignment match C signed int, with negative, zero, positive, and boundary-safe public parameter values.
    - id: numeric_parameter_domain
      description: FT_Int fixture parameters must preserve signedness for indices, deltas, modes, and sentinel values rather than coercing through unsigned JSON interpretation.

- id: fttypes.FT_List
  kind: type
  symbol: FT_List
  header: freetype/fttypes.h
  description: Public opaque-ish handle typedef to FT_ListRec, declared as struct FT_ListRec_*.
  cases:
    - id: alias_defined_as_list_record_pointer
      description: The public C declaration is typedef struct FT_ListRec_* FT_List.
    - id: pointer_size_alignment_and_nullability
      description: The handle has pointer size/alignment and can be NULL or point to a caller-visible FT_ListRec record.
    - id: list_record_shape_dependency
      description: Runtime list fixtures must compare the pointed-to FT_ListRec head and tail fields through C layout, not treat FT_List as an owned container.

- id: fttypes.FT_ListNode
  kind: type
  symbol: FT_ListNode
  header: freetype/fttypes.h
  description: Public handle typedef to FT_ListNodeRec, declared as struct FT_ListNodeRec_*.
  cases:
    - id: alias_defined_as_list_node_record_pointer
      description: The public C declaration is typedef struct FT_ListNodeRec_* FT_ListNode.
    - id: pointer_size_alignment_and_nullability
      description: The handle has pointer size/alignment and can be NULL or point to a caller-visible FT_ListNodeRec record.
    - id: node_link_shape_dependency
      description: Runtime list fixtures must compare prev, next, and data through the record layout and avoid assigning behavior to the pointer alias itself.

- id: fttypes.FT_Long
  kind: type
  symbol: FT_Long
  header: freetype/fttypes.h
  description: Public signed long integer type, declared as signed long.
  cases:
    - id: alias_defined_as_signed_long
      description: The public C declaration is typedef signed long FT_Long.
    - id: size_alignment_and_signed_range
      description: Size and alignment match C signed long, which is ABI-dependent and must be probed rather than assumed to be 32-bit.
    - id: signed_value_domain
      description: Fixtures should include negative, zero, positive, and boundary-safe values for APIs that expose FT_Long counts, indices, or coordinates.

- id: fttypes.FT_Offset
  kind: type
  symbol: FT_Offset
  header: freetype/fttypes.h
  description: Public unsigned size type, declared as size_t.
  cases:
    - id: alias_defined_as_size_t
      description: The public C declaration is typedef size_t FT_Offset.
    - id: size_alignment_and_unsigned_range
      description: Size and alignment match C size_t, with zero, small, large safe, and maximum-representable fixture-domain values.
    - id: file_and_memory_offset_domain
      description: Inputs using FT_Offset represent byte positions or lengths and must reject signed or negative fixture encodings.

- id: fttypes.FT_Pointer
  kind: type
  symbol: FT_Pointer
  header: freetype/fttypes.h
  description: Public typeless mutable pointer alias, declared as void*.
  cases:
    - id: alias_defined_as_void_pointer
      description: The public C declaration is typedef void* FT_Pointer.
    - id: pointer_size_alignment_and_nullability
      description: The alias has pointer size/alignment and supports NULL, stable opaque handles, and callback user-data pointers.
    - id: opaque_identity_domain
      description: Fixture comparison must preserve pointer identity classes and nullness without serializing raw process addresses as portable expected output.

- id: fttypes.FT_PtrDist
  kind: type
  symbol: FT_PtrDist
  header: freetype/fttypes.h
  description: Public signed pointer-distance type, declared as ft_ptrdiff_t.
  cases:
    - id: alias_defined_as_ft_ptrdiff_t
      description: The public C declaration is typedef ft_ptrdiff_t FT_PtrDist.
    - id: size_alignment_and_signed_range
      description: Size and alignment match the configured C ft_ptrdiff_t, with negative, zero, positive, and pointer-sized boundary-safe samples.
    - id: pointer_difference_domain
      description: Inputs using FT_PtrDist must model signed pointer differences and offsets, not unsigned lengths.

- id: fttypes.FT_Short
  kind: type
  symbol: FT_Short
  header: freetype/fttypes.h
  description: Public signed short integer type, declared as signed short.
  cases:
    - id: alias_defined_as_signed_short
      description: The public C declaration is typedef signed short FT_Short.
    - id: size_alignment_and_signed_range
      description: Size and alignment match C signed short, with min, negative, zero, positive, and max samples.
    - id: signed_parameter_domain
      description: Fixture parameters using FT_Short must preserve signedness for fields and legacy APIs that expose 16-bit signed values.

- id: fttypes.FT_String
  kind: type
  symbol: FT_String
  header: freetype/fttypes.h
  description: Public string character type, declared as plain char.
  cases:
    - id: alias_defined_as_plain_char
      description: The public C declaration is typedef char FT_String, not signed char or unsigned char.
    - id: size_alignment_and_implementation_signedness
      description: Size and alignment match C char; signedness is implementation-defined and must not be asserted unless probed from C.
    - id: c_string_and_byte_string_domain
      description: Inputs using FT_String must represent NUL-terminated strings and raw name bytes distinctly, with explicit handling for NULL pointers.

- id: fttypes.FT_Tag
  kind: type
  symbol: FT_Tag
  header: freetype/fttypes.h
  description: Public 32-bit SFNT tag type, declared as FT_UInt32.
  cases:
    - id: alias_defined_as_uint32
      description: The public C declaration is typedef FT_UInt32 FT_Tag.
    - id: size_alignment_and_unsigned_range
      description: Size is exactly 32 bits through FT_UInt32, with unsigned value-domain samples including 0 and all-byte-set tag values.
    - id: packed_fourcc_domain
      description: Tag fixture inputs must compare exact numeric big-endian four-character codes such as 'name', 'head', 'cmap', and non-ASCII byte tags.

- id: fttypes.FT_UFWord
  kind: type
  symbol: FT_UFWord
  header: freetype/fttypes.h
  description: Public unsigned 16-bit font-unit distance type, declared as unsigned short.
  cases:
    - id: alias_defined_as_unsigned_short
      description: The public C declaration is typedef unsigned short FT_UFWord.
    - id: size_alignment_and_unsigned_range
      description: Size and alignment match C unsigned short, with 0, small, large, and max unsigned font-unit distances.
    - id: unsigned_font_unit_distance_domain
      description: Runtime inputs using FT_UFWord must preserve unsigned design-unit values and reject negative fixture encodings.

- id: fttypes.FT_UInt
  kind: type
  symbol: FT_UInt
  header: freetype/fttypes.h
  description: Public unsigned integer type, declared as unsigned int.
  cases:
    - id: alias_defined_as_unsigned_int
      description: The public C declaration is typedef unsigned int FT_UInt.
    - id: size_alignment_and_unsigned_range
      description: Size and alignment match C unsigned int, with zero, small, large safe, and max samples where APIs expose unsigned counts or indices.
    - id: numeric_parameter_domain
      description: Fixture parameters using FT_UInt must preserve unsigned semantics for glyph indices, character codes narrowed to UInt, counts, and flags.

- id: fttypes.FT_ULong
  kind: type
  symbol: FT_ULong
  header: freetype/fttypes.h
  description: Public unsigned long integer type, declared as unsigned long.
  cases:
    - id: alias_defined_as_unsigned_long
      description: The public C declaration is typedef unsigned long FT_ULong.
    - id: size_alignment_and_unsigned_range
      description: Size and alignment match C unsigned long, which is ABI-dependent and must be probed rather than assumed to be 32-bit.
    - id: unsigned_value_domain
      description: Fixtures should include zero, positive, large safe, and maximum-representable values for APIs exposing FT_ULong tags, offsets, and counts.
