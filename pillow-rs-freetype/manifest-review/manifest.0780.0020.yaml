- id: ftsynth.FT_GlyphSlot_AdjustWeight
  kind: function
  symbol: FT_GlyphSlot_AdjustWeight
  header: freetype/ftsynth.h
  description: Public glyph-slot weight adjustment helper that emboldens outline and bitmap glyph slots by caller-provided 16.16 Em-size deltas.
  cases:
    - id: signature_and_void_contract
      description: Public declaration is void FT_GlyphSlot_AdjustWeight(FT_GlyphSlot, FT_Fixed, FT_Fixed), so comparison is based on mutated slot output rather than status.
    - id: outline_weight_adjusts_points_metrics_and_advances
      description: For outline glyphs, C converts xdelta and ydelta through size ppem into 26.6 strengths, calls FT_Outline_EmboldenXY, and updates advance, width, height, horiAdvance, vertAdvance, and horiBearingY exactly.
    - id: bitmap_weight_owns_emboldens_and_updates_top
      description: For bitmap glyphs, C rounds strengths to full pixels, owns the bitmap if needed, emboldens bitmap bytes, updates metrics/advances, and increases bitmap_top by ystr pixels.
    - id: null_or_unsupported_format_noop
      description: Null slots and glyph formats other than OUTLINE or BITMAP return without mutation or error reporting.
  # needs-input: operation=FT_Load_Glyph followed by FT_GlyphSlot_AdjustWeight; fixture_asset=outline TrueType/CFF glyphs, bitmap strike glyphs, and synthetic unsupported slot-format records; params={font, glyph_index, ppem, load_flags, xdelta, ydelta, initial_slot_snapshot}; expected output shape={slot_format, outline_points/cbox or bitmap descriptor/bytes, metrics, advance, bitmap_top, unchanged sentinel for noop}; comparison=exact C oracle mutated fields and bytes, with void/no-status semantics.

- id: ftsynth.FT_GlyphSlot_Embolden
  kind: function
  symbol: FT_GlyphSlot_Embolden
  header: freetype/ftsynth.h
  description: Public convenience wrapper that applies FreeType's built-in glyph-slot emboldening strength.
  cases:
    - id: signature_and_wrapper_strength
      description: Public declaration is void FT_GlyphSlot_Embolden(FT_GlyphSlot), and C delegates to FT_GlyphSlot_AdjustWeight(slot, 0x0AAA, 0x0AAA).
    - id: outline_embolden_mutates_geometry_and_metrics
      description: Outline glyphs receive the same point, cbox, metric, and advance changes as AdjustWeight with 0x0AAA deltas at the active size.
    - id: bitmap_embolden_mutates_bitmap_and_metrics
      description: Bitmap glyphs are owned, emboldened, and have descriptor, byte buffer, metrics, advances, and bitmap_top updated exactly as C reports.
    - id: null_or_unsupported_format_noop
      description: Null slots and unsupported glyph formats return without observable mutation because the wrapped AdjustWeight path no-ops.
  # needs-input: operation=FT_Load_Glyph followed by FT_GlyphSlot_Embolden; fixture_asset=outline glyph fonts, embedded bitmap strike font, and synthetic unsupported slot-format records; params={font, glyph_index, ppem, load_flags, initial_slot_snapshot}; expected output shape={slot_format, outline_points/cbox or bitmap descriptor/bytes, metrics, advance, bitmap_top, unchanged sentinel for noop}; comparison=exact C oracle mutated fields and bitmap bytes.

- id: ftsynth.FT_GlyphSlot_Oblique
  kind: function
  symbol: FT_GlyphSlot_Oblique
  header: freetype/ftsynth.h
  description: Public convenience wrapper that slants outline glyph slots by FreeType's built-in oblique shear.
  cases:
    - id: signature_and_wrapper_shear
      description: Public declaration is void FT_GlyphSlot_Oblique(FT_GlyphSlot), and C delegates to FT_GlyphSlot_Slant(slot, 0x0366A, 0).
    - id: outline_oblique_transforms_points_only
      description: Outline glyphs are transformed by matrix xx=1.0, xy=0x0366A, yx=0, yy=1.0, while the advance width is not touched by the slant operation.
    - id: metrics_and_cbox_match_c_after_shear
      description: The post-slant outline coordinates and derived control box match C's FT_Outline_Transform fixed-point rounding exactly.
    - id: null_or_non_outline_noop
      description: Null slots and non-outline glyph formats, including bitmap glyphs, return without mutation.
  # needs-input: operation=FT_Load_Glyph followed by FT_GlyphSlot_Oblique; fixture_asset=outline glyphs with vertical stems/diagonals plus bitmap strike glyph; params={font, glyph_index, ppem, load_flags, initial_slot_snapshot}; expected output shape={outline_points, cbox, metrics, advance, bitmap/noop sentinel}; comparison=exact C oracle 26.6 coordinates and unchanged fields for no-op cases.

- id: ftsynth.FT_GlyphSlot_Slant
  kind: function
  symbol: FT_GlyphSlot_Slant
  header: freetype/ftsynth.h
  description: Public glyph-slot slant helper that applies a caller-provided x/y shear to outline glyph slots.
  cases:
    - id: signature_and_matrix_contract
      description: Public declaration is void FT_GlyphSlot_Slant(FT_GlyphSlot, FT_Fixed, FT_Fixed), and C constructs matrix {xx=0x10000, xy=xslant, yx=-yslant, yy=0x10000}.
    - id: horizontal_and_vertical_slant_mutate_outline
      description: Non-zero xslant and yslant values transform outline points exactly through FT_Outline_Transform, including combined affine shear.
    - id: zero_slant_preserves_outline
      description: Zero xslant and yslant leave all outline points and public slot fields unchanged apart from any C-internal no-op traversal effects.
    - id: null_or_non_outline_noop
      description: Null slots and glyph formats other than OUTLINE return without mutation or error reporting.
  # needs-input: operation=FT_Load_Glyph followed by FT_GlyphSlot_Slant; fixture_asset=outline glyphs with positive/negative coordinates and bitmap strike glyph; params={font, glyph_index, ppem, load_flags, xslant, yslant, initial_slot_snapshot}; expected output shape={outline_points, cbox, metrics, advance, unchanged sentinel for zero/non-outline/null}; comparison=exact C oracle 26.6 point values and unchanged public fields.

- id: ftsystem.FT_StreamRec
  kind: record
  symbol: FT_StreamRec
  header: freetype/ftsystem.h
  description: Public stream record used by FreeType clients to provide memory-backed or callback-backed input streams.
  cases:
    - id: layout_matches_c
      description: Size, alignment, and field offsets match the pinned C header for base, size, pos, descriptor, pathname, read, close, memory, cursor, and limit.
    - id: memory_stream_field_contract
      description: Memory streams expose base, size, pos, cursor, and limit behavior used by FT_Stream_OpenMemory and frame-reading helpers.
    - id: callback_stream_field_contract
      description: Callback streams use descriptor/pathname unions plus read and close function pointers without changing the public record shape.
  # needs-input: operation=C ABI layout probe plus FT_Open_Args external stream fixture; fixture_asset=in-memory font bytes and custom callback stream binary harness; params={initial FT_StreamRec fields, read callback behavior, close callback behavior}; expected output shape={sizeof, alignof, field_offsets, stream positions, callback event log, face load status}; comparison=exact C ABI layout and stream callback observations.

- id: ftsystem.FT_Memory
  kind: type
  symbol: FT_Memory
  header: freetype/ftsystem.h
  description: Public opaque handle typedef to FT_MemoryRec_ used by FreeType allocation callbacks.
  cases:
    - id: alias_defined
      description: Type alias is present as struct FT_MemoryRec_* in the pinned C public interface.
    - id: pointer_abi_contract
      description: The handle has pointer size/alignment and is passed unchanged to alloc, free, and realloc callbacks.
    - id: custom_allocator_runtime_events
      description: A library initialized with custom memory records routes allocation, reallocation, and free events through the supplied callbacks.
  # needs-input: operation=FT_New_Library with custom FT_MemoryRec followed by face load and FT_Done_Library; fixture_asset=valid small font bytes; params={allocator success/failure plan, realloc behavior}; expected output shape={ABI pointer layout, callback event log, FT_Error, allocation counts}; comparison=exact C oracle callback order, pointer classes, and returned status.

- id: ftsystem.FT_Stream
  kind: type
  symbol: FT_Stream
  header: freetype/ftsystem.h
  description: Public opaque handle typedef to FT_StreamRec_ used by FreeType stream APIs and custom FT_Open_Args.
  cases:
    - id: alias_defined
      description: Type alias is present as struct FT_StreamRec_* in the pinned C public interface.
    - id: pointer_abi_contract
      description: The handle has pointer size/alignment and points to the public FT_StreamRec fields used by callbacks.
    - id: external_stream_runtime_contract
      description: Passing a caller-owned FT_Stream through FT_Open_Args keeps stream ownership and invokes the public close callback only according to C's external-stream rules.
  # needs-input: operation=FT_Open_Face using FT_OPEN_STREAM with caller-owned FT_StreamRec; fixture_asset=valid font bytes and malformed stream callback fixture; params={read callback returns, seek behavior, close callback present}; expected output shape={ABI pointer layout, callback event log, face load status, stream field mutations}; comparison=exact C oracle pointer/ownership behavior and returned error.

- id: fttrigon.FT_ANGLE_2PI
  kind: constant
  symbol: FT_ANGLE_2PI
  header: freetype/fttrigon.h
  description: Public FT_Angle constant for a full turn in FreeType's 16.16 degree units.
  cases:
    - id: value_matches_header
      description: Value equals FT_ANGLE_PI * 2, i.e. 23592960 in the pinned C header.
    - id: periodic_equivalence
      description: Adding or subtracting this value to trigonometric input angles produces C-equivalent periodic Sin, Cos, Tan, Rotate, and Unit outputs.
  # needs-input: operation=constant_eval plus trigon function calls; fixture_asset=no font needed; params={angles=[0, FT_ANGLE_PI2, FT_ANGLE_PI, arbitrary, arbitrary+FT_ANGLE_2PI]}; expected output shape={constant_value, FT_Fixed results, FT_Vector results}; comparison=exact C oracle integers and vector fields.

- id: fttrigon.FT_ANGLE_PI
  kind: constant
  symbol: FT_ANGLE_PI
  header: freetype/fttrigon.h
  description: Public FT_Angle constant for 180 degrees in FreeType's 16.16 degree units.
  cases:
    - id: value_matches_header
      description: Value equals 180L << 16, i.e. 11796480 in the pinned C header.
    - id: half_turn_outputs
      description: C trigon output at this angle produces the pinned fixed-point half-turn signs for unit vector, sine, cosine, tangent, and vector rotation.
  # needs-input: operation=constant_eval plus FT_Sin/FT_Cos/FT_Tan/FT_Vector_Unit/FT_Vector_Rotate; fixture_asset=no font needed; params={angle=FT_ANGLE_PI, vectors=[unit_x, unit_y, arbitrary]}; expected output shape={constant_value, FT_Fixed results, FT_Vector results}; comparison=exact C oracle integers and vector fields.

- id: fttrigon.FT_ANGLE_PI2
  kind: constant
  symbol: FT_ANGLE_PI2
  header: freetype/fttrigon.h
  description: Public FT_Angle constant for 90 degrees in FreeType's 16.16 degree units.
  cases:
    - id: value_matches_header
      description: Value equals FT_ANGLE_PI / 2, i.e. 5898240 in the pinned C header.
    - id: quarter_turn_outputs
      description: C trigon output at this angle captures the exact quarter-turn fixed-point rounding used by unit, rotate, sine, cosine, and tangent paths.
  # needs-input: operation=constant_eval plus FT_Sin/FT_Cos/FT_Tan/FT_Vector_Unit/FT_Vector_Rotate; fixture_asset=no font needed; params={angle=FT_ANGLE_PI2, vectors=[unit_x, unit_y, arbitrary, large_safe]}; expected output shape={constant_value, FT_Fixed results, FT_Vector results}; comparison=exact C oracle integers and vector fields.

- id: fttrigon.FT_ANGLE_PI4
  kind: constant
  symbol: FT_ANGLE_PI4
  header: freetype/fttrigon.h
  description: Public FT_Angle constant for 45 degrees in FreeType's 16.16 degree units.
  cases:
    - id: value_matches_header
      description: Value equals FT_ANGLE_PI / 4, i.e. 2949120 in the pinned C header.
    - id: sector_boundary_outputs
      description: C CORDIC sector reduction boundary behavior at +/-PI4 is captured for sine, cosine, tangent, unit vector, rotate, and polarize.
  # needs-input: operation=constant_eval plus trigon function calls at +/-FT_ANGLE_PI4; fixture_asset=no font needed; params={angles=[FT_ANGLE_PI4, -FT_ANGLE_PI4], vectors=[unit_x, diagonal, large_safe]}; expected output shape={constant_value, FT_Fixed results, FT_Vector results, polar length/angle}; comparison=exact C oracle integers including boundary rounding.

- id: fttrigon.FT_Angle_Diff
  kind: function
  symbol: FT_Angle_Diff
  header: freetype/fttrigon.h
  description: Public angle subtraction helper that constrains angle2-angle1 to FreeType's ]-PI..PI] interval.
  cases:
    - id: signature_and_return_type
      description: Public declaration returns FT_Angle from two FT_Angle inputs with no error status.
    - id: wraps_to_open_closed_pi_interval
      description: Deltas less than or equal to -FT_ANGLE_PI are increased by FT_ANGLE_2PI and deltas greater than FT_ANGLE_PI are decreased until they enter ]-PI..PI].
    - id: boundary_and_multiple_turn_cases
      description: Exact behavior at -PI, +PI, zero, and multi-turn-separated angles matches C integer loop semantics.
  # needs-input: operation=FT_Angle_Diff; fixture_asset=no font needed; params={angle_pairs including zero, +/-PI, +/-2PI, arbitrary large positive/negative}; expected output shape={FT_Angle result}; comparison=exact C oracle integer result.

- id: fttrigon.FT_Atan2
  kind: function
  symbol: FT_Atan2
  header: freetype/fttrigon.h
  description: Public fixed-point arctangent helper returning an FT_Angle for an input vector.
  cases:
    - id: signature_and_return_type
      description: Public declaration returns FT_Angle FT_Atan2(FT_Fixed x, FT_Fixed y) with no error status.
    - id: zero_vector_returns_zero
      description: C returns angle 0 when both coordinates are zero.
    - id: quadrant_and_axis_angles
      description: Axis-aligned, diagonal, and all-quadrant vectors match C's prenormalization, pseudo-polarization, and angle rounding.
    - id: large_and_small_fixed_point_inputs
      description: Very small and overflow-safe large vectors exercise C's shift normalization and produce exact pinned integer angles.
  # needs-input: operation=FT_Atan2; fixture_asset=no font needed; params={vectors=[zero, axes, diagonals, arbitrary, large_safe, tiny]}; expected output shape={FT_Angle result}; comparison=exact C oracle 16.16 degree integer.

- id: fttrigon.FT_Cos
  kind: function
  symbol: FT_Cos
  header: freetype/fttrigon.h
  description: Public fixed-point cosine helper implemented through FT_Vector_Unit.
  cases:
    - id: signature_and_return_type
      description: Public declaration returns FT_Fixed FT_Cos(FT_Angle angle) with no error status.
    - id: cardinal_and_diagonal_angles
      description: Cosine outputs at 0, +/-PI4, +/-PI2, PI, and 2PI match C's CORDIC table and rounding.
    - id: periodic_and_large_angle_inputs
      description: Angles outside one turn are reduced by C pseudo-rotation loops and return exact periodic fixed-point results.
  # needs-input: operation=FT_Cos; fixture_asset=no font needed; params={angles=[0, +/-PI4, +/-PI2, PI, 2PI, arbitrary, large]}; expected output shape={FT_Fixed result}; comparison=exact C oracle integer result.

- id: fttrigon.FT_Sin
  kind: function
  symbol: FT_Sin
  header: freetype/fttrigon.h
  description: Public fixed-point sine helper implemented through FT_Vector_Unit.
  cases:
    - id: signature_and_return_type
      description: Public declaration returns FT_Fixed FT_Sin(FT_Angle angle) with no error status.
    - id: cardinal_and_diagonal_angles
      description: Sine outputs at 0, +/-PI4, +/-PI2, PI, and 2PI match C's CORDIC table and rounding.
    - id: periodic_and_large_angle_inputs
      description: Angles outside one turn are reduced by C pseudo-rotation loops and return exact periodic fixed-point results.
  # needs-input: operation=FT_Sin; fixture_asset=no font needed; params={angles=[0, +/-PI4, +/-PI2, PI, 2PI, arbitrary, large]}; expected output shape={FT_Fixed result}; comparison=exact C oracle integer result.

- id: fttrigon.FT_Tan
  kind: function
  symbol: FT_Tan
  header: freetype/fttrigon.h
  description: Public fixed-point tangent helper using CORDIC pseudo-rotation and FT_DivFix.
  cases:
    - id: signature_and_return_type
      description: Public declaration returns FT_Fixed FT_Tan(FT_Angle angle) with no error status.
    - id: zero_diagonal_and_negative_angles
      description: Tangent results at zero, +/-PI4, arbitrary positive, and arbitrary negative angles match C's CORDIC and division rounding.
    - id: near_vertical_edge_cases
      description: Inputs around +/-PI2 capture C's exact division behavior, saturation/error-free return value shape, and integer rounding.
  # needs-input: operation=FT_Tan; fixture_asset=no font needed; params={angles=[0, +/-PI4, near +/-PI2, arbitrary, arbitrary+PI]}; expected output shape={FT_Fixed result}; comparison=exact C oracle integer result.

- id: fttrigon.FT_Vector_From_Polar
  kind: function
  symbol: FT_Vector_From_Polar
  header: freetype/fttrigon.h
  description: Public helper that converts a length and angle into an output FT_Vector in place.
  cases:
    - id: signature_and_void_contract
      description: Public declaration is void FT_Vector_From_Polar(FT_Vector*, FT_Fixed, FT_Angle), so comparison is based on the mutated vector.
    - id: cardinal_diagonal_and_negative_lengths
      description: C initializes vec to {length,0} and rotates it, preserving exact fixed-point output for cardinal, diagonal, arbitrary, and negative length inputs.
    - id: zero_length_and_zero_angle
      description: Zero length or zero angle follows FT_Vector_Rotate's no-op paths after initialization and produces exact C vector fields.
    - id: null_vector_noop
      description: A null vector pointer returns without writing output.
  # needs-input: operation=FT_Vector_From_Polar; fixture_asset=no font needed; params={lengths=[0, 1, 0x10000, negative, large_safe], angles=[0, +/-PI4, +/-PI2, PI, arbitrary], initial_vec_sentinel}; expected output shape={FT_Vector fields or unchanged sentinel}; comparison=exact C oracle x/y integers and null no-op behavior.

- id: fttrigon.FT_Vector_Length
  kind: function
  symbol: FT_Vector_Length
  header: freetype/fttrigon.h
  description: Public helper that returns the fixed-point length of an FT_Vector.
  cases:
    - id: signature_and_return_type
      description: Public declaration returns FT_Fixed FT_Vector_Length(FT_Vector*) with no error status.
    - id: null_and_axis_fast_paths
      description: Null vectors return 0, and vectors with one zero component return the absolute value of the other component exactly.
    - id: general_vectors_use_cordic_length
      description: Diagonal and arbitrary vectors match C's prenormalization, pseudo-polarization, downscale, and shift rounding.
    - id: large_and_negative_coordinates
      description: Negative and overflow-safe large coordinates return the same exact fixed-point length as C.
  # needs-input: operation=FT_Vector_Length; fixture_asset=no font needed; params={vectors=[null, zero, axes, diagonals, arbitrary negative, large_safe]}; expected output shape={FT_Fixed result}; comparison=exact C oracle integer result.

- id: fttrigon.FT_Vector_Polarize
  kind: function
  symbol: FT_Vector_Polarize
  header: freetype/fttrigon.h
  description: Public helper that converts a source vector into fixed-point length and FT_Angle outputs.
  cases:
    - id: signature_and_void_contract
      description: Public declaration is void FT_Vector_Polarize(FT_Vector*, FT_Fixed*, FT_Angle*), so comparison is based on output pointers.
    - id: null_pointer_noop
      description: Null vector, null length output, or null angle output returns without mutating caller-provided sentinels.
    - id: zero_vector_preserves_outputs
      description: A non-null zero vector returns without changing length and angle output values.
    - id: quadrant_lengths_and_angles
      description: Axis, diagonal, arbitrary, negative, and large vectors produce exact C length and angle outputs after CORDIC normalization.
  # needs-input: operation=FT_Vector_Polarize; fixture_asset=no font needed; params={vectors=[zero, axes, diagonals, arbitrary, large_safe], pointer_null_matrix, initial_length_angle_sentinels}; expected output shape={length, angle, unchanged sentinels}; comparison=exact C oracle integers and no-op mutation behavior.

- id: fttrigon.FT_Vector_Rotate
  kind: function
  symbol: FT_Vector_Rotate
  header: freetype/fttrigon.h
  description: Public helper that rotates an FT_Vector in place by an FT_Angle.
  cases:
    - id: signature_and_void_contract
      description: Public declaration is void FT_Vector_Rotate(FT_Vector*, FT_Angle), so comparison is based on the mutated vector.
    - id: null_zero_angle_and_zero_vector_noop
      description: Null vector pointers, zero angles, and zero vectors return without mutating caller-visible vector fields.
    - id: cardinal_diagonal_and_arbitrary_rotations
      description: Rotations by +/-PI4, +/-PI2, PI, 2PI, and arbitrary angles match C's prenormalization, pseudo-rotation, downscale, and signed rounding.
    - id: large_fixed_point_edges
      description: Overflow-safe large and negative coordinate vectors exercise C's shift-up and shift-down paths with exact integer output comparison.
  # needs-input: operation=FT_Vector_Rotate; fixture_asset=no font needed; params={vectors=[zero, unit_x, unit_y, diagonal, arbitrary negative, large_safe], angles=[0, +/-PI4, +/-PI2, PI, 2PI, arbitrary], initial_vec_sentinel}; expected output shape={FT_Vector fields or unchanged sentinel}; comparison=exact C oracle x/y integers and no-op behavior.
