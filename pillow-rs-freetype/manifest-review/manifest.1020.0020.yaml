  # needs-input: operation=FT_Get_Sfnt_Name; fixture_asset=input/fonts/names/ot14-preferred-family.ttf; params={name_id=TT_NAME_ID_PREFERRED_FAMILY}; expected output shape={FT_Error, name_index, platform_id, encoding_id, language_id, name_id, string_bytes}; comparison=exact C oracle status and record scalar/string bytes, including returned name_id=16.

