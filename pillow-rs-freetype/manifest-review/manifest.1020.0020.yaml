- id: ttnameid.TT_NAME_ID_FULL_NAME
  kind: constant
  symbol: TT_NAME_ID_FULL_NAME
  header: freetype/ttnameid.h
  description: Public SFNT name-table name ID for the full font name; pinned FreeType defines it as 4.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 4 as defined by pinned freetype/ttnameid.h.
    - id: public_import_contract
      description: A C translation unit including <freetype/ttnameid.h> can reference TT_NAME_ID_FULL_NAME as a preprocessor-visible public constant.
    - id: representative_name_record_match
      description: A representative SFNT name record with name ID 4 is returned with the same scalar fields and string bytes as the C oracle.
  # needs-input: operation=FT_Get_Sfnt_Name; fixture_asset=input/fonts/names/ot-name-basic.ttf; params={name_id=TT_NAME_ID_FULL_NAME, platform_id=TT_PLATFORM_MICROSOFT, encoding_id=TT_MS_ID_UNICODE_CS}; expected output shape={FT_Error, name_index, platform_id, encoding_id, language_id, name_id, string_bytes}; comparison=exact C oracle status and name-record scalar/string bytes.

