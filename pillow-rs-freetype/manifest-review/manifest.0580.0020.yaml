- id: ftincrem.FT_Incremental_FuncsRec
  kind: record
  symbol: FT_Incremental_FuncsRec
  header: freetype/ftincrem.h
  description: Public incremental loading callback table used by FT_Incremental_InterfaceRec.
  cases:
    - id: layout_matches_c
      description: Size, alignment, and field offsets for get_glyph_data, free_glyph_data, and get_glyph_metrics match the pinned C header.
    - id: callback_abi_matches_c
      description: Function pointer signatures match the C ABI for glyph data acquisition, glyph data release, and optional metrics override callbacks.
    - id: required_and_optional_callbacks
      description: get_glyph_data and free_glyph_data are required by the incremental contract, while get_glyph_metrics may be null and is skipped by C when absent.
    - id: glyph_data_success_and_release
      description: A successful get_glyph_data callback returns FT_Data bytes that C consumes read-only and later releases through free_glyph_data with the same incremental object.
    - id: callback_error_propagates
      description: Errors returned by get_glyph_data or get_glyph_metrics propagate through the glyph load path with C-compatible cleanup behavior.
  # needs-input: operation=FT_Open_Face with FT_PARAM_TAG_INCREMENTAL followed by FT_Load_Glyph/FT_Load_Char; fixture_asset=minimal TrueType and Type1/CFF binary-font fixtures whose glyph bytes are supplied by callbacks, plus malformed glyph data and callback-error cases; params={glyph_index, load_flags, callback_return_error, metrics_override, nested_compound_glyph}; expected output shape={FT_Error, callback event log, FT_Data pointer/length class, released byte-handle ids, glyph metrics/outline/bitmap fields}; comparison=exact C oracle callback order, arguments, error propagation, output fields, and ownership release sequence.

- id: ftincrem.FT_Incremental_InterfaceRec
  kind: record
  symbol: FT_Incremental_InterfaceRec
  header: freetype/ftincrem.h
  description: Public incremental loading interface record passed through FT_PARAM_TAG_INCREMENTAL to FT_Open_Face.
  cases:
    - id: layout_matches_c
      description: Size, alignment, and field offsets for funcs and object match the pinned C header.
    - id: open_face_stores_interface
      description: FT_Open_Face copies the interface pointer from FT_Parameter data into face->internal->incremental_interface when FT_CONFIG_OPTION_INCREMENTAL is enabled.
    - id: object_round_trips_to_callbacks
      description: The opaque object pointer is passed unchanged to get_glyph_data, free_glyph_data, and get_glyph_metrics callbacks.
    - id: absent_parameter_uses_embedded_data
      description: Opening the same font without FT_PARAM_TAG_INCREMENTAL uses normal embedded glyph data and performs no incremental callback calls.
  # needs-input: operation=FT_Open_Face with and without FT_PARAM_TAG_INCREMENTAL; fixture_asset=TrueType and Type1/CFF fonts usable both with embedded glyphs and callback-supplied glyph bytes; params={num_params, param_tag, interface_pointer, object_token, callback_table}; expected output shape={FT_Error, face-open status, callback event log, object pointer identity class, loaded glyph metrics/bytes}; comparison=exact C oracle face-open error, callback/no-callback path, object identity, and glyph output parity.

- id: ftincrem.FT_Incremental_MetricsRec
  kind: record
  symbol: FT_Incremental_MetricsRec
  header: freetype/ftincrem.h
  description: Public incremental glyph metrics record with font-unit bearings and advances.
  cases:
    - id: layout_matches_c
      description: Size, alignment, and field offsets for bearing_x, bearing_y, advance, and advance_v match the pinned C header.
    - id: input_metrics_seed_matches_c
      description: Before get_glyph_metrics is called, C seeds the record from the current glyph metrics or zeros according to the driver path.
    - id: horizontal_override_applied
      description: A successful horizontal metrics callback overrides left bearing and advance fields exactly as the C TrueType, Type1, and CFF paths do.
    - id: vertical_override_applied_where_c_calls_it
      description: Vertical metrics callbacks are only invoked by C paths that implement them, and output advance/bearing fields match those paths exactly.
  # needs-input: operation=FT_Load_Glyph with incremental get_glyph_metrics; fixture_asset=TrueType font with hmtx/vmtx candidates and Type1/CFF charstrings; params={glyph_index, vertical=false/true where reached, original_metrics, override_metrics, callback_error}; expected output shape={FT_Error, callback input/output metrics record, final FT_GlyphSlot metrics and linear advances}; comparison=exact C oracle callback arguments, seeded values, final metrics, and error propagation.

- id: ftincrem.FT_Incremental
  kind: type
  symbol: FT_Incremental
  header: freetype/ftincrem.h
  description: Public opaque handle type for client-owned incremental loading state.
  cases:
    - id: typedef_pointer_shape
      description: Type is an opaque pointer to struct FT_IncrementalRec_ exactly as declared by the C header.
    - id: handle_passed_without_deref
      description: FreeType treats the handle as client-owned opaque state and passes it to callbacks without dereferencing or copying the pointed data.
    - id: lifetime_owned_by_client
      description: The client must keep the object alive while the face can load incrementally supplied glyphs; C does not free the object.
  # needs-input: operation=FT_Open_Face and repeated FT_Load_Glyph through incremental callbacks; fixture_asset=incremental binary-font fixture; params={object_token, object_lifetime_scope, face_done_order}; expected output shape={callback event log, object pointer identity class, allocation/free event stream}; comparison=exact C oracle object pointer identity and absence of FreeType-owned frees for the opaque object.

- id: ftincrem.FT_Incremental_Interface
  kind: type
  symbol: FT_Incremental_Interface
  header: freetype/ftincrem.h
  description: Public pointer typedef for FT_Incremental_InterfaceRec.
  cases:
    - id: typedef_pointer_shape
      description: Type is FT_Incremental_InterfaceRec* exactly as declared by the C header.
    - id: parameter_data_cast_shape
      description: FT_Open_Face casts FT_Parameter.data for FT_PARAM_TAG_INCREMENTAL to this pointer type before storing it in the face internals.
    - id: null_or_absent_interface_behavior
      description: A missing incremental parameter leaves face incremental state null; a null parameter data pointer records C open/load behavior without inventing callback calls.
  # needs-input: operation=FT_Open_Face with FT_PARAM_TAG_INCREMENTAL; fixture_asset=valid binary font; params={parameter_absent, parameter_data_null, parameter_data_valid}; expected output shape={FT_Error, face-open status, callback event log, loaded glyph output}; comparison=exact C oracle null/valid handling and callback invocation class.

- id: ftincrem.FT_Incremental_Metrics
  kind: type
  symbol: FT_Incremental_Metrics
  header: freetype/ftincrem.h
  description: Public pointer typedef for FT_Incremental_MetricsRec.
  cases:
    - id: typedef_pointer_shape
      description: Type is struct FT_Incremental_MetricsRec_* exactly as declared by the C header.
    - id: callback_pointer_argument_shape
      description: get_glyph_metrics receives a mutable FT_Incremental_MetricsRec pointer whose inout values are observed by C after the callback returns.
    - id: null_not_passed_by_c
      description: C glyph loaders pass a valid stack metrics record when invoking get_glyph_metrics; null-pointer behavior is only a facade ABI guard.
  # needs-input: operation=incremental get_glyph_metrics callback during FT_Load_Glyph; fixture_asset=incremental TrueType and Type1/CFF font fixtures; params={glyph_index, callback_mutates_each_field, callback_error}; expected output shape={callback pointer validity, input metrics, output metrics, final slot metrics}; comparison=exact C oracle pointer validity class, field mutation effects, and error propagation.

- id: ftlcdfil.FT_LCD_FILTER_FIVE_TAPS
  kind: constant
  symbol: FT_LCD_FILTER_FIVE_TAPS
  header: freetype/ftlcdfil.h
  description: Public macro constant defining the five-byte LCD filter weight array length.
  cases:
    - id: value_matches_header
      description: Value is 5 in the pinned C public header.
    - id: weights_copy_uses_five_bytes
      description: FT_Library_SetLcdFilterWeights copies exactly FT_LCD_FILTER_FIVE_TAPS bytes into the library LCD weights when subpixel filtering is enabled.
  # needs-input: operation=FT_Library_SetLcdFilterWeights followed by LCD glyph render; fixture_asset=outline font with LCD-renderable glyph; params={weights[5], sentinel_bytes_after_weights, render_mode=FT_RENDER_MODE_LCD}; expected output shape={FT_Error, copied weight bytes, rendered LCD bitmap descriptor and bytes}; comparison=exact C oracle error code, five-byte copy boundary, bitmap dimensions, placement, and bytes.

- id: ftlcdfil.FT_LcdFilter
  kind: enum
  symbol: FT_LcdFilter
  header: freetype/ftlcdfil.h
  description: Public enum selecting LCD filter presets.
  cases:
    - id: variants_match_header
      description: Enum variants and numeric values for NONE, DEFAULT, LIGHT, LEGACY1, LEGACY, and MAX match the pinned C header.
    - id: accepted_filter_values
      description: FT_Library_SetLcdFilter accepts NONE, DEFAULT, and LIGHT when ClearType-style subpixel rendering support is enabled.
    - id: rejected_filter_values
      description: LEGACY, LEGACY1, MAX, and unknown values return C-compatible errors instead of silently selecting a filter.
  # needs-input: operation=FT_Library_SetLcdFilter followed by LCD glyph render; fixture_asset=outline font with thin LCD-renderable glyph; params={filter_value, build_subpixel_mode, render_mode=FT_RENDER_MODE_LCD and LCD_V}; expected output shape={FT_Error, selected filter class, bitmap descriptor and bytes}; comparison=exact C oracle error code, accepted/rejected class, dimensions, placement, and bitmap bytes.

- id: ftlcdfil.FT_LCD_FILTER_DEFAULT
  kind: enum_variant
  symbol: FT_LCD_FILTER_DEFAULT
  header: freetype/ftlcdfil.h
  description: Public FT_LcdFilter value selecting the default beveled five-tap LCD filter.
  cases:
    - id: value_matches_header
      description: Value is 1 in the pinned C public header.
    - id: preset_weights_match_c
      description: When accepted, FT_Library_SetLcdFilter copies weights [0x08, 0x4D, 0x56, 0x4D, 0x08] before LCD rendering.
  # needs-input: operation=FT_Library_SetLcdFilter(DEFAULT) then FT_Render_Glyph(LCD/LCD_V); fixture_asset=outline font with stems at multiple ppem sizes; params={glyph_index, size, load_flags, render_mode}; expected output shape={FT_Error, LCD bitmap descriptor, bitmap bytes}; comparison=exact C oracle preset behavior, dimensions, placement, pitch, pixel mode, and bytes.

- id: ftlcdfil.FT_LCD_FILTER_LEGACY
  kind: enum_variant
  symbol: FT_LCD_FILTER_LEGACY
  header: freetype/ftlcdfil.h
  description: Public FT_LcdFilter legacy value retained for source compatibility.
  cases:
    - id: value_matches_header
      description: Value is 16 in the pinned C public header.
    - id: rejected_by_set_lcd_filter
      description: FT_Library_SetLcdFilter returns Invalid_Argument for this value when the filtering implementation is active.
  # needs-input: operation=FT_Library_SetLcdFilter(LEGACY); fixture_asset=no font needed for direct setter, plus LCD-renderable control glyph to verify unchanged previous filter state; params={previous_filter, filter=LEGACY}; expected output shape={FT_Error, previous filter effect on subsequent bitmap}; comparison=exact C oracle error code and unchanged render output after failed setter.

- id: ftlcdfil.FT_LCD_FILTER_LEGACY1
  kind: enum_variant
  symbol: FT_LCD_FILTER_LEGACY1
  header: freetype/ftlcdfil.h
  description: Public FT_LcdFilter legacy value retained for source compatibility.
  cases:
    - id: value_matches_header
      description: Value is 3 in the pinned C public header.
    - id: rejected_by_set_lcd_filter
      description: FT_Library_SetLcdFilter returns Invalid_Argument for this value when the filtering implementation is active.
  # needs-input: operation=FT_Library_SetLcdFilter(LEGACY1); fixture_asset=no font needed for direct setter, plus LCD-renderable control glyph to verify unchanged previous filter state; params={previous_filter, filter=LEGACY1}; expected output shape={FT_Error, previous filter effect on subsequent bitmap}; comparison=exact C oracle error code and unchanged render output after failed setter.

- id: ftlcdfil.FT_LCD_FILTER_LIGHT
  kind: enum_variant
  symbol: FT_LCD_FILTER_LIGHT
  header: freetype/ftlcdfil.h
  description: Public FT_LcdFilter value selecting the light three-tap LCD filter encoded in five bytes.
  cases:
    - id: value_matches_header
      description: Value is 2 in the pinned C public header.
    - id: preset_weights_match_c
      description: When accepted, FT_Library_SetLcdFilter copies weights [0x00, 0x55, 0x56, 0x55, 0x00] before LCD rendering.
  # needs-input: operation=FT_Library_SetLcdFilter(LIGHT) then FT_Render_Glyph(LCD/LCD_V); fixture_asset=outline font with stems at multiple ppem sizes; params={glyph_index, size, load_flags, render_mode}; expected output shape={FT_Error, LCD bitmap descriptor, bitmap bytes}; comparison=exact C oracle preset behavior, dimensions, placement, pitch, pixel mode, and bytes.

- id: ftlcdfil.FT_LCD_FILTER_MAX
  kind: enum_variant
  symbol: FT_LCD_FILTER_MAX
  header: freetype/ftlcdfil.h
  description: Public sentinel FT_LcdFilter enum value.
  cases:
    - id: value_matches_header
      description: Value follows the explicit legacy value in the pinned C public enum.
    - id: rejected_by_set_lcd_filter
      description: FT_Library_SetLcdFilter treats the sentinel as invalid input when the filtering implementation is active.
  # needs-input: operation=FT_Library_SetLcdFilter(MAX); fixture_asset=no font needed for direct setter; params={filter=FT_LCD_FILTER_MAX, previous_filter}; expected output shape={FT_Error, previous filter state class}; comparison=exact C oracle error code and unchanged state after failed setter.

- id: ftlcdfil.FT_LCD_FILTER_NONE
  kind: enum_variant
  symbol: FT_LCD_FILTER_NONE
  header: freetype/ftlcdfil.h
  description: Public FT_LcdFilter value disabling LCD filter weights.
  cases:
    - id: value_matches_header
      description: Value is 0 in the pinned C public header.
    - id: clears_filter_weights
      description: When accepted, FT_Library_SetLcdFilter zeroes the five LCD weight bytes before LCD rendering.
  # needs-input: operation=FT_Library_SetLcdFilter(NONE) then FT_Render_Glyph(LCD/LCD_V); fixture_asset=outline font with LCD-renderable glyph; params={glyph_index, size, render_mode}; expected output shape={FT_Error, LCD bitmap descriptor, bitmap bytes}; comparison=exact C oracle zero-filter behavior, dimensions, placement, pitch, pixel mode, and bytes.

- id: ftlcdfil.FT_Library_SetLcdFilter
  kind: function
  symbol: FT_Library_SetLcdFilter
  header: freetype/ftlcdfil.h
  description: Public C API function that changes the library LCD filter preset for subpixel bitmap rendering.
  cases:
    - id: success_sets_none_default_light
      description: For active subpixel filtering builds, NONE clears weights, DEFAULT copies the beveled preset, and LIGHT copies the light preset.
    - id: error_null_library
      description: A null library returns Invalid_Library_Handle in active subpixel filtering builds.
    - id: error_invalid_filter
      description: Unsupported enum values return Invalid_Argument and do not change the previous filter.
    - id: unimplemented_without_subpixel_filtering
      description: Builds without FT_CONFIG_OPTION_SUBPIXEL_RENDERING return Unimplemented_Feature for every input because the stub ignores library and filter.
  # needs-input: operation=FT_Library_SetLcdFilter plus FT_Render_Glyph in LCD/LCD_V modes; fixture_asset=outline font with glyphs sensitive to LCD filtering; params={library_null, filter_value, build_subpixel_mode, previous_filter, glyph_index, size}; expected output shape={FT_Error, LCD bitmap descriptor, bitmap bytes, state preservation class}; comparison=exact C oracle error code, preset effect, unchanged state on invalid values, dimensions, placement, pitch, and bytes.

- id: ftlcdfil.FT_Library_SetLcdFilterWeights
  kind: function
  symbol: FT_Library_SetLcdFilterWeights
  header: freetype/ftlcdfil.h
  description: Public C API function that copies custom five-tap LCD filter weights into the library.
  cases:
    - id: success_copies_five_weights
      description: For active subpixel filtering builds, copies the first five bytes from weights into library state and affects subsequent LCD rendering.
    - id: error_null_library
      description: A null library returns Invalid_Library_Handle in active subpixel filtering builds.
    - id: error_null_weights
      description: A null weights pointer returns Invalid_Argument in active subpixel filtering builds.
    - id: unimplemented_without_subpixel_filtering
      description: Builds without FT_CONFIG_OPTION_SUBPIXEL_RENDERING return Unimplemented_Feature for every input because the stub ignores library and weights.
  # needs-input: operation=FT_Library_SetLcdFilterWeights plus FT_Render_Glyph in LCD/LCD_V modes; fixture_asset=outline font with glyphs sensitive to LCD filtering; params={library_null, weights_null, weights[5], sentinel_after_weights, build_subpixel_mode, glyph_index, size}; expected output shape={FT_Error, copied five-byte weight class, LCD bitmap descriptor, bitmap bytes}; comparison=exact C oracle error code, copy length, state preservation on error, dimensions, placement, pitch, and bytes.

- id: ftlcdfil.FT_Library_SetLcdGeometry
  kind: function
  symbol: FT_Library_SetLcdGeometry
  header: freetype/ftlcdfil.h
  description: Public C API function that sets Harmony LCD subpixel geometry when ClearType-style filtering is not active.
  cases:
    - id: success_sets_three_vectors
      description: In Harmony builds, copies exactly three FT_Vector values into library LCD geometry and affects subsequent LCD/LCD_V rendering shifts.
    - id: error_null_library
      description: In Harmony builds, a null library returns Invalid_Library_Handle.
    - id: error_null_geometry
      description: In Harmony builds, a null subpixel vector pointer returns Invalid_Argument.
    - id: unimplemented_with_subpixel_filtering
      description: In FT_CONFIG_OPTION_SUBPIXEL_RENDERING builds, this function returns Unimplemented_Feature and ignores library and sub arguments.
  # needs-input: operation=FT_Library_SetLcdGeometry plus FT_Render_Glyph in LCD/LCD_V modes; fixture_asset=outline font with glyphs sensitive to subpixel shifts; params={library_null, sub_null, sub[3] vectors for RGB/BGR/vertical/PenTile, build_subpixel_mode, glyph_index, size}; expected output shape={FT_Error, copied vector class, LCD bitmap descriptor, bitmap bytes}; comparison=exact C oracle error code, three-vector copy boundary, state preservation on error, dimensions, placement, pitch, and bytes.

- id: ftlist.FT_List_Add
  kind: function
  symbol: FT_List_Add
  header: freetype/ftlist.h
  description: Public C API function that appends a node to the tail of an FT_List.
  cases:
    - id: success_empty_list
      description: Appending to an empty list sets both head and tail to the node, sets node->prev null, and sets node->next null.
    - id: success_non_empty_list
      description: Appending to a non-empty list links the previous tail to the node, updates node->prev, clears node->next, and changes tail only.
    - id: null_list_or_node_noop
      description: A null list or null node returns without mutating reachable list or node state.
  # needs-input: operation=FT_List_Add; fixture_asset=no font needed, use ABI list fixture with allocated FT_ListNodeRec nodes and stable data tokens; params={initial_nodes, node_to_add, list_null, node_null}; expected output shape={head token, tail token, per-node prev/next/data tokens, mutation event class}; comparison=exact C oracle pointer graph after call and no-op behavior.

- id: ftlist.FT_List_Finalize
  kind: function
  symbol: FT_List_Finalize
  header: freetype/ftlist.h
  description: Public C API function that destroys every node in a list and optionally calls a user destructor for node data.
  cases:
    - id: success_destroys_all_nodes
      description: Iterates from head to tail, calls destroy for each node data when provided, frees each node with FT_FREE, then clears list head and tail.
    - id: success_null_destructor_frees_nodes_only
      description: A null destroy callback skips data destruction while still freeing all nodes and clearing the list.
    - id: null_list_or_memory_noop
      description: A null list or null memory returns without destructor calls or pointer graph mutation.
    - id: destructor_receives_memory_data_user
      description: The destructor callback receives the supplied FT_Memory, current node data pointer, and user pointer for every node in traversal order.
  # needs-input: operation=FT_List_Finalize; fixture_asset=no font needed, use ABI list fixture with custom FT_Memory allocator hooks and node data tokens; params={node_count, destroy_present, list_null, memory_null, user_token}; expected output shape={destructor event log, free event log, final head/tail, data tokens}; comparison=exact C oracle traversal order, callback args, frees, null no-op behavior, and final list state.

- id: ftlist.FT_List_Find
  kind: function
  symbol: FT_List_Find
  header: freetype/ftlist.h
  description: Public C API function that finds the first list node whose data pointer equals the requested object pointer.
  cases:
    - id: success_finds_first_matching_node
      description: Returns the first node whose data pointer is exactly equal to the requested pointer, preserving list order for duplicate data values.
    - id: missing_data_returns_null
      description: Returns null when no node data pointer matches.
    - id: null_list_returns_null
      description: A null list returns null without reading any node memory.
    - id: null_data_matches_null_node_data
      description: A null data search returns the first node whose data field is null, matching C pointer equality semantics.
  # needs-input: operation=FT_List_Find; fixture_asset=no font needed, use ABI list fixture with stable data tokens including duplicate and null data entries; params={initial_nodes, search_data_token, list_null}; expected output shape={returned node token/null, list pointer graph unchanged}; comparison=exact C oracle returned pointer identity and no mutation of head/tail/prev/next/data.
