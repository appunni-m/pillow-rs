- id: ftmoderr.FT_Mod_Err_e
  kind: error
  symbol: FT_Mod_Err_e
  header: freetype/ftmoderr.h
  description: Public enum tag generated by FT_MODERR_START_LIST for the module error-base list.
  cases:
    - id: enum_tag_exists
      description: The public module-error list is emitted as an enum when FT_MODERRDEF is not pre-defined, and this subject records the generated enum tag shape.
    - id: import_contract
      description: Including freetype/ftmoderr.h with default setup macros exposes the module error enum without requiring client-side FT_MODERRDEF definitions.
    - id: cleanup_macros_removed
      description: FT_MODERR_START_LIST, FT_MODERR_END_LIST, and FT_MODERRDEF are undefined after inclusion as in the pinned C header.
  # needs-input: operation=C import/ABI compile probe; fixture_asset=small C translation unit including freetype/ftmoderr.h twice with and without custom FT_MODERRDEF; params={default_include, custom_list_include}; expected output shape={compile_status, enum_tag_available, generated_constants, cleanup_macro_visibility}; comparison=exact C compiler success and preprocessor/import shape.

- id: ftotval.FT_VALIDATE_BASE
  kind: flag
  symbol: FT_VALIDATE_BASE
  header: freetype/ftotval.h
  description: Public OpenType validation flag for the BASE table.
  cases:
    - id: value_matches_header
      description: Value is 0x0100 in the pinned C public header.
    - id: validate_selects_base_table
      description: FT_OpenType_Validate passes this bit to the OpenType validation service and only requests BASE output for this flag.
    - id: absent_table_returns_null_output
      description: For a valid OpenType face without BASE, C succeeds or reports service-specific validation status while leaving the BASE output pointer null as the validator dictates.
  # needs-input: operation=FT_OpenType_Validate; fixture_asset=OpenType font with BASE table, OpenType font without BASE table, malformed BASE table binary; params={validation_flags=FT_VALIDATE_BASE, output_pointer_null=false}; expected output shape={FT_Error, BASE_table pointer class, table byte length/hash, other table pointer classes}; comparison=exact C oracle status, null/non-null outputs, and copied table bytes.

