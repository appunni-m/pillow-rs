- id: ftmoderr.FT_Mod_Err_Raster
  kind: error
  symbol: FT_Mod_Err_Raster
  header: freetype/ftmoderr.h
  description: Public module error base for the classic raster module.
  cases:
    - id: value_matches_configured_header
      description: Value is 0x0F00 when FT_CONFIG_OPTION_USE_MODULE_ERRORS is enabled and 0 otherwise, exactly as FT_MODERRDEF expands in the pinned C header.
    - id: prefixed_error_base
      description: Raster module errors use this high-byte base when rasterrs.h defines FT_ERR_BASE as FT_Mod_Err_Raster.
    - id: module_name_contract
      description: The public FT_MODERRDEF list labels this entry as the raster module, preserving source-compatible module classification.
  # needs-input: operation=compile-time constant extraction plus raster error fixture; fixture_asset=outline that triggers raster Invalid_Outline/Cannot_Render_Glyph where reachable; params={module_errors_enabled, render_mode, malformed_outline}; expected output shape={constant_value, FT_Error, FT_ERROR_BASE, FT_ERROR_MODULE}; comparison=exact C oracle constant and returned error base/module bits.

