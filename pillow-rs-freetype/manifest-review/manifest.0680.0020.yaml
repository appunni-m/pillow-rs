- id: ftotval.FT_VALIDATE_OT
  kind: flag
  symbol: FT_VALIDATE_OT
  header: freetype/ftotval.h
  description: Public aggregate OpenType validation flag for BASE, GDEF, GPOS, GSUB, JSTF, and MATH.
  cases:
    - id: value_matches_header_expression
      description: Value equals the bitwise OR of FT_VALIDATE_BASE, FT_VALIDATE_GDEF, FT_VALIDATE_GPOS, FT_VALIDATE_GSUB, FT_VALIDATE_JSTF, and FT_VALIDATE_MATH in the pinned C header.
    - id: validate_all_requested_tables
      description: FT_OpenType_Validate requests all supported OpenType validation tables and returns the five public output pointers exactly as C does.
    - id: partial_failure_cleanup_contract
      description: If one table fails validation, output pointer state and caller free obligations match C for tables allocated before the failure.
  # needs-input: operation=FT_OpenType_Validate then FT_OpenType_Free for every non-null public output; fixture_asset=OpenType font containing multiple valid tables plus table-specific malformed variants; params={validation_flags=FT_VALIDATE_OT, malformed_table_kind}; expected output shape={FT_Error, BASE/GDEF/GPOS/GSUB/JSTF pointer classes, output byte length/hash, free event list, MATH validation status without output pointer}; comparison=exact C oracle aggregate flag value, validation status, output bytes, and cleanup behavior.

- id: ftotval.FT_OpenType_Free
  kind: function
  symbol: FT_OpenType_Free
  header: freetype/ftotval.h
  description: Public C API function that frees buffers allocated by FT_OpenType_Validate.
  cases:
    - id: declaration_matches_header
      description: Declaration is void FT_OpenType_Free(FT_Face face, FT_Bytes table) exactly as exported by the pinned C header.
    - id: null_face_noop
      description: ftotval.c returns immediately when face is null and does not free or dereference the table pointer.
    - id: frees_validated_table_with_face_memory
      description: For a non-null face, the table is released through the face memory allocator exactly once.
    - id: null_table_noop
      description: Passing a null table with a valid face is accepted as the C FT_FREE macro path defines.
  # needs-input: operation=FT_OpenType_Validate followed by FT_OpenType_Free; fixture_asset=OpenType font producing at least one non-null validation table; params={face_valid, table_null, table_from_validate, double_free_attempt=false}; expected output shape={void_status, allocator free event count, pointer identity class}; comparison=exact C oracle no-op/free behavior and absence of observable output mutation.

- id: ftotval.FT_OpenType_Validate
  kind: function
  symbol: FT_OpenType_Validate
  header: freetype/ftotval.h
  description: Public C API function that validates selected OpenType layout tables and returns copied table buffers.
  cases:
    - id: declaration_matches_header
      description: Declaration is FT_Error FT_OpenType_Validate(FT_Face, FT_UInt, FT_Bytes*, FT_Bytes*, FT_Bytes*, FT_Bytes*) with five output table pointers exactly as exported by the pinned C header.
    - id: null_face_error
      description: ftotval.c returns Invalid_Face_Handle when face is null before touching validation service state.
    - id: null_output_pointer_error
      description: If any of BASE, GDEF, GPOS, GSUB, or JSTF output pointer parameters is null, C returns Invalid_Argument.
    - id: service_missing_error
      description: If the face has no OPENTYPE_VALIDATE service, C returns Unimplemented_Feature.
    - id: selected_tables_success
      description: Valid selected tables produce C-owned buffers whose bytes match the original validated table data and must be released with FT_OpenType_Free.
    - id: malformed_table_error
      description: Malformed selected tables propagate the validation service error and preserve output-pointer state exactly as C does.
  # needs-input: operation=FT_OpenType_Validate; fixture_asset=OpenType fonts with valid layout tables, no-layout fonts, and malformed BASE/GDEF/GPOS/GSUB/JSTF/MATH table binaries; params={validation_flags, null_face, null_output_index, face_without_service}; expected output shape={FT_Error, BASE/GDEF/GPOS/GSUB/JSTF pointer classes, table byte length/hash, allocator ownership ids, MATH validation status without output pointer}; comparison=exact C oracle status, output byte payloads, null classes, and ownership/free requirements.

- id: ftoutln.FT_Orientation
  kind: enum
  symbol: FT_Orientation
  header: freetype/ftoutln.h
  description: Public enum describing the fill orientation of an outline contour set.
  cases:
    - id: enum_variants_match_header
      description: Variants and aliases match the pinned header, with TRUETYPE/FILL_RIGHT as 0, POSTSCRIPT/FILL_LEFT as 1, and NONE following them.
    - id: orientation_algorithm_contract
      description: FT_Outline_Get_Orientation uses ftoutln.c polygon-area accumulation over control points, returns TRUETYPE for null/empty outlines, and NONE for collapsed, oversized, or zero-area outlines.
    - id: geometry_fixture_matrix
      description: Runtime fixtures must include clockwise, counter-clockwise, reversed, empty, collapsed, multi-contour, translated, transformed, and malformed outlines with exact cbox/bbox and decompose event comparison.
  # needs-input: operation=FT_Outline_Get_Orientation plus FT_Outline_Get_CBox, FT_Outline_Get_BBox, FT_Outline_Decompose, FT_Outline_Translate, FT_Outline_Transform, and FT_Outline_Reverse on the same outline inputs; fixture_asset=shared outline JSON/binary fixtures with line, conic, cubic, degenerate, oversized, and malformed contour cases; params={points, tags, contours, transform_matrix, translate_dx_dy, reverse=false/true, callback_error_at_event}; expected output shape={FT_Orientation, FT_BBox cbox, FT_BBox bbox, transformed point array, decompose event log, FT_Error}; comparison=exact C oracle enum value, 26.6 geometry, callback order/arguments, and propagated callback/error status.

- id: ftoutln.FT_ORIENTATION_FILL_LEFT
  kind: enum_variant
  symbol: FT_ORIENTATION_FILL_LEFT
  header: freetype/ftoutln.h
  description: Public FT_Orientation alias for PostScript fill-left winding semantics.
  cases:
    - id: value_matches_header
      description: Value aliases FT_ORIENTATION_POSTSCRIPT and is 1 in the pinned C public header.
    - id: returned_for_positive_area
      description: FT_Outline_Get_Orientation returns this value through the POSTSCRIPT alias when polygon-area accumulation is positive.
    - id: reverse_toggles_orientation_fixture
      description: After FT_Outline_Reverse changes point/tag order and toggles FT_OUTLINE_REVERSE_FILL, an orientation fixture that was fill-right should compare against C as fill-left where the resulting area sign changes.
  # needs-input: operation=FT_Outline_Get_Orientation before/after FT_Outline_Reverse, with CBox/BBox and decompose cross-checks; fixture_asset=counter-clockwise/PostScript outline and reversed TrueType outline fixtures; params={points, tags, contours, reverse, transform_matrix_optional}; expected output shape={FT_Orientation, outline flags, point/tag arrays, cbox, bbox, decompose event log}; comparison=exact C oracle enum value, alias numeric value, 26.6 geometry, flags, and event order.
