    - id: malformed_table_error
      description: Malformed GDEF data returns the same validation error class and leaves/freeable output pointers in the same state as C.
  # needs-input: operation=FT_OpenType_Validate then FT_OpenType_Free for non-null outputs; fixture_asset=OpenType fonts with valid, absent, and malformed GDEF tables; params={validation_flags=FT_VALIDATE_GDEF}; expected output shape={FT_Error, GDEF_table pointer class, table byte length/hash, freed pointers}; comparison=exact C oracle status, output bytes, null classes, and free behavior.

