- id: ftgasp.FT_GASP_NO_TABLE
  kind: constant
  symbol: FT_GASP_NO_TABLE
  header: freetype/ftgasp.h
  description: Public FT_Get_Gasp sentinel value returned when the face has no usable gasp table for the query.
  cases:
    - id: value_matches_header
      description: Value is exactly -1 when imported with #include <freetype/ftgasp.h>.
      # needs-input: constant fixture for <freetype/ftgasp.h>; output shape is signed integer value.
    - id: returned_for_null_or_non_sfnt_face
      description: Verify FT_Get_Gasp returns this sentinel for a null face, and for a non-SFNT fixture face when available.
      # needs-input: handle API fixture with null face plus optional non-SFNT font asset; output shape is signed integer return value.

- id: ftgasp.FT_GASP_SYMMETRIC_GRIDFIT
  kind: flag
  symbol: FT_GASP_SYMMETRIC_GRIDFIT
  header: freetype/ftgasp.h
  description: Public FT_Get_Gasp bit flag 0x04 indicating ClearType symmetric smoothing should use grid-fitting.
  cases:
