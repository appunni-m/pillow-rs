- id: fterrors.FT_ERR_PREFIX
  kind: macro
  symbol: FT_ERR_PREFIX
  header: freetype/fterrors.h
  description: Public fterrors preprocessor hook that defaults error-code identifiers to the FT_Err_ prefix when the includer has not provided a custom prefix.
  cases:
    - id: default_prefix_expands_error_identifiers
      description: Include <freetype/fterrors.h> normally and verify generated error identifiers use the default FT_Err_ prefix, including FT_Err_Ok and FT_Err_Max.
      # needs-input: c-preprocess fixture that includes <freetype/fterrors.h>; output shape is the resolved public enum symbol set and exact numeric values compared across C FreeType, Rust FFI, C FFI, and wasm.
    - id: custom_prefix_expands_error_identifiers
      description: Undefine the header guard as documented, define FT_ERR_PREFIX to a custom token prefix, include <freetype/fterrors.h>, and verify generated identifiers use that prefix.
      # needs-input: c-preprocess fixture with custom FT_ERR_PREFIX and FT_ERROR_START_LIST/FT_ERRORDEF/FT_ERROR_END_LIST; output shape is generated token/value pairs from the C preprocessor.

- id: fterrors.FT_ERR_PROTOS_DEFINED
  kind: macro
  symbol: FT_ERR_PROTOS_DEFINED
  header: freetype/fterrors.h
  description: Public-header include guard macro that prevents duplicate FT_Error_String prototype emission after normal <freetype/fterrors.h> inclusion.
  cases:
    - id: prototype_guard_defined_after_normal_include
      description: Include <freetype/fterrors.h> normally and verify FT_ERR_PROTOS_DEFINED is defined after the FT_Error_String prototype section is emitted once.
      # needs-input: c-preprocess fixture that includes <freetype/fterrors.h> twice; output shape is macro-defined state plus a successful compile with one visible FT_Error_String declaration.
    - id: custom_error_table_include_does_not_emit_prototype
      description: Include with FT_ERRORDEF already defined and verify the prototype guard path is not used while the error-list macros expand.
      # needs-input: c-preprocess fixture for documented custom error table generation; output shape is expanded table rows and macro-defined state.

- id: fterrors.FT_INCLUDE_ERR_PROTOS
  kind: macro
  symbol: FT_INCLUDE_ERR_PROTOS
  header: freetype/fterrors.h
  description: Public-header control macro used internally by fterrors.h to decide whether the FT_Error_String prototype block is emitted during normal inclusion.
  cases:
    - id: normal_include_emits_error_string_prototype
      description: Include <freetype/fterrors.h> without a caller-defined FT_ERRORDEF and verify the FT_Error_String prototype is available through the documented header import.
      # needs-input: c-compile fixture using #include <freetype/fterrors.h> and taking the address of FT_Error_String; output shape is compile success plus runtime pointer availability across FFI surfaces.
    - id: custom_errordef_include_suppresses_prototype_path
      description: Define FT_ERRORDEF before inclusion and verify fterrors.h expands the caller's error-list machinery instead of declaring FT_Error_String through FT_INCLUDE_ERR_PROTOS.
      # needs-input: c-preprocess fixture with FT_ERRORDEF/FT_ERROR_START_LIST/FT_ERROR_END_LIST; output shape is generated rows and no dependency on the prototype path.

- id: fterrors.FT_Error_String
  kind: function
  symbol: FT_Error_String
  header: freetype/fterrors.h
  description: Public function returning the configured description string for a valid FreeType error code, or NULL for invalid or unsupported string-table cases.
  cases:
    - id: valid_error_code_string_or_null
      description: Query representative valid error codes, including FT_Err_Ok and a nonzero public FT_Err_* value, and compare the returned nullable string exactly to C FreeType for the build configuration.
      # needs-input: scalar API fixture with error_code values; output shape is nullable string, preserving NULL distinctly from an empty string.
    - id: invalid_negative_error_returns_null
      description: Pass a negative FT_Error value and verify C returns NULL without reading the error table.
      # needs-input: scalar API fixture with error_code -1; output shape is nullable string and status-less success because the API reports NULL rather than FT_Error.
    - id: invalid_too_large_error_returns_null
      description: Pass FT_Err_Max or a larger value and verify C returns NULL.
      # needs-input: scalar API fixture using FT_Err_Max and FT_Err_Max + 1; output shape is nullable string.
    - id: module_bits_ignored_when_strings_enabled
      description: When error strings are compiled in, compare a base error and the same base error with module bits and verify the returned string follows FT_ERROR_BASE behavior.
      # needs-input: build-aware scalar fixture; output shape is nullable string pair. If the pinned C build lacks error strings, both outputs are expected NULL and must still compare exactly.

- id: fterrors.FT_ERRORDEF
  kind: macro
  symbol: FT_ERRORDEF
  header: freetype/fterrors.h
  description: Documented function-like macro hook used by clients to generate custom error-code tables or switches from fterrors.h.
  cases:
    - id: default_enum_generation
      description: Include <freetype/fterrors.h> without defining FT_ERRORDEF and verify it expands each error definition into the public error enum.
      # needs-input: c-compile fixture referencing FT_Err_Ok, FT_Err_Invalid_Argument, and FT_Err_Max; output shape is exact integer values.
    - id: custom_table_generation
      description: Define FT_ERRORDEF(e,v,s) to emit table rows and verify fterrors.h produces the same error values and strings as C preprocessing.
      # needs-input: c-preprocess fixture using the documented table-generation pattern; output shape is ordered rows of code/value/string.

- id: fterrors.FT_ERRORDEF_
  kind: macro
  symbol: FT_ERRORDEF_
  header: freetype/fterrors.h
  description: Public fterrors helper macro that concatenates FT_ERR_PREFIX with each error identifier and adds FT_ERR_BASE for module-specific builds.
  cases:
    - id: prefixed_error_value_generation
      description: Verify FT_ERRORDEF_ expands a representative error into the prefixed public identifier and value expression used by fterrdef.h.
      # needs-input: c-preprocess fixture with FT_ERRORDEF redirected to rows and normal FT_ERR_PREFIX; output shape is prefixed identifier plus integer value.
    - id: module_error_base_adjustment
      description: In a module-errors build, verify FT_ERRORDEF_ adds FT_ERR_BASE while FT_NOERRORDEF_ leaves Ok at zero.
      # needs-input: build-aware c-preprocess fixture toggling FT_CONFIG_OPTION_USE_MODULE_ERRORS if supported by the harness; output shape is generated value expressions or evaluated constants.

- id: ftfntfmt.FT_Get_Font_Format
  kind: function
  symbol: FT_Get_Font_Format
  header: freetype/ftfntfmt.h
  description: Public function returning the driver font-format string for a face, or NULL for a null face or a face without the FONT_FORMAT service.
  cases:
    - id: truetype_face_returns_truetype
      description: Load a TrueType fixture face and verify the returned string exactly matches C FreeType.
      # needs-input: font fixture tests/fixtures/input/fonts/DejaVuSans.ttf; output shape is nullable string, expected non-null TrueType for C comparison.
    - id: type1_or_other_supported_face_returns_driver_format
      description: Load at least one non-TrueType supported fixture when available and compare the driver-provided format string exactly to C.
      # needs-input: fixture asset for a non-TrueType format such as BDF, PCF, Type 1, CFF, or Windows FNT; output shape is nullable string.
    - id: null_face_returns_null
      description: Pass a null FT_Face and verify the function returns NULL rather than an error status.
      # needs-input: handle API fixture with null face; output shape is nullable string.

- id: ftfntfmt.FT_Get_X11_Font_Format
  kind: function
  symbol: FT_Get_X11_Font_Format
  header: freetype/ftfntfmt.h
  description: Deprecated public ABI alias of FT_Get_Font_Format with identical nullable string behavior.
  cases:
    - id: alias_matches_font_format_for_face
      description: Load the same face and verify FT_Get_X11_Font_Format returns the same nullable string as FT_Get_Font_Format and C FreeType.
      # needs-input: font fixture tests/fixtures/input/fonts/DejaVuSans.ttf; output shape is pair of nullable strings from both API names.
    - id: null_face_returns_null
      description: Pass a null FT_Face and verify the deprecated alias returns NULL.
      # needs-input: handle API fixture with null face; output shape is nullable string.

- id: ftgasp.FT_GASP_DO_GRAY
  kind: flag
  symbol: FT_GASP_DO_GRAY
  header: freetype/ftgasp.h
  description: Public FT_Get_Gasp bit flag 0x02 indicating grayscale rendering should be used at the queried ppem.
  cases:
    - id: value_matches_header
      description: Value is exactly 0x02 when imported with #include <freetype/ftgasp.h>.
      # needs-input: constant fixture for <freetype/ftgasp.h>; output shape is signed integer value.

- id: ftgasp.FT_GASP_DO_GRIDFIT
  kind: flag
  symbol: FT_GASP_DO_GRIDFIT
  header: freetype/ftgasp.h
  description: Public FT_Get_Gasp bit flag 0x01 indicating grid-fitting and TrueType bytecode hinting should be used at the queried ppem.
  cases:
    - id: value_matches_header
      description: Value is exactly 0x01 when imported with #include <freetype/ftgasp.h>.
