- id: ftgasp.FT_GASP_SYMMETRIC_SMOOTHING
  kind: flag
  symbol: FT_GASP_SYMMETRIC_SMOOTHING
  header: freetype/ftgasp.h
  description: Public FT_Get_Gasp bit flag 0x08 indicating ClearType symmetric smoothing should be used.
  cases:
    - id: value_matches_header
      description: Value is exactly 0x08 when imported with #include <freetype/ftgasp.h>.
      # needs-input: constant fixture for <freetype/ftgasp.h>; output shape is signed integer value.

- id: ftgasp.FT_Get_Gasp
  kind: function
  symbol: FT_Get_Gasp
  header: freetype/ftgasp.h
  description: Public function returning TrueType/OpenType gasp table flags for a ppem, or FT_GASP_NO_TABLE when no matching table is available.
  cases:
    - id: null_face_returns_no_table
      description: Pass a null FT_Face and verify the return value is FT_GASP_NO_TABLE.
      # needs-input: handle API fixture with null face and ppem values 0, 8, 16; output shape is signed integer return.
    - id: sfnt_face_ppem_ranges_match_c
      description: Load a TrueType/OpenType fixture and compare returned flags across ppem values below, inside, and above gasp ranges.
      # needs-input: font fixture with a gasp table; ppem set should include 0, 8, 16, 32, and a value above the last maxPPEM. Output shape is signed integer flags from C FreeType, Rust FFI, C FFI, and wasm.
      coverage:
        font_variability:
          folders: ["fonts", "fonts_autohint"]
          sizes: [8, 12, 16, 24, 32]
    - id: sfnt_without_gasp_returns_no_table
      description: Load an SFNT fixture without a gasp table and verify FT_GASP_NO_TABLE.
      # needs-input: font fixture known to have no gasp ranges; output shape is signed integer return.
    - id: version_zero_masks_spurious_bits
      description: For a version 0 gasp table, verify C masks the result to the low two bits.
      # needs-input: crafted or selected TrueType fixture with version 0 gasp table containing high bits; output shape is signed integer flags.

- id: ftglyph.FT_Glyph_BBox_Mode
  kind: enum
  symbol: FT_Glyph_BBox_Mode
  header: freetype/ftglyph.h
  description: Public enum selecting how FT_Glyph_Get_CBox reports glyph control boxes.
  cases:
    - id: enum_variants_match_header
      description: Variants match the pinned header, including FT_GLYPH_BBOX_UNSCALED and FT_GLYPH_BBOX_SUBPIXELS both equaling 0.
      # needs-input: enum fixture importing <freetype/ftglyph.h>; output shape is ordered variant/value map.
    - id: deprecated_lowercase_aliases_match
      description: Deprecated ft_glyph_bbox_* macro aliases expand to the corresponding FT_GLYPH_BBOX_* values.
      # needs-input: macro constant fixture importing <freetype/ftglyph.h>; output shape is alias/value map.

- id: ftglyph.FT_GLYPH_BBOX_GRIDFIT
  kind: enum_variant
  symbol: FT_GLYPH_BBOX_GRIDFIT
  header: freetype/ftglyph.h
  description: Public bbox mode value 1; FT_Glyph_Get_CBox floors minima and ceils maxima in 26.6 coordinates.
  cases:
    - id: value_matches_header
      description: Value is exactly 1 when imported with #include <freetype/ftglyph.h>.
      # needs-input: enum fixture for FT_Glyph_BBox_Mode; output shape is integer value.
    - id: cbox_gridfit_rounding_matches_c
      description: Extract an outline glyph and verify grid-fit control box rounding matches C exactly.
      # needs-input: glyph API fixture loading outline glyphs with fractional 26.6 bounds across fonts/sizes; output shape is FT_BBox {xMin,yMin,xMax,yMax}.
      coverage:
        font_variability:
          folders: ["fonts", "fonts_autohint"]
          sizes: [10, 20, 32]

- id: ftglyph.FT_GLYPH_BBOX_PIXELS
  kind: enum_variant
  symbol: FT_GLYPH_BBOX_PIXELS
  header: freetype/ftglyph.h
  description: Public bbox mode value 3; FT_Glyph_Get_CBox grid-fits then shifts 26.6 coordinates to integer pixels.
  cases:
    - id: value_matches_header
      description: Value is exactly 3 when imported with #include <freetype/ftglyph.h>.
      # needs-input: enum fixture for FT_Glyph_BBox_Mode; output shape is integer value.
    - id: cbox_pixels_rounding_matches_c
      description: Extract outline and bitmap glyphs and verify pixel-mode control boxes match C exactly.
      # needs-input: glyph API fixture covering outline and bitmap glyph formats; output shape is FT_BBox integer pixel coordinates.
      coverage:
        font_variability:
          folders: ["fonts", "fonts_autohint"]
          sizes: [10, 20, 32]

- id: ftglyph.FT_GLYPH_BBOX_SUBPIXELS
  kind: enum_variant
  symbol: FT_GLYPH_BBOX_SUBPIXELS
  header: freetype/ftglyph.h
  description: Public bbox mode alias value 0; FT_Glyph_Get_CBox returns unfitted 26.6 coordinates, equivalent to FT_GLYPH_BBOX_UNSCALED.
  cases:
    - id: value_matches_header
      description: Value is exactly 0 and equal to FT_GLYPH_BBOX_UNSCALED when imported with #include <freetype/ftglyph.h>.
      # needs-input: enum fixture for FT_Glyph_BBox_Mode; output shape is integer value and equality relation.
    - id: cbox_subpixels_matches_c
      description: Extract outline glyphs and verify unfitted 26.6 control boxes match C exactly.
      # needs-input: glyph API fixture loading normal scaled outline glyphs; output shape is FT_BBox in 26.6 coordinates.
      coverage:
        font_variability:
          folders: ["fonts", "fonts_autohint"]
          sizes: [10, 20, 32]

- id: ftglyph.FT_GLYPH_BBOX_TRUNCATE
  kind: enum_variant
  symbol: FT_GLYPH_BBOX_TRUNCATE
  header: freetype/ftglyph.h
  description: Public bbox mode value 2; FT_Glyph_Get_CBox shifts unfitted 26.6 coordinates to integer pixels without grid-fitting first.
  cases:
    - id: value_matches_header
      description: Value is exactly 2 when imported with #include <freetype/ftglyph.h>.
      # needs-input: enum fixture for FT_Glyph_BBox_Mode; output shape is integer value.
    - id: cbox_truncate_matches_c
      description: Extract outline glyphs and verify truncation-mode control boxes match C exactly, especially for negative minima.
      # needs-input: glyph API fixture with glyphs that have negative bearings and fractional 26.6 bounds; output shape is FT_BBox integer pixel coordinates.
      coverage:
        font_variability:
          folders: ["fonts", "fonts_autohint"]
          sizes: [10, 20, 32]

- id: ftglyph.FT_GLYPH_BBOX_UNSCALED
  kind: enum_variant
  symbol: FT_GLYPH_BBOX_UNSCALED
  header: freetype/ftglyph.h
  description: Public bbox mode value 0; FT_Glyph_Get_CBox returns unscaled font units for glyphs loaded with FT_LOAD_NO_SCALE and is an alias of FT_GLYPH_BBOX_SUBPIXELS.
  cases:
    - id: value_matches_header
      description: Value is exactly 0 and equal to FT_GLYPH_BBOX_SUBPIXELS when imported with #include <freetype/ftglyph.h>.
      # needs-input: enum fixture for FT_Glyph_BBox_Mode; output shape is integer value and equality relation.
    - id: cbox_unscaled_matches_c
      description: Load glyphs with FT_LOAD_NO_SCALE and verify unscaled control boxes match C exactly.
      # needs-input: glyph API fixture using FT_LOAD_NO_SCALE on outline glyphs across fonts; output shape is FT_BBox in font units.
      coverage:
        font_variability:
          folders: ["fonts", "fonts_autohint"]
          sizes: [0]
