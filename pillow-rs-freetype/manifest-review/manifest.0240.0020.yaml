- id: ftcid.FT_Get_CID_Registry_Ordering_Supplement
  kind: function
  symbol: FT_Get_CID_Registry_Ordering_Supplement
  header: freetype/ftcid.h
  description: FreeType C API function from freetype/ftcid.h that retrieves the Registry/Ordering/Supplement triple from a CID-keyed face.
  cases:
    - id: public_header_signature
      description: Signature matches the pinned public header with FT_Face input and registry, ordering, and supplement output pointers.
    - id: success_cid_keyed_face
      description: A CID-keyed face returns the same face-owned registry and ordering C strings and FT_Int supplement as C FreeType.
    - id: error_non_cid_or_null_outputs
      description: Non-CID faces, null face, and null output pointers return the pinned C error classification and preserve caller-owned output sentinels like C.
  # needs-input: operation=FT_Get_CID_Registry_Ordering_Supplement; fixture_asset=input/fonts/cid/source-han-cid.otf plus input/fonts/DejaVuSans.ttf non-CID control; params face_index=0 with output pointers initialized to sentinels and null-pointer variants; expected output shape={FT_Error, registry_utf8_or_null, ordering_utf8_or_null, supplement_i32, output_pointer_write_bitmap}; comparison=exact C oracle error, strings, supplement, null/identity classification, and sentinel preservation.

- id: ftcolor.FT_PALETTE_FOR_DARK_BACKGROUND
  kind: constant
  symbol: FT_PALETTE_FOR_DARK_BACKGROUND
  header: freetype/ftcolor.h
  description: FreeType public CPAL palette flag for palettes suitable on dark backgrounds.
  cases:
    - id: value_matches_header
      description: Numeric value 0x02 matches the pinned public C header.
    - id: palette_flags_runtime
      description: FT_Palette_Data_Get returns this bit in palette_flags for CPAL palettes marked usable on dark backgrounds.
  # needs-input: operation=FT_Palette_Data_Get; fixture_asset=input/fonts/color/cpal-palettes-light-dark.ttf; params face_index=0; expected output shape={FT_Error, FT_Palette_Data{num_palettes, palette_name_ids[], palette_flags[], num_palette_entries, palette_entry_name_ids[]}}; comparison=exact C oracle scalar fields, array values, null-array policy, and presence of 0x02 in the dark palette flag.

