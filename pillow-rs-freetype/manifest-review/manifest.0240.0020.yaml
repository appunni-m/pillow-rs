- id: ftcolor.FT_Color_Root_Transform
  kind: enum
  symbol: FT_Color_Root_Transform
  header: freetype/ftcolor.h
  description: FreeType public enum controlling whether FT_Get_Color_Glyph_Paint inserts the computed COLR v1 root transform.
  cases:
    - id: enum_variants_match_header
      description: "Variants and implicit C enum values match the pinned public header: INCLUDE_ROOT_TRANSFORM=0, NO_ROOT_TRANSFORM=1, ROOT_TRANSFORM_MAX=2."
    - id: root_transform_controls_initial_paint
      description: FT_Get_Color_Glyph_Paint returns an initial FT_COLR_PAINTFORMAT_TRANSFORM paint only when FT_COLOR_INCLUDE_ROOT_TRANSFORM is requested and otherwise returns the font's root paint directly.
  # needs-input: operation=FT_Get_Color_Glyph_Paint followed by FT_Get_Paint; fixture_asset=input/fonts/color/colr_v1_root_transform.ttf; params base_glyph with COLR v1 graph, sizes 12px and 48px, FT_Set_Transform identity and non-identity, root_transform in {INCLUDE_ROOT_TRANSFORM, NO_ROOT_TRANSFORM}; expected output shape={FT_Bool, FT_OpaquePaint{p_nonnull, insert_root_transform}, first FT_COLR_Paint JSON with format, transform affine xx/xy/dx/yx/yy/dy when included, and nested paint reference}; comparison=exact C oracle bool, enum value, fixed-point affine fields, opaque null/non-null classification, and paint graph shape.

- id: ftcolor.FT_Composite_Mode
  kind: enum
  symbol: FT_Composite_Mode
  header: freetype/ftcolor.h
  description: FreeType public enum listing COLR v1 PaintComposite compositing operators.
  cases:
    - id: enum_variants_match_header
      description: Variants and values match the pinned public header from FT_COLR_COMPOSITE_CLEAR=0 through FT_COLR_COMPOSITE_MAX=28.
    - id: paint_composite_modes_runtime
      description: FT_Get_Paint returns each COLR v1 PaintComposite node with the exact FT_Composite_Mode value encoded in the font.
  # needs-input: operation=FT_Get_Color_Glyph_Paint and recursive FT_Get_Paint traversal; fixture_asset=input/fonts/color/colr_v1_composite_modes.ttf; params base glyphs covering every FT_Composite_Mode value 0..27 plus nested source/backdrop paints; expected output shape=ordered paint graph JSON nodes {format:FT_COLR_PAINTFORMAT_COMPOSITE, composite:{source_paint_ref, composite_mode_u32, backdrop_paint_ref}} with child paint nodes and stable glyph ids/color indices; comparison=exact C oracle enum values, traversal order, child references by traversal id, and no rendered-pixel thresholding.

- id: ftcolor.FT_PaintExtend
  kind: enum
  symbol: FT_PaintExtend
  header: freetype/ftcolor.h
  description: FreeType public enum for COLR v1 gradient color-line extend behavior.
  cases:
    - id: enum_variants_match_header
      description: "Variants and values match the pinned public header: PAD=0, REPEAT=1, REFLECT=2."
    - id: gradient_extend_runtime
      description: FT_Get_Paint returns linear, radial, and sweep gradient color lines with the exact extend mode encoded in the COLR v1 font.
  # needs-input: operation=FT_Get_Color_Glyph_Paint, FT_Get_Paint, and FT_Get_Colorline_Stops; fixture_asset=input/fonts/color/colr_v1_gradients_extend.ttf; params glyphs with PAD, REPEAT, and REFLECT color lines for linear/radial/sweep paints; expected output shape=paint graph JSON containing gradient paint format, colorline.extend, color_stop_iterator counts, and color stops {stop_offset_16_16, palette_index, alpha_f2dot14}; comparison=exact C oracle enum values, stop order, fixed-point values, and iterator termination.

- id: ftcolor.FT_PaintFormat
  kind: enum
  symbol: FT_PaintFormat
  header: freetype/ftcolor.h
  description: FreeType public enum describing returned COLR v1 FT_COLR_Paint union formats.
  cases:
    - id: enum_variants_match_header
      description: Variants and values match the pinned public header, including COLR_LAYERS=1, SOLID=2, LINEAR_GRADIENT=4, RADIAL_GRADIENT=6, SWEEP_GRADIENT=8, GLYPH=10, COLR_GLYPH=11, TRANSFORM=12, TRANSLATE=14, SCALE=16, ROTATE=24, SKEW=28, COMPOSITE=32, PAINT_FORMAT_MAX=33, and UNSUPPORTED=255.
    - id: paint_union_shape_runtime
      description: FT_Get_Paint populates only the FT_COLR_Paint union member selected by the returned format, with exact C field values for each supported COLR v1 paint kind.
  # needs-input: operation=FT_Get_Color_Glyph_Paint, recursive FT_Get_Paint, FT_Get_Paint_Layers, and FT_Get_Colorline_Stops; fixture_asset=input/fonts/color/colr_v1_all_paint_formats.ttf; params base glyphs covering every supported non-variable Paint format and one unsupported-format control if constructible; expected output shape=paint graph JSON discriminated by format with union payloads for colr_layers, solid, linear_gradient, radial_gradient, sweep_gradient, glyph, colr_glyph, transform, translate, scale, rotate, skew, and composite; comparison=exact C oracle enum values, fixed-point fields, glyph ids, color indices, iterator counts, and unsupported classification.

- id: ftcolor.FT_COLOR_INCLUDE_ROOT_TRANSFORM
  kind: enum_variant
  symbol: FT_COLOR_INCLUDE_ROOT_TRANSFORM
  header: freetype/ftcolor.h
  description: FreeType public FT_Color_Root_Transform variant requesting an initial computed root transform paint.
  cases:
    - id: value_matches_header
      description: Implicit C enum value 0 matches the pinned public header.
    - id: include_transform_runtime
      description: FT_Get_Color_Glyph_Paint marks the returned opaque paint so FT_Get_Paint first yields a root FT_COLR_PAINTFORMAT_TRANSFORM node.
  # needs-input: operation=FT_Get_Color_Glyph_Paint followed by FT_Get_Paint; fixture_asset=input/fonts/color/colr_v1_root_transform.ttf; params root_transform=FT_COLOR_INCLUDE_ROOT_TRANSFORM, sizes and FT_Set_Transform values covering scale and translation; expected output shape={FT_Bool, first_paint:{format:TRANSFORM, affine:{xx,xy,dx,yx,yy,dy}, child_ref}}; comparison=exact C oracle bool, enum value 0, 16.16 affine fields, and nested paint reference.

- id: ftcolor.FT_COLOR_NO_ROOT_TRANSFORM
  kind: enum_variant
  symbol: FT_COLOR_NO_ROOT_TRANSFORM
  header: freetype/ftcolor.h
  description: FreeType public FT_Color_Root_Transform variant requesting no initial computed root transform paint.
  cases:
    - id: value_matches_header
      description: Implicit C enum value 1 matches the pinned public header.
    - id: omit_transform_runtime
      description: FT_Get_Color_Glyph_Paint returns the font's root paint without an inserted root transform when this variant is used.
  # needs-input: operation=FT_Get_Color_Glyph_Paint followed by FT_Get_Paint; fixture_asset=input/fonts/color/colr_v1_root_transform.ttf; params root_transform=FT_COLOR_NO_ROOT_TRANSFORM with same base glyph, size, and transform matrix as include-transform case; expected output shape={FT_Bool, first_paint:{format:not inserted TRANSFORM unless font root itself is transform, payload_by_format}}; comparison=exact C oracle bool, enum value 1, first paint format/payload, and absence of synthetic root transform.

- id: ftcolor.FT_COLOR_ROOT_TRANSFORM_MAX
