- id: ftrender.FT_Glyph_Transform_Func
  kind: macro
  symbol: FT_Glyph_Transform_Func
  header: freetype/ftrender.h
  description: Deprecated public macro alias for the FT_Glyph_TransformFunc callback typedef.
  cases:
    - id: alias_matches_callback_typedef
      description: Including ftrender.h makes FT_Glyph_Transform_Func compile as the same type as FT_Glyph_TransformFunc.
    - id: callback_signature_optional_matrix_delta
      description: A callback receiving optional FT_Matrix and FT_Vector pointers observes NULL and non-NULL inputs identically through either spelling.
  # needs-input: operation=compile_and_call_callback_abi; fixture_asset=tiny C ABI probe source plus outline glyph fixture; params={typedef_spelling=FT_Glyph_Transform_Func, matrix_pointer_class, delta_pointer_class}; expected output shape={compile_result, callback_event_log, transformed outline points}; comparison=C compile success and exact C oracle callback arguments and 26.6 transformed coordinates.

- id: ftrender.FT_Get_Renderer
  kind: function
  symbol: FT_Get_Renderer
  header: freetype/ftrender.h
  description: Public renderer lookup API returning the current renderer for a glyph image format.
  cases:
    - id: outline_renderer_lookup_success
      description: For an initialized library, lookup of FT_GLYPH_FORMAT_OUTLINE returns the current outline renderer, normally the smooth renderer after module initialization.
    - id: bitmap_svg_and_unknown_formats
      description: Lookup for bitmap, SVG, SDF, or unknown formats returns the renderer pointer or NULL exactly as configured modules expose it.
    - id: null_library_returns_null
      description: Null library is accepted by the lookup helper path and returns NULL, not an FT_Error.
  # needs-input: operation=FT_Get_Renderer before/after renderer module changes; fixture_asset=no font needed plus optional SVG/SDF module-enabled build probe; params={library_pointer_class, glyph_format}; expected output shape={renderer_present, renderer_class_name, glyph_format, pointer_identity_token}; comparison=exact C oracle null/non-null, class fields, and pointer identity relative to FT_Set_Renderer inputs.

- id: ftrender.FT_Set_Renderer
  kind: function
  symbol: FT_Set_Renderer
  header: freetype/ftrender.h
  description: Public API that promotes a renderer to the front of the renderer list and optionally passes mode parameters to the renderer set_mode callback.
  cases:
    - id: set_outline_renderer_success
      description: Passing a renderer owned by the library returns success, moves it to the front of the renderer list, and makes it current for outline glyph rendering.
    - id: invalid_library_renderer_or_params
      description: Null library returns Invalid_Library_Handle; null renderer, foreign renderer, or num_params>0 with NULL parameters returns Invalid_Argument.
    - id: set_mode_parameter_error_propagates
      description: When parameters are supplied, C calls renderer->clazz->set_mode in order and returns the first non-zero FT_Error without hiding prior state changes.
    - id: render_output_changes_with_current_renderer
      description: After selecting mono, smooth, LCD, LCD_V, SDF, or SVG-capable renderers where available, rendered glyph output matches C for supported and unsupported render modes.
  # needs-input: operation=FT_Get_Renderer/FT_Set_Renderer then FT_Load_Glyph/FT_Render_Glyph; fixture_asset=outline font, optional SVG color font, and custom test renderer module probe; params={renderer_format, num_params, parameters_pointer_class, render_mode, glyph_index, size}; expected output shape={FT_Error, current_renderer_identity, set_mode_event_log, FT_Bitmap fields, buffer bytes/hash}; comparison=exact C oracle error, callback order, renderer identity, bitmap descriptor, and bytes.

- id: ftrender.FT_Renderer_Class
  kind: record
  symbol: FT_Renderer_Class
  header: freetype/ftrender.h
  description: Public renderer module class record describing the module root, handled glyph format, render callbacks, mode setter, and raster class.
  cases:
    - id: layout_matches_header
      description: Field order is root, glyph_format, render_glyph, transform_glyph, get_glyph_cbox, set_mode, and raster_class in the pinned C public header.
    - id: standard_renderer_classes_match
      description: Built-in smooth, mono, SDF, bitmap SDF, and SVG renderer classes expose the C glyph_format, callback presence, module name, and raster_class presence.
    - id: render_mode_acceptance_matches_callbacks
      description: Smooth accepts NORMAL, LIGHT, LCD, and LCD_V; mono accepts MONO; SDF/SVG paths accept only their C-supported modes and produce matching errors otherwise.
  # needs-input: operation=record_layout_probe and renderer_behavior_probe; fixture_asset=tiny C ABI layout source plus outline/SDF/SVG-capable font fixtures; params={renderer_class_symbol, render_mode, glyph_index, size}; expected output shape={sizeof, alignof, field_offsets, class_fields, FT_Error, bitmap fields, buffer bytes/hash}; comparison=exact C oracle layout numbers, callback nullability, glyph format tags, errors, and rendered output bytes.
