  symbol: FT_Glyph_Done_Func
  header: freetype/ftrender.h
  description: Deprecated public macro alias for the FT_Glyph_DoneFunc callback typedef.
  cases:
    - id: alias_matches_callback_typedef
      description: Including ftrender.h makes FT_Glyph_Done_Func compile as the same type as FT_Glyph_DoneFunc.
    - id: callback_signature_void_return
      description: A callback receiving FT_Glyph and returning void can be installed through either spelling and receives the same glyph pointer.
  # needs-input: operation=compile_and_call_callback_abi; fixture_asset=tiny C ABI probe source; params={typedef_spelling=FT_Glyph_Done_Func, glyph_pointer_class}; expected output shape={compile_result, callback_event_log}; comparison=C compile success and exact C oracle callback argument identity/order.

- id: ftrender.FT_Glyph_Init_Func
  kind: macro
  symbol: FT_Glyph_Init_Func
  header: freetype/ftrender.h
  description: Deprecated public macro alias for the FT_Glyph_InitFunc callback typedef.
  cases:
    - id: alias_matches_callback_typedef
      description: Including ftrender.h makes FT_Glyph_Init_Func compile as the same type as FT_Glyph_InitFunc.
    - id: callback_signature_and_slot_input
      description: A callback receiving FT_Glyph and FT_GlyphSlot returns FT_Error identically through either typedef spelling.
  # needs-input: operation=compile_and_call_callback_abi; fixture_asset=tiny C ABI probe source plus loaded glyph slot from DejaVuSans.ttf; params={typedef_spelling=FT_Glyph_Init_Func, glyph_index, size, callback_error}; expected output shape={compile_result, FT_Error, callback_event_log, slot format/metrics}; comparison=C compile success and exact C oracle callback arguments and propagated error.

- id: ftrender.FT_Glyph_Prepare_Func
  kind: macro
  symbol: FT_Glyph_Prepare_Func
  header: freetype/ftrender.h
  description: Deprecated public macro alias for the FT_Glyph_PrepareFunc callback typedef.
  cases:
    - id: alias_matches_callback_typedef
      description: Including ftrender.h makes FT_Glyph_Prepare_Func compile as the same type as FT_Glyph_PrepareFunc.
    - id: callback_signature_prepares_slot
      description: A callback receiving FT_Glyph and FT_GlyphSlot returns FT_Error and can mutate slot-visible fields exactly as the canonical typedef allows.
