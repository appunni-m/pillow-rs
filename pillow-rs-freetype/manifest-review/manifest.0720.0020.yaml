- id: ftparams.FT_PARAM_TAG_IGNORE_SBIX
  kind: tag
  symbol: FT_PARAM_TAG_IGNORE_SBIX
  header: freetype/ftparams.h
  description: Public FT_Parameter tag that asks FT_Open_Face to ignore an sbix table and expose outline glyphs when available.
  cases:
    - id: value_matches_header
      description: Macro expands to FT_MAKE_TAG('i','s','b','x') in the pinned C public header.
    - id: open_face_ignores_sbix
      description: Opening an sbix-capable SFNT with this parameter follows the sfnt loader ignore_sbix branch and exposes outline behavior instead of color bitmap sbix selection.
    - id: unsupported_or_non_sbix_no_spurious_failure
      description: Passing the tag to a non-sbix face or a face without outlines does not create a fake success path; output and errors match C.
  # needs-input: operation=FT_Open_Face; fixture_asset=tests/fixtures/input/fonts/sbix/sbix-with-outlines.ttf plus non-sbix control font; params={FT_Open_Args, FT_Parameter tag=FT_PARAM_TAG_IGNORE_SBIX, data=NULL}; expected output shape={FT_Error, face_flags, glyph_format_after_load, bitmap fields/outline cbox}; comparison=exact C oracle error code, flags, glyph format, metrics, and bitmap/outline output.

- id: ftparams.FT_PARAM_TAG_IGNORE_TYPOGRAPHIC_FAMILY
  kind: tag
  symbol: FT_PARAM_TAG_IGNORE_TYPOGRAPHIC_FAMILY
  header: freetype/ftparams.h
  description: Public FT_Parameter tag that makes FT_Open_Face ignore OpenType typographic family names.
  cases:
    - id: value_matches_header
      description: Macro expands to FT_MAKE_TAG('i','g','p','f') and is the canonical value for the deprecated preferred-family alias.
    - id: open_face_uses_legacy_family_name
      description: With a font that has distinct name IDs 1 and 16, C reports the legacy family name when this tag is supplied.
    - id: null_data_accepted
      description: The tag is presence-only for FT_Open_Face; data is NULL and no output value is read.
  # needs-input: operation=FT_Open_Face then inspect face family_name; fixture_asset=tests/fixtures/input/fonts/names/ot14-preferred-family.ttf; params={tag=FT_PARAM_TAG_IGNORE_TYPOGRAPHIC_FAMILY, data=NULL}; expected output shape={FT_Error, family_name, style_name}; comparison=exact C oracle strings and error code.

- id: ftparams.FT_PARAM_TAG_IGNORE_TYPOGRAPHIC_SUBFAMILY
  kind: tag
  symbol: FT_PARAM_TAG_IGNORE_TYPOGRAPHIC_SUBFAMILY
  header: freetype/ftparams.h
  description: Public FT_Parameter tag that makes FT_Open_Face ignore OpenType typographic subfamily names.
  cases:
    - id: value_matches_header
      description: Macro expands to FT_MAKE_TAG('i','g','p','s') and is the canonical value for the deprecated preferred-subfamily alias.
    - id: open_face_uses_legacy_subfamily_name
      description: With a font that has distinct name IDs 2 and 17, C reports the legacy style name when this tag is supplied.
    - id: null_data_accepted
      description: The tag is presence-only for FT_Open_Face; data is NULL and no output value is read.
  # needs-input: operation=FT_Open_Face then inspect face style_name; fixture_asset=tests/fixtures/input/fonts/names/ot14-preferred-family.ttf; params={tag=FT_PARAM_TAG_IGNORE_TYPOGRAPHIC_SUBFAMILY, data=NULL}; expected output shape={FT_Error, family_name, style_name}; comparison=exact C oracle strings and error code.

- id: ftparams.FT_PARAM_TAG_INCREMENTAL
  kind: tag
  symbol: FT_PARAM_TAG_INCREMENTAL
  header: freetype/ftparams.h
  description: Public FT_Parameter tag that installs an FT_Incremental_Interface during FT_Open_Face when incremental loading support is compiled in.
  cases:
    - id: value_matches_header
      description: Macro expands to FT_MAKE_TAG('i','n','c','r') in the pinned C public header.
    - id: incremental_interface_used_for_glyph_load
      description: With FT_CONFIG_OPTION_INCREMENTAL enabled and valid callbacks, FT_Open_Face stores the interface and later glyph loads call through the incremental callbacks.
    - id: missing_or_null_interface_matches_c
      description: Null data or builds without incremental support follow C behavior exactly instead of fabricating incremental glyph data.
  # needs-input: operation=FT_Open_Face followed by FT_Load_Glyph; fixture_asset=incremental synthetic face binary and callback fixture; params={tag=FT_PARAM_TAG_INCREMENTAL, data=interface_pointer_or_NULL, glyph_index}; expected output shape={FT_Error, callback_event_log, glyph metrics, outline points or load error}; comparison=exact C oracle errors, callback sequence, metrics, and outline coordinates.

- id: ftparams.FT_PARAM_TAG_LCD_FILTER_WEIGHTS
  kind: tag
  symbol: FT_PARAM_TAG_LCD_FILTER_WEIGHTS
  header: freetype/ftparams.h
  description: Public FT_Parameter tag for per-face LCD filter weights; pinned FreeType documents this tag as ignored.
  cases:
    - id: value_matches_header
      description: Macro expands to FT_MAKE_TAG('l','c','d','f') in the pinned C public header.
    - id: face_property_ignored
      description: Supplying the tag through FT_Face_Properties does not alter LCD or LCD_V rendering bytes in current C FreeType.
    - id: malformed_data_does_not_read_as_weights
      description: C ignores the tag rather than dereferencing or validating a malformed weight pointer.
  # needs-input: operation=FT_Face_Properties then FT_Load_Glyph/FT_Render_Glyph in LCD and LCD_V modes; fixture_asset=tests/fixtures/input/fonts/DejaVuSans.ttf; params={tag=FT_PARAM_TAG_LCD_FILTER_WEIGHTS, data=NULL/malformed/5-byte-weights, glyph_index, size}; expected output shape={FT_Error, FT_Bitmap fields, buffer bytes/hash}; comparison=exact C oracle property error, render error, bitmap descriptor, and bytes.

- id: ftparams.FT_PARAM_TAG_RANDOM_SEED
  kind: tag
  symbol: FT_PARAM_TAG_RANDOM_SEED
  header: freetype/ftparams.h
  description: Public FT_Face_Properties tag that overrides a face-specific 32-bit random seed for drivers that consult it.
  cases:
    - id: value_matches_header
      description: Macro expands to FT_MAKE_TAG('s','e','e','d') in the pinned C public header.
    - id: valid_seed_sets_face_property
      description: A valid FT_Int32 pointer is accepted by C and subsequent randomized output, where a driver uses it, is deterministic for the same seed.
    - id: null_or_wrong_size_errors
      description: Null data or malformed property input returns the same public FT_Error as C instead of silently changing state.
  # needs-input: operation=FT_Face_Properties then driver-visible glyph load/render where applicable; fixture_asset=CFF/Type1 font using random-seed-sensitive driver path plus DejaVuSans control; params={seed_i32, data_pointer_class, glyph_index, size}; expected output shape={FT_Error, glyph metrics, outline points, bitmap bytes/hash}; comparison=exact C oracle error and output fields; mark no-op outputs explicitly when selected driver ignores seed.

- id: ftparams.FT_PARAM_TAG_STEM_DARKENING
  kind: tag
  symbol: FT_PARAM_TAG_STEM_DARKENING
  header: freetype/ftparams.h
  description: Public FT_Face_Properties tag that toggles driver or autohinter stem darkening for supported outlines.
  cases:
    - id: value_matches_header
      description: Macro expands to FT_MAKE_TAG('d','a','r','k') in the pinned C public header.
    - id: cff_type1_toggle_changes_supported_output
      description: Supported CFF, Type1, or CID faces match C metrics, outline, and bitmap differences when stem darkening is toggled.
    - id: unsupported_or_null_data_matches_c_error
      description: Unsupported drivers and null or malformed Boolean data return the same FT_Error and leave subsequent output unchanged as C.
  # needs-input: operation=FT_Face_Properties then FT_Load_Glyph/FT_Render_Glyph; fixture_asset=CFF, Type1, CID, and TrueType control fonts; params={FT_Bool darken, glyph_index, size, render_mode, load_flags}; expected output shape={FT_Error, glyph metrics, outline cbox, bitmap fields, buffer bytes/hash}; comparison=exact C oracle error, 26.6 metrics/cbox, and bitmap bytes.

- id: ftparams.FT_PARAM_TAG_UNPATENTED_HINTING
  kind: tag
  symbol: FT_PARAM_TAG_UNPATENTED_HINTING
  header: freetype/ftparams.h
  description: Deprecated public FT_Parameter tag that current pinned FreeType documents as having no effect.
  cases:
    - id: value_matches_header
      description: Macro expands to FT_MAKE_TAG('u','n','p','a') in the pinned C public header.
    - id: open_face_no_effect
      description: Opening the same TrueType face with and without the tag yields identical glyph metrics, outline, and rendered bitmap outputs in current C.
    - id: null_data_accepted_or_ignored
      description: C treats the tag as deprecated/no-op and does not read output from the data pointer.
  # needs-input: operation=FT_Open_Face then FT_Load_Glyph/FT_Render_Glyph; fixture_asset=TrueType bytecode font with hinting-sensitive glyphs; params={tag=FT_PARAM_TAG_UNPATENTED_HINTING, data=NULL/malformed, glyph_index, size, load_flags, render_mode}; expected output shape={FT_Error, glyph metrics, outline points, bitmap bytes/hash}; comparison=exact C oracle no-tag versus tagged outputs and error code.

- id: ftpfr.FT_Get_PFR_Advance
  kind: function
  symbol: FT_Get_PFR_Advance
  header: freetype/ftpfr.h
  description: Public PFR-specific API returning a glyph advance in original PFR metrics units.
  cases:
    - id: pfr_glyph_advance_success
      description: For a PFR face with a metrics service, C returns the service advance for valid glyph indexes.
    - id: non_pfr_returns_invalid_argument
      description: For non-PFR faces C returns Invalid_Argument rather than falling back to generic advance loading.
    - id: null_face_or_output_errors
      description: Null face returns Invalid_Face_Handle and null aadvance returns Invalid_Argument.
  # needs-input: operation=FT_Get_PFR_Advance; fixture_asset=PFR font fixture plus tests/fixtures/input/fonts/DejaVuSans.ttf control; params={face_pointer_class, glyph_index, aadvance_pointer_class}; expected output shape={FT_Error, advance_value_or_sentinel}; comparison=exact C oracle error code and FT_Pos output, preserving sentinel on error where C leaves output untouched.

- id: ftpfr.FT_Get_PFR_Kerning
  kind: function
  symbol: FT_Get_PFR_Kerning
  header: freetype/ftpfr.h
  description: Public PFR-specific API returning kerning in original PFR metrics units, with generic unscaled kerning fallback for non-PFR faces.
  cases:
    - id: pfr_pair_kerning_success
      description: For a PFR face with a metrics service, C returns the service kerning vector for covered left/right glyph pairs.
    - id: non_pfr_falls_back_to_unscaled_kerning
      description: For non-PFR faces, C calls FT_Get_Kerning with FT_KERNING_UNSCALED and returns the exact vector and error from that path.
    - id: null_face_or_vector_errors
      description: Null face returns Invalid_Face_Handle and null avector returns Invalid_Argument.
  # needs-input: operation=FT_Get_PFR_Kerning and FT_Get_Kerning control call; fixture_asset=PFR font fixture and kerning TrueType/CFF control fonts; params={left_glyph, right_glyph, avector_pointer_class}; expected output shape={FT_Error, FT_Vector x/y or sentinel}; comparison=exact C oracle error and vector fields.

- id: ftpfr.FT_Get_PFR_Metrics
  kind: function
  symbol: FT_Get_PFR_Metrics
  header: freetype/ftpfr.h
  description: Public PFR-specific API returning outline resolution, metrics resolution, and metrics scaling values.
  cases:
    - id: pfr_metrics_success
      description: For a PFR face with a metrics service, C fills requested output pointers from the PFR service and returns success.
    - id: non_pfr_outputs_valid_values_and_unknown_format
      description: For non-PFR faces, C fills non-null outputs from face units_per_EM and size metrics scales, then returns Unknown_File_Format.
    - id: optional_outputs_and_null_face
      description: Any output pointer can be NULL, while a NULL face returns Invalid_Face_Handle without writing outputs.
  # needs-input: operation=FT_Get_PFR_Metrics before and after FT_Set_Char_Size; fixture_asset=PFR font fixture plus tests/fixtures/input/fonts/DejaVuSans.ttf control; params={face_pointer_class, output_pointer_mask, size}; expected output shape={FT_Error, outline_resolution, metrics_resolution, x_scale, y_scale, sentinels}; comparison=exact C oracle error, optional-write behavior, and 16.16 scale values.

- id: ftrender.FT_Glyph_BBox_Func
  kind: macro
  symbol: FT_Glyph_BBox_Func
  header: freetype/ftrender.h
  description: Deprecated public macro alias for the FT_Glyph_GetBBoxFunc callback typedef.
  cases:
    - id: alias_matches_callback_typedef
      description: Including ftrender.h makes FT_Glyph_BBox_Func compile as the same type as FT_Glyph_GetBBoxFunc.
    - id: callback_signature_matches_c
      description: A callback receiving FT_Glyph and FT_BBox* can be assigned through either spelling without ABI or warning differences.
  # needs-input: operation=compile_and_call_callback_abi; fixture_asset=tiny C ABI probe source; params={typedef_spelling=FT_Glyph_BBox_Func, glyph_class=outline/bitmap, bbox_pointer_class}; expected output shape={compile_result, callback_event_log, FT_BBox fields}; comparison=C compile success and exact callback call arguments/output from C oracle probe.

- id: ftrender.FT_Glyph_Copy_Func
  kind: macro
  symbol: FT_Glyph_Copy_Func
  header: freetype/ftrender.h
  description: Deprecated public macro alias for the FT_Glyph_CopyFunc callback typedef.
  cases:
    - id: alias_matches_callback_typedef
      description: Including ftrender.h makes FT_Glyph_Copy_Func compile as the same type as FT_Glyph_CopyFunc.
    - id: callback_signature_and_error_return
      description: A callback receiving source and target FT_Glyph values returns FT_Error identically through either typedef spelling.
  # needs-input: operation=compile_and_call_callback_abi; fixture_asset=tiny C ABI probe source and glyph-copy fixture; params={typedef_spelling=FT_Glyph_Copy_Func, source_glyph, target_glyph, callback_error}; expected output shape={compile_result, FT_Error, copied glyph record/event log}; comparison=C compile success and exact C oracle callback arguments, error propagation, and copied fields.

- id: ftrender.FT_Glyph_Done_Func
