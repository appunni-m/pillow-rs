- id: ttnameid.TT_APPLE_ID_ISO_10646
  kind: constant
  symbol: TT_APPLE_ID_ISO_10646
  header: freetype/ttnameid.h
  description: Deprecated Apple Unicode platform encoding id 2 for ISO 10646 cmap/name records.
  cases:
    - id: value_matches_header
      description: Macro expands to integer value 2 in the pinned C public header.
    - id: public_import_contract
      description: A C translation unit including <freetype/ttnameid.h> can reference TT_APPLE_ID_ISO_10646 as a public constant expression.
    - id: deprecated_apple_unicode_encoding_runtime
      description: C oracle preserves encoding_id 2 for an Apple Unicode ISO 10646 cmap/name fixture instead of normalizing it to another Apple encoding id.
  # needs-input: operation=FT_Get_Charmap_Index plus FT_Get_Sfnt_Name; fixture_asset=input/fonts/name-cmap/apple-unicode-iso10646.ttf; params={platform_id=TT_PLATFORM_APPLE_UNICODE, encoding_id=TT_APPLE_ID_ISO_10646}; expected output shape={FT_Error, charmap_index, platform_id, encoding_id, name_record_fields, name_bytes}; comparison=exact C oracle fields and bytes.

