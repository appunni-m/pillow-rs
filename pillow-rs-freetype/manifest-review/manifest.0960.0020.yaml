- id: ttnameid.TT_MAC_LANGID_MALAYALAM
  kind: constant
  symbol: TT_MAC_LANGID_MALAYALAM
  header: freetype/ttnameid.h
  description: Public Mac platform language ID constant for Malayalam name-table records; pinned FreeType defines it as 72.
  cases:
    - id: value_matches_header
      description: Numeric value is exactly 72 as defined by pinned freetype/ttnameid.h.
    - id: public_import_contract
      description: A C translation unit including <freetype/ttnameid.h> can reference TT_MAC_LANGID_MALAYALAM as a preprocessor-visible public constant.
    - id: representative_name_record_language_match
      description: A representative Mac name record tagged with platform Mac and language ID 72 is selected and reported with the same language identity as the C oracle.
  # needs-input: operation=FT_Get_Sfnt_Name; fixture_asset=input/fonts/names/mac-malayalam.ttf; params={platform_id=TT_PLATFORM_MACINTOSH, language_id=TT_MAC_LANGID_MALAYALAM, name_id=TT_NAME_ID_FULL_NAME}; expected output shape={FT_Error, name_index, platform_id, encoding_id, language_id, name_id, string_bytes}; comparison=exact C oracle status and name-record scalar/string bytes.

