name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: 1.96.1

jobs:
  rust:
    name: Rust (${{ matrix.toolchain }} / ${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: "1.87"
            task: msrv-tests
          - toolchain: "1.96.1"
            task: fmt
          - toolchain: "1.96.1"
            task: clippy
          - toolchain: "1.96.1"
            task: tests
          - toolchain: "1.96.1"
            task: docs
          - toolchain: "1.96.1"
            task: benchmark-contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: MSRV Tests
        if: matrix.task == 'msrv-tests'
        run: cargo test --locked

      - name: Format
        if: matrix.task == 'fmt'
        run: cargo fmt -- --check

      - name: Clippy
        if: matrix.task == 'clippy'
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Tests
        if: matrix.task == 'tests'
        run: |
          cargo test --test coverage_matrix_tests --locked -- --nocapture
          cargo test --test no_runtime_ffi --locked -- --nocapture
          cargo test --locked

      - name: Docs
        if: matrix.task == 'docs'
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked

      - name: Benchmark Contract
        if: matrix.task == 'benchmark-contract'
        run: |
          PYTHONPYCACHEPREFIX=target/pycache python3 -m py_compile scripts/bench_freetype.py
          python3 scripts/bench_freetype.py --self-test
          cargo test --test perf_benchmark_contract --locked

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - run: |
          cargo deny check advisories
          cargo deny check bans
          cargo deny check licenses
          cargo deny check sources
          cargo audit
