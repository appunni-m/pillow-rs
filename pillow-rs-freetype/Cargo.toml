[package]
name = "pillow-rs-freetype"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
description = "Pure-Rust TrueType font renderer — auto-hinter, rasterizer, and table parsers"
readme = "README.md"
repository = "https://github.com/pillow-rs/pillow-rs-freetype"
keywords = ["freetype", "truetype", "font", "rendering", "autohint"]
categories = ["rendering", "text-processing"]

[lib]
name = "pillow_rs_freetype"

[dependencies]
log = "0.4"
thiserror = "2"

[dev-dependencies]
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = "0.11"

[lints.rust]
future-incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
unsafe_code = "deny"
unused_crate_dependencies = "warn"
dead_code = "deny"
deprecated = "allow"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
unwrap_in_result = "deny"
todo = "deny"
redundant_clone = "deny"
large_enum_variant = "deny"
needless_collect = "deny"
clone_on_copy = "deny"
unnecessary_to_owned = "deny"
needless_borrow = "deny"
map_unwrap_or = "deny"
needless_range_loop = "deny"
unnecessary_cast = "deny"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
arithmetic_side_effects = "warn"
