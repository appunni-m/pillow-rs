[package]
name = "pillow-rs-freetype"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Pure-Rust TrueType font renderer — auto-hinter, rasterizer, and table parsers"
repository = "https://github.com/pillow-rs/pillow-rs"
keywords = ["freetype", "truetype", "font", "rendering", "autohint"]
categories = ["rendering", "text-processing"]

[lib]
name = "pillow_rs_freetype"

[dependencies]
log = "0.4"
thiserror = "2"

[dev-dependencies]
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
