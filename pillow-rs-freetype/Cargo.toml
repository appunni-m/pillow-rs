[package]
name = "pillow-rs-freetype"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure-Rust byte-perfect port of FreeType 2.14.1 (FT_INT64 path, smooth renderer, TrueType outlines)"

[lib]
name = "pillow_rs_freetype"

[dependencies]
log = "0.4"
thiserror = "2"

[dev-dependencies]
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
