[package]
name = "fontdone-ffi-c"
version = "2.14.3"
edition = "2024"
rust-version = "1.87"
license = "FTL"
description = "C ABI export layer for fontdone"
publish = false

[lib]
name = "fontdone_ffi_c"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
fontdone = { path = ".." }

[lints.rust]
future-incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
unsafe_code = "allow"
unused_crate_dependencies = "warn"
dead_code = "deny"
deprecated = "allow"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
unwrap_in_result = "deny"
todo = "deny"
redundant_clone = "deny"
large_enum_variant = "deny"
needless_collect = "deny"
clone_on_copy = "deny"
unnecessary_to_owned = "deny"
needless_borrow = "deny"
map_unwrap_or = "deny"
needless_range_loop = "deny"
unnecessary_cast = "deny"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
arithmetic_side_effects = "warn"
