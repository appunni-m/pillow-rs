[package]
name = "pillow-rs-py"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "PyO3 bindings for pillow-rs — Pillow drop-in replacement"

[lib]
name = "_core"
crate-type = ["cdylib"]

[features]
default = []
parallel = ["pillow-rs/parallel"]
# Enable only for migration fault-contract test builds; never part of defaults.
migration-fault-injection = ["pillow-rs/migration-fault-injection"]
# Maturin-only entry point used by the optional PyPI companion wheel. Ordinary
# source builds and Parallel CPU benchmarks keep the canonical `_core` name.
parallel-wheel = ["parallel"]

[dependencies]
bytes = "1.10"
pillow-rs = { path = "../pillow-rs" }
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3", "abi3-py38", "bytes"] }
pyo3-log = "0.13.4"

[lints]
workspace = true
