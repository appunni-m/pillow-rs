[workspace]
members = [
    "pillow-rs",
    "pillow-rs-py",
    "pillow-rs-js",
]
resolver = "2"

[workspace.package]
version = "12.2.3"
edition = "2024"
license = "MIT-CMU"
rust-version = "1.96.1"
repository = "https://github.com/appunni-m/pillow-rs"
homepage = "https://github.com/appunni-m/pillow-rs"
documentation = "https://docs.rs/pillow-rs"

# ============================================================================
# AS PER DESIGN — DO NOT REMOVE OR WEAKEN THESE LINTS:
#   These settings prevent entire classes of bugs from recurring. Each lint
#   level was chosen based on the CODEBASE_AUDIT.md findings and SYSTEMIC_FIXES.md
#   systemic fix patterns. Changing any of these must be accompanied by a
#   documented rationale in the PR description.
#
#   Key protections:
#   - unwrap_used/expect_used: Fallible operations must not panic
#   - dead_code: No accumulating dead code
#   - arithmetic_side_effects/cast_possible_truncation: Report migration debt
# ============================================================================

[workspace.lints.rust]
# ── Correctness: hard errors that block CI ──
future-incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
# AS PER DESIGN — DO NOT REMOVE:
# No unsafe blocks allowed anywhere in the workspace.
unsafe_code = "deny"
unused_crate_dependencies = "warn"

# AS PER DESIGN — DO NOT REMOVE:
# dead_code = "deny" prevents unused functions/types from accumulating.
# Previously dead code was suppressed with #[allow(dead_code)] — that is banned.
dead_code = "deny"

# Reject obsolete dependency APIs before release.
deprecated = "deny"

# ── Documentation ──
# Review warning: surface missing public API docs while documentation debt is
# being reduced. This is not currently a CI error.
missing_docs = "warn"

[workspace.lints.clippy]
# ── Safety: hard errors that block CI ──
# AS PER DESIGN — DO NOT REMOVE:
# Both unwrap() and expect() are denied. Use Result/Option propagation for
# fallible work, or the existing infallible helper for proven invariants.
unwrap_used = "deny"

# AS PER DESIGN — DO NOT REMOVE:
# `expect_used` is a hard Clippy error; a message does not make expect() an
# accepted production path. `InfallibleExt::because()` documents proven cases.
expect_used = "deny"

# AS PER DESIGN — DO NOT REMOVE:
# Result.unwrap() is banned for the same reason as Option.unwrap().
unwrap_in_result = "deny"

todo = "deny"

# ── Performance: hard errors that block CI ──
redundant_clone = "deny"
large_enum_variant = "deny"
needless_collect = "deny"
clone_on_copy = "deny"
unnecessary_to_owned = "deny"

# ── Style & Idiom: hard errors that block CI ──
needless_borrow = "deny"
map_unwrap_or = "deny"
needless_range_loop = "deny"
unnecessary_cast = "deny"

# Review-only function-size signal. The quality runner ratchets new functions
# over 100 lines and growth in baseline functions; 60 lines is an early warning.
too_many_lines = "warn"

# These arithmetic and cast lints report migration debt but do not currently
# fail CI. Promote them only after their existing warnings are resolved.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
arithmetic_side_effects = "warn"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.dev]
opt-level = 1
