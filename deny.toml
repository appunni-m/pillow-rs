# ============================================================================
# AS PER DESIGN — DO NOT REMOVE:
#   cargo-deny configuration for supply chain security.
#   Run in CI via: cargo deny check
#   Install: cargo install cargo-deny
#
#   Enforces:
#     - No known CVEs (deny)
#     - No yanked crate versions (deny)
#     - Report unmaintained crates in every dependency scope for review
#     - No multiple versions of the same crate (deny, with exceptions)
#     - License compliance (allowlist)
#     - No unknown registries or git sources
#
#   See SYSTEMIC_FIXES.md Fix 14.
# ============================================================================

[advisories]
# cargo-deny 0.20 scopes unmaintained advisories by dependency graph rather
# than accepting a severity string. Keep every scope visible for manual review.
unmaintained = "all"
# Yanked crates indicate a known defect.
yanked = "deny"
# `paste` is pulled in by wgpu's Apple Metal backend. The RustSec advisory
# has no safe upgrade; keep the exception explicit so cargo-deny still reports
# it and the dependency path remains reviewable.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "transitive wgpu Metal dependency; RustSec reports no safe upgrade" },
]

[bans]
# AS PER DESIGN: Duplicate crate versions are denied (to prevent the
# png 0.17+0.18 situation from recurring).
multiple-versions = "deny"

# Exceptions: crates that exist in two versions during migration.
# Add explicit entries with a trail issue/PR link.
skip = [
    # These versions are required by the pinned wgpu 24 graph and are kept
    # explicit so a future dependency update can revisit each duplicate.
    { crate = "bitflags@1.3.2", reason = "core-graphics-types used by wgpu's Metal backend" },
    { crate = "hashbrown@0.15.5", reason = "gpu-descriptor uses this line while naga uses 0.17" },
    { crate = "syn@2.0.119", reason = "proc-macro ecosystem versions cannot be unified without breaking dependents" },
    { crate = "thiserror@1.0.69", reason = "gpu-allocator remains on this major while workspace crates use thiserror 2" },
    { crate = "thiserror-impl@1.0.69", reason = "paired with gpu-allocator's thiserror 1 dependency" },
]

# AS PER DESIGN: Ban specific crates if they're superseded or dangerous.
deny = [
    # Example: { crate = "serde_yaml" },                 # deprecated, use serde_yml
]

[licenses]
# AS PER DESIGN: Licenses compatible with MIT-CMU.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Unicode-3.0",
    "ISC",
    "Zlib",
    "OpenSSL",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "Apache-2.0 WITH LLVM-exception",
    "FTL",
    "IJG",
    "MIT-CMU",
]
# Licenses outside the explicit allowlist remain rejected by the license check.

[sources]
# Only crates.io and the two intentional, pinned project git sources are allowed.
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/appunni-m/fontdone.git",
    "https://github.com/appunni-m/image-slash-star.git",
]
