site_name: pillow-rs
site_description: Rust image processing with Python and WebAssembly bindings.
site_url: https://appunni-m.github.io/pillow-rs/
repo_url: https://github.com/appunni-m/pillow-rs
repo_name: appunni-m/pillow-rs
docs_dir: target/docs-source
site_dir: target/site
use_directory_urls: true
strict: true
theme:
  name: material
  font: false
  language: en
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
extra_css:
  - assets/docs.css
extra_javascript:
  - assets/evidence.js
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
nav:
  - Overview: index.md
  - Use:
      - Installation: installation.md
      - Python recipes: python.md
      - JavaScript and browsers: javascript.md
      - Rust: rust.md
      - Supported APIs and limitations: compatibility.md
  - Benchmark results: benchmarks.md
  - Contribute:
      - Contributor guide: contributing.md
      - Commands: commands.md
      - Run benchmarks: benchmarking.md
      - Benchmark measurement details: benchmark-details.md
      - API parity inventory: api-support.md
      - Coverage evidence: coverage.md
      - Implementation roadmap: pipeline-roadmap.md
      - Architecture: architecture.md
      - Documentation maintenance: documentation.md
      - Release process: releasing.md
  - Project:
      - Releases: https://github.com/appunni-m/pillow-rs/releases
      - Changelog: changelog.md
      - Support: support.md
      - Security: security.md
      - Code of conduct: conduct.md
