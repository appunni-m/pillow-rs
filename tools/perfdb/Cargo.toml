[package]
name = "pillow-perfdb"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
description = "Standalone DuckDB evidence store and comparison CLI for pillow-rs benchmarks"
license = "MIT"

[workspace]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
duckdb = { version = "=1.10506.0", features = ["bundled"] }
serde_json = "1.0"
sha2 = "0.10"
