[package]
name = "pillow-rs-image"
version = "0.1.0"
edition = "2021"
description = "Zero-dependency pixel-perfect image decoders (JPEG, PNG, GIF, BMP, WebP, TIFF)"

[dependencies]
png = "0.17"
gif = "0.14"
tiff = { version = "0.11", default-features = false, features = ["lzw", "deflate"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
jpeg-encoder = "0.6"

[features]
avif = []

[dev-dependencies]
serde_json = "1.0.150"
serde_yaml = "0.9.34"
