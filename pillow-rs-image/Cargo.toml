[package]
name = "pillow-rs-image"
version = "0.1.0"
edition = "2024"
description = "Zero-dependency pixel-perfect image decoders (JPEG, PNG, GIF, BMP, WebP, TIFF)"

[dependencies]
png = { version = "0.18", optional = true }
gif = { version = "0.14", optional = true }
tiff = { version = "0.11", default-features = false, features = ["lzw", "deflate"], optional = true }
bytemuck = { version = "1", features = ["derive"] }
image-webp = { version = "0.2", optional = true }

[features]
default = ["png", "gif", "tiff", "webp"]
avif = []
png = ["dep:png"]
gif = ["dep:gif"]
tiff = ["dep:tiff"]
webp = ["dep:image-webp"]

[dev-dependencies]
md5 = "0.8.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[lints]
workspace = true
