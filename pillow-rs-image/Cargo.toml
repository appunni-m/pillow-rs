[package]
name = "pillow-rs-image"
version = "0.1.0"
edition = "2021"
description = "Zero-dependency pixel-perfect image decoders (JPEG, PNG, GIF, BMP, WebP, TIFF)"

[dependencies]
jpeg-encoder = "0.6"
log = "0.4"
png = "0.17.16"
gif = "0.14"
tiff = { version = "0.11", default-features = false, features = ["lzw", "deflate"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[features]
avif = []

[dev-dependencies]
md5 = "0.8.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sha2 = "0.11.0"

[lints]
workspace = true
