[package]
name = "pillow-rs-image"
version = "0.1.0"
edition = "2021"
description = "Zero-dependency pixel-perfect image decoders (JPEG, PNG, GIF, BMP, WebP, TIFF)"

[dependencies]
png = "0.18"
gif = "0.14"
tiff = { version = "0.11", default-features = false, features = ["lzw", "deflate"] }
bytemuck = { version = "1", features = ["derive"] }

[features]
avif = []

[dev-dependencies]
md5 = "0.8.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"

[lints]
workspace = true
