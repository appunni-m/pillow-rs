    - id: enc_local_ct
      description: 
      params: {'color_table': 'local'}
    - id: enc_1x1
      description: 
      params: {'size': [1, 1]}

    - id: enc_static
      description: Static GIF
      params:
        animated: false
    - id: enc_transparent
      description: Transparent GIF
      params:
        transparency: true
    - id: enc_interlaced
