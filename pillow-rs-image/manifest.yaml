    - id: enc_no_interlace
      description: 
      params: {'interlace': False}
    - id: enc_8bit
      description: 
      params: {'bit_depth': 8}
    - id: enc_16bit
      description: 
      params: {'bit_depth': 16}
    - id: enc_filter_none
      description: 
      params: {'filter': 'none'}
    - id: enc_filter_sub
      description: 
      params: {'filter': 'sub'}
    - id: enc_filter_up
      description: 
      params: {'filter': 'up'}
    - id: enc_filter_avg
      description: 
      params: {'filter': 'average'}
    - id: enc_filter_paeth
      description: 
