      - no_interlace.png
    - id: interlace_adam7
      description: Adam7 interlacing
      test_assets:
      - adam7.png
    - id: filter_none
      description: No filter
      test_assets:
      - filter_none.png
    - id: filter_sub
      description: Sub filter
      test_assets:
      - filter_sub.png
    - id: filter_up
      description: Up filter
      test_assets:
      - filter_up.png
    - id: filter_average
      description: Average filter
      test_assets:
      - filter_average.png
    - id: filter_paeth
      description: Paeth filter
      test_assets:
      - filter_paeth.png
    - id: filter_mixed
      description: Adaptive per-scanline filtering
