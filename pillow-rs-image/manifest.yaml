      - compress_default.png
    - id: compress_none
      description: No compression (store only)
      test_assets:
      - compress_none.png
    - id: compress_max
      description: Maximum compression (level 9)
      test_assets:
      - compress_max.png
    - id: chunk_gama
      description: PNG with gAMA chunk (gamma)
      test_assets:
      - gama.png
    - id: chunk_srgb
      description: PNG with sRGB chunk
      test_assets:
      - srgb.png
    - id: chunk_iccp
      description: PNG with iCCP color profile
      test_assets:
      - iccp.png
    - id: chunk_text
      description: PNG with tEXt/zTXt/iTXt metadata
      test_assets:
      - text_chunks.png
    - id: chunk_time
      description: PNG with tIME chunk
      test_assets:
      - time_chunk.png
    - id: chunk_background
      description: PNG with bKGD chunk
      test_assets:
      - bkgd.png
    - id: chunk_phys
      description: PNG with pHYs chunk (physical dimensions)
      test_assets:
      - phys.png
    - id: size_1x1
      description: Single pixel
      test_assets:
      - 1x1.png
    - id: size_small
      description: Small image (16x16)
      test_assets:
      - 16x16.png
    - id: size_large
      description: Large image (4096x4096)
      test_assets:
      - large.png
    - id: size_odd
