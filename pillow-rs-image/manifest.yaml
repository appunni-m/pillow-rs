version: 0.1.0
formats:
  jpeg:
    name: JPEG
    extensions:
    - .jpg
    - .jpeg
    magic:
    - 255
    - 216
    decoder: own
    encoder: jpeg-encoder crate (pure Rust baseline DCT)
    status: in-progress
    edge_cases:
    - id: subsampling_444
      description: 4:4:4 chroma subsampling (no subsampling)
      test_assets:
      - baseline_444.jpg
    - id: subsampling_422
      description: 4:2:2 horizontal chroma subsampling
      test_assets:
      - baseline_422.jpg
    - id: subsampling_420
      description: 4:2:0 chroma subsampling (most common)
      test_assets:
      - baseline_420.jpg
    - id: subsampling_411
      description: 4:1:1 chroma subsampling
      test_assets:
      - baseline_411.jpg
    - id: subsampling_gray
      description: Grayscale (no chroma components)
      test_assets:
      - baseline_gray.jpg
    - id: color_ycbcr
      description: YCbCr color space (standard)
      test_assets:
      - baseline_ycbcr.jpg
    - id: color_rgb
      description: RGB color space (rare, Adobe)
      test_assets:
      - baseline_rgb_jpeg.jpg
    - id: color_cmyk
      description: CMYK color space (Adobe)
      test_assets:
      - baseline_cmyk.jpg
    - id: huffman_default
      description: Default Huffman tables
      test_assets:
      - baseline_default.jpg
    - id: huffman_optimized
      description: Optimized/custom Huffman tables
      test_assets:
      - baseline_optimized.jpg
    - id: huffman_progressive
      description: Progressive JPEG (multiple scans)
      test_assets:
      - progressive.jpg
    - id: quality_100
      description: Quality 100 (minimal compression)
      test_assets:
      - q100.jpg
    - id: quality_50
      description: Quality 50 (medium compression)
      test_assets:
      - q50.jpg
    - id: quality_10
      description: Quality 10 (heavy compression, artifacts)
      test_assets:
      - q10.jpg
    - id: quality_1
      description: Quality 1 (maximum compression)
      test_assets:
      - q1.jpg
    - id: size_minimal
      description: Smallest valid JPEG (8x8 minimum)
      test_assets:
      - 8x8.jpg
    - id: size_odd
      description: Odd dimensions requiring edge MCU handling
      test_assets:
      - 17x17.jpg
      - 33x33.jpg
    - id: size_large
      description: Large image (4096x4096)
      test_assets:
      - large.jpg
    - id: size_1x1
      description: Single pixel
      test_assets:
      - 1x1.jpg
    - id: restart_none
      description: No restart markers
      test_assets:
      - baseline_default.jpg
    - id: restart_interval
      description: Restart markers every N MCUs
      test_assets:
      - restart.jpg
    - id: exif_orientation
      description: JPEG with EXIF orientation tag
      test_assets:
      - exif_orientation.jpg
    - id: exif_thumbnail
      description: JPEG with embedded thumbnail
      test_assets:
      - exif_thumbnail.jpg
    - id: no_exif
      description: JPEG without EXIF
      test_assets:
      - no_exif.jpg
    - id: trailing_data
      description: JPEG with extra data after EOI marker
      test_assets:
      - trailing_data.jpg
    - id: multiple_eoi
      description: Multiple EOI markers
      test_assets:
      - multiple_eoi.jpg
    - id: zero_length
      description: Empty file (error expected)
      test_assets:
      - empty.jpg
      expect_error: true
    - id: truncated
      description: Truncated JPEG (incomplete)
      test_assets:
      - truncated.jpg
      expect_error: true
    - id: corrupt_header
      description: Corrupt JPEG header
      test_assets:
      - corrupt.jpg
      expect_error: true
    - id: baseline_standard
      description: Baseline DCT sequential
      test_assets:
      - baseline.jpg
    - id: progressive_spectral
      description: Progressive with spectral selection
      test_assets:
      - progressive_spectral.jpg
    encode_edge_cases:
    - id: enc_q100
      description: 
      params: {'quality': 100}
    - id: enc_q85
      description: 
      params: {'quality': 85}
    - id: enc_q75
      description: 
      params: {'quality': 75}
    - id: enc_q50
      description: 
      params: {'quality': 50}
    - id: enc_q25
      description: 
      params: {'quality': 25}
    - id: enc_q10
      description: 
      params: {'quality': 10}
    - id: enc_q1
      description: 
      params: {'quality': 1}
    - id: enc_sub_444
      description: 
      params: {'subsampling': '444'}
    - id: enc_sub_422
      description: 
      params: {'subsampling': '422'}
    - id: enc_sub_420
      description: 
      params: {'subsampling': '420'}
    - id: enc_progressive
      description: 
      params: {'progressive': True}
    - id: enc_baseline
      description: 
      params: {'progressive': False}
    - id: enc_grayscale
      description: 
      params: {'grayscale': True}
    - id: enc_rgb
      description: 
      params: {'grayscale': False}
    - id: enc_1x1
      description: 
      params: {'size': [1, 1]}
    - id: enc_8x8
      description: 
      params: {'size': [8, 8]}
    - id: enc_odd_size
      description: 
      params: {'size': [17, 17]}
    - id: enc_exif
      description: 
      params: {'exif': True}
    - id: enc_no_exif
      description: 
      params: {'exif': False}
    - id: enc_restart
      description: 
      params: {'restart_interval': 4}
    - id: enc_no_restart
      description: 
      params: {'restart_interval': 0}
    - id: enc_dct_fast
      description: 
      params: {'dct_method': 'fast'}
    - id: enc_dct_slow
      description: 
      params: {'dct_method': 'slow'}
    - id: enc_optimize
      description: 
      params: {'optimize': True}
    - id: enc_no_optimize
      description: 
      params: {'optimize': False}

    - id: enc_quality_100
      description: Quality 100 (max)
      params:
        quality: 100
    - id: enc_quality_85
      description: Quality 85 (default)
      params:
        quality: 85
    - id: enc_quality_50
      description: Quality 50
      params:
        quality: 50
    - id: enc_quality_10
      description: Quality 10 (min)
      params:
        quality: 10
    - id: enc_subsample_444
      description: 4:4:4 chroma
      params:
        subsampling: '444'
    - id: enc_subsample_420
      description: 4:2:0 chroma
      params:
        subsampling: '420'
    - id: enc_progressive
      description: Progressive JPEG
      params:
        progressive: true
    - id: enc_grayscale
      description: Grayscale JPEG
      params:
        grayscale: true
  png:
    name: PNG
    extensions:
    - .png
    magic:
    - 137
    - 80
    - 78
    - 71
    - 13
    - 10
    - 26
    - 10
